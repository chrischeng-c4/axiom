[package]
name = "pm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Lightweight, space-saving local Project Management MCP Server for AI Agents"
autotests = false

[lib]
name = "pm"
path = "src/lib.rs"

[[bin]]
name = "pm"
path = "src/main.rs"

[[test]]
name = "e2e_http_mcp"
path = "e2e/http_mcp_e2e.rs"

[[test]]
name = "local_gate_merge_e2e"
path = "e2e/local_gate_merge_e2e.rs"

[[test]]
name = "e2e_stdio_mcp"
path = "e2e/stdio_mcp_e2e.rs"

[dependencies]
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
axum = { workspace = true }
fs2 = "0.4"
sha2 = "0.10"

[dev-dependencies]
reqwest = { workspace = true }
