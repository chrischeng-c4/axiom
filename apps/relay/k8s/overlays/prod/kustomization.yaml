apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
components:
  - ../../components/network-policy
  - ../../components/observability
patches:
  - target: {kind: ConfigMap, name: relay-config}
    patch: |-
      - {op: replace, path: /data/RELAY_AUTH, value: required}
  - target: {kind: StatefulSet, name: relay}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: RELAY_TOKEN_REGISTRY_FILE, value: /var/run/secrets/relay/token-registry.json}
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: {name: relay-token-registry, mountPath: /var/run/secrets/relay, readOnly: true}
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: relay-token-registry
          secret:
            secretName: relay-token-registry
            items: [{key: token-registry.json, path: token-registry.json}]
      - {op: replace, path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage, value: 100Gi}
