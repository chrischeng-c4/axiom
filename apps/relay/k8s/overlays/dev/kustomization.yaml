apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
patches:
  - target: {kind: ConfigMap, name: relay-config}
    patch: |-
      - {op: replace, path: /data/RUST_LOG, value: debug}
  - target: {kind: StatefulSet, name: relay}
    patch: |-
      - {op: replace, path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage, value: 1Gi}
