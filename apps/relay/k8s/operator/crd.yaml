apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: relays.relay.dev
spec:
  group: relay.dev
  names:
    categories: []
    kind: Relay
    plural: relays
    shortNames:
    - rly
    singular: relay
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for RelaySpec via `CustomResource`
        properties:
          spec:
            description: '`relay.dev/v1alpha1` `Relay`. Namespaced: every child object the operator renders lands in this object''s namespace, so independent relay deployments coexist by name.'
            properties:
              auth:
                default: "off"
                description: 'Request-auth mode for the /v1 data plane: `off` (default) or `required`. A flat string, not an enum with divergent variant schemas (Kubernetes structural schemas cannot represent those — keep #776). `required` takes effect only together with [`Self::tokens_secret`].'
                type: string
              backup:
                description: 'Optional scheduled backup (#1209). When set, the operator renders a `<name>-backup` CronJob (see [`super::render`]) invoking `relay backup` on this schedule against the deployment''s own `GET /admin/backup` endpoint — no new snapshot mechanism, only scheduling + transport (lumen #808). Absent means no CronJob; the endpoint stays reachable for manual/scripted use either way.'
                nullable: true
                properties:
                  adminTokenSecret:
                    description: 'Name of a Secret whose `token` key holds a bearer token with `admin` on `*`, injected into the CronJob as `RELAY_BACKUP_TOKEN`. Needed when `auth: required`; ignored (the endpoint needs no token) when auth is off.'
                    nullable: true
                    type: string
                  destination:
                    description: Destination URI accepted by [`BackupDestination::from_uri`].
                    type: string
                  retentionSecs:
                    description: Drop objects older than this many seconds after a successful put. `None` keeps every object.
                    type: integer
                    minimum: 0.0
                    nullable: true
                  schedule:
                    description: Cron expression rendered into `CronJob.spec.schedule`.
                    type: string
                required:
                - destination
                - schedule
                type: object
              graceSecs:
                default: 10
                description: Graceful drain window on SIGTERM (seconds); tracks `terminationGracePeriodSeconds`. Defaults to 10 (`RELAY_GRACE_SECS`).
                type: integer
                minimum: 0.0
              image:
                type: string
              imagePullPolicy:
                nullable: true
                type: string
              logLevel:
                description: Log level (`trace|debug|info|warn|error`), injected as `RUST_LOG`. Unset means the server default (`info`).
                nullable: true
                type: string
              peerTlsSecret:
                description: Secret containing `tls.crt`, `tls.key`, and `ca.crt` for authenticated Raft peer traffic on the dedicated 7001 listener. Omit only for local cleartext development clusters.
                nullable: true
                type: string
              replicasPerShard:
                default: 1
                description: Starting/minimum members per shard. With startup-static raft-runtime membership this is also the fixed desired value; a future membership controller may plan whole replica layers above this floor.
                type: integer
                minimum: 0.0
              resources:
                default:
                  cpu: ''
                  memory: ''
                description: Per-pod CPU/memory requests. Empty values resolve to the shared data-plane defaults (`1` CPU / `4Gi`) at render time. Limits are intentionally omitted so a dedicated-node pod can use otherwise-idle node capacity. @spec libs/service-k8s/tech-design/semantic/source/libs-service-k8s-src-service-rs.md#source
                properties:
                  cpu:
                    default: ''
                    type: string
                  memory:
                    default: ''
                    type: string
                type: object
              shardCount:
                default: 1
                type: integer
                minimum: 0.0
              storage:
                default: 10Gi
                description: Per-pod durable-log (+ raft hard state) PVC size. Defaults to `10Gi`.
                type: string
              storageClass:
                description: PVC StorageClass for the durable log. Unset means the cluster default.
                nullable: true
                type: string
              tokensSecret:
                description: 'Name of the Secret carrying the bearer-token registry (key `token-registry.json`). When set with `auth: required`, the render mounts it read-only at `/var/run/secrets/relay` and injects `RELAY_AUTH=required` + `RELAY_TOKEN_REGISTRY_FILE` (lumen''s pattern; off unless the CR asks).'
                nullable: true
                type: string
              voterCount:
                default: 1
                type: integer
                minimum: 0.0
            required:
            - image
            type: object
          status:
            description: Status subresource, written back by the reconcile loop.
            nullable: true
            properties:
              desiredReplicas:
                default: 0
                description: Desired broker replicas (`replicasPerShard`; relay is single-group).
                format: int32
                type: integer
              message:
                default: ''
                description: Last human-readable reconcile message.
                type: string
              observedGeneration:
                default: 0
                description: The `.metadata.generation` this status reflects (drift detection).
                format: int64
                type: integer
              phase:
                default: ''
                description: '`Pending | Reconciling | Ready`.'
                type: string
              readyReplicas:
                default: 0
                description: Ready broker replicas (from the StatefulSet status).
                format: int32
                type: integer
            type: object
        required:
        - spec
        title: Relay
        type: object
    served: true
    storage: true
    subresources:
      status: {}
