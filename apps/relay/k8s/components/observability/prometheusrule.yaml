apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: relay
spec:
  groups:
    - name: relay
      rules:
        - alert: RelayLeaseReclaiming
          expr: increase(relay_requests_total{route=~".*lease.*",status=~"5.."}[5m]) > 0
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: Relay worker lease operations are failing
