apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: relay
  namespace: relay
spec:
  serviceName: relay-headless
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: relay, role: server}
  template:
    metadata:
      labels: {app: relay, role: server}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: relay
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: relay
          image: relay:0.4.7
          imagePullPolicy: IfNotPresent
          command: ["relay"]
          ports:
            - {name: http, containerPort: 7000, protocol: TCP}
            - {name: raft, containerPort: 7001, protocol: TCP}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: SHARD_COUNT, value: "1"}
            - {name: REPLICAS_PER_SHARD, value: "1"}
            - {name: VOTER_COUNT, value: "1"}
            - {name: RELAY_PEER_SERVICE, value: relay-headless}
            - {name: RELAY_RAFT_PORT, value: "7001"}
            - {name: RELAY_DATA_DIR, value: /data}
            - name: RELAY_BIND
              valueFrom: {configMapKeyRef: {name: relay-config, key: RELAY_BIND}}
            - name: RELAY_GRACE_SECS
              valueFrom: {configMapKeyRef: {name: relay-config, key: RELAY_GRACE_SECS}}
            - name: RELAY_LOG_FORMAT
              valueFrom: {configMapKeyRef: {name: relay-config, key: RELAY_LOG_FORMAT}}
            - name: RELAY_AUTH
              valueFrom: {configMapKeyRef: {name: relay-config, key: RELAY_AUTH}}
            - name: RUST_LOG
              valueFrom: {configMapKeyRef: {name: relay-config, key: RUST_LOG}}
          resources:
            requests: {cpu: "1", memory: 4Gi}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 120
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 10Gi}
