[project]
name = "relay"
cap_path = "CAPABILITIES.md"
label = "app:relay"

[capability.profile]
traits = ["service", "long_running", "cli_facing", "competitive_replacement", "network_exposed", "primary_replicas", "stateful_storage"]

[ec.efficiency]
tool = "meter"
meter = "apps/relay"
command = "cd apps/relay && ../../target/debug/vat run meter-perf"

[ec.security]
tool = "guard"
dir = "apps/relay"
command = "cd apps/relay && ../../target/debug/vat run guard-security"

[[workspaces]]
name = "relay"
paths = ["**"]
target = "rust"
test_cmd = "cargo test -p relay"
codegen.profile = "rust/score-crate"

