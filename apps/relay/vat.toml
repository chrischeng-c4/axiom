version = 1
name = "relay-ec"
default_runner = "meter-perf"

[workspace]
base = "../.."
workdir = "apps/relay"
keep = "always"

[env]
PATH = "/Users/chrischeng/.rustup/toolchains/stable-aarch64-apple-darwin/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/Users/chrischeng/.cargo/bin"

[[setup]]
id = "build-aw-tools"
cmd = ["cargo", "build", "-p", "meter-cli", "-p", "guard-cli"]

[[setup]]
id = "build-relay-security-ec-tests"
cmd = [
  "cargo",
  "test",
  "-p",
  "relay",
  "--test",
  "auth",
  "--test",
  "service_admission",
  "--test",
  "raft_peer_mtls",
  "--test",
  "direct_k8s_assets",
  "--no-run",
]

[[setup]]
id = "build-relay-measured-performance-gate"
cmd = [
  "cargo",
  "test",
  "--release",
  "-p",
  "relay",
  "--test",
  "measured_performance",
  "--no-run",
]

[[runners]]
id = "meter-perf"
cmd = [
  "../../target/debug/meter",
  "test",
  "--",
  "--release",
  "-p",
  "relay",
  "--test",
  "measured_performance",
  "measured_durable_lifecycle_gate",
  "--",
  "--exact",
  "--ignored",
  "--nocapture",
]
timeout_s = 600

[[runners]]
id = "guard-security"
cmd = [
  "../../target/debug/guard",
  "scan",
  ".",
  "--profile",
  "security-lint",
  "--compact",
  "--no-persist",
  "--meter-command",
  "../../target/debug/meter test -- -p relay --test auth --test service_admission --test raft_peer_mtls --test direct_k8s_assets -- --nocapture",
]
timeout_s = 600
