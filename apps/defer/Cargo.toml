[package]
name = "defer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Delayed push-queue scheduler core for Axiom"
build = "build.rs"

[lib]
name = "defer"
path = "src/lib.rs"

[[bin]]
name = "defer"
path = "src/bin/defer.rs"

[dependencies]
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
raft-runtime = { path = "../../libs/raft-runtime" }
storage-durable = { path = "../../libs/storage-durable" }
anyhow = { workspace = true }
axum = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
clap = { workspace = true, features = ["env"] }
cli-std = { path = "../../libs/cli-std", default-features = false }
service-http = { path = "../../libs/service-http" }
service-auth = { path = "../../libs/service-auth" }
metrics-prometheus = { path = "../../libs/metrics-prometheus" }
utoipa = { workspace = true }
serde_yaml = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
cclab-openapi-codegen = { path = "../../libs/openapi-codegen" }
service-backup = { path = "../../libs/service-backup", features = ["http-client"] }
service-executor = { path = "../../libs/service-executor" }
kube = { version = "0.98", features = ["runtime", "derive", "client"], optional = true }
k8s-openapi = { version = "0.24", features = ["v1_32"], optional = true }
schemars = { version = "0.8", optional = true }
service-k8s = { path = "../../libs/service-k8s", optional = true }
peer-tls = { path = "../../libs/peer-tls" }

[build-dependencies]
build-stamp = { path = "../../libs/build-stamp" }

[features]
default = []
self-update = ["cli-std/online"]
issue = ["cli-std/online"]
otel = ["service-http/otlp"]
backup = ["service-backup/s3"]
operator = ["dep:kube", "dep:k8s-openapi", "dep:schemars", "dep:service-k8s"]

[dev-dependencies]
tempfile = "3"
rcgen = "0.13"
tower = { workspace = true, features = ["util"] }
redis = { version = "0.27", features = ["tokio-comp"] }
relay = { path = "../relay" }
service-observability = { path = "../../libs/service-observability" }
