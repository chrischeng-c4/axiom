[[cases]]
id = "defer-cli-interface-conformance"
capability_id = "cli-interface"
claim_id = "defer-cli-convention-and-task-verbs"
contract_id = "standard-domain-cli-offline-spec-and-render-contract"
dimension = "behavior"
source_ref = "apps/defer/external-contracts/behavior/2213.md#defer-cli-interface-conformance"
test_path = "apps/defer/tests/behavior_defer_cli_interface_conformance.rs"
command = "cargo test -p defer --test cli_contract -- --nocapture"
required_for_production = true
assertions = [
    "`defer --help` exits successfully and exposes the standard `llm`, `upgrade`, and `issue` commands together with `serve`, `spec`, `queue`, `task`, `dispatch`, `backup`, `k8s`, and `dockerfile`; independent `task --help` and `queue --help` observations must include create/status/cancel and get/put/control respectively.",
    "`defer llm --topic outline` runs while every HTTP(S)/ALL proxy variable points at a local connection trap, makes zero network connections, advertises workflow/API/delivery/HA/auth topics, and terminates with `next: done`.",
    "`defer spec --format openapi` emits the queue-task route and a terminal marker, while TypeScript generation must produce exactly types.ts, runtime.ts, client.ts, hooks.ts, and index.ts; client.ts must contain createDeferClient plus taskCreate/taskStatus/taskCancel route functions, so an arbitrary non-empty placeholder fails.",
    "Source/release Dockerfile and CRD/operator/prod-instance render commands each have their exit status asserted before content inspection and emit the expected lifecycle-layer kinds; `defer serve --help` exposes the shared pretty/json log-format policy.",
]
evidence_digest = "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
evaluator_digest = "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
digest = "sha256:807386c5ec22f33ee93af303f4ddee49a70e5b0a3daaff9e45b22e2662e88f19"

