[[cases]]
id = "defer-http-dispatch-and-retries"
capability_id = "http-dispatch-and-retries"
claim_id = "http-target-attempt-contract"
contract_id = "manual-dispatch-route-terminal-state-and-recovery"
dimension = "behavior"
source_ref = "apps/defer/external-contracts/behavior/766.md#defer-http-dispatch-and-retries"
test_path = "apps/defer/tests/behavior_defer_http_dispatch_and_retries.rs"
command = "cargo test -p defer --test http_api -- --nocapture"
required_for_production = true
assertions = [
    "POST /v1/queues/{queue}/dispatch on a due task returns a JSON dispatch report with target_status 204 for the real HTTP target, and the public task GET route then reports status Succeeded for that exact task id.",
    "The manual dispatch route increments the public metrics surface so /metrics contains defer_dispatch_acked_total 1 after the committed success.",
    "A backup taken after the manual dispatch can seed a fresh raft store, and the recovered public task state still reports the same terminal Succeeded outcome instead of replaying or dropping the committed dispatch result.",
]
