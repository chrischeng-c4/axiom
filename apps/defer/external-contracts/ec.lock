[[cases]]
id = "defer-competitor-durable-ha"
capability_id = "competitor-feature-parity"
claim_id = "delayed-task-competitor-feature-matrix"
contract_id = "replicated-scheduler-state-and-repeated-failover"
dimension = "behavior"
source_ref = "apps/defer/external-contracts/behavior/2216.md#defer-competitor-durable-ha"
test_path = "apps/defer/tests/behavior_defer_competitor_durable_ha.rs"
command = "cargo test -p defer --test raft_scheduler -- --nocapture"
required_for_production = true
assertions = [
    "A real three-node Raft cluster commits queue and task state, preserves the live lease across leader loss, rejects wrong-replica and stale-epoch settlement, and only reassigns after committed expiry with a higher epoch and fresh attempt id.",
    "The failed node restarts from the same durable directory, catches up terminal state, then a second leader loss elects another primary that commits and completes a new task, proving repeated durable HA rather than a one-shot memory replay.",
    "Rate, burst, and max-in-flight limits are consumed by proposals through different followers as one committed aggregate; the next leader preserves both the sub-second rate denial and active in-flight denial, then admits work only after the committed one-second refill or exact fenced acknowledgement.",
    "A two-attempt task is nacked through a follower from Retried to DeadLettered, every live replica converges, and a killed node restarted from the same durable directory recovers one terminal task with no scheduled or in-flight residue.",
]
