[[cases]]
id = "defer-http-dispatch-signing-oracle-and-negatives"
capability_id = "http-dispatch-and-retries"
claim_id = "http-target-attempt-contract"
contract_id = "exact-hmac-oracle-attempt-binding-and-negative-cases"
dimension = "behavior"
source_ref = "apps/defer/external-contracts/behavior/766.md#defer-http-dispatch-signing-oracle-and-negatives"
test_path = "apps/defer/tests/behavior_defer_http_dispatch_signing_oracle_and_negatives.rs"
command = "cargo test -p defer --test http_dispatch_signing -- --nocapture"
required_for_production = true
assertions = [
    "The target-side oracle recomputes HMAC-SHA256 over the exact length-delimited field sequence [idempotency_key, attempt_id, target_url, timestamp_ms, exact JSON body bytes] and the received x-defer-signature must match exactly, not merely start with v1=.",
    "A retry preserves the same idempotency key but changes attempt_id, so the recomputed signature changes with the fresh attempt identity while still validating under the shared secret.",
    "Tampering with any signed field or the exact received body bytes causes the oracle to reject the signature instead of accepting a stale or partially matching header.",
    "Using the wrong key id or wrong secret is a negative case that must fail verification; Defer may not claim signed-target integrity until this executable oracle passes.",
]
