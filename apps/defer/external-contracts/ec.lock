[[cases]]
id = "defer-http-dispatch-efficiency-ceiling"
capability_id = "http-dispatch-and-retries"
claim_id = "http-target-attempt-contract"
contract_id = "same-host-durable-dispatch-overhead-ceiling"
dimension = "efficiency"
source_ref = "apps/defer/external-contracts/behavior/766.md#defer-http-dispatch-efficiency-ceiling"
test_path = "apps/defer/tests/efficiency_defer_http_dispatch_efficiency_ceiling.rs"
command = "cargo test --release -p defer --test relay_performance_ceiling -- --ignored --nocapture"
required_for_production = true
assertions = [
    "Under the declared single-voter durable lifecycle workload (durable enqueue -> committed lease -> committed ack), Defer throughput is non-zero and reported together with p50/p95/p99, CPU, RSS, disk bytes, amplification, and error counts.",
    "The measured report includes errors = 0 for both sides and enforces defer_to_relay_ratio >= 0.80 as the bounded scheduler overhead ceiling for Defer relative to Relay on the same host.",
    "The efficiency oracle is the emitted numeric report and hard threshold, not a qualitative statement about Defer being fast enough.",
]
