[[cases]]
id = "defer-http-dispatch-retry-dlq-and-lost-fence"
capability_id = "http-dispatch-and-retries"
claim_id = "http-target-attempt-contract"
contract_id = "retry-dlq-lost-fence-and-stable-idempotency"
dimension = "behavior"
source_ref = "apps/defer/external-contracts/behavior/766.md#defer-http-dispatch-retry-dlq-and-lost-fence"
test_path = "apps/defer/tests/behavior_defer_http_dispatch_retry_dlq_and_lost_fence.rs"
command = "cargo test -p defer --test http_dispatch -- --nocapture && cargo test -p defer --test task_lifecycle nack_reschedules_then_dead_letters_after_max_attempts -- --nocapture"
required_for_production = true
assertions = [
    "A real HTTP target 503 causes a committed retry, the next delivery reuses the stable idempotency key queue/task_id, and each delivery carries a fresh attempt id before the eventual committed Acked disposition.",
    "If a target may have accepted the effect but the executor loses its committed fence before settlement, Defer reports LostOwnership and only a later fenced retry may commit the terminal success.",
    "When max_attempts is exhausted, the second nack commits DeadLettered and the public scheduler state for that queue/task becomes terminal DeadLettered rather than remaining leased or requeueing forever.",
    "Shared-executor dispatch stays bounded: the dispatcher pass does not exceed the configured hard concurrency cap while still making non-zero progress.",
]
