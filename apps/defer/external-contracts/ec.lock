[[cases]]
id = "defer-http-dispatch-retry-soak-stability"
capability_id = "http-dispatch-and-retries"
claim_id = "http-target-attempt-contract"
contract_id = "bounded-retry-soak-fixed-state-plateau"
dimension = "stability"
source_ref = "apps/defer/external-contracts/behavior/766.md#defer-http-dispatch-retry-soak-stability"
test_path = "apps/defer/tests/stability_defer_http_dispatch_retry_soak_stability.rs"
command = "DEFER_SOAK_AUTOSTART=1 bash apps/defer/scripts/soak.sh"
required_for_production = true
assertions = [
    "The fixed-keyspace soak must make non-zero progress, report errors = 0, keep the committed success task terminally Succeeded, and keep a second real HTTP-404 task retryable rather than silently dropping or dead-lettering it early.",
    "With the soak queue's explicit zero-delay retry policy, the committed retry counter must increase in each measured window, proving that lease, HTTP fault, nack, and rescheduling continue to make progress throughout the soak instead of being inferred from a one-shot setup attempt; non-zero backoff timing remains covered by the lifecycle test.",
    "Across the two steady windows the soak enforces measurable stability thresholds: RSS drift <= 10%, file-descriptor growth <= 8, thread/task growth <= 4, and p99 <= 250ms with no more than 100% growth between windows.",
    "The stability oracle is bounded fault/retry-soak evidence from the script output, not an unmeasured claim that retries are stable over time.",
]
evidence_digest = "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
evaluator_digest = "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
digest = "sha256:1a423e2fc5d4e33320040498ca5a4128e0e4f12116d3221d41b36332eb3315b8"

[[cases]]
id = "defer-http-dispatch-signing-oracle-and-negatives"
capability_id = "http-dispatch-and-retries"
claim_id = "http-target-attempt-contract"
contract_id = "exact-hmac-oracle-attempt-binding-and-negative-cases"
dimension = "behavior"
source_ref = "apps/defer/external-contracts/behavior/766.md#defer-http-dispatch-signing-oracle-and-negatives"
test_path = "apps/defer/tests/behavior_defer_http_dispatch_signing_oracle_and_negatives.rs"
command = "cargo test -p defer --test http_dispatch_signing -- --nocapture"
required_for_production = true
assertions = [
    "The target-side oracle recomputes HMAC-SHA256 over the exact length-delimited field sequence [idempotency_key, attempt_id, target_url, timestamp_ms, exact JSON body bytes] and the received x-defer-signature must match exactly, not merely start with v1=.",
    "A retry preserves the same idempotency key but changes attempt_id, so the recomputed signature changes with the fresh attempt identity while still validating under the shared secret.",
    "Tampering with any signed field or the exact received body bytes causes the oracle to reject the signature instead of accepting a stale or partially matching header.",
    "Using the wrong key id or wrong secret is a negative case that must fail verification; Defer may not claim signed-target integrity until this executable oracle passes.",
]
evidence_digest = "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
evaluator_digest = "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
