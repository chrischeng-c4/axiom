    "The measured report includes errors = 0 for both sides and enforces defer_to_relay_ratio >= 0.80 as the bounded scheduler overhead ceiling for Defer relative to Relay on the same host.",
    "The efficiency oracle is the emitted numeric report and hard threshold, not a qualitative statement about Defer being fast enough.",
