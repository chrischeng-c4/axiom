test_path = "apps/defer/tests/stability_defer_http_dispatch_retry_soak_stability.rs"
command = "DEFER_SOAK_AUTOSTART=1 bash apps/defer/scripts/soak.sh"
required_for_production = true
assertions = [
    "The fixed-keyspace soak must make non-zero progress, report errors = 0, keep the committed success task terminally Succeeded, and keep a second real HTTP-404 task retryable rather than silently dropping or dead-lettering it early.",
    "With the soak queue's explicit zero-delay retry policy, the committed retry counter must increase in each measured window, proving that lease, HTTP fault, nack, and rescheduling continue to make progress throughout the soak instead of being inferred from a one-shot setup attempt; non-zero backoff timing remains covered by the lifecycle test.",
    "Across the two steady windows the soak enforces measurable stability thresholds: RSS drift <= 10%, file-descriptor growth <= 8, thread/task growth <= 4, and p99 <= 250ms with no more than 100% growth between windows.",
    "The stability oracle is bounded fault/retry-soak evidence from the script output, not an unmeasured claim that retries are stable over time.",
]
