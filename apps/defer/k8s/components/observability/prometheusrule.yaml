apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: defer
spec:
  groups:
    - name: defer
      rules:
        - alert: DeferDispatchLosingOwnership
          expr: increase(defer_dispatch_lost_ownership_total[5m]) > 0
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: Defer executors are losing committed lease ownership
