apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: defer
spec:
  podSelector:
    matchLabels: {app: defer, role: server}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - {protocol: TCP, port: 7141}
    - from:
        - podSelector:
            matchLabels: {app: defer, role: server}
      ports:
        - {protocol: TCP, port: 7142}
  egress:
    - to:
        - podSelector:
            matchLabels: {app: defer, role: server}
      ports:
        - {protocol: TCP, port: 7142}
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 80}
