# HANDWRITE-BEGIN gap="missing-generator:deployment:defer-prod-overlay" tracker="#766" reason="Defer production auth, storage, and optional component composition remains hand-authored until service-k8s emits profile overlays."
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
components:
  - ../../components/network-policy
  - ../../components/observability
patches:
  - target: {kind: ConfigMap, name: defer-config}
    patch: |-
      - {op: replace, path: /data/DEFER_AUTH, value: required}
  - target: {kind: StatefulSet, name: defer}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: DEFER_TOKEN_REGISTRY_FILE, value: /var/run/secrets/defer/token-registry.json}
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: {name: defer-token-registry, mountPath: /var/run/secrets/defer, readOnly: true}
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: defer-token-registry
          secret:
            secretName: defer-token-registry
            items: [{key: token-registry.json, path: token-registry.json}]
      - {op: replace, path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage, value: 100Gi}
# HANDWRITE-END
