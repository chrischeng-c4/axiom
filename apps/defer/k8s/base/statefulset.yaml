apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: defer
  namespace: defer
spec:
  serviceName: defer-headless
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: defer, role: server}
  template:
    metadata:
      labels: {app: defer, role: server}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7141"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: defer
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: defer
          image: defer:0.4.7
          imagePullPolicy: IfNotPresent
          command: ["defer", "serve"]
          ports:
            - {name: http, containerPort: 7141, protocol: TCP}
            - {name: raft, containerPort: 7142, protocol: TCP}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: SHARD_COUNT, value: "1"}
            - {name: REPLICAS_PER_SHARD, value: "1"}
            - {name: VOTER_COUNT, value: "1"}
            - {name: DEFER_PEER_SERVICE, value: defer-headless}
            - {name: DEFER_RAFT_PORT, value: "7142"}
            - {name: DEFER_DATA_DIR, value: /data}
            - name: DEFER_BIND
              valueFrom: {configMapKeyRef: {name: defer-config, key: DEFER_BIND}}
            - name: DEFER_GRACE_SECS
              valueFrom: {configMapKeyRef: {name: defer-config, key: DEFER_GRACE_SECS}}
            - name: DEFER_LOG_FORMAT
              valueFrom: {configMapKeyRef: {name: defer-config, key: DEFER_LOG_FORMAT}}
            - name: DEFER_AUTH
              valueFrom: {configMapKeyRef: {name: defer-config, key: DEFER_AUTH}}
            - name: RUST_LOG
              valueFrom: {configMapKeyRef: {name: defer-config, key: RUST_LOG}}
          resources:
            requests: {cpu: "1", memory: 4Gi}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 120
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 10Gi}
