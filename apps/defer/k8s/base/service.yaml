apiVersion: v1
kind: Service
metadata:
  name: defer-headless
  namespace: defer
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: defer, role: server}
  ports:
    - {name: http, port: 7141, targetPort: http, protocol: TCP}
    - {name: raft, port: 7142, targetPort: raft, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata:
  name: defer
  namespace: defer
spec:
  selector: {app: defer, role: server}
  ports:
    - {name: http, port: 7141, targetPort: http, protocol: TCP}
