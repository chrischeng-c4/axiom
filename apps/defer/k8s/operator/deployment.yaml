apiVersion: apps/v1
kind: Deployment
metadata: {name: defer-operator, namespace: defer-system}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: defer-operator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: defer-operator}
    spec:
      serviceAccountName: defer-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: operator
          image: defer:0.4.7
          command: ["defer", "k8s", "operator", "run"]
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
