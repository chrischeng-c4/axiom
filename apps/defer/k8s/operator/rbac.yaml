apiVersion: v1
kind: Namespace
metadata: {name: defer-system}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: defer-operator, namespace: defer-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: defer-operator}
rules:
  - apiGroups: ["defer.dev"]
    resources: ["defers", "defers/status", "defers/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps", "batch", "policy", "coordination.k8s.io"]
    resources: ["statefulsets", "cronjobs", "poddisruptionbudgets", "leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: defer-operator}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: defer-operator}
subjects:
  - {kind: ServiceAccount, name: defer-operator, namespace: defer-system}
