[project]
name = "aw"
version = "0.1.0"
description = "aw workflow CLI"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15",
]

[project.scripts]
aw = "aw.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aw"]
