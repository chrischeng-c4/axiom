name: preview-uat

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

env:
  PREVIEW_APP: checkout
  PREVIEW_HOST: uat.example.com
  PREVIEW_BASE_NAMESPACE: uat-base
  PREVIEW_CONTEXT: kind-preview-ec
  PREVIEW_TTL_HOURS: "48"
  PREVIEW_REGISTRY: registry.local

jobs:
  open-update-rerun:
    if: github.event_name == 'workflow_dispatch' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set preview identity
        run: |
          echo "PREVIEW_MR=${{ github.event.pull_request.number || github.run_number }}" >> "$GITHUB_ENV"
          echo "PREVIEW_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "PREVIEW_IMAGE=${PREVIEW_REGISTRY}/${PREVIEW_APP}:${{ github.sha }}" >> "$GITHUB_ENV"
      - name: Build image
        run: docker build -t "$PREVIEW_IMAGE" .
      - name: Discover base workload
        run: |
          preview discover-base \
            --context "$PREVIEW_CONTEXT" \
            --namespace "$PREVIEW_BASE_NAMESPACE" \
            --app "$PREVIEW_APP" \
            --out dist/base-contract.json
      - name: Render preview
        run: |
          preview render \
            --mr "$PREVIEW_MR" \
            --sha "$PREVIEW_SHA" \
            --image "$PREVIEW_IMAGE" \
            --app "$PREVIEW_APP" \
            --host "$PREVIEW_HOST" \
            --base-contract dist/base-contract.json \
            --ttl-hours "$PREVIEW_TTL_HOURS" \
            --out dist/preview
      - name: Plan apply
        run: preview apply --dir dist/preview --context "$PREVIEW_CONTEXT" --plan-only
      - name: Server dry-run
        run: preview apply --dir dist/preview --context "$PREVIEW_CONTEXT" --dry-run
      - name: Apply preview
        run: preview apply --dir dist/preview --context "$PREVIEW_CONTEXT"
      - name: Wait rollout
        run: kubectl --context "$PREVIEW_CONTEXT" rollout status "deployment/${PREVIEW_APP}" -n "uat-mr-${PREVIEW_MR}" --timeout=120s
      - name: Resolve router target
        run: preview router resolve --context "$PREVIEW_CONTEXT" --host "$PREVIEW_HOST" --header-target "mr-${PREVIEW_MR}"
      - name: Render MR comment
        run: preview comment --mr "$PREVIEW_MR" --sha "$PREVIEW_SHA" --image "$PREVIEW_IMAGE" --app "$PREVIEW_APP" --host "$PREVIEW_HOST"

  close-cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cleanup plan
        run: |
          preview cleanup plan \
            --mr "${{ github.event.pull_request.number }}" \
            --closed \
            --namespace-exists \
            --route-binding-exists \
            --base-namespace "$PREVIEW_BASE_NAMESPACE" \
            --control-namespace preview-system > cleanup-plan.json
      - name: Apply cleanup
        run: preview cleanup apply --plan cleanup-plan.json --context "$PREVIEW_CONTEXT"
