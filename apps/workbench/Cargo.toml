[package]
name = "workbench"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Terminal-first native desktop host with pluggable read-only context renderers"
build = "build.rs"

[lib]
name = "workbench"
path = "src/lib.rs"

[[bin]]
name = "workbench"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
portable-pty = "0.9"
