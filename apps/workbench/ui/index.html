<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workbench</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #0d1117;
        color: #e6edf3;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, #172554 0, transparent 36rem),
          #0d1117;
      }
      main {
        width: min(42rem, calc(100vw - 3rem));
        padding: 2.5rem;
        border: 1px solid #30363d;
        border-radius: 1rem;
        background: rgb(22 27 34 / 92%);
        box-shadow: 0 1.5rem 5rem rgb(0 0 0 / 35%);
      }
      .eyebrow {
        margin: 0 0 0.75rem;
        color: #7ee787;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 4rem);
        line-height: 1;
      }
      p {
        max-width: 34rem;
        margin: 1.25rem 0 0;
        color: #b1bac4;
        font-size: 1rem;
        line-height: 1.65;
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="workbench-title">
      <p class="eyebrow">Native desktop host ready</p>
      <h1 id="workbench-title">Workbench</h1>
      <p>
        The verified host boundary is running. Launch folders, the native agent
        terminal, and read-only context renderers land as separate product
        slices so each behavior remains independently testable.
      </p>
    </main>
  </body>
</html>
