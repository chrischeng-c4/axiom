# Non-secret controller config. The data-plane endpoints (relay broker, keep
# store) are in-cluster ClusterIP services; override per environment in an
# overlay. Completion shards must match the workers' sink.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loom-config
  namespace: loom
  labels:
    app: loom
data:
  LOOM_RELAY: "http://relay.relay.svc.cluster.local:7400"
  LOOM_KEEP: "http://keep.keep.svc.cluster.local:7117"
  LOOM_COMPLETION_SHARDS: "8"
  LOOM_GC_RETENTION_SECS: "3600"
  LOOM_LOG_LEVEL: "info"
