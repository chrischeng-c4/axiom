# loom control plane — the raft-backed, strongly-consistent DAG state machine.
# Base is single-node (replicas 1, REPLICAS_PER_SHARD 1 → `raft_host::
# replica_mode()` is false → single-node raft). An overlay that scales replicas
# and REPLICAS_PER_SHARD > 1 flips the SAME image to a raft HA group with no
# code change: `ClusterTopology::from_env` derives node id / voters / peers from
# this pod's downward-API env + the loom-headless DNS.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loom
  namespace: loom
  labels:
    app: loom
    role: controller
spec:
  serviceName: loom-headless
  replicas: 1
  revisionHistoryLimit: 5
  # Parallel: raft forms quorum only once peers are up — do not gate pod N on
  # pod N-1 becoming Ready (which needs quorum → deadlock under OrderedReady).
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: loom
      role: controller
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: loom
        role: controller
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7474"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: loom
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loom
          image: loom:0.4.3
          imagePullPolicy: IfNotPresent
          command: ["loom", "controller"]
          ports:
            - name: http
              containerPort: 7474
              protocol: TCP
          env:
            # Downward API — the raft node identity + peer discovery inputs.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Raft topology (base = single-node; a prod overlay bumps these).
            - name: SHARD_COUNT
              value: "1"
            - name: REPLICAS_PER_SHARD
              value: "1"
            - name: VOTER_COUNT
              value: "1"
            - name: LOOM_ADDR
              value: "0.0.0.0:7474"
            - name: LOOM_LOG_FORMAT
              value: "json"
            - name: LOOM_RAFT_DIR
              value: "/data/raft"
            - name: LOOM_DRAIN_GRACE_SECS
              value: "10"
            - name: LOOM_RELAY
              valueFrom:
                configMapKeyRef:
                  name: loom-config
                  key: LOOM_RELAY
            - name: LOOM_KEEP
              valueFrom:
                configMapKeyRef:
                  name: loom-config
                  key: LOOM_KEEP
            - name: LOOM_COMPLETION_SHARDS
              valueFrom:
                configMapKeyRef:
                  name: loom-config
                  key: LOOM_COMPLETION_SHARDS
            - name: LOOM_GC_RETENTION_SECS
              valueFrom:
                configMapKeyRef:
                  name: loom-config
                  key: LOOM_GC_RETENTION_SECS
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: loom
          role: controller
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
