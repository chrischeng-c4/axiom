# Headless service: stable per-pod DNS (loom-0.loom-headless.loom.svc…) that the
# StatefulSet needs for raft peer identity + `ClusterTopology::from_env` DNS.
apiVersion: v1
kind: Service
metadata:
  name: loom-headless
  namespace: loom
  labels:
    app: loom
    role: controller
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: loom
    role: controller
  ports:
    - name: http
      port: 7474
      targetPort: http
      protocol: TCP
---
# Client endpoint. Callers submit runs + poll status through this ClusterIP
# (payload bytes never traverse loom — claim-check via keep).
apiVersion: v1
kind: Service
metadata:
  name: loom
  namespace: loom
  labels:
    app: loom
    role: controller
spec:
  type: ClusterIP
  selector:
    app: loom
    role: controller
  ports:
    - name: http
      port: 7474
      targetPort: http
      protocol: TCP
