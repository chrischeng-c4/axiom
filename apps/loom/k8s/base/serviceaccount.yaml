# The controller runs under this ServiceAccount. The `loom job-controller` role
# (a separate Deployment, not in this base) reuses it to create k8s Jobs, so it
# carries a namespaced Role granting batch/jobs + pods (read) access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loom
  namespace: loom
  labels:
    app: loom
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loom-jobctl
  namespace: loom
  labels:
    app: loom
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loom-jobctl
  namespace: loom
  labels:
    app: loom
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loom-jobctl
subjects:
  - kind: ServiceAccount
    name: loom
    namespace: loom
