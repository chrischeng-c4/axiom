# Keep a raft majority available during voluntary disruptions (node drains,
# rolling updates). At replicas=1 this is a no-op; it bites once an overlay
# scales the control plane to an HA group.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: loom
  namespace: loom
  labels:
    app: loom
    role: controller
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: loom
      role: controller
