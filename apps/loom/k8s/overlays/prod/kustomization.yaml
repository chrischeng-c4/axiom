# Prod overlay: a 3-node raft HA group with production resources and a pinned
# image tag. REPLICAS_PER_SHARD/VOTER_COUNT=3 flip `raft_host::replica_mode()`
# on so the same image derives a 3-voter raft group from the downward API.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: loom
    newTag: 0.4.3

patches:
  - target:
      kind: StatefulSet
      name: loom
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: loom
      spec:
        replicas: 3
        template:
          spec:
            containers:
              - name: loom
                securityContext:
                  runAsNonRoot: true
                env:
                  - name: REPLICAS_PER_SHARD
                    value: "3"
                  - name: VOTER_COUNT
                    value: "3"
                resources:
                  requests:
                    cpu: "1"
                    memory: 1Gi
                  limits:
                    cpu: "2"
                    memory: 2Gi
