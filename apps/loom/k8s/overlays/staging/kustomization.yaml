# Staging overlay: a 3-node raft HA group (REPLICAS_PER_SHARD/VOTER_COUNT=3 flip
# `raft_host::replica_mode()` on — the same image derives a 3-voter group from
# the downward API). Modest resources.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: loom
    newTag: staging

patches:
  - target:
      kind: StatefulSet
      name: loom
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: loom
      spec:
        replicas: 3
        template:
          spec:
            containers:
              - name: loom
                securityContext:
                  runAsNonRoot: true
                env:
                  - name: REPLICAS_PER_SHARD
                    value: "3"
                  - name: VOTER_COUNT
                    value: "3"
                resources:
                  requests:
                    cpu: "500m"
                    memory: 512Mi
                  limits:
                    cpu: "1"
                    memory: 1Gi
