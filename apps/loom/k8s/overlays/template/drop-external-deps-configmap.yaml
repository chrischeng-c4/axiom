# Companion to drop-external-deps.yaml: the StatefulSet env entries are
# already deleted there; nulling the map keys here removes the now-dead
# ConfigMap data too, so the rendered manifests carry no relay/keep endpoint
# at all.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loom-config
  namespace: loom
data:
  LOOM_RELAY: null
  LOOM_KEEP: null
