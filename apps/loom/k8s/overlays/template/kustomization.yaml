apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
images:
  - name: loom
    newName: REPLACE_ME__REGISTRY/loom
    newTag: REPLACE_ME__TAG
# Isolated acceptance: with LOOM_RELAY unset the controller selects the
# in-process MemDispatcher (apps/loom/src/controller.rs), so no relay/keep
# deployment is needed while the raft store stays durable on the PVC
# (LOOM_RAFT_DIR is set in the base, independent of dispatcher selection).
patches:
  - path: drop-external-deps.yaml
  - path: drop-external-deps-configmap.yaml
