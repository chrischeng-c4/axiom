# The loom operator's namespace + identity + cluster permissions. The operator
# watches `Loom` CRs cluster-wide and applies their child objects; it holds a
# coordination Lease for leader election (HA-safe at replicas > 1).
apiVersion: v1
kind: Namespace
metadata:
  name: loom-system
  labels:
    app.kubernetes.io/name: loom
    app.kubernetes.io/component: operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loom-operator
  namespace: loom-system
  labels:
    app.kubernetes.io/name: loom
    app.kubernetes.io/component: operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: loom-operator
  labels:
    app.kubernetes.io/name: loom
    app.kubernetes.io/component: operator
rules:
  # Watch + status on the Loom custom resource.
  - apiGroups: ["loom.dev"]
    resources: ["looms", "looms/status", "looms/finalizers"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # Child objects the reconcile loop server-side-applies.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "serviceaccounts", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Leader-election lease.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Events for reconcile diagnostics.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: loom-operator
  labels:
    app.kubernetes.io/name: loom
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: loom-operator
subjects:
  - kind: ServiceAccount
    name: loom-operator
    namespace: loom-system
