apiVersion: v1
kind: Namespace
metadata:
  name: beam-system
  labels:
    app.kubernetes.io/name: beam-operator
    app.kubernetes.io/part-of: beam
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: beam-operator
  namespace: beam-system
  labels:
    app.kubernetes.io/name: beam-operator
    app.kubernetes.io/part-of: beam
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: beam-operator
  labels:
    app.kubernetes.io/name: beam-operator
    app.kubernetes.io/part-of: beam
# rules for beam-operator
rules:
  - apiGroups: ["beam.dev"]
    resources: ["beams", "beams/status", "beams/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: beam-operator
  labels:
    app.kubernetes.io/name: beam-operator
    app.kubernetes.io/part-of: beam
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: beam-operator
subjects:
  - kind: ServiceAccount
    name: beam-operator
    namespace: beam-system
