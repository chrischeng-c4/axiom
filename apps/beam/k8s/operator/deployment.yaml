apiVersion: apps/v1
kind: Deployment
metadata:
  name: beam-operator
  namespace: beam-system
  labels:
    app.kubernetes.io/name: beam-operator
    app.kubernetes.io/part-of: beam
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: beam-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beam-operator
    spec:
      serviceAccountName: beam-operator
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: beam:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/beam", "k8s", "operator", "run"]
          env:
            - name: RUST_LOG
              value: "info"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
