[project]
name = "tape"
cap_path = "README.md"
label = "app:tape"

[capability.profile]
traits = ["service", "long_running", "cli_facing", "competitive_replacement", "network_exposed", "primary_replicas", "stateful_storage"]

[[workspaces]]
name = "tape"
paths = ["**"]
target = "rust"
test_cmd = "cargo test -p tape"
codegen.profile = "rust/score-crate"

[impl]
build = "cargo test --locked -p tape --lib --no-run"
test = "cargo test --locked -p tape --lib"
harness = "cargo"
