apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tapes.tape.dev
spec:
  group: tape.dev
  names:
    categories: []
    kind: Tape
    plural: tapes
    shortNames:
    - tp
    singular: tape
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for TapeSpec via `CustomResource`
        properties:
          spec:
            description: '`tape.dev/v1alpha1` `Tape`. Namespaced: every child object the operator renders lands in this object''s namespace, so independent tape deployments coexist by name.'
            properties:
              auth:
                default: required
                description: |-
                  Request-auth mode for the data plane: `required` (the default — supply a token registry via `tokensSecret` or `tokensSecretProviderClass`) or `disabled`.

                  `required` is the default because the other way round, forgetting this field ships an open cluster and nothing says so; forgetting it now fails startup with a message naming the field to set. `disabled` remains a one-word opt-out for local development (#2765).

                  Spelled `disabled`, not `off`: YAML 1.1 reads a bare `off` as the boolean `false`. (`off` is what the serving process's own `TAPE_AUTH` env var takes — the two spellings are not interchangeable.)
                enum:
                - disabled
                - required
                type: string
              backup:
                description: |-
                  Optional scheduled backup. When set, the operator renders a CronJob that runs `tape backup` against this instance's client Service on the declared schedule (#2574). Unset renders no CronJob — the previous behavior, and still the default.

                  The `tape backup` CLI verb and the `/admin/backup` endpoint it pulls from both already existed (#1329); what was missing was any declarative way to schedule them, so the only route was running the verb by hand or hand-authoring a CronJob outside the operator — which then did not track the CR's image, ServiceAccount, or auth wiring.
                nullable: true
                properties:
                  adminTokenSecret:
                    description: 'Name of a Secret holding a bearer token with `admin` on `*`, projected into the CronJob as `TAPE_BACKUP_TOKEN` (key `token`). Required when the instance runs `auth: required`; omit for `auth: disabled`.'
                    nullable: true
                    type: string
                  destination:
                    description: Destination URI accepted by [`BackupDestination::from_uri`].
                    type: string
                  retentionSecs:
                    description: Drop objects older than this many seconds after a successful put. `None` keeps every object.
                    type: integer
                    minimum: 0.0
                    nullable: true
                  schedule:
                    description: Cron expression rendered into `CronJob.spec.schedule`.
                    type: string
                required:
                - destination
                - schedule
                type: object
              bodyLimitBytes:
                description: Data-plane request body size limit (bytes). Requests with `Content-Length` exceeding this are rejected with 413; streamed bodies are bounded mid-read. Defaults to 8 MiB. Unset means the server default (#2484).
                type: integer
                minimum: 0.0
                nullable: true
              bootstrapSeedUri:
                description: 'Exact backup object URI consulted to seed a replica whose data directory is still EMPTY before Raft catch-up. Bootstrap-if-empty (#2468): the server probes the durable data directory first — a pod that already has raft state (including a routine restart onto its own PVC) skips the seed and boots from that existing state instead of refusing, so this field may harmlessly stay set on the CR after a successful bootstrap. It only ever seeds a fresh (empty) data directory, so this is cold recovery rather than live replica synchronization. Recommended hygiene: remove it once the bootstrap converges anyway, so the CR does not silently re-seed if the PVC is ever recreated (e.g. deleted-and-reprovisioned) — the field''s presence alone would then look like a fresh empty PVC again.'
                nullable: true
                type: string
              graceSecs:
                default: 10
                description: Graceful drain window on SIGTERM (seconds); tracks `terminationGracePeriodSeconds`. Defaults to 10 (`TAPE_GRACE_SECS`).
                type: integer
                minimum: 0.0
              image:
                type: string
              imagePullPolicy:
                nullable: true
                type: string
              logLevel:
                description: Log level (`trace|debug|info|warn|error`), injected as `RUST_LOG`. Unset means the server default (`info`).
                nullable: true
                type: string
              observability:
                default: false
                description: |-
                  Emit a `ServiceMonitor` + `PrometheusRule` alongside the workload (#2575), carrying the same four SLO alerts the hand-maintained `k8s/components/observability` kustomize component ships — including #2485's seed-failure and consumer-liveness runbooks.

                  Opt-in, and default-off on purpose: both are `monitoring.coreos.com/v1` kinds, so a cluster without the Prometheus Operator CRDs installed would reject them. Leaving it off keeps a vanilla cluster installable; turning it on there is a reconcile error the operator reports, not a surprise the CR author meets at install time. Same shape and default as lumen's `spec.observability`.
                type: boolean
              replicasPerShard:
                default: 1
                description: Starting/minimum members per shard. With startup-static raft-runtime membership this is also the fixed desired value; a future membership controller may plan whole replica layers above this floor.
                type: integer
                minimum: 0.0
              resources:
                default:
                  cpu: ''
                  memory: ''
                description: Per-pod CPU/memory requests. Empty values resolve to the shared data-plane defaults (`1` CPU / `4Gi`) at render time. Limits are intentionally omitted so a dedicated-node pod can use otherwise-idle node capacity.
                properties:
                  cpu:
                    default: ''
                    type: string
                  memory:
                    default: ''
                    type: string
                type: object
              serviceAccountName:
                description: Optional external ServiceAccount name for the workload StatefulSet. When set, the operator skips rendering the `<instance>` ServiceAccount entirely and configures the workload StatefulSet to use this name instead (#2581). `<name>-backup` identity is unaffected.
                nullable: true
                type: string
              shardCount:
                default: 1
                type: integer
                minimum: 0.0
              storage:
                default: 10Gi
                description: Per-pod journal plus shared Raft hard-state/log/snapshot PVC size. Defaults to `10Gi`.
                type: string
              storageClass:
                description: PVC StorageClass for the journal disk. Unset means the cluster default.
                nullable: true
                type: string
              tokensSecret:
                description: 'Name of the Secret carrying the bearer-token registry (key `token-registry.json`). When set with `auth: required`, the render mounts it read-only at `/var/run/secrets/tape` and injects `TAPE_TOKEN_REGISTRY_FILE` (relay/lumen''s pattern). Tape watches a changed projection and atomically applies only a valid replacement without a pod restart. Ignored when `auth: disabled`. Setting **both** this and `tokensSecretProviderClass` is rejected by the CRD schema (#2765), because silently preferring one leaves an operator reading credentials that are not the ones being served.'
                nullable: true
                type: string
              tokensSecretCsiDriver:
                description: CSI driver name for the `tokensSecretProviderClass` projection. Defaults to the community `secrets-store.csi.k8s.io`; GKE's managed Secrets Store add-on registers `secrets-store-gke.csi.k8s.io`, so GKE instances must set that value (#2456).
                nullable: true
                type: string
              tokensSecretProviderClass:
                description: 'Name of a Secrets Store CSI `SecretProviderClass` that projects the same `token-registry.json` file as [`Self::tokens_secret`]. When the CSI driver refreshes that file, Tape''s watcher applies valid rotations without a pod restart. Ignored when `auth: disabled`. Mutual exclusion with `tokensSecret` is enforced by the CRD schema (`x-kubernetes-validations`), so setting both is rejected at `kubectl apply` rather than resolved by a precedence rule nothing surfaces (#2765).'
                nullable: true
                type: string
              topics:
                description: 'Declarative topic/subscription provisioning: a list of topics and their pre-created subscriptions. The serve path (after the journal is ready) idempotently ensures each subscription, tolerating `AlreadyExists` errors. Topic creation is implicit (no journal mutation); declaring a topic alone is documentation + future-proofing for per-topic config (retention/quotas — #2550). **Additive-only**: removing an entry from this list never deletes anything (deletion lifecycle is #2549''s decision). Cross-ref: #2557.'
                items:
                  description: Topic declaration with optional subscriptions.
                  properties:
                    name:
                      description: Topic name.
                      type: string
                    subscriptions:
                      default: []
                      description: 'Pre-created subscriptions for this topic (default: empty).'
                      items:
                        type: string
                      type: array
                  required:
                  - name
                  type: object
                nullable: true
                type: array
              voterCount:
                default: 1
                type: integer
                minimum: 0.0
            required:
            - image
            type: object
            x-kubernetes-validations:
            - rule: '!(has(self.tokensSecret) && has(self.tokensSecretProviderClass))'
              message: set at most one of spec.tokensSecret (a Kubernetes Secret) or spec.tokensSecretProviderClass (a Secret Manager CSI projection); with both set there is no way to tell which registry is actually being served
          status:
            description: Status subresource, written back by the reconcile loop.
            nullable: true
            properties:
              conditions:
                description: |-
                  Kubernetes-convention convergence conditions (#3054): `Ready`, `Progressing`, `StorageHealthy`, `BackupConfigured`. This is the surface `kubectl wait --for=condition=Ready`, Argo CD health assessment, and Flux readiness gates read; `phase` is unchanged and still populated, so nothing already consuming it breaks.

                  `lastTransitionTime` is stamped by the reconcile loop, not here — see [`super::reconcile`]'s no-I/O `status_patch` contract.
                items:
                  description: |-
                    One entry of a Kubernetes `status.conditions[]` array, in the shape every controller-aware tool already reads — `kubectl wait --for=condition=…`, Argo CD health assessment, Flux readiness gates.

                    Hand-written rather than reused from `k8s_openapi::apimachinery::pkg::apis::meta::v1::Condition` because that type does not derive `JsonSchema`, so it cannot be embedded in a CRD schema generated by `kube`'s derive.
                  properties:
                    lastTransitionTime:
                      description: RFC3339 instant the status last *changed* — not the last time it was observed. Carried across reconciles by [`project`].
                      type: string
                    message:
                      default: ''
                      description: Human-readable detail. May be empty.
                      type: string
                    observedGeneration:
                      description: The `.metadata.generation` this condition was computed from.
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: CamelCase machine-readable cause of the current status.
                      type: string
                    status:
                      description: '`"True" | "False" | "Unknown"`.'
                      type: string
                    type:
                      description: CamelCase condition name, e.g. `Ready`.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
              desiredReplicas:
                default: 0
                description: Desired replicas (`replicasPerShard`; tape is single-group).
                format: int32
                type: integer
              message:
                default: ''
                description: Last human-readable reconcile message.
                type: string
              observedGeneration:
                default: 0
                description: The `.metadata.generation` this status reflects (drift detection).
                format: int64
                type: integer
              phase:
                default: ''
                description: '`Pending | Reconciling | Ready`.'
                type: string
              readyReplicas:
                default: 0
                description: Ready replicas (from the StatefulSet status).
                format: int32
                type: integer
            type: object
        required:
        - spec
        title: Tape
        type: object
    served: true
    storage: true
    subresources:
      status: {}
