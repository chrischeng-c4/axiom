# CODEGEN-BEGIN
# Keeps one reconciler alive through voluntary disruption. The operator
# runs two replicas behind leader election, so a node drain must take them one
# at a time — evicting both at once leaves every Tape CR in the cluster
# unreconciled until a replacement pod becomes ready and acquires the Lease.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tape-operator
  namespace: tape-system
  labels:
    app.kubernetes.io/name: tape-operator
    app.kubernetes.io/part-of: tape
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tape-operator
# CODEGEN-END
