# The tape operator runs in its own namespace and needs cluster-wide
# permission to manage the child kinds it renders for every Tape custom
# resource.
apiVersion: v1
kind: Namespace
metadata:
  name: tape-system
  labels:
    app.kubernetes.io/name: tape-operator
    app.kubernetes.io/part-of: tape
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tape-operator
  namespace: tape-system
  labels:
    app.kubernetes.io/name: tape-operator
    app.kubernetes.io/part-of: tape
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tape-operator
  labels:
    app.kubernetes.io/name: tape-operator
    app.kubernetes.io/part-of: tape
rules:
  # The custom resource it owns + its status subresource.
  - apiGroups: ["tape.dev"]
    resources: ["tapes", "tapes/status", "tapes/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The durable journal workload.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The optional scheduled-backup CronJob rendered from spec.backup (#2574).
  # Without this the operator renders the object and then fails to apply it.
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Serving Service/ServiceAccount.
  - apiGroups: [""]
    resources: ["services", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The opt-in observability pair rendered from spec.observability (#2575).
  # Granted unconditionally: RBAC rules name API groups, not installed CRDs, so
  # this is harmless on a cluster without the Prometheus Operator — the CR
  # simply never sets the flag. Withholding it instead would turn the flag into
  # a Forbidden at reconcile time.
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "prometheusrules"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Leader-election Lease (HA: only the holder reconciles).
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tape-operator
  labels:
    app.kubernetes.io/name: tape-operator
    app.kubernetes.io/part-of: tape
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tape-operator
subjects:
  - kind: ServiceAccount
    name: tape-operator
    namespace: tape-system
