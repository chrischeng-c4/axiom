# CODEGEN-BEGIN
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Installs the tape Operator: the Tape CRD, its RBAC, and the controller
# Deployment + PodDisruptionBudget (in the tape-system namespace). After this
# is applied, create `Tape` objects (see ../../examples/tape-cr.yaml) instead
# of hand-applying k8s/base + overlays.
#
#   kubectl apply -k k8s/operator
#   kubectl apply -f examples/tape-cr.yaml
#
# crd.yaml is generated — regenerate with:
#   cargo run -p tape --features operator --bin tape -- k8s crd render > k8s/operator/crd.yaml

resources:
  - crd.yaml
  - rbac.yaml
  - deployment.yaml
  # The operator's own scrape target. Unconditional because it carries no CRD
  # dependency; the ServiceMonitor + alerts that consume it are the opt-in
  # ../components/operator-monitoring component.
  - service.yaml
  - pdb.yaml
# CODEGEN-END
