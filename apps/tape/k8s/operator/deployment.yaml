# The tape operator: a controller that watches Tape objects cluster-wide.
# Ships in the same `tape` image (run as `tape k8s operator run`, built with
# --features operator). HA-safe: a coordination.k8s.io Lease elects one active
# reconciler, so this can be scaled to replicas > 1 (the others stand by).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tape-operator
  namespace: tape-system
  labels:
    app.kubernetes.io/name: tape-operator
    app.kubernetes.io/part-of: tape
spec:
  # Scale to 2+ for HA — leader-election guarantees a single active reconciler.
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: tape-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tape-operator
    spec:
      serviceAccountName: tape-operator
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: tape:latest
          imagePullPolicy: IfNotPresent
          command: ["tape", "k8s", "operator", "run"]
          env:
            - name: RUST_LOG
              value: "info"
            # Leader-election identity + the namespace the Lease lives in.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
