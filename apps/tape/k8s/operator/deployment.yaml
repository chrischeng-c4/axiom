# The tape operator: a controller that watches Tape objects cluster-wide.
# Ships in the same `tape` image (run as `tape k8s operator run`, built with
# --features operator). Two replicas run behind a coordination.k8s.io Lease,
# which elects one active reconciler and keeps the other as a warm standby.
# With the PDB's maxUnavailable: 1, a node drain takes them one at a time,
# maintaining continuous reconciliation without leaving Tape CRs unreconciled.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tape-operator
  namespace: tape-system
  labels:
    app.kubernetes.io/name: tape-operator
    app.kubernetes.io/part-of: tape
spec:
  # HA floor: two replicas is the minimum for leader election to provide
  # meaningful availability. The Lease elects one to reconcile; the other
  # stands by and takes over on drain, eviction, or rollout. The PDB
  # (maxUnavailable: 1) enforces one-at-a-time eviction during voluntary
  # disruption so the standby survives and the group never goes dark.
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: tape-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tape-operator
    spec:
      serviceAccountName: tape-operator
      terminationGracePeriodSeconds: 15
      affinity:
        podAntiAffinity:
          # Preferred, not required: co-located replicas still survive a drain
          # (the PDB forces it one pod at a time), and a single-node cluster —
          # kind, minikube — must be able to run both rather than park one
          # replica Pending forever.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: tape-operator
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/chrischeng-c4/tape:0.5.0
          imagePullPolicy: IfNotPresent
          command: ["tape", "k8s", "operator", "run"]
          ports:
            # Control-plane scrape endpoint. Every replica serves it, leader
            # and standby alike: the standby publishes `_leader 0` rather than
            # going dark, which is what makes "which replica is in charge"
            # answerable and a failed handover visible.
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info"
            # Leader-election identity + the namespace the Lease lives in.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
