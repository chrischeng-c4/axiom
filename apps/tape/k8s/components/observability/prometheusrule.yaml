# HANDWRITE-BEGIN gap="missing-generator:logic:4449c2ec" tracker="#1588" reason="Alert on real Tape append/replay average-latency series and Kubernetes restart loops without inventing domain lag metrics. generator gap: missing-generator:prometheus-rule (#1588)."
#
# Editing an alert here? The operator renders a twin of this rule from
# `spec.observability` (#2575, src/operator/render.rs::prometheus_rule), and
# e2e/operator.rs fails if the alert set, `for`, severity, summary, runbook
# text, metric names, or thresholds drift apart. The label SELECTORS are
# expected to differ — this file targets the static base's `app`/`role` labels,
# the operator targets the `app.kubernetes.io/*` set it stamps — so change both
# files together, and never copy an expr verbatim between them.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tape-slo
  namespace: tape
  labels:
    app: tape
    role: server
    release: prometheus
spec:
  groups:
    - name: tape.slo
      interval: 30s
      rules:
        - alert: TapeAppendLatencyHigh
          expr: |
            sum(rate(tape_append_latency_ms_sum{app="tape",role="server"}[5m]))
            / clamp_min(sum(rate(tape_append_latency_ms_count{app="tape",role="server"}[5m])), 1) > 500
          for: 10m
          labels: { severity: warning, app: tape, role: server }
          annotations:
            summary: "tape append average latency above 500ms"
        - alert: TapeReplayLatencyHigh
          expr: |
            sum(rate(tape_replay_latency_ms_sum{app="tape",role="server"}[5m]))
            / clamp_min(sum(rate(tape_replay_latency_ms_count{app="tape",role="server"}[5m])), 1) > 2000
          for: 10m
          labels: { severity: warning, app: tape, role: server }
          annotations:
            summary: "tape replay average latency above 2s"
        - alert: TapePodRestarting
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="tape",container="tape"}[15m]) > 2
          for: 5m
          labels: { severity: warning, app: tape, role: server }
          annotations:
            summary: "tape pod restarting repeatedly"
            runbook: "#2485: Differentiate seed-failure restarts by checking if `spec.bootstrapSeedUri` is set on the CR and examining the pod log for structured decision fields: (1) `decision=\"seeded\"` = seed succeeded, look for other causes (probe failures, image pull, resource limits); (2) `decision=\"skipped_existing_state\"` = seed was skipped (PVC already had data), pod is healthy; (3) NEITHER line present before a crash = seed fetch/decode failed (bad URI, IAM, corrupt object) — restore logs show which. #2468: the one-shot seed cleared bit is separate. See docs/deployment-handoff.md Cold restore runbook."
        - alert: TapeStorageDegraded
          # `max_over_time` on purpose: the node re-probes every 30s and clears
          # the gauge itself, so a volume that keeps filling and draining can
          # read 0 at every scrape while rejecting writes between them. The
          # window trades a ~5m tail after real recovery for not missing that.
          expr: |
            max_over_time(tape_storage_degraded{app="tape",role="server"}[5m]) > 0
          for: 2m
          labels: { severity: critical, app: tape, role: server }
          annotations:
            summary: "tape node in ENOSPC degraded read-only mode"
            runbook: "#2573: The node hit ENOSPC on its journal persist path and latched degraded read-only mode — mutating requests answer 507 `storage_full`, reads keep serving. Check `tape_storage_full_errors_total`: a rising counter with the gauge back at 0 means the volume is flapping in and out of full, not that it recovered. Remedy is capacity — free objects via retention or expand the PVC on a resizable StorageClass. No restart is needed: the pod re-probes the store directory every `TAPE_STORAGE_FULL_REPROBE_SECS` (default 30s) and clears the flag itself. If the gauge stays 1 after the volume has room, read the pod log for the re-probe warning — the store directory can be unwritable for reasons other than capacity (read-only remount, permissions)."
        - alert: TapeSubscriptionLagGrowing
          expr: |
            increase(tape_subscription_lag{app="tape",role="server"}[15m]) > 0
          for: 15m
          labels: { severity: warning, app: tape, role: server }
          annotations:
            summary: "tape subscription lag growing over 15m"
            runbook: "#2485: Check if the consumer bound to the subscription is alive and actively pulling. If the consumer has stopped or stalled, verify it has not crashed or exhausted resources. If the consumer is healthy, check the append rate to the topic — a rapid append rate combined with a slow consumer will naturally grow lag. No action needed if this is expected; adjust retention policy if needed to protect the subscription's checkpoint from expiry."
        - alert: TapeMemoryHeadroomLow
          # #3051. Unlike every other alert here, both series come from
          # cAdvisor, not from tape's own /metrics — so this one is scoped by
          # the kubelet's `namespace`/`container` labels and carries no
          # `app`/`role`, exactly as TapePodRestarting above.
          #
          # The `> 0` on the denominator is a filter, not a comparison: a
          # container with no memory limit reports the spec gauge as 0, and
          # dropping those samples leaves the division with nothing to match
          # rather than +Inf. Without it, every unbounded container in the
          # namespace would alert forever.
          expr: |
            max by (pod) (
            container_memory_working_set_bytes{namespace="tape",container="tape"}
            / (container_spec_memory_limit_bytes{namespace="tape",container="tape"} > 0)
            ) > 0.85
          for: 10m
          labels: { severity: warning, app: tape, role: server }
          annotations:
            summary: "tape container memory headroom below 15%"
            runbook: "#3051: The container's memory working set is within 15% of its limit, and the limit equals the request, so the next step is an OOMKill of this pod. Do NOT raise the limit as the remedy — it defers the wall and hides the growth again; the limit exists to make this growth visible. Act on the two causes you can fix now: (1) retention — `tape retention list` (or the CR's `spec.retention`); a topic with no entry is NEVER pruned and grows without bound, so give every active topic a byte or count bound; (2) a stalled consumer — check `tape_subscription_lag` and whether the bound consumer is still pulling, since a checkpoint that stops advancing pins events that retention would otherwise drop. If neither applies, the pod is holding more memory than its journal justifies: this is the whole-journal-rewrite persist path (`AppState::persist` serializes the entire journal on every mutation), which #3052 (WAL + group commit) removes. Capacity sizing is #2552 — do not derive a new limit from this alert alone."
# HANDWRITE-END
