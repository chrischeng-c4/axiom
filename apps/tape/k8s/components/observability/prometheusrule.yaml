# HANDWRITE-BEGIN gap="missing-generator:logic:4449c2ec" tracker="#1588" reason="Alert on real Tape append/replay average-latency series and Kubernetes restart loops without inventing domain lag metrics. generator gap: missing-generator:prometheus-rule (#1588)."
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tape-slo
  namespace: tape
  labels:
    app: tape
    role: server
    release: prometheus
spec:
  groups:
    - name: tape.slo
      interval: 30s
      rules:
        - alert: TapeAppendLatencyHigh
          expr: |
            sum(rate(tape_append_latency_ms_sum{app="tape",role="server"}[5m]))
            / clamp_min(sum(rate(tape_append_latency_ms_count{app="tape",role="server"}[5m])), 1) > 500
          for: 10m
          labels: { severity: warning, app: tape, role: server }
          annotations:
            summary: "tape append average latency above 500ms"
        - alert: TapeReplayLatencyHigh
          expr: |
            sum(rate(tape_replay_latency_ms_sum{app="tape",role="server"}[5m]))
            / clamp_min(sum(rate(tape_replay_latency_ms_count{app="tape",role="server"}[5m])), 1) > 2000
          for: 10m
          labels: { severity: warning, app: tape, role: server }
          annotations:
            summary: "tape replay average latency above 2s"
        - alert: TapePodRestarting
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="tape",container="tape"}[15m]) > 2
          for: 5m
          labels: { severity: warning, app: tape, role: server }
          annotations:
            summary: "tape pod restarting repeatedly"
            runbook: "#2468: spec.bootstrapSeedUri left set on the CR after a cold restore is bootstrap-if-empty and no longer a crash-loop cause by itself — a pod restarting onto its own already-populated PVC detects existing state and skips the seed (look for decision=\"skipped_existing_state\" in the pod log). If a pod IS crash-looping with bootstrapSeedUri set, suspect its PVC was actually deleted/reprovisioned (genuinely empty again) and the seed is being re-applied against a stale backup object, or check other causes generically (probe failures, image pull, resource limits) — this alert cannot distinguish the cause (#2485). See docs/deployment-handoff.md Cold restore runbook."
# HANDWRITE-END
