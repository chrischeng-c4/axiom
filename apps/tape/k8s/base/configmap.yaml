# HANDWRITE-BEGIN gap="missing-generator:deployment:direct-install-statefulset" tracker="#1809" reason="Static direct-install runtime configuration is kept in a stable ConfigMap so overlays can patch values without changing immutable selectors."
apiVersion: v1
kind: ConfigMap
metadata:
  name: tape-config
  namespace: tape
  labels:
    app: tape
    role: server
data:
  # h2c + HTTP/1.1 client API listener.
  TAPE_BIND: "0.0.0.0:7137"
  # SIGTERM drain window; matches the StatefulSet's grace period.
  TAPE_GRACE_SECS: "30"
  # Sift's node collector accepts the shared versioned JSONL contract.
  TAPE_LOG_FORMAT: "json"
  # Production defaults to structured logs. Dev overlays use debug.
  RUST_LOG: "info"
  # Direct Kustomize starts tokenless. Staging/prod overlays may set required
  # only together with a mounted token-registry Secret or CSI projection.
  TAPE_AUTH: "off"
# HANDWRITE-END
