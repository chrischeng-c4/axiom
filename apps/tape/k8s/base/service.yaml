# HANDWRITE-BEGIN gap="missing-generator:deployment:direct-install-statefulset" tracker="#1809" reason="Direct-install Services preserve the Tape operator's stable headless peer identity and distinct client endpoint."
# Headless Service gives StatefulSet members stable DNS. Direct Kustomize keeps
# it at one member; HA peer membership is rendered by the operator.
apiVersion: v1
kind: Service
metadata:
  name: tape-headless
  namespace: tape
  labels:
    app: tape
    role: server
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: tape
    role: server
  ports:
    - name: http
      port: 7137
      targetPort: http
      protocol: TCP
    - name: raft
      port: 7138
      targetPort: raft
      protocol: TCP
---
# Client endpoint. Consumers publish and replay through this ClusterIP Service.
apiVersion: v1
kind: Service
metadata:
  name: tape
  namespace: tape
  labels:
    app: tape
    role: server
spec:
  type: ClusterIP
  selector:
    app: tape
    role: server
  ports:
    - name: http
      port: 7137
      targetPort: http
      protocol: TCP
# HANDWRITE-END
