# HANDWRITE-BEGIN gap="missing-generator:deployment:direct-install-statefulset" tracker="#1809" reason="Tape's direct path needs a PVC-backed StatefulSet rather than Lumen's disposable Deployment; HA/membership remains operator-owned."
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tape
  namespace: tape
  labels:
    app: tape
    role: server
spec:
  # This direct path is deliberately a one-member durable journal. Do not
  # scale it by changing replicas: Tape HA needs the operator to render a
  # complete raft membership and per-pod topology environment.
  serviceName: tape-headless
  replicas: 1
  revisionHistoryLimit: 5
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: tape
      role: server
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: tape
        role: server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7137"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: tape
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tape
          image: ghcr.io/chrischeng-c4/tape:0.5.0
          imagePullPolicy: IfNotPresent
          command: ["tape", "serve"]
          ports:
            - name: http
              containerPort: 7137
              protocol: TCP
            - name: raft
              containerPort: 7138
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # These values keep direct mode explicitly single-member. The
            # operator changes all three as one validated raft topology.
            - name: SHARD_COUNT
              value: "1"
            - name: REPLICAS_PER_SHARD
              value: "1"
            - name: VOTER_COUNT
              value: "1"
            - name: TAPE_PEER_SERVICE
              value: tape-headless
            - name: TAPE_DATA_DIR
              value: /data
            - name: TAPE_BIND
              valueFrom:
                configMapKeyRef:
                  name: tape-config
                  key: TAPE_BIND
            - name: TAPE_GRACE_SECS
              valueFrom:
                configMapKeyRef:
                  name: tape-config
                  key: TAPE_GRACE_SECS
            - name: TAPE_LOG_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: tape-config
                  key: TAPE_LOG_FORMAT
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: tape-config
                  key: RUST_LOG
            - name: TAPE_AUTH
              valueFrom:
                configMapKeyRef:
                  name: tape-config
                  key: TAPE_AUTH
          # Memory is bounded, CPU is not (#3051).
          #
          # Requests alone make this pod Burstable, and the kubelet relieves
          # node memory pressure by ranking victims on QoS and usage — so a
          # tape whose journal keeps growing gets its neighbours evicted while
          # it survives. The limit equals the request so the kill lands on the
          # container that caused it. Do not raise it in response to an
          # OOMKill: the growth it exposes is the whole-journal rewrite in
          # AppState::persist, which #3052 (WAL + group commit) removes.
          #
          # No CPU limit on purpose. tape runs one pod per node and should use
          # idle CPU, and throttling the persist path only lengthens the append
          # latency TapeAppendLatencyHigh is watching.
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: tape
          role: server
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
# HANDWRITE-END
