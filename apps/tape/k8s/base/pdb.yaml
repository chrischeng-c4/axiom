# HANDWRITE-BEGIN gap="missing-generator:deployment:direct-install-statefulset" tracker="#1809" reason="The direct singleton's PDB is a durable-data safety guard; multi-member availability belongs to the operator CR path."
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tape
  namespace: tape
  labels:
    app: tape
    role: server
spec:
  # Do not evict the sole durable direct-install member during a voluntary
  # disruption. Operator-managed raft clusters use their rendered PDB instead.
  #
  # Consequence: `kubectl drain` on this pod's node will block indefinitely
  # and GKE node auto-upgrade will not proceed. This is deliberate: with
  # exactly one durable member, permitting eviction means accepting data-plane
  # downtime. See apps/tape/docs/runbooks/node-drain-and-pdb.md for the safe sequence
  # when a drain hangs on this pod.
  maxUnavailable: 0
  selector:
    matchLabels:
      app: tape
      role: server
# HANDWRITE-END
