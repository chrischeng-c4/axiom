# HANDWRITE-BEGIN gap="missing-generator:deployment:direct-install-statefulset" tracker="#1809" reason="Staging profile composes monitoring evidence around the direct singleton; Raft soak remains operator-managed."
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tape

resources:
  - ../../base

components:
  - ../../components/observability

# Staging exercises the same PVC/probe/security path with Prometheus assets.
# For live three-member failover/soak, use `tape k8s instance render --profile
# staging` plus the operator rather than scaling this manifest.
patches:
  - target:
      kind: ConfigMap
      name: tape-config
    patch: |-
      - op: replace
        path: /data/RUST_LOG
        value: "info"
      - op: replace
        path: /data/TAPE_AUTH
        value: "off"
  - target:
      kind: StatefulSet
      name: tape
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: "20Gi"
# HANDWRITE-END
