# HANDWRITE-BEGIN gap="missing-generator:deployment:direct-install-statefulset" tracker="#1809" reason="Prod direct-install profile demonstrates strict auth and optional policy composition while preserving the operator boundary for raft HA."
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tape

resources:
  - ../../base

components:
  - ../../components/observability
  - ../../components/network-policy

# Strict-auth direct singleton. A Secret named tape-token-registry containing
# token-registry.json must be materialized out-of-band; Tape watches valid
# Secret/CSI projection replacements without a pod restart.
patches:
  - target:
      kind: ConfigMap
      name: tape-config
    patch: |-
      - op: replace
        path: /data/RUST_LOG
        value: "info"
      - op: replace
        path: /data/TAPE_AUTH
        value: "required"
  - target:
      kind: StatefulSet
      name: tape
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: TAPE_TOKEN_REGISTRY_FILE
          value: /var/run/secrets/tape/token-registry.json
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: tape-token-registry
          mountPath: /var/run/secrets/tape
          readOnly: true
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: tape-token-registry
          secret:
            secretName: tape-token-registry
            items:
              - key: token-registry.json
                path: token-registry.json
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "4Gi"
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: "100Gi"
# HANDWRITE-END
