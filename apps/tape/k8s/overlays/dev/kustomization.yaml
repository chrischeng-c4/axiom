# HANDWRITE-BEGIN gap="missing-generator:deployment:direct-install-statefulset" tracker="#1809" reason="Dev profile patches the direct singleton without pretending to be an operator-managed raft topology."
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tape

resources:
  - ../../base

# Vanilla-Kind/laptop profile: durable singleton, open auth, human-debuggable
# logs, and a small PVC. Prometheus Operator CRDs are intentionally absent.
patches:
  - target:
      kind: ConfigMap
      name: tape-config
    patch: |-
      - op: replace
        path: /data/RUST_LOG
        value: "debug"
      - op: replace
        path: /data/TAPE_AUTH
        value: "off"
  - target:
      kind: StatefulSet
      name: tape
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: "2Gi"
# HANDWRITE-END
