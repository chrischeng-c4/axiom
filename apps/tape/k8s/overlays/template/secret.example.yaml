# Tape bearer-token registry example. Do not apply as-is: copy to secret.yaml
# in a private environment, replace every placeholder, and enable the optional
# auth patch in kustomization.yaml. A valid projected replacement is watched
# by the running Tape pod without a restart.
apiVersion: v1
kind: Secret
metadata:
  name: tape-token-registry
type: Opaque
stringData:
  token-registry.json: |
    {
      "REPLACE_ME__BEARER_TOKEN": {
        "subject": "my-app",
        "roles": { "*": "admin" }
      }
    }
