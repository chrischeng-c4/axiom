# Local verification stack: Tape + observability (Prometheus scraping tape
# directly; otel-collector/Jaeger wired up ready for tape's future OTLP
# trace exporter).
#
#   docker compose -f apps/tape/compose.yaml up --build
#
# Proves the local service + metrics scrape path on one machine. For
# multi-node local raft replication, use the raft/HA test harness instead.
#
# UIs:  Tape http://localhost:7137/docs · Prometheus :9090 · Jaeger :16686 · Grafana :3000

services:
  tape:
    build:
      context: ../..
      dockerfile: apps/tape/Dockerfile
    image: tape:dev
    hostname: tape
    command: ["serve", "--bind", "0.0.0.0:7137"]
    environment:
      TAPE_BIND: "0.0.0.0:7137"
      TAPE_AUTH: "off"
    ports: ["7137:7137"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC (ready for when tape gains an OTLP exporter)
    depends_on: [jaeger]

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [tape]

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"] # Jaeger UI

  grafana:
    image: grafana/grafana:11.5.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/ds.yaml:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, jaeger]

networks:
  default:
    name: tape-otlp
