# Tape exposes Prometheus text-exposition metrics directly at /metrics (see
# apps/tape/src/metrics.rs) -- it does not yet push OTLP metrics, so
# Prometheus scrapes tape itself rather than the otel-collector. The
# otel-collector in this stack is wired up for tape's traces once tape gains
# an OTLP exporter; it is not on tape's metrics path today.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: tape
    metrics_path: /metrics
    static_configs:
      - targets: ["tape:7137"]
