# otel-collector for tape's local dev stack. Tape does not push OTLP traces
# or metrics yet (its only telemetry surface today is the pull-based
# Prometheus /metrics endpoint, scraped directly -- see prometheus.yml), so
# this collector currently receives nothing from tape; it is wired up ready
# for when tape gains an OTLP trace exporter, mirroring the
# lumen->collector->backends path so the local stack exercises the same
# shape lumen already runs.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, debug]
