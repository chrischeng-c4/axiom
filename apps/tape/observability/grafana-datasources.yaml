# Grafana auto-provisioned datasources: Prometheus (tape's /metrics, scraped
# directly) + Jaeger (ready for tape's traces once an OTLP exporter lands).
# Anonymous admin is on (see compose.yaml) for local use.
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
