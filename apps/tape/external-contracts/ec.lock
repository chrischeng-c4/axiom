[[cases]]
id = "ec-3052-scaling"
capability_id = "topic-replay-journal"
claim_id = "ec-3052"
contract_id = "ec-3052-scaling"
dimension = "efficiency"
source_ref = "apps/tape/external-contracts/pyproject.toml#case:ec-3052-scaling"
test_path = "apps/tape/external-contracts/src/ec-3052-durable-append-scaling.py"
command = "uv run --frozen --offline --project apps/tape/external-contracts python apps/tape/external-contracts/src/runner.py ec-3052-scaling"
required_for_production = true
assertions = [
    "Durable append throughput rises with connection count: 16 concurrent connections commit at least 4x the events per second of 1, measured on two independent servers with separate empty data directories; the 1-connection level stays above a floor derived from the measured durability barrier so the ratio cannot be won by starving the lone writer; and neither level exceeds the ceiling that barrier arithmetic allows, so the ratio cannot be won by not being durable at all.",
    "artifact: artifact:tape/ec-3052",
    "oracle: Wall-clock rate measured by an external HTTP client across two concurrency levels, expressed as the ratio between them and bounded on both sides by a durability barrier measured on the same host in the same run. The ceiling is arithmetic rather than a tuning choice: with N closed-loop connections at most N records are in flight, so at most N can share one barrier, and a build that acknowledges without waiting for a barrier exceeds N * barrier_hz by orders of magnitude. That ceiling is what covers the one thing the kill cannot: each level is SIGKILLed and counted from a fresh process, which proves the writes left the process but not that they reached the medium, because the page cache outlives SIGKILL. No absolute throughput is asserted, because absolutes do not transfer off this hardware; every bound here is expressed against the in-run barrier measurement.",
    "threshold: scaled_ops_per_s / baseline_ops_per_s >= 4.0, where baseline is 1 connection and scaled is 16, each measured on its own fresh server and empty data directory; and baseline_ops_per_s >= 0.25 * barrier_hz; and ops_per_s <= 3.0 * connections * barrier_hz at both levels. barrier_hz is the median rate of the durability barrier Rust uses on this platform (F_FULLFSYNC on macOS, fsync elsewhere), measured in the same run on the same host.",
    "target: rust",
]
