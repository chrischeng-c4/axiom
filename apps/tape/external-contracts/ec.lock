contract_id = "ec-3052-durability"
dimension = "behavior"
source_ref = "apps/tape/external-contracts/pyproject.toml#case:ec-3052-durability"
test_path = "apps/tape/external-contracts/src/ec-3052-durability-under-sigkill.py"
command = "uv run --frozen --offline --project apps/tape/external-contracts python apps/tape/external-contracts/src/runner.py ec-3052-durability"
required_for_production = true
assertions = [
    "Every append that returned 2xx is replayable after the server process is SIGKILLed and restarted from the same data directory; every append the server refused with a non-2xx status is absent; replay invents nothing that was never submitted and applies nothing twice.",
    "artifact: artifact:tape/ec-3052",
    "oracle: The verifying client's own in-memory record of what each append returned, partitioned into acknowledged (2xx), refused (non-2xx) and unknown (no response, killed in flight). It is built before the kill and never derived from server state or from on-disk files. The server is a black box reached only over HTTP, and the kill is a real SIGKILL to a real child process -- which is why this cannot be an in-process Rust test. The run is refused as ungradeable unless the kill fired on the acknowledgement threshold rather than on its timeout, so a stalled server cannot report green by never putting the property at risk, and equally unless the refusal probes were in fact refused: the non-2xx half of the promise is driven deliberately rather than hoped for, by submitting appends with a truncated JSON body that the handler rejects at parse time before touching the journal, each body still carrying its own key in its bytes so that recovering one is unambiguous. Without those probes a healthy server refuses nothing and that clause is satisfied by every green run with an empty set; with them the assertion has been shown to go red against a real server that stored a write it had declined. Scope boundary, stated rather than implied: SIGKILL ends the process but not the page cache, so this case establishes crash consistency across process death and not survival of power loss; a build that acknowledged before its barrier is caught by the barrier ceiling in ec-3052-scaling, not here.",
    "target: rust",
]
evidence_digest = "sha256:93c6d73c1c5901c0a727749d8fcecf840b397a71dba7682119d8daad0bb8d21d"
