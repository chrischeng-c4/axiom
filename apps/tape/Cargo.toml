# <HANDWRITE gap="missing-generator:project-bootstrap" tracker="#768" reason="Initial Tape Rust crate manifest following the Lumen-style service slice.">
[package]
name = "tape"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "tape - topic replay journal service"
build = "build.rs"

[lib]
name = "tape"
path = "src/lib.rs"

[[bin]]
name = "tape"
path = "src/bin/tape.rs"

[[bin]]
name = "tape-bench"
path = "src/bin/tape-bench.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["env"] }
cli-std = { path = "../../libs/cli-std", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

# Shared service shell (#1325): standard probe routes (/healthz /readyz
# /metrics /openapi.json /docs), the h2c + HTTP/1.1 one-port serve loop,
# SIGTERM-aware graceful drain, and the {error, message} ApiErr envelope.
service-http = { path = "../../libs/service-http" }
# Prometheus metric primitives (Counter/Latency + text-format render) for
# TapeMetrics.
service-metrics = { path = "../../libs/service-metrics" }
# Shared bearer-token auth contract (#1326): StaticRoleMapVerifier, the
# blanket auth_middleware, and the registry loader.
service-auth = { path = "../../libs/service-auth" }
# Shared raft driver (#1327): RaftHost/RaftStore/RaftStateMachine,
# ClusterTopology::from_env, OutcomeWindow, SnapshotPolicy/HostConfig.
raft-host = { path = "../../libs/raft-host" }
# Peer-mTLS config-surface adapter (#1327): PeerTlsConfig::from_env +
# rustls server/client config builders.
service-tls = { path = "../../libs/service-tls" }
# rustls config types surfaced by the peer_tls builder passthroughs (always
# in the graph via service-tls).
rustls = "0.23"
# K8s operator (feature `operator`) — the shared libs/operator scaffold + render
# toolkit (#1328), mirroring relay's #1208 slice. tape supplies a TapeSpec CRD +
# ManagedService and gets the reconcile controller for free. Versions mirror
# the workspace's existing kube-rs users (relay / keep / lumen) so the
# lockfile stays single-versioned. Optional so the serving image never links
# kube-rs unless built with `--features operator`.
kube = { version = "0.98", features = ["runtime", "derive", "client"], optional = true }
k8s-openapi = { version = "0.24", features = ["v1_32"], optional = true }
schemars = { version = "0.8", optional = true }
operator = { path = "../../libs/operator", optional = true }
axum = { workspace = true }
utoipa = { workspace = true }
# Serve-path tracing init (RUST_LOG wins, else info EnvFilter).
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
async-nats = { workspace = true }
futures = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["full"] }
reqwest = { workspace = true }
h2c = { path = "../../libs/h2c" }
http-body-util = "0.1"
tower = { workspace = true, features = ["util"] }

[build-dependencies]
build-stamp = { path = "../../libs/build-stamp" }

[features]
default = []
self-update = ["cli-std/online"]
issue = ["cli-std/online"]
# operator — the shared libs/operator scaffold: a TapeSpec CRD + ManagedService
# render, driven by operator::run. Ships the `tape k8s operator run` controller
# and the CRD generator; pulls kube-rs, so the serving image stays kube-free
# unless built with this feature (#1328).
operator = ["dep:kube", "dep:k8s-openapi", "dep:schemars", "dep:operator"]
# </HANDWRITE>
