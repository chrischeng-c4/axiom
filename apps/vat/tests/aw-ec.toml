claim_id = "microvm-sandbox-backend-for-vat-run"
description = "Deterministic selected-plan doctor/P1 contract: explicit MicroVm image/preset services perform exactly one read-only container system status probe per invocation plus bounded read-only shared-builder advisory probes, never Docker even when Docker is on PATH. A full Docker probe maps the public services.docker_services availability string to available or unavailable. An Apple-Container-only selected doctor maps it to not_probed and records docker.daemon_probe.state=skipped with the truthful selected-plan reason as provenance; daemon=false is not unavailable evidence because no Docker command ran. An unselected Docker service cannot poison that runner. The builder record is shared_unknown ownership with automatic_cleanup=false, separate configuration/observed stats/global disk, and nonfatal timeout/unknown/probe errors; it never starts/stops/deletes/prunes shared state and never changes doctor runtime success. Unsupported no-OCI-route MicroVm presets and named-volume presets fail closed without Docker fallback. Docker runtime, Auto image, eligible Auto preset fallback, and selected cluster retain Docker probing; cluster needs Docker. Direct vat capabilities remains a full Docker probe. Recorded validation: vat_toml_runner passed 26/26; real live builder state is advisory only when the installed Apple Container CLI supports it."

