[[test_commands]]
id = "vat-headless-docker-shim"
command = "RUST_TEST_THREADS=1 cargo test -p vat --test vat_docker_shim -- --nocapture"
capability_id = "agent-native-gpu-native-dev-containers"
claim_id = "headless-docker-command-shim"
description = "Deterministic Docker-to-Apple-Container argv/profile/provenance contract for strict-single-image-v1, strict-single-build-v1, and exact host-facing-independent-v1. It covers strict direct native-JSON container inventory (`docker ps --format json` / equals with optional exactly-once `--all` or `-a`, plus only the `container ls`/`container list` aliases); strict native-JSON image inventory (`docker images --format json` / equals plus only `image ls`/`image list`); strict direct image inspect (`docker image inspect --format json IMAGE` / equals with one VAT-only selector before one safe opaque reference); strict direct container inspect (`docker inspect --format json CONTAINER` / equals plus only `container inspect`, with a VAT-only selector and one safe id); separate strict direct VAT-JSON logs, foreground-exec snapshots, retained direct build receipts, and non-owning direct pull receipts; strict no-runtime Compose preflight; bounded wait; known-provenance Compose ps topology; capture-only JSON logs; text logs/exec whose additive VAT handoff JSON starts on a new line after observed log/child bytes; and fail-closed profile/flag boundaries. The full serial fake-shim aggregate is intentionally not recorded because an independent serial run exposed a nondeterministic pre-existing Compose JSON logs timing race; serialized-cap unit passed 1/1. The Docker-facing Compose exec delimiter is parsed and validated but not forwarded: Apple receives `container exec CONTAINER COMMAND [ARG...]`. The opt-in dual-service proof is bounded to host-facing-independent-v1 up-wait/endpoints, one-document JSON ps/logs/exec, text logs, no-final-newline text-exec handoff, and down cleanup—not service-name DNS, general Compose, Docker Engine API, Kubernetes, or general runtime behavior. Strict Docker stats, direct ps, direct image inventory, direct image inspect, direct inspect, direct logs, direct exec, direct build, and direct pull have their own EC entries. The real-host direct-observation E2E passed 1/1 (50 filtered) on Apple Container 1.1.0: it uses a high-entropy nonce+PID temporary nginx container and verifies `io.cclab.vat.e2e-owner=<token>` before cleanup. Exact-label rechecks are conservative best-effort precautions, and the emergency guard retains the container on uncertainty; Apple Container has no atomic conditional delete, so this does not claim a race-free or impossible-to-misdelete cleanup. Ps/images are global read-only inventory smoke observations; inspect/stats/VAT logs and direct exec target that temporary owner-labeled container. The host smoke proves only one valid JSON document or VAT wrapper, while fake/unit tests prove byte-preservation and fail-closed details; it is not Docker Engine parity."

