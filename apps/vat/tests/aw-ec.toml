command = "VAT_DOCKER_SHIM_E2E_REQUIRED=1 cargo test -p vat --test vat_docker_shim apple_container_docker_run_published_port_contract -- --ignored --nocapture"
capability_id = "agent-native-gpu-native-dev-containers"
claim_id = "headless-docker-command-shim"
description = "Passed 1/1 (50 filtered) on Apple Container 1.1.0. The opt-in direct-observation gate creates a high-entropy nonce+PID temporary nginx container and verifies `io.cclab.vat.e2e-owner=<token>` by inspect before cleanup. Exact-label rechecks are conservative best-effort precautions, and the emergency guard retains the container on uncertainty. Apple Container provides no atomic conditional delete, so the test does not claim race-free cleanup or that a misdelete is impossible; the shared/cacheable nginx image is not cleaned up. Ps/images are global read-only inventory smoke observations; inspect/stats/VAT logs and direct exec target that temporary owner-labeled container. The host smoke proves one valid JSON document or VAT wrapper only, including one direct exec wrapper with both stdout and stderr markers; fake/unit tests prove byte-preservation and fail-closed details. It does not claim guest-timeout termination, Docker Engine parity, immutable image identity, or image cleanup."

