# Phase A E2E contracts for non-finite old-style numeric percent formatting (issue #3603).
#
# The 54 receiver/conversion/value matrix is intentionally atomic; controls below
# pin flags, finite old-style behavior, and modern formatting frontends.

bucket = "core"
lib = "percent_nonfinite_formatting"

[[case]]
dimension = "behavior"
case = "str_percent_f_positive_inf"
subject = "str.percent_format"
import = "# old-style string percent formatting uses only Python built-ins"
kind = "semantic"
intent = "str percent f formatting renders positive inf without a bogus exponent"
body = '''value = float("inf")
result = "%.2f" % value
assert result == "inf"
assert type(result) is str

print("str_percent_f_positive_inf OK")'''

