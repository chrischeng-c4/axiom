# Phase A E2E contracts for canonical string conversion in percent-s formatting (issue #3604).
#
# Every case is atomic. Handle conversions and primitive/direct-str controls stay
# in one independent library so the pre-fix red/green split is explicit.

bucket = "core"
lib = "percent_s_numeric_handles"

[[case]]
dimension = "behavior"
case = "percent_s_formats_decimal"
subject = "str.percent_format"
import = "from decimal import Decimal"
kind = "semantic"
intent = "percent s formatting routes a Decimal handle through canonical string conversion"
body = '''from decimal import Decimal

assert "%s" % Decimal("2.5") == "2.5"

print("percent_s_formats_decimal OK")'''

[[case]]
dimension = "behavior"
case = "percent_s_formats_fraction"
subject = "str.percent_format"
import = "from fractions import Fraction"
kind = "semantic"
intent = "percent s formatting routes a Fraction handle through canonical string conversion"
body = '''from fractions import Fraction

assert "%s" % Fraction(5, 2) == "5/2"

print("percent_s_formats_fraction OK")'''

[[case]]
dimension = "behavior"
case = "percent_s_width_formats_decimal"
subject = "str.percent_format"
import = "from decimal import Decimal"
kind = "semantic"
intent = "percent s width applies after Decimal canonical string conversion"
body = '''from decimal import Decimal

assert "%8s" % Decimal("2.5") == "     2.5"

print("percent_s_width_formats_decimal OK")'''

[[case]]
dimension = "behavior"
case = "percent_s_precision_formats_fraction"
subject = "str.percent_format"
import = "from fractions import Fraction"
kind = "semantic"
intent = "percent s precision applies after Fraction canonical string conversion"
body = '''from fractions import Fraction

assert "%.2s" % Fraction(5, 2) == "5/"

print("percent_s_precision_formats_fraction OK")'''

[[case]]
dimension = "behavior"
case = "percent_s_formats_int_control"
subject = "str.percent_format"
import = "# formatting syntax uses only Python built-ins"
kind = "semantic"
intent = "primitive integer percent s formatting remains unchanged"
body = '''assert "%s" % 42 == "42"

print("percent_s_formats_int_control OK")'''

[[case]]
dimension = "behavior"
case = "str_decimal_control"
subject = "str"
import = "from decimal import Decimal"
kind = "semantic"
intent = "direct Decimal string conversion remains canonical"
body = '''from decimal import Decimal

assert str(Decimal("2.5")) == "2.5"

print("str_decimal_control OK")'''

[[case]]
dimension = "behavior"
case = "str_fraction_control"
subject = "str"
import = "from fractions import Fraction"
kind = "semantic"
intent = "direct Fraction string conversion remains canonical"
body = '''from fractions import Fraction

assert str(Fraction(5, 2)) == "5/2"

print("str_fraction_control OK")'''
