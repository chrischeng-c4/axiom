# Phase A E2E contracts for old-style percent-format operand arity (issue #3598).
#
# Each case isolates one operand-selection or mapping contract. Error cases use
# the mechanical exact-exception renderer; controls carry explicit bodies so
# they are emitted filled and remain exact-output assertions.

bucket = "core"
lib = "percent_format_arity"

[[case]]
dimension = "errors"
case = "percent_format_rejects_scalar_for_multiple_slots"
subject = "str.percent_format"
import = "# formatting syntax uses only Python built-ins"
kind = "mechanical"
call = "'%s %s' % 'single'"
expect_exc = "TypeError"

[[case]]
dimension = "errors"
case = "percent_format_rejects_short_tuple"
subject = "str.percent_format"
import = "# formatting syntax uses only Python built-ins"
kind = "mechanical"
call = "'%s %s' % (1,)"
expect_exc = "TypeError"

[[case]]
dimension = "errors"
case = "percent_format_rejects_long_tuple"
subject = "str.percent_format"
import = "# formatting syntax uses only Python built-ins"
kind = "mechanical"
call = "'%s' % (1, 2)"
expect_exc = "TypeError"

[[case]]
dimension = "errors"
case = "percent_format_rejects_unused_positional_args"
subject = "str.percent_format"
import = "# formatting syntax uses only Python built-ins"
kind = "mechanical"
call = "'literal' % (1,)"
expect_exc = "TypeError"

[[case]]
dimension = "errors"
case = "percent_format_rejects_non_mapping_operand"
subject = "str.percent_format"
import = "# formatting syntax uses only Python built-ins"
kind = "mechanical"
call = "'%(name)s' % 'Ada'"
expect_exc = "TypeError"

[[case]]
dimension = "errors"
case = "percent_format_missing_mapping_key_raises_key_error"
subject = "str.percent_format"
import = "# formatting syntax uses only Python built-ins"
kind = "mechanical"
call = "'%(name)s' % {}"
expect_exc = "KeyError"

[[case]]
dimension = "behavior"
case = "percent_format_accepts_exact_positional_tuple"
subject = "str.percent_format"
import = "# formatting syntax uses only Python built-ins"
kind = "semantic"
intent = "an exact two-item positional tuple fills two percent s slots"
body = '''assert "%s %s" % ("Ada", "Lovelace") == "Ada Lovelace"

print("percent_format_accepts_exact_positional_tuple OK")'''

[[case]]
dimension = "behavior"
case = "percent_format_accepts_named_mapping"
subject = "str.percent_format"
import = "# formatting syntax uses only Python built-ins"
kind = "semantic"
intent = "a named percent s format consumes a one-key mapping"
body = '''assert "%(name)s" % {"name": "Ada"} == "Ada"

print("percent_format_accepts_named_mapping OK")'''

[[case]]
dimension = "behavior"
case = "percent_format_positional_dict_is_scalar"
subject = "str.percent_format"
import = "# formatting syntax uses only Python built-ins"
kind = "semantic"
intent = "a positional percent s format treats a one-key dict as one scalar"
body = '''assert "%s" % {"name": "Ada"} == "{'name': 'Ada'}"

print("percent_format_positional_dict_is_scalar OK")'''
