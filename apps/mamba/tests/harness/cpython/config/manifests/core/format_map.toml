# Phase A E2E contracts for str.format_map dispatch (issue #3599).
#
# Each case is atomic: numeric-handle formatting, custom __format__ dispatch,
# ordinary-float and __missing__ controls, and missing-key taxonomy are kept
# independently observable.

bucket = "core"
lib = "format_map"

[[case]]
dimension = "behavior"
case = "format_map_formats_decimal_float_spec"
subject = "str.format_map"
import = "from decimal import Decimal"
kind = "semantic"
intent = "format_map applies a float spec to a Decimal value through the canonical formatter"

[[case]]
dimension = "behavior"
case = "format_map_formats_fraction_float_spec"
subject = "str.format_map"
import = "from fractions import Fraction"
kind = "semantic"
intent = "format_map applies a float spec to a Fraction value through the canonical formatter"

[[case]]
dimension = "behavior"
case = "format_map_dispatches_custom_format"
subject = "str.format_map"
import = "# custom class is defined by the fixture body"
kind = "semantic"
intent = "format_map invokes class-level __format__ exactly once with .3f and preserves its sentinel"

[[case]]
dimension = "behavior"
case = "format_map_formats_float_control"
subject = "str.format_map"
import = "# formatting syntax uses only Python built-ins"
kind = "semantic"
intent = "format_map preserves ordinary float formatting"

[[case]]
dimension = "behavior"
case = "format_map_uses_missing_control"
subject = "str.format_map"
import = "# mapping subclass is defined by the fixture body"
kind = "semantic"
intent = "format_map preserves mapping __missing__ lookup"

[[case]]
dimension = "errors"
case = "format_map_missing_key_raises_key_error"
subject = "str.format_map"
import = "# formatting syntax uses only Python built-ins"
kind = "mechanical"
call = "'{x}'.format_map({})"
expect_exc = "KeyError"
