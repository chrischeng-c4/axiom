# Phase A E2E contracts for string/bytes percent formatting with numeric handles (issue #3601).
#
# Every case is atomic. The Decimal/Fraction %.3f cases are moved here from
# core/formatting so this dispatch-order contract has an independent library.

bucket = "core"
lib = "percent_numeric_handles"

[[case]]
dimension = "behavior"
case = "percent_f_accepts_decimal"
subject = "str.percent_format"
import = "from decimal import Decimal"
kind = "semantic"
intent = "percent f formatting routes a Decimal handle through string percent dispatch"
body = '''from decimal import Decimal

assert "%.3f" % Decimal("2.5") == "2.500"

print("percent_f_accepts_decimal OK")'''

[[case]]
dimension = "behavior"
case = "percent_f_accepts_fraction"
subject = "str.percent_format"
import = "from fractions import Fraction"
kind = "semantic"
intent = "percent f formatting routes a Fraction handle through string percent dispatch"
body = '''from fractions import Fraction

assert "%.3f" % Fraction(5, 2) == "2.500"

print("percent_f_accepts_fraction OK")'''

[[case]]
dimension = "behavior"
case = "percent_r_formats_fraction"
subject = "str.percent_format"
import = "from fractions import Fraction"
kind = "semantic"
intent = "percent r formatting routes a Fraction handle through string percent dispatch"
body = '''from fractions import Fraction

assert "%r" % Fraction(5, 2) == "Fraction(5, 2)"

print("percent_r_formats_fraction OK")'''

[[case]]
dimension = "behavior"
case = "bytes_percent_f_accepts_decimal"
subject = "bytes.percent_format"
import = "from decimal import Decimal"
kind = "semantic"
intent = "bytes percent f formatting routes a Decimal handle through percent dispatch"
body = '''from decimal import Decimal

assert b"%.3f" % Decimal("2.5") == b"2.500"

print("bytes_percent_f_accepts_decimal OK")'''

[[case]]
dimension = "behavior"
case = "bytes_percent_f_accepts_fraction"
subject = "bytes.percent_format"
import = "from fractions import Fraction"
kind = "semantic"
intent = "bytes percent f formatting routes a Fraction handle through percent dispatch"
body = '''from fractions import Fraction

assert b"%.3f" % Fraction(5, 2) == b"2.500"

print("bytes_percent_f_accepts_fraction OK")'''

[[case]]
dimension = "behavior"
case = "bytearray_percent_f_accepts_decimal"
subject = "bytearray.percent_format"
import = "from decimal import Decimal"
kind = "semantic"
intent = "bytearray percent f formatting routes a Decimal handle through percent dispatch"
body = '''from decimal import Decimal

assert bytearray(b"%.3f") % Decimal("2.5") == bytearray(b"2.500")

print("bytearray_percent_f_accepts_decimal OK")'''

[[case]]
dimension = "behavior"
case = "str_percent_f_accepts_float_control"
subject = "str.percent_format"
import = "# formatting syntax uses only Python built-ins"
kind = "semantic"
intent = "ordinary string percent f formatting remains green with a float"
body = '''assert "%.3f" % 2.5 == "2.500"

print("str_percent_f_accepts_float_control OK")'''

[[case]]
dimension = "behavior"
case = "decimal_modulo_decimal_control"
subject = "decimal.Decimal.__mod__"
import = "from decimal import Decimal"
kind = "semantic"
intent = "Decimal modulo Decimal remains numeric arithmetic"
body = '''from decimal import Decimal

assert Decimal("5.5") % Decimal("2") == Decimal("1.5")

print("decimal_modulo_decimal_control OK")'''

[[case]]
dimension = "behavior"
case = "fraction_modulo_fraction_control"
subject = "fractions.Fraction.__mod__"
import = "from fractions import Fraction"
kind = "semantic"
intent = "Fraction modulo Fraction remains numeric arithmetic"
body = '''from fractions import Fraction

assert Fraction(5, 2) % Fraction(2, 1) == Fraction(1, 2)

print("fraction_modulo_fraction_control OK")'''

[[case]]
dimension = "behavior"
case = "str_percent_tuple_control"
subject = "str.percent_format"
import = "# formatting syntax uses only Python built-ins"
kind = "semantic"
intent = "ordinary string tuple percent formatting remains green"
body = '''assert "value=%d name=%s" % (7, "ok") == "value=7 name=ok"

print("str_percent_tuple_control OK")'''

[[case]]
dimension = "behavior"
case = "str_percent_mapping_control"
subject = "str.percent_format"
import = "# formatting syntax uses only Python built-ins"
kind = "semantic"
intent = "ordinary string mapping percent formatting remains green"
body = '''assert "%(name)s=%(value)d" % {"name": "ok", "value": 7} == "ok=7"

print("str_percent_mapping_control OK")'''
