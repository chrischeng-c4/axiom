# Phase A E2E contracts for numeric formatting (issue #3125).
#
# Every case is intentionally atomic: the negative cases pin one receiver and
# one spelling/conversion, while controls pin one accepted value or exception
# taxonomy.  The errors cases are mechanical and self-asserting; semantic
# controls are generated as fillable fixtures below.

bucket = "core"
lib = "formatting"

# %f-family must reject every nonnumeric receiver, without substituting 0.000.

[[case]]
dimension = "errors"
case = "percent_f_rejects_none"
subject = "str.percent_format"
import = "# formatting syntax uses only Python built-ins"
kind = "mechanical"
call = "'%.3f' % None"
expect_exc = "TypeError"

[[case]]
dimension = "errors"
case = "percent_f_rejects_str"
subject = "str.percent_format"
import = "# formatting syntax uses only Python built-ins"
kind = "mechanical"
call = "'%.3f' % 'abc'"
expect_exc = "TypeError"

[[case]]
dimension = "errors"
case = "percent_f_rejects_list"
subject = "str.percent_format"
import = "# formatting syntax uses only Python built-ins"
kind = "mechanical"
call = "'%.3f' % [1]"
expect_exc = "TypeError"

