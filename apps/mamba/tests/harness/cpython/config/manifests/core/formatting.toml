import = "# formatting syntax uses only Python built-ins"
kind = "mechanical"
call = "f'{None:.3f}'"
expect_exc = "TypeError"

[[case]]
dimension = "errors"
case = "fstring_rejects_object"
subject = "fstring.float_format"
import = "# formatting syntax uses only Python built-ins"
