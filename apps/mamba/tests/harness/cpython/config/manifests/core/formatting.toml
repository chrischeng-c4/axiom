[[case]]
dimension = "errors"
case = "str_format_string_receiver_keeps_value_error"
subject = "str.format"
import = "# formatting syntax uses only Python built-ins"
kind = "mechanical"
call = "'{:.3f}'.format('abc')"
expect_exc = "ValueError"

[[case]]
dimension = "behavior"
case = "percent_f_accepts_float_subclass"
subject = "str.percent_format"
import = "# formatting syntax uses only Python built-ins"
kind = "semantic"
intent = "percent f formatting accepts a float subclass"
body = '''class FloatSub(float):
    pass


assert "%.3f" % FloatSub(2.5) == "2.500"

print("percent_f_accepts_float_subclass OK")'''

[[case]]
dimension = "behavior"
case = "percent_upper_g_accepts_dunder_index"
subject = "str.percent_format"
import = "# formatting syntax uses only Python built-ins"
kind = "semantic"
intent = "percent upper G formatting uses __index__ returning 7"
body = '''class IndexOnly:
    def __index__(self):
        return 7


assert "%.3G" % IndexOnly() == "7"

print("percent_upper_g_accepts_dunder_index OK")'''

[[case]]
dimension = "errors"
case = "percent_f_propagates_float_value_error"
subject = "str.percent_format"
import = "# formatting syntax uses only Python built-ins"
kind = "semantic"
intent = "percent f preserves a ValueError raised by __float__"
body = '''class FloatRaises:
    def __float__(self):
        raise ValueError("float sentinel")


try:
    "%.3f" % FloatRaises()
except ValueError as exc:
    assert str(exc) == "float sentinel"
else:
    raise AssertionError("expected ValueError")

print("percent_f_propagates_float_value_error OK")'''

[[case]]
dimension = "errors"
case = "percent_f_propagates_index_overflow_error"
subject = "str.percent_format"
import = "# formatting syntax uses only Python built-ins"
kind = "semantic"
intent = "percent f preserves an OverflowError raised by __index__"
body = '''class IndexRaises:
    def __index__(self):
        raise OverflowError("index sentinel")


try:
    "%.3f" % IndexRaises()
except OverflowError as exc:
    assert str(exc) == "index sentinel"
else:
    raise AssertionError("expected OverflowError")

print("percent_f_propagates_index_overflow_error OK")'''

[[case]]
dimension = "errors"
case = "percent_f_rejects_invalid_dunder_float_return"
subject = "str.percent_format"
import = "# formatting syntax uses only Python built-ins"
kind = "semantic"
intent = "percent f pins the TypeError taxonomy for an invalid __float__ return"
body = '''class FloatBad:
    def __float__(self):
        return 3


try:
    "%.3f" % FloatBad()
except TypeError as exc:
    assert str(exc) == "FloatBad.__float__ returned non-float (type int)"
else:
    raise AssertionError("expected TypeError")

print("percent_f_rejects_invalid_dunder_float_return OK")'''

[[case]]
dimension = "errors"
case = "percent_f_rejects_invalid_dunder_index_return"
subject = "str.percent_format"
import = "# formatting syntax uses only Python built-ins"
kind = "semantic"
intent = "percent f pins the TypeError taxonomy for an invalid __index__ return"
body = '''class IndexBad:
    def __index__(self):
        return 2.5


try:
    "%.3f" % IndexBad()
except TypeError as exc:
    assert str(exc) == "__index__ returned non-int (type float)"
else:
    raise AssertionError("expected TypeError")

print("percent_f_rejects_invalid_dunder_index_return OK")'''

[[case]]
dimension = "errors"
case = "fstring_str_subclass_keeps_value_error"
subject = "fstring.float_format"
import = "# formatting syntax uses only Python built-ins"
kind = "semantic"
intent = "f-string .3f on a str subclass preserves ValueError taxonomy"
body = '''class StrSub(str):
    pass


try:
    f"{StrSub('abc'):.3f}"
except ValueError as exc:
    assert str(exc) == "Unknown format code 'f' for object of type 'StrSub'"
else:
    raise AssertionError("expected ValueError")

print("fstring_str_subclass_keeps_value_error OK")'''

[[case]]
dimension = "errors"
case = "str_format_str_subclass_keeps_value_error"
subject = "str.format"
import = "# formatting syntax uses only Python built-ins"
kind = "semantic"
intent = "str.format .3f on a str subclass preserves ValueError taxonomy"
body = '''class StrSub(str):
    pass


try:
    "{:.3f}".format(StrSub("abc"))
except ValueError as exc:
    assert str(exc) == "Unknown format code 'f' for object of type 'StrSub'"
else:
    raise AssertionError("expected ValueError")

print("str_format_str_subclass_keeps_value_error OK")'''
