# A numeric dunder alone does not replace object.__format__ for a non-empty spec.

[[case]]
dimension = "errors"
case = "fstring_dunder_float_without_dunder_format_rejected"
subject = "fstring.float_format"
import = "# formatting syntax uses only Python built-ins"
kind = "mechanical"
call = "f'{type(\"FloatOnly\", (), {\"__float__\": lambda self: 2.5})():.3f}'"
expect_exc = "TypeError"

[[case]]
dimension = "errors"
case = "str_format_dunder_float_without_dunder_format_rejected"
subject = "str.format"
import = "# formatting syntax uses only Python built-ins"
kind = "mechanical"
call = "'{:.3f}'.format(type('FloatOnly', (), {'__float__': lambda self: 2.5})())"
expect_exc = "TypeError"

