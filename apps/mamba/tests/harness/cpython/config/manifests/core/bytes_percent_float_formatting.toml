# Phase A E2E contracts for bytes/bytearray real-number percent formatting (issue #3602).
#
# Every case is atomic. The primitive bytes float control is transferred from
# core/percent_numeric_handles so this formatter capability has an independent
# library; the three Decimal/Fraction integration fixtures remain in #3601.

bucket = "core"
lib = "bytes_percent_float_formatting"

[[case]]
dimension = "behavior"
case = "bytes_percent_upper_f_accepts_float"
subject = "bytes.percent_format"
import = "# bytes formatting syntax uses only Python built-ins"
kind = "semantic"
intent = "bytes percent upper F formatting accepts a primitive float"
body = '''assert b"%.3F" % 2.5 == b"2.500"

print("bytes_percent_upper_f_accepts_float OK")'''

