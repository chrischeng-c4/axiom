[[case]]
dimension = "behavior"
case = "bytes_percent_f_accepts_dunder_float"
subject = "bytes.percent_format"
import = "# bytes formatting syntax uses a class-level float protocol"
kind = "semantic"
intent = "bytes percent f formatting accepts a class-level __float__ protocol"
body = '''class FloatLike:
    def __float__(self):
        return 2.5


assert b"%.3f" % FloatLike() == b"2.500"

print("bytes_percent_f_accepts_dunder_float OK")'''

