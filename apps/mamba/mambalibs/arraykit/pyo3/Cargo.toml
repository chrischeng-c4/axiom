[package]
name = "arraykit-pyo3"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "PyO3 abi3 bindings that publish arraykit's array surface as `mambalibs.array`"

[lib]
name = "array"
crate-type = ["cdylib"]

[dependencies]
arraykit = { path = ".." }
pyo3 = { version = "0.27", features = ["abi3-py312"] }

[features]
# `maturin` turns this on through `[tool.maturin] features` when it builds the
# wheel. It stays off by default so that `cargo test --lib` links a real
# libpython and can run the colocated tests.
extension-module = ["pyo3/extension-module"]
