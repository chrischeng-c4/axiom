[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "mambalibs-arraykit"
requires-python = ">=3.12"
description = "N-dimensional arrays for mamba, as the `mambalibs.array` extension module"
dynamic = ["version"]

[tool.maturin]
module-name = "mambalibs.array"
features = ["pyo3/extension-module"]
python-source = "python"
# `python/mambalibs/` exists only so Git tracks the namespace directory; the
# keep file inside it is not part of what the wheel installs.
exclude = ["python/mambalibs/.gitkeep"]
