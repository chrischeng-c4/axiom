assertions = [
    "The external contract verifier verifies fixture inventory against manifest apps/mamba/tests/governance/gates/t1_generic_binding_denominator/manifest.toml, asserting exact expected row_count = 11 and exact expected denominator_sha256 = 7f31655cff76e349217304c482fede11d07442b28aa9f9dc82fa1292315d9f1c. An empty denominator, manifest drift, or missing denominator artifact is a hard failure.",
    "Before execution, the verifier proves the runnable selector surface against the current cpython_ported_integration target by invoking --list once without a libtest filter, which must yield exactly 13767 unique terminal test names for the whole target, and once with the exact libtest filter pep::_695, which must yield exactly the 11-name set in apps/mamba/tests/governance/gates/t1_generic_binding_denominator/denominator.txt. A selector that resolves to zero, fewer, more, duplicate, cross-namespace, missing, or unparseable rows is a hard failure.",
    "The executable proof is one fresh subprocess execution of exactly python3 apps/mamba/tools/run_denominator.py t1_generic_binding from one unchanged repository revision, the repo-required rustup toolchain surface, and the pinned manifest digest. The verifier must fail closed if the denominator runner reports hash drift, an empty list, a renamed or omitted test that libtest would otherwise silently filter out, or any incomplete terminal accounting.",
    "Success requires complete terminal accounting for all 11 denominator rows, with exactly 11 passed, 0 failed, and 0 ignored rows. A run that executes fewer than 11 named rows, even with exit code 0, is a failure.",
    "The 8 behavior rows in the denominator are the visible positive oracle for this bounded EC slice only: they must keep generic explicit-base retention, generic class value storage, polymorphic generic function behavior, generic method zero-arg super behavior, star-unpacked generic base lists, empty __type_params__ on non-generic declarations, writable __type_params__ metadata, and ordinary function argument defaults on generic functions externally correct as asserted by the ported CPython fixtures.",
    "The row test_gen_behavior_pep_695_typeparam_default_args is not a PEP 696 type-parameter-default witness. It proves only that a generic function annotated by T preserves ordinary Python function argument defaults at runtime; it does not prove __default__, type-argument substitution defaults, or invalid type-parameter default ordering/bounds.",
    "The 3 error rows in the denominator are the visible negative oracle for this bounded EC slice only: invalid double-generic bases, invalid object-base-plus-generic MRO combinations, and undeclared type parameters in generic bases must still be rejected exactly as asserted by the ported CPython error fixtures. A widening that turns any of those rows green by accepting the invalid form is a contract failure.",
    "This EC is intentionally narrower than WI #2005's full roadmap claim. It does not approve or imply coverage for type-parameter scope/order beyond the named rows, bounds, constraints, variance, PEP 696 type-parameter defaults, TypeVarTuple or variadic rejection, traditional TypeVar forms, nested/class/method/type-alias scope completeness, stable runtime metadata outside the named __type_params__ witnesses, or specialization subtype/wall behavior. Those surfaces remain unverified by this 11-row denominator and require separate manifest-backed executable witnesses before they can be claimed complete.",
    "This EC is bounded to the accepted 11-row regression-prevention denominator for work root #1505. It does not treat implementation-source claims, internal runtime registries, or Rust-only helper assertions as its oracle; the oracle is the externally observable Python behavior and rejection semantics encoded in the named denominator fixtures plus the manifest-backed denominator inventory.",
    "Timeouts, crash or signal termination, output truncation, missing terminal summaries, manifest drift, selector drift, parse errors, or environment/toolchain drift during the measured run are hard failures.",
]
