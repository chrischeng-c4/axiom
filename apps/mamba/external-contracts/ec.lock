[[cases]]
id = "build-globals-dict-key-leak-free"
capability_id = "mamba-core-semantics"
claim_id = "build-globals-dict-leaks-no-key-references"
contract_id = "MAMBA-T1-BUILD-GLOBALS-DICT-KEY-LEAK-FREE"
dimension = "stability"
source_ref = "apps/mamba/external-contracts/stability/build-globals-dict-key-leak-free.md#build-globals-dict-key-leak-free"
test_path = "apps/mamba/tests/external_contracts/ec_build_globals_dict_key_leak_free.rs"
command = "cargo test -p mamba --release --test mamba_core_semantics_ec -- build_globals_dict_key_leak_free --exact"
required_for_production = true
assertions = [
    "Comparing two mamba runs that call globals() 100 times versus 50,000 times (42 exposed names per call: 20 id_ns values, 20 func_info functions, plus the __name__ and total module globals), peak process RSS for the 50,000-call run is no greater than the 100-call run's peak RSS plus 24 MiB; unreleased per-call key allocations would instead grow roughly linearly with call count.",
    "Equal id_ns and func_info name counts (20 each) ensure a leak isolated to either loop alone still produces per-call growth far in excess of the 24 MiB slack, so the gate cannot pass by exercising only one of the two loops build_globals_dict populates.",
    "Each run's script accumulates and prints the sum of len(globals()) across every call; the gate asserts this sum exactly equals iterations times the expected 42-key count, so a degenerate or empty build_globals_dict cannot pass vacuously by having nothing left to leak.",
    "Peak RSS is sampled via the OS process resource-usage counter (wait4/getrusage-equivalent) on the real compiled mamba binary, not a runtime-internal self-reported counter.",
]
evidence_digest = "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
evaluator_digest = "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
digest = "sha256:5a10b8a4882b058edbd834c4d6dce66e417a99bf98aa71dce55f838e9899644f"

[[cases]]
id = "mamba-t1-force-typed-contract-completion"
capability_id = "mamba-core-semantics"
claim_id = "force-typed-contract-completion"
contract_id = "MAMBA-T1-FORCE-TYPED-CONTRACT-COMPLETION"
dimension = "behavior"
source_ref = "apps/mamba/external-contracts/behavior/2011.md#mamba-t1-force-typed-contract-completion"
test_path = "apps/mamba/tests/external_contracts/ec_mamba_t1_force_typed_contract_completion.rs"
command = "cargo test -p mamba --release --test mamba_core_semantics_ec -- force_typed_contract_completion --exact"
required_for_production = true
assertions = [
    "The verifier must fail closed unless all pinned artifacts exist and agree: the rollup inventory at apps/mamba/tests/governance/gates/t1_forcetyped_contract_completion_inventory/{manifest.toml,cases.jsonl}, the implicit-Any ingress matrix at apps/mamba/tests/governance/gates/t1_implicit_any_ingress_matrix/{manifest.toml,cases.jsonl}, the explicit-Any acceptance matrix at apps/mamba/tests/governance/gates/t1_explicit_any_acceptance_matrix/{manifest.toml,cases.jsonl}, and the evidence locks apps/mamba/external-contracts/evidence/mamba-t1-force-typed-contract-completion-lock.json, mamba-t1-implicit-any-ingress-matrix-lock.json, and mamba-t1-explicit-any-acceptance-lock.json. Missing files, empty files, empty matrices, or disagreement between those artifacts are hard failures; the verifier must never synthesize a denominator, row_count, digest, or best-effort inventory.",
    "The rollup manifest must pin, at minimum, schema_version, inventory_path, inventory_sha256, row_count, required_channels = [compile, behavior, concurrency, performance], source_sets, migration_inputs, baseline_sha, current_sha, baseline_provenance_kind, baseline_provenance_path, baseline_provenance_sha256, cpython312_executable, cpython312_version, platform, mamba_git_sha, mamba_binary_sha256, and generated_at. The evidence locks must repeat those identities plus the verifier command, source revision, and capture timestamp. If any required inventory has not yet been generated, success is impossible; the verifier fails rather than fabricating row_count or digest values.",
    "The legacy apps/mamba/tests/governance/gates/t1_forcetyped_completeness_denominator/{manifest.toml,denominator.txt} surface is a reconciled input only, not proof of implicit-Any behavior. Its current pinned identity remains row_count = 23 and denominator_sha256 = 9cf96e2ebb3dfee53a02bc3d6fb9a9c3e7c48f6c2de20af090298a2d54af8c8f, and the verifier must reconcile every one of those 23 rows into the rollup inventory exactly once as legacy_negative_input. Deletion, omission, duplicate mapping, stale mapping, or treating those 23 union-heavy rows as sufficient proof of explicit-Any or implicit-Any coverage is a hard failure.",
    "The implicit-Any ingress matrix is the authoritative negative source set for WI #2011 and is unconditional. Its exact authored fixture paths are apps/mamba/tests/cpython/_regression/core/typecheck/implicit_any_ingress/{local_binding.py,global_binding.py,class_attribute.py,parameter.py,return.py,comprehension.py,expression_join.py}. The exact companion inventory artifacts are apps/mamba/tests/governance/gates/t1_implicit_any_ingress_matrix/{manifest.toml,cases.jsonl} and apps/mamba/external-contracts/evidence/mamba-t1-implicit-any-ingress-matrix-lock.json. The matrix manifest row_count must equal 7, the matrix cases.jsonl must contain exactly 7 non-comment rows, the evidence lock must pin exactly those same 7 fixture paths and digests, and the rollup inventory must contain exactly 7 rows with source_set = implicit_any_ingress_matrix. Missing any of those seven rows at any layer is a hard failure.",
    "The explicit-Any acceptance matrix is the authoritative positive source set for WI #2011 and is unconditional. Its exact authored fixture paths are apps/mamba/tests/cpython/_regression/core/typecheck/explicit_any_acceptance/{local_binding.py,global_binding.py,class_attribute.py,parameter.py,return.py,comprehension.py,expression_join.py}. The exact companion inventory artifacts are apps/mamba/tests/governance/gates/t1_explicit_any_acceptance_matrix/{manifest.toml,cases.jsonl} and apps/mamba/external-contracts/evidence/mamba-t1-explicit-any-acceptance-lock.json. The matrix manifest row_count must equal 7, the matrix cases.jsonl must contain exactly 7 non-comment rows, the evidence lock must pin exactly those same 7 fixture paths and digests, and the rollup inventory must contain exactly 7 rows with source_set = explicit_any_acceptance_matrix. Missing any of those seven rows at any layer is a hard failure.",
    "The 14 authored matrix rows are exact and closed. The verifier must prove bidirectional equality across authored fixture paths, matrix manifests, matrix cases.jsonl files, matrix evidence locks, and rollup rows: every authored implicit or explicit fixture path appears exactly once in its matrix inventory, exactly once in its matrix evidence lock, and exactly once in the rollup inventory, and every matrix or rollup row claiming one of those two source sets resolves to one of those 14 authored paths. out_of_scope, deferred, dispositioned, reviewer-waived, or best-effort escape hatches are forbidden for these 14 rows; omission, duplication, stale carry-over, or substitution is a hard failure.",
    "Each ingress family must exist as an exact implicit/explicit pair: local_binding, global_binding, class_attribute, parameter, return, comprehension, and expression_join. For each family, the verifier must derive a normalized source form that removes only the single explicit Any annotation or material token that distinguishes the explicit fixture from its implicit twin while preserving every other byte-significant token, binding name, control-flow edge, literal, call site, and expected observable behavior. The matrix manifests, matrix locks, and rollup rows must record a shared pair_id and paired_template_sha256 for each family, and the verifier must fail if any paired identities differ by more than that explicit Any token or if any pair cannot be independently reconstructed from source bytes.",
    "The compile_diagnostic_probes and positive_runtime_baseline remain required exact tracked surfaces today. compile_diagnostic_probes must contain exactly two source identities: apps/mamba/tests/cpython/_regression/core/typecheck/type_mismatch.py and apps/mamba/tests/cpython/_regression/core/typecheck/undefined_var.py. positive_runtime_baseline must contain exactly three source identities: apps/mamba/tests/cpython/_regression/core/typecheck/behavior.py, apps/mamba/tests/cpython/_regression/core/typecheck/surface.py, and apps/mamba/tests/cpython/_regression/core/typecheck/errors.py. Zero, fewer, more, duplicate, or cross-family substitutions are hard failures.",
    "Exact set equality is required after reconciliation. Every cases.jsonl row in the rollup inventory must map to one independently discovered source identity from legacy_negative_input, implicit_any_ingress_matrix, explicit_any_acceptance_matrix, compile_diagnostic_probes, positive_runtime_baseline, concurrency_parallel_progress_probe, concurrency_barrier_stability_probe, or performance_applicability, and every independently discovered source identity must map to exactly one cases.jsonl row. Deletion, omission, duplicate mapping, stale mapping, source identities that vanish from cases.jsonl, inventory rows with no authoritative source, or any attempt to let cases.jsonl define its own denominator are hard failures.",
    "Each non-comment JSONL row in the rollup cases.jsonl must have a unique case_id and must declare: channel, sample_role, fixture_or_probe_path, probe_id, oracle_kind, oracle_command, oracle_executable, oracle_version, sut_command, expected_terminal_classification, expected_probe_anchor, source_identity, source_set, platform, mamba_git_sha, and mamba_binary_sha256. Every implicit-Any compile row must additionally pin binding_identity, inference_path_classification, exact source_span, exact call_site_or_binding_site, expected_diagnostic_class, expected_terminal_compile_result, pair_id, and paired_template_sha256. Generic diagnostic-only proof, span-less proof, pair-less proof, or binding-ambiguous proof is a hard failure.",
    "Routing is exact and fail-closed. Compile-channel rows must prove compile-time rejection or compile-time acceptance from the public Mamba compiler surface; runtime behavior rows must use the exact pinned CPython 3.12 executable and version as their oracle; explicit-Any acceptance rows must prove that runtime behavior remains correct only when Any is explicitly requested in the authored source; legacy_negative_input rows remain reconciled inputs only; and any row that routes through implementation-source tests, Rust unit tests, runtime registries, or Mamba itself as the oracle is a hard failure.",
    "The verifier must maintain four complete-accounting channels named compile, behavior, concurrency, and performance. Every selected row must terminate in exactly one of those channels, and the final report must give exact selected, executed, completed, green, intentional_red, undeclared_red, undeclared_diverge, oracle_skip, timeout, signal, and unclassified counts for each channel. A row counted twice, counted in no channel, dropped after an early failure, or omitted from terminal accounting is a hard failure.",
    "The executable proof for the legacy_negative_input reconciliation is exactly python3 apps/mamba/tools/run_denominator.py t1_forcetyped_completeness from one unchanged repository revision, the pinned legacy manifest digest, and the repo-required rustup toolchain surface. The verifier must fail if the denominator runner reports hash drift, an empty list, a renamed or omitted test that libtest would otherwise silently filter out, or any incomplete terminal accounting. That command may only prove legacy input membership; it must not close the implicit-Any or explicit-Any matrices by itself.",
    "The executable proof for compile_diagnostic_probes is exactly cargo test -p mamba --release --test conformance -- _regression/core/typecheck/. The verifier must parse terminal output and require that apps/mamba/tests/cpython/_regression/core/typecheck/type_mismatch.py terminates with the declared EXPECT-ERROR type mismatch contract and apps/mamba/tests/cpython/_regression/core/typecheck/undefined_var.py terminates with the declared EXPECT-ERROR undefined name contract. In addition, every negative compile witness in the implicit-Any ingress matrix must pin the binding identity, inference-path classification, source span, call or binding site, diagnostic class, expected terminal compile result, pair_id, and paired_template_sha256 it is asserting. A pass that executes zero tests, proves only a generic diagnostic string, or reaches an earlier unrelated compiler failure is a hard failure.",
    "The executable proof for positive_runtime_baseline is exactly cargo test -p mamba --release --test conformance -- _regression/core/typecheck/. The verifier must parse terminal output and require that apps/mamba/tests/cpython/_regression/core/typecheck/behavior.py, surface.py, and errors.py all run and byte-match the pinned CPython 3.12 oracle. A compile reject, skipped row, missing row, duplicate row, or mismatch on any of those three baseline fixtures is a hard failure and proves type-system over-wall behavior.",
    "The no-global-serialization oracle is the named public-path concurrency probe apps/mamba/tests/cpython/concurrency/primitives/threading/force_typed_contract_completion_parallel_compile_progress.py. Its executable proof is exactly python3.12 apps/mamba/tests/cpython/concurrency/primitives/threading/force_typed_contract_completion_parallel_compile_progress.py, and it must compile or exercise the public force-typed contract-completion surface across the seven paired ingress families while emitting a one-worker and four-worker comparison from the same current_sha, baseline_sha, and paired_template_sha256 set. On hosts with at least 4 logical CPUs, success requires wall-clock speedup >= 1.50x, process cpu_time / wall_time >= 1.50 for the four-worker run, and parallel peak_rss_bytes <= 1.25 times serial peak_rss_bytes plus 16777216 bytes. If those thresholds are not met, or the probe is missing, zero-row, or reports only single-worker evidence, the verifier fails closed; the barrier probe is not an acceptable substitute for this oracle.",
    "Deadlock freedom remains separate stability evidence only. The named stability probe source_identity is apps/mamba/tests/cpython/concurrency/primitives/threading/barrier_rounds_complete_without_deadlock.py, executed via python3.12 apps/mamba/tests/harness/cpython/tools/stress_suites.py concurrency --repeat 3 --timeout 20 --json. This probe is green only when the underlying fixture preserves its exact authored thresholds in every repeat: N = 4 workers, ROUNDS = 25, completed progress exactly 100, barrier wait timeout 1.0 s, thread join timeout 5.0 s, no alive threads after join, and no timeout, panic, or deadlock. This probe may satisfy concurrency_barrier_stability_probe, but it may not satisfy concurrency_parallel_progress_probe or the no-global-serialization claim.",
    "Performance applicability is conditional and machine-verifiable from anchored provenance, not producer choice. baseline_sha must come from accepted independent lifecycle provenance: either the accepted WI or TD evidence for claim force-typed-contract-completion that records the last pre-change implementation base, or the first parent of the first implementation commit recorded by that accepted evidence. baseline_sha must be non-empty, must differ from current_sha, and git merge-base --is-ancestor baseline_sha current_sha must succeed. The rollup manifest and evidence lock must pin baseline_provenance_kind, baseline_provenance_path, and baseline_provenance_sha256 so that empty, self-selected, non-ancestor, or producer-mutated baselines are hard failures.",
    "Changed-path classification must be anchored to that pinned baseline_sha. The verifier must run exactly git diff --name-only baseline_sha..current_sha, record the complete resulting path list and matched hot-path globs in apps/mamba/external-contracts/evidence/mamba-t1-force-typed-contract-completion-lock.json, and derive applicability only from that recorded diff. If any changed path matches apps/mamba/src/types/**, apps/mamba/src/driver/**, apps/mamba/src/codegen/**, apps/mamba/tests/cpython/_regression/core/typecheck/**, or apps/mamba/tests/harness/cpython/config/manifests/**, then performance is applicable; if no changed path matches those globs, then non-applicability must be justified from that exact recorded diff. Unknown, missing, partial, hand-waved, or unanchored path classification is a hard failure.",
    "When performance is applicable, the verifier must run the standard perf-pin gate exactly as MAMBA_REQUIRE_CPYTHON_PERF_BASELINE=1 cargo test -p mamba --release --test perf_pin -- run_pin::force_typed_contract_completion_2011.toml and must require the named pin apps/mamba/tests/harness/cpython/config/perf/pins/force_typed_contract_completion_2011.toml. That pin must carry one committed CPython baseline row in apps/mamba/tests/harness/cpython/config/perf/pins/baseline.jsonl and one imported SQLite row in apps/mamba/tests/cpython/.cache/perf/cpython_baseline.sqlite, both selected by the same stable baseline row identity: pin_path, fixture, fixture_sha256, issue, lib, samples, python, platform, and host. The verifier must compute and record a baseline_row_sha256 over those identity fields plus cpu_time_ns and peak_rss_bytes, and the committed JSONL row and imported SQLite row must match exactly on baseline row identity and baseline_row_sha256. The baseline row host fingerprint and the verifier host fingerprint must both be present and equal; cross-host skip, missing host, missing baseline, or JSONL to SQLite mismatch is a hard failure, not a passing skip.",
    "The selected perf trial must be actually graded, not merely present. Success requires numeric thresholds floor = 1.0, mem_floor = 1.0, and samples = 9 under the standard external perf-pin gate semantics, and the selected trial output for run_pin::force_typed_contract_completion_2011.toml must explicitly contain and reconcile the graded CPU and RSS metrics for that pin: baseline cpu_time_ns, baseline peak_rss_bytes, measured mamba cpu_time_ns, measured mamba peak_rss_bytes, computed CPU ratio against floor, computed adjusted RSS ratio against mem_floor, and the selected pin's terminal graded verdict. Filtered-zero runs, selected-trial missing, ungraded or skipped selected trials, missing CPU or RSS metrics, missing selected-trial reconciliation, or cargo exit 0 without an actually graded selected pin are hard failures. The verifier must record the exact pin path, fixture path, baseline row identity, baseline_row_sha256, CPython executable path, platform, verifier host fingerprint, Mamba git SHA, and Mamba binary sha256.",
    "Result identity is part of the contract. For every executed row, the verifier must record the exact oracle_command and sut_command it replayed, the absolute oracle executable path, oracle version string, platform triple, Mamba git SHA, Mamba binary sha256, fixture or probe path, probe anchor, exit status, signal or timeout state, stdout sha256, stderr sha256, and terminal classification. PATH-dependent aliases, patch-version drift, binary drift, or missing identity fields are hard failures.",
    "Success requires complete positive and negative accounting. The final inventory must contain at least one green implicit-Any compile rejection witness, at least one green runtime acceptance witness, at least one green explicit-Any acceptance witness, the named concurrency parallel-progress probe or an explicit fail-closed not-yet-implemented outcome, the named barrier stability probe, and either a green applicable perf pin or a green machine-verifiable non-applicability classification derived from baseline_sha. Zero-row, omission, duplicate, or cross-family substitutions are forbidden, and a pure-negative wall report cannot close WI #2011.",
    "No implementation-source self-oracle is allowed. src/types/tests/check.rs, src/driver/tests/strict_type_dynamic_ingress.rs, runtime unit tests, strict_type_accounting.py, keep_status.py, and generator or bookkeeping outputs may be used as supplementary diagnostics or drift detectors, but none of them may satisfy the EC terminal oracle by themselves. The oracle must remain the externally observable compiler and runtime behavior encoded in the independently derived fixture and source denominators.",
    "Ordinary parity completeness is part of this contract. Any runtime row in the selected source sets that is not explicitly declared intentional_red in the inventory must satisfy its exact routed oracle, and no undocumented exclusion, stale carry-over, early-abort omission, or verifier-owned sample shrink may remove it from the denominator. Zero-row, duplicate-row, stale-row, or unexecuted-row acceptance is forbidden.",
    "Success requires exact agreement among the manifests, inventories, evidence locks, authoritative source-set digests, paired-template digests, oracle identities, Mamba identities, per-binding compile identities, changed-path applicability classification, baseline provenance, and per-channel terminal accounting. Unknown classes, missing matrices, missing any of the 14 authored matrix rows, empty explicit-Any coverage, stale legacy substitution, self-oracle behavior, incomplete reconciliation, or any attempt to let cases.jsonl define its own denominator are hard failures.",
]
