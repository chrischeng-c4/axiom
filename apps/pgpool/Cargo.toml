# <HANDWRITE gap="missing-generator:project-bootstrap" tracker="#pgpool-bootstrap" reason="Initial working-name app scaffold before pgpool has a generated TD source unit.">
[package]
name = "pgpool"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "working-name PostgreSQL pooler service built on server-lifecycle/server-tcp/server-http"
build = "build.rs"

[lib]
name = "pgpool"
path = "src/lib.rs"

[[bin]]
name = "pgpool"
path = "src/bin/pgpool.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["env"] }
cli-std = { path = "../../libs/cli-std", default-features = false }
k8s-openapi = { version = "0.24", features = ["v1_32"] }
kube = { version = "0.98", features = ["runtime", "derive", "client"] }
metrics-prometheus = { path = "../../libs/metrics-prometheus" }
mio = { version = "0.8", features = ["net", "os-poll"] }
schemars = "0.8"
server-http = { path = "../../libs/server-http" }
service-k8s = { path = "../../libs/service-k8s" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
server-lifecycle = { path = "../../libs/server-lifecycle" }
server-tcp = { path = "../../libs/server-tcp" }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-postgres = "0.7"
tracing = { workspace = true }

[dev-dependencies]
transport-h2c = { path = "../../libs/transport-h2c" }
http-body-util = "0.1"
reqwest = { workspace = true }
tower = { workspace = true }

[build-dependencies]
build-stamp = { path = "../../libs/build-stamp" }

[features]
default = []
self-update = ["cli-std/online"]
issue = ["cli-std/online"]
# </HANDWRITE>
