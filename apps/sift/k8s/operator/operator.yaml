apiVersion: v1
kind: Namespace
metadata:
  name: sift-system
---
apiVersion: v1
# Controller entrypoint: sift k8s operator run
kind: ServiceAccount
metadata:
  name: sift-operator
  namespace: sift-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sift-operator
rules:
  - apiGroups: ["sift.axiom.dev"]
    resources: ["sifts"]
    verbs: ["get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["sift.axiom.dev"]
    resources: ["sifts/status", "sifts/finalizers"]
    verbs: ["get", "patch", "update"]
  # The operator delegates this exact project-scoped rule to Sift runtime
  # service accounts. Kubernetes requires the grantor to hold every delegated
  # permission, even though the operator does not call this virtual resource.
  - apiGroups: ["sift.axiom.dev"]
    resources: ["projects"]
    verbs: ["get", "create", "update"]
  - apiGroups: [""]
    resources: ["services", "endpoints", "configmaps", "persistentvolumeclaims", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["networking.gke.io"]
    resources: ["fqdnnetworkpolicies"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  # Kubernetes blocks privilege delegation unless the operator already owns
  # every delegated permission or has `bind` on the exact ClusterRole.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["system:auth-delegator"]
    verbs: ["bind"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  # Reconcile narration on the CR itself (#2620). `create` writes a new Event,
  # `patch` updates the EventSeries count when the Recorder's 6-minute dedup
  # window collapses a repeating event — without `patch`, a repeatedly failing
  # reconcile would fail to report the repetition.
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sift-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sift-operator
subjects:
  - kind: ServiceAccount
    name: sift-operator
    namespace: sift-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sift-operator
  namespace: sift-system
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: sift-operator }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sift-operator }
    spec:
      serviceAccountName: sift-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: operator
          image: ghcr.io/chrischeng-c4/axiom/sift:0.1.1
          imagePullPolicy: IfNotPresent
          args: ["k8s", "operator", "run"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
