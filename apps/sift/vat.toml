# HANDWRITE-BEGIN gap="sift-vat-real-service-runner" tracker="1607" reason="Define the COW workspace and real Sift service runner used by operational evidence."
version = 1
name = "sift-operational"
default_runner = "ec-stability"

[workspace]
base = "../.."
workdir = "apps/sift"
keep = "always"

[env]
PATH = "/Users/chrischeng/.rustup/toolchains/stable-aarch64-apple-darwin/bin:/Users/chrischeng/.cargo/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin"

[[services]]
id = "sift"
cmd = ["sh", "-c", "CARGO_TARGET_DIR=\"$VAT_WORKSPACE_BASE/target\" cargo build -p sift --bin sift && exec \"$VAT_WORKSPACE_BASE/target/debug/sift\" serve --host 127.0.0.1 --data-dir \"/tmp/sift-vat-data-$$\""]
ready_http = "http://127.0.0.1:7380/healthz"
timeout_s = 600

[[runners]]
id = "ec-security"
requires = ["sift"]
cmd = ["sh", "-c", "export CARGO_TARGET_DIR=\"$VAT_WORKSPACE_BASE/target\" && exec cargo test -p sift --test runtime_security_e2e -- --nocapture"]
timeout_s = 600

[[runners]]
id = "ec-stability"
requires = ["sift"]
cmd = ["sh", "-c", "export CARGO_TARGET_DIR=\"$VAT_WORKSPACE_BASE/target\" && exec cargo test -p sift --test stability_e2e -- --nocapture"]
timeout_s = 600
# HANDWRITE-END
