[project]
name = "agentic-workflow-external-contracts"
version = "0.1.0"
requires-python = ">=3.11"

[tool.aw.python-artifact]
protocol = "aw.python-artifact.v1"
entrypoint = "src/runner.py"
source_roots = ["src"]
dependency_files = ["pyproject.toml"]
evidence_dir = "evidence"

[tool.aw.python-ec]
protocol = "aw.python-ec.v1"
author = "agent:codex:/root"
efficiency_policy = "required"

[[tool.aw.python-ec.cases]]
id = "api-contract-source-passes"
artifact_id = "artifact:agentic-workflow/api-contract-source-passes"
capability_id = "td-cb-lifecycle-automation"
use_case_id = "api-contract-source-passes"
dimension = "behavior"
applicability = "td"
test_path = "src/cases/api-contract-source-passes.py"
promise = "source_backed is true; findings is empty"
oracle = "The preserved external Rust test command must exit zero and its original assertions remain the independent oracle."
