[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aw-python-spec-http-db-fixture"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3",
]

[dependency-groups]
test = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "external-contracts/tests"]

[tool.setuptools.packages.find]
where = ["src"]
