[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aw-python-spec-typer-fixture"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["typer>=0.17,<0.18"]

[dependency-groups]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit", "external-contracts/tests"]

[tool.setuptools.packages.find]
where = ["src"]
