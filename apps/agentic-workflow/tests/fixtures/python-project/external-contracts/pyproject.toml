[tool.aw.python-artifact]
protocol = "aw.python-artifact.v1"
entrypoint = "src/runner.py"
source_roots = ["src"]
dependency_files = [
    "pyproject.toml",
    "oracles/_contract.py",
    "oracles/behavior.py",
    "oracles/security.py",
    "oracles/stability.py",
    "oracles/efficiency.py",
]
evidence_dir = "evidence"

[tool.aw.python-ec]
protocol = "aw.python-ec.v1"
author = "python-project-ec-author"
efficiency_policy = "required"

[[tool.aw.python-ec.cases]]
id = "user-model-import-behavior"
artifact_id = "artifact:user-model/import"
capability_id = "retired-placeholder"
use_case_id = "reference-import"
dimension = "behavior"
applicability = "td"
test_path = "src/behavior.py"
promise = "The reference user model imports and exposes an instantiable User class."
oracle = "independent-cpython-import"
target = "python"
command = "python3 external-contracts/oracles/behavior.py"
evidence_paths = ["evidence/behavior.json"]

[[tool.aw.python-ec.cases]]
id = "user-model-import-security"
artifact_id = "artifact:user-model/import"
capability_id = "retired-placeholder"
use_case_id = "module-boundary"
dimension = "security"
applicability = "td"
test_path = "src/security.py"
promise = "The imported User identity remains owned by the declared module boundary."
oracle = "independent-cpython-module-check"
target = "python"
command = "python3 external-contracts/oracles/security.py"
evidence_paths = ["evidence/security.json"]

[[tool.aw.python-ec.cases]]
id = "user-model-import-stability"
artifact_id = "artifact:user-model/import"
capability_id = "retired-placeholder"
use_case_id = "generated-repeat-import"
dimension = "stability"
applicability = "post-gen"
test_path = "src/stability.py"
promise = "The generated user model imports repeatedly without identity drift."
oracle = "independent-cpython-repeat-import"
threshold = "three cold imports expose User"
target = "python"
command = "python3 external-contracts/oracles/stability.py"
evidence_paths = ["evidence/stability.json"]

[[tool.aw.python-ec.cases]]
id = "user-model-import-efficiency"
artifact_id = "artifact:user-model/import"
capability_id = "retired-placeholder"
use_case_id = "generated-import-budget"
dimension = "efficiency"
applicability = "post-gen"
test_path = "src/efficiency.py"
promise = "The generated user model import remains within the fixture budget."
oracle = "independent-monotonic-clock"
threshold = "cold import under 2 seconds"
target = "python"
command = "python3 external-contracts/oracles/efficiency.py"
evidence_paths = ["evidence/efficiency.json"]
