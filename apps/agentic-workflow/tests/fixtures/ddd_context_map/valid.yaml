schema_version: aw.ddd-context-map.v1
nodes:
  - id: context:workflow
    kind: context
    projections:
      paths: [CAPABILITIES.md]
      markdown_anchors: ["#capability-control-plane"]
  - id: context:verification
    kind: context
    projections:
      paths: [external-contracts]
  - id: aggregate:workflow/work-item
    kind: aggregate
    projections:
      paths: [src/issues/types.rs]
  - id: use-case:workflow/plan-change
    kind: use-case
    projections:
      paths: [src/issues/planner.rs]
  - id: port:verification/contract-runner
    kind: port
    projections:
      paths: [external-contracts/runner.py]
  - id: adapter:workflow/aw-cli
    kind: adapter
    projections:
      paths: [src/cli/wi.rs]
  - id: artifact:workflow/capability-contract
    kind: artifact
    projections:
      paths: [CAPABILITIES.md]
      markdown_anchors: ["#capability-control-plane"]
relations:
  - { from: context:workflow, kind: depends-on, to: context:verification }
  - { from: context:workflow, kind: contains, to: aggregate:workflow/work-item }
  - { from: context:workflow, kind: contains, to: use-case:workflow/plan-change }
  - { from: context:workflow, kind: contains, to: adapter:workflow/aw-cli }
  - { from: context:workflow, kind: contains, to: artifact:workflow/capability-contract }
  - { from: context:verification, kind: contains, to: port:verification/contract-runner }
  - { from: use-case:workflow/plan-change, kind: uses, to: aggregate:workflow/work-item }
  - { from: use-case:workflow/plan-change, kind: uses, to: port:verification/contract-runner }
  - { from: adapter:workflow/aw-cli, kind: implements, to: port:verification/contract-runner }
  - { from: artifact:workflow/capability-contract, kind: realizes, to: use-case:workflow/plan-change }
