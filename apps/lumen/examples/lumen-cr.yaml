# Example Lumen custom resources. Apply after `kubectl apply -k k8s/operator`.
# The operator reconciles each into a Lumen-owned data plane. Inspect with:
# kubectl get lumen -A

---
# Dev / kind: one serving pod, embedded WAL, no auth, pretty logs. The smallest
# thing that runs.
apiVersion: lumen.dev/v1alpha1
kind: Lumen
metadata:
  name: search
  namespace: default
spec:
  image: lumen:latest
  shardCount: 1
  replicasPerShard: 1
  voterCount: 1
  logFormat: pretty
  # `auth` defaults to `required`, so an open API has to be asked for out loud.
  # The value is spelled `disabled`, not `off` — YAML 1.1 reads a bare `off`
  # as the boolean false.
  auth: disabled
  serving:
    autoscaling:
      minReplicas: 1
      maxReplicas: 3
      targetCpuUtilization: 70

---
# Production: 6 shards x 3 replicas per shard, Lumen-owned raft WAL,
# bearer-token auth (token registry from Secret key `token-registry.json`),
# json logs, and Prometheus ServiceMonitor + alerts.
apiVersion: lumen.dev/v1alpha1
kind: Lumen
metadata:
  name: lumen
  namespace: lumen
spec:
  image: registry.example.com/lumen:1.2.3
  imagePullPolicy: Always
  shardCount: 6
  replicasPerShard: 3
  voterCount: 3
  logFormat: json
  logLevel: warn
  auth: required
  tokensSecret: lumen-tokens
  # tokensSecretProviderClass: lumen-tokens-spc  # CSI alternative to tokensSecret.
  # Exactly one of the two: the CRD's CEL rule rejects a CR that sets both, so a
  # half-finished migration fails at `kubectl apply` instead of at runtime.
  serving:
    autoscaling:
      minReplicas: 6
      maxReplicas: 12
      targetCpuUtilization: 65
    cpu: "4"
    memory: 16Gi
    graceSecs: 45
    raftStorage: 100Gi
    raftStorageClass: ssd
  observability: true
