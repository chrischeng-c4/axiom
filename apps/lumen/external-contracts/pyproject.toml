[project]
name = "lumen-external-contracts"
version = "0.0.0"
requires-python = ">=3.11"

[tool.aw.python-artifact]
protocol = "aw.python-artifact.v1"
entrypoint = "src/runner.py"
source_roots = ["src"]
dependency_files = ["pyproject.toml", "uv.lock"]
evidence_dir = "evidence"

[tool.aw.python-ec]
protocol = "aw.python-ec.v1"
author = "019fb951-e713-7600-b4a2-bf3949cb7a48"
efficiency_policy = "optional"

[[tool.aw.python-ec.cases]]
id = "gke-ksa-rbac-authorization"
artifact_id = "artifact:lumen/ksa-rbac-auth"
capability_id = "security-hardening"
use_case_id = "gke-two-hop-ksa-rbac"
dimension = "security"
applicability = "cb"
test_path = "src/ec-2879.py"
promise = "A fresh, redacted GKE run proves that Google identities stop at kube-apiserver; only a short-lived, Lumen-audience client KSA reaches Lumen and receives the exact RBAC grant, with bounded issuer and Lumen authorization revocation."
oracle = "The real acceptance/gcp GKE harness observes kube-apiserver TokenRequest and SubjectAccessReview decisions, Lumen HTTP status responses, serving logs, and post-run Kubernetes/GCP cleanup. Historic bearer, Google, or human-auth evidence is input only and cannot satisfy this contract."
target = "rust"
command = "gke-ksa-rbac-authorization"
evidence_paths = ["evidence/gke-ksa-rbac-authorization.json"]
