[project]
name = "lumen-external-contracts"
version = "0.0.0"
requires-python = ">=3.11"

[tool.aw.python-artifact]
protocol = "aw.python-artifact.v1"
entrypoint = "src/runner.py"
source_roots = ["src"]
dependency_files = ["pyproject.toml", "uv.lock"]
evidence_dir = "evidence"

[tool.aw.python-ec]
protocol = "aw.python-ec.v1"
author = "019fb951-e713-7600-b4a2-bf3949cb7a48"
efficiency_policy = "optional"

[[tool.aw.python-ec.cases]]
id = "topology-contract-behavior"
artifact_id = "artifact:lumen/topology-public-contract"
capability_id = "kubernetes-native-deployment"
use_case_id = "primary-replicas-topology"
dimension = "behavior"
applicability = "td"
test_path = "src/topology-contract-behavior.py"
promise = "The #2937 topology design admits the canonical 1x1 default, admits one or three voters, carries a user-set shard minimum and a non-voting read-replica count into the admitted topology, separates user policy from current topology, target topology, and generations, and refuses to call an uncommitted render converged."
oracle = "The verifier imports the design and drives its real admission, status, and availability entry points with EC-owned literal specs. Every expected value is transcribed from issue #2937 R1/R3/R5/R7; no expectation is read back out of the design, and no boolean pass flag is accepted in place of an observed value."
target = "rust"
command = "topology-contract-behavior"
evidence_paths = ["evidence/topology-contract-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "topology-contract-security"
artifact_id = "artifact:lumen/topology-public-contract"
capability_id = "kubernetes-native-deployment"
use_case_id = "primary-replicas-topology"
dimension = "security"
applicability = "td"
test_path = "src/topology-contract-security.py"
promise = "The #2937 topology design fails closed on zero shard minimums, zero voters, even voter counts, unsupported odd voter counts, the ambiguous legacy replica field, negative read-replica counts, HPA/VPA knobs it does not own, voter-membership mutations with no safe controller, and two Lumen instances placing data members on one node; and it never describes a one-voter shard as surviving unexpected node loss."
oracle = "Each refusal is driven with an EC-owned literal spec and checked against the exact rejection reason named in issue #2937 R2/R4/R5/R6, not merely against 'some rejection happened'. A closing row holds every refusal in the case to a non-empty field path, so an admission that refuses without naming the offending field fails."
target = "rust"
command = "topology-contract-security"
evidence_paths = ["evidence/topology-contract-security.json"]

[[tool.aw.python-ec.cases]]
id = "gke-ksa-rbac-td-behavior"
artifact_id = "artifact:lumen/ksa-rbac-auth"
capability_id = "security-hardening"
use_case_id = "kubernetes-native-request-identity-and-authorization"
dimension = "behavior"
applicability = "td"
test_path = "src/ec-2879.py"
promise = "The #2879 TD source declares the complete run, auth-verification, cleanup, and clean-verification public boundary: Google issuers stop at kube-apiserver, a named client KSA token with audience lumen.axiom.dev reaches Lumen, and SubjectAccessReview is authoritative."
oracle = "The verifier AST-reads the protocol-located TD artifact under a controller-bound source-root digest and checks EC-owned hop, issuer, audience, KSA, authorization-resource, complete four-target public-boundary, and raw-evidence literals. Environment-selected TD roots, producer mirrors, and pass flags are not accepted."
target = "rust"
command = "gke-ksa-rbac-td-behavior"
evidence_paths = ["evidence/gke-ksa-rbac-td-behavior.json"]

[tool.aw.python-ec.cases.known_failure]
reason = "The current #2879 TD exposes only one producer target and has no source-literal external-contract declaration for the complete orchestration/finalization boundary."
expected = "The TD behavior verifier fails closed on the incomplete public producer target set until the TD stage publishes all four boundary targets and the EC-owned literals."

