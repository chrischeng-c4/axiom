[[tool.aw.python-ec.cases]]
id = "durability-contract-behavior"
artifact_id = "artifact:lumen/topology-public-contract"
capability_id = "kubernetes-native-deployment"
use_case_id = "primary-replicas-topology"
dimension = "behavior"
applicability = "td"
test_path = "src/durability-contract-behavior.py"
promise = "The #2938 durability design selects one named Raft group for every new production shard including one-voter shards, routes index/delete/schema/admin mutations through durable Raft commit-and-apply, admits Raft in production, preserves group identity and durable format through learner or voter extension, and maps typed persistence failure to durability-unavailable degraded status. The closest existing topology capability and use case are reused because this durability path is the production shard topology's persistence dimension."
oracle = "The verifier imports and drives the pure durability design with EC-owned literal profile, shard, group, membership, mutation, and persistence-failure inputs. Every expected value is transcribed from #2938 R1/R2/R3/R5/R7; no expected value is read from the design, and no design-computed validity flag is accepted in place of the observed plan, route, identity, format, result, or status value."
target = "rust"
command = "durability-contract-behavior"
evidence_paths = ["evidence/durability-contract-behavior.json"]

[tool.aw.python-ec.cases.known_failure]
reason = "The #2938 pure durability design modules have not landed, so the EC import fails closed."
expected = "The behavior verifier remains a known failure until the design exposes the frozen specification, admitted durability verdicts, and pure admission, routing, membership, and failure-mapping entry points."

