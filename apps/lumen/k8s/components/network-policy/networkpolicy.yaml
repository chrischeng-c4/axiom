# Default-deny posture for the direct kustomize install (#2603). Once any
# NetworkPolicy selects a pod, only the union of matching rules is permitted,
# so these rules are the complete contract for `k8s/base`'s serving pod.
#
# This is the base Deployment's posture, not the operator's: the direct install
# is deliberately single-node embedded mode with one container port (7373), so
# there is no Raft peer traffic to admit here. The operator CR path renders its
# own policy — including the 7374 peer rules — from `spec.networkPolicy`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lumen
spec:
  podSelector:
    matchLabels: {app: lumen, role: server}
  policyTypes: [Ingress, Egress]
  ingress:
    # The search API, reachable from any namespace in the cluster. An external
    # client arriving through a node (LoadBalancer, NodePort) is not admitted
    # by this rule; cluster-internal reach is the intended posture.
    - from:
        - namespaceSelector: {}
      ports:
        - {protocol: TCP, port: 7373}
  egress:
    # DNS over both transports — a truncated UDP answer retries over TCP — plus
    # outbound TLS for object-storage backups and OIDC discovery. Plaintext :80
    # is deliberately not granted.
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
        - {protocol: TCP, port: 443}
