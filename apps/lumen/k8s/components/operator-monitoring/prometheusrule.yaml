apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: lumen-operator
  namespace: lumen-system
  labels:
    app.kubernetes.io/name: lumen-operator
    app.kubernetes.io/part-of: lumen
    release: prometheus
spec:
  groups:
    - name: lumen.operator
      interval: 30s
      rules:
        # The control plane going dark produces no user-visible symptom: the
        # serving StatefulSet keeps answering reads from its last-reconciled
        # state while nothing reconciles. So this alert cannot be written as a
        # threshold on any lumen_operator_* counter -- when the pod is gone the
        # series stops existing, and "no series" evaluates the same as "no
        # errors". It has to be the scrape target's own `up`.
        #
        # Two arms, because `up` fails in two different ways:
        #   1. Pods exist but the scrape fails (crash-loop, wedged listener,
        #      wrong port) -- `up` is present and 0.
        #   2. Deployment scaled to zero or deleted -- the Endpoints vanish, so
        #      `up` itself disappears and arm 1 returns an empty vector, which
        #      never fires. `absent()` is what covers the total-disappearance
        #      case, and it is the one a scale-to-zero actually hits.
        #
        # `job` is the Service name: prometheus-operator relabels
        # __meta_kubernetes_service_name into `job` unless the ServiceMonitor
        # sets `jobLabel`, and ours does not.
        - alert: LumenOperatorAbsent
          expr: |
            sum by (job, namespace) (
              up{job="lumen-operator-metrics", namespace="lumen-system"}
            ) == 0
            or
            absent(up{job="lumen-operator-metrics", namespace="lumen-system"})
          for: 5m
          # Alert labels are Prometheus label names, not Kubernetes ones: they
          # become labels on the fired alert series, so they must match
          # [a-zA-Z_][a-zA-Z0-9_]*. The `app.kubernetes.io/*` keys above are
          # legal on `metadata` and illegal here. `role` distinguishes this
          # control-plane alert from the data-plane `role: server` alerts in
          # ../observability, which are otherwise labelled identically.
          labels:
            severity: critical
            app: lumen
            role: operator
          annotations:
            summary: "No lumen operator is being scraped in {{ $labels.namespace }} -- nothing is reconciling Lumen custom resources"
            description: "Every lumen-operator replica is either down or unscrapeable for 5m. Existing Lumen instances keep serving from their last-reconciled state, so there is no user-visible symptom: spec edits, drift repair, failed-pod replacement, and shard splits are all silently not happening. Both replicas are covered by one target group, so this fires only when the whole control plane is gone, not on a single-replica restart."
            runbook: "kubectl -n lumen-system get deploy lumen-operator; if READY is 0/N check `kubectl -n lumen-system logs deploy/lumen-operator --previous` for a crash, if it is 0/0 the Deployment was scaled down (`kubectl -n lumen-system scale deploy/lumen-operator --replicas=2`), and if the pods are Running check `kubectl -n lumen-system get endpoints lumen-operator-metrics` -- an empty Endpoints list means the Service selector no longer matches the pod labels."
            runbook_url: "apps/lumen/docs/runbooks/operator-control-plane.md#lumenoperatorabsent"

        # A ratio, not an absolute rate: an operator watching three CRs runs
        # very few reconciles, so `rate(errors) > 0` would page on a single
        # optimistic-concurrency conflict that the next requeue resolves.
        #
        # The trailing `and` is a floor on the denominator, and it does two
        # jobs. It stops a nearly idle operator from reaching 100% on one
        # failure, and it keeps 0/0 (NaN) out of the comparison. 0.01/s over
        # 15m is ~9 attempts; one Lumen CR alone produces ~0.033/s from the
        # 30s steady-state requeue, so any live instance clears the floor.
        #
        # It also keeps the two alerts from double-paging on one incident: a
        # dead operator drives the attempt rate to zero, the floor blocks this
        # rule, and LumenOperatorAbsent is the only one that fires.
        #
        # Only the leader increments either counter -- the follower's no-op is
        # excluded on purpose (libs/service-k8s/src/controller.rs), so summing
        # across replicas measures actual work, not replica count.
        - alert: LumenOperatorReconcileErrorRate
          expr: |
            (
              sum by (namespace) (
                rate(lumen_operator_reconcile_errors_total{namespace="lumen-system"}[15m])
              )
              /
              sum by (namespace) (
                rate(lumen_operator_reconcile_total{namespace="lumen-system"}[15m])
              )
            ) > 0.1
            and
            sum by (namespace) (
              rate(lumen_operator_reconcile_total{namespace="lumen-system"}[15m])
            ) > 0.01
          for: 10m
          labels:
            severity: warning
            app: lumen
            role: operator
          annotations:
            summary: "lumen operator is failing more than 10% of its reconciles in {{ $labels.namespace }} ({{ $value | humanizePercentage }})"
            description: "Over the last 15m more than one in ten reconcile attempts returned an error. The operator keeps retrying every 15s, so some Lumen instances may still converge -- but a persistent failure means child objects (StatefulSet, Service, PVC, CronJob) are drifting from their CR without anything reporting it on the instance side. Each failure also emits a Warning/ReconcileFailed Event on the offending CR, which names the object and the error."
            runbook: "kubectl get events -A --field-selector reason=ReconcileFailed --sort-by=.lastTimestamp; the newest Event names the failing CR and the apiserver's own error. `is forbidden` means a missing RBAC grant in k8s/operator/rbac.yaml, `no matches for kind ServiceMonitor` means spec.observability=true on a cluster without the prometheus-operator CRDs, and `the object has been modified` is a conflict that clears itself unless a second controller is fighting over the same object. Cross-check with `kubectl -n lumen-system logs deploy/lumen-operator | grep 'reconcile failed'`."
            runbook_url: "apps/lumen/docs/runbooks/operator-control-plane.md#lumenoperatorreconcileerrorrate"
