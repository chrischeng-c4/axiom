apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lumen-operator
  namespace: lumen-system
  labels:
    app.kubernetes.io/name: lumen-operator
    app.kubernetes.io/part-of: lumen
    # Picked up by the prometheus-operator default release selector, matching
    # the instance ServiceMonitor in ../observability.
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - lumen-system
  selector:
    matchLabels:
      app.kubernetes.io/name: lumen-operator
  endpoints:
    # Scrapes the Endpoints behind lumen-operator-metrics, which means one
    # target per replica rather than one per Service. That is required, not
    # incidental: `lumen_operator_leader` is per-replica, so a collapsed
    # target would leave "which replica is reconciling" unanswerable and make
    # a lease handover invisible.
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      # No honorLabels: the operator publishes no `namespace`/`pod` labels of
      # its own, so prometheus-operator's target labels are the only source
      # and must not be overridable by scraped content.
