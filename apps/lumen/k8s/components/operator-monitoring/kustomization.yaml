apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Prometheus Operator integration for the **control plane** (#2621): a
# ServiceMonitor scraping the operator's own /metrics, and a PrometheusRule
# with the two alerts that cover a dead or failing operator.
#
# Sibling of ../observability, which covers the **instance** (data plane).
# They are deliberately separate components: an installation may scrape the
# serving StatefulSet without scraping the operator, and the two answer
# different questions — "are reads healthy" versus "is anything reconciling".
#
# Opt-in for the same reason as ../observability: ServiceMonitor and
# PrometheusRule are monitoring.coreos.com/v1 CRDs, absent on a vanilla
# cluster. `k8s/operator` itself stays CRD-free and applies anywhere; the
# Service it now ships (the scrape *target*) is plain core/v1 and is
# unconditional, so enabling this component later needs no change there.
#
# Usage — from a kustomization that installs the operator:
#
#   resources:
#     - ../../operator
#   components:
#     - ../../components/operator-monitoring
#
# Unlike ../observability, this component hardcodes `namespace: lumen-system`
# and needs no `replacements:` block in the consumer. The operator install is
# not namespace-remapped — k8s/operator/rbac.yaml pins lumen-system for the
# Namespace, ServiceAccount and ClusterRoleBinding subject — so the ordering
# problem documented there (a Component's transformers resolve before the
# enclosing kustomization's `namespace:`) has nothing to bite here. Rendering
# the operator elsewhere goes through `lumen k8s operator render --namespace`,
# which rewrites all of these together.

resources:
  - servicemonitor.yaml
  - prometheusrule.yaml
