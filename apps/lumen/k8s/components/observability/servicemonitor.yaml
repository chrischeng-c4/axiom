apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lumen
  # No hardcoded namespace: the consuming overlay's `namespace:` transformer
  # supplies it (verified by build), so this stays correct under a
  # namespace-remapped consumer without a second edit here.
  labels:
    app: lumen
    role: server
    # Picked up by the prometheus-operator default release selector.
    release: prometheus
spec:
  namespaceSelector:
    # Default value; kept in sync with the object's own final namespace by a
    # `replacements:` block in each consuming overlay that pulls in this
    # component (see overlays/staging, overlays/prod). Kustomize resolves a
    # Component's own resources+transformers before the *enclosing*
    # kustomization's `namespace:` transformer runs, so this component
    # cannot self-derive the final namespace from inside its own
    # kustomization.yaml (verified empirically) — the replacement has to
    # live one level up, alongside the `namespace:` field it depends on.
    matchNames:
      - lumen
  selector:
    matchLabels:
      app: lumen
      role: server
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
