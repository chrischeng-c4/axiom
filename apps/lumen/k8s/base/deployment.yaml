# HANDWRITE-BEGIN gap="missing-generator:deployment:direct-install-strategy" tracker="1646" reason="The single-node direct-install Deployment is a hand-authored compatibility path until the shared stateful-service template can generate its Recreate rollout, one-pod-per-node scheduling, probes, security context, and request-only resources; HA is operator-owned."
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumen
  namespace: lumen
  labels:
    app: lumen
    role: server
spec:
  # Direct kustomize install is intentionally single-node embedded mode.
  # HA uses the operator CR path, which renders a raft StatefulSet with stable
  # identity and per-pod hard-state PVCs.
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: lumen
      role: server
  strategy:
    # required podAntiAffinity enforces the one-pod-per-node production
    # baseline. A one-replica direct install therefore cannot surge a second
    # pod onto the same node; Recreate avoids a deterministic rollout
    # deadlock. HA/no-downtime topology belongs to the operator StatefulSet.
    type: Recreate
  template:
    metadata:
      labels:
        app: lumen
        role: server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7373"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: lumen
      # SIGTERM -> /readyz flips to 503 -> drain in-flight reads -> exit.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Spread serving pods across hosts (and zones when labelled) so a
      # single node loss never takes out read capacity wholesale.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: lumen
              role: server
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: lumen
              role: server
      # Production data-plane baseline: one Lumen pod per node. Pending pods
      # are the portable signal Cluster Autoscaler uses; no provider-specific
      # node-pool detection is required.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: lumen
                  role: server
              topologyKey: kubernetes.io/hostname
      containers:
        - name: lumen
          image: ghcr.io/chrischeng-c4/lumen:0.4.24
          imagePullPolicy: IfNotPresent
          command: ["lumen", "serve"]
          ports:
            - name: http
              containerPort: 7373
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Bind all interfaces inside the pod network namespace.
            - name: LUMEN_HOST
              value: "0.0.0.0"
            # Auto mode: embedded for this single-node Deployment; raft only
            # when the operator renders StatefulSet topology env.
            - name: LUMEN_WAL
              value: "auto"
            # Graceful-drain window; should track terminationGracePeriodSeconds.
            - name: LUMEN_GRACE_SECS
              value: "30"
            - name: LUMEN_PORT
              valueFrom:
                configMapKeyRef:
                  name: lumen-config
                  key: LUMEN_PORT
            - name: LUMEN_LOG_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: lumen-config
                  key: LUMEN_LOG_FORMAT
            - name: SHARD_COUNT
              valueFrom:
                configMapKeyRef:
                  name: lumen-config
                  key: SHARD_COUNT
          # Request-only baseline. The deployer edits its overlay for the
          # actual node pool; no limits lets this dedicated pod use idle node
          # capacity.
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
          readinessProbe:
            # 503 until the process has finished startup/recovery (and again
            # while draining).
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            # Covers the initial recovery window; once healthy, liveness takes over.
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Scratch only (readOnlyRootFilesystem=true needs writable /tmp).
            # The index is in memory; nothing here is durable.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
# HANDWRITE-END
