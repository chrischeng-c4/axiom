                        A JSON Merge Patch (RFC 7386) applied over [`LumenFleetSpec::defaults`] — the app team's knowledge: this tenant's CPU/memory request, its disk size, the name of its credential source. A `null` value removes an inherited field.

                        Free-form rather than an enumerated override struct so it covers every `Lumen` field, now and after the next one is added. Typos cannot hide in it: the merged document is deserialized into a `LumenSpec` and any key the spec does not have is reported as a rejected entry rather than silently dropped.
