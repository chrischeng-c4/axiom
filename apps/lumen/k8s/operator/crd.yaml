apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: lumens.lumen.dev
spec:
  group: lumen.dev
  names:
    categories: []
    kind: Lumen
    plural: lumens
    shortNames:
    - lum
    singular: lumen
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.servingReadyReplicas
      name: Ready
      type: integer
    - jsonPath: .status.shardCount
      name: Shards
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Converged
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for LumenSpec via `CustomResource`
        properties:
          spec:
            description: '`lumen.dev/v1alpha1` `Lumen`. Namespaced: every child object the operator renders lands in this object''s namespace, so multiple independent lumen deployments can coexist by name. @spec apps/lumen/tech-design/semantic/source/apps-lumen-src-operator-crd-rs.md#source'
            properties:
              admission:
                description: Optional in-process request admission (bounded token-bucket rate limiting per endpoint class), mirroring the `LUMEN_ADMISSION_*` env grammar `libs/service-http::AdmissionConfig` already parses (see `bin/lumen.rs`'s `serve` wiring). Absent means admission stays disabled — the pre-existing default; no new semantics, only a declarative surface for the existing env-driven behavior.
                nullable: true
                properties:
                  adminCapacity:
                    description: Token-bucket capacity for admin-class requests (`LUMEN_ADMISSION_ADMIN_CAPACITY`). Unset leaves admin unbounded.
                    type: integer
                    minimum: 0.0
                    nullable: true
                  maxKeys:
                    description: Maximum distinct admission keys retained per class (`LUMEN_ADMISSION_MAX_KEYS`). Unset falls back to `AdmissionConfig::DEFAULT_MAX_KEYS` (1024).
                    type: integer
                    minimum: 0.0
                    nullable: true
                  readCapacity:
                    description: Token-bucket capacity for read-class requests (`LUMEN_ADMISSION_READ_CAPACITY`). Unset leaves reads unbounded.
                    type: integer
                    minimum: 0.0
                    nullable: true
                  refillSecs:
                    description: Refill window in seconds, shared by every configured class (`LUMEN_ADMISSION_REFILL_SECS`). Unset falls back to `AdmissionConfig::DEFAULT_REFILL_SECS` (60s).
                    type: integer
                    minimum: 0.0
                    nullable: true
                  writeCapacity:
                    description: Token-bucket capacity for write-class requests (`LUMEN_ADMISSION_WRITE_CAPACITY`). Unset leaves writes unbounded.
                    type: integer
                    minimum: 0.0
                    nullable: true
                type: object
              auth:
                default: required
                description: |-
                  Auth mode: `required` (the default — callers are resolved through the cluster's own TokenReview/SubjectAccessReview) or `disabled`.

                  `required` is the default because the other way round, forgetting this field ships an open cluster and nothing says so; forgetting it now fails startup with a message naming the field to set. `disabled` remains a one-word opt-out for local development (#2678, R4).

                  Spelled `disabled`, not `off`: YAML 1.1 reads a bare `off` as the boolean `false`. (`off` is what the serving process's own `LUMEN_AUTH` env var takes — the two spellings are not interchangeable.)
                enum:
                - disabled
                - required
                type: string
              bodyLimitBytes:
                description: 'Data-plane request body size limit (bytes). Requests with `Content-Length` exceeding this are rejected with 413; streamed bodies are bounded mid-read. Defaults to 8 MiB. Unset means the server default (#2584). Accepted range: 1 MiB (1048576) to 64 MiB (67108864).'
                type: integer
                minimum: 0.0
                nullable: true
              image:
                description: Serving container image, e.g. `lumen:latest`. Required.
                type: string
              imagePullPolicy:
                description: Image pull policy. Defaults to `IfNotPresent`.
                nullable: true
                type: string
              logFormat:
                default: pretty
                description: 'Log output format: `json` (prod/staging) or `pretty` (dev).'
                enum:
                - json
                - pretty
                type: string
              logLevel:
                description: Log level (`trace|debug|info|warn|error`). Defaults to `info`.
                nullable: true
                type: string
              networkPolicy:
                default: false
                description: |-
                  Emit a NetworkPolicy isolating this instance (#2603): the client API (`7373`) stays reachable from any namespace, while the Raft port (`7374`) is reachable only from this instance's own pods, and egress is narrowed to DNS, TLS, and sibling Raft.

                  Opt-in rather than default-on for one reason: a NetworkPolicy is inert unless the cluster runs a CNI that enforces it. On GKE that means Dataplane V2 or the Calico add-on; on a plain kind cluster (default kindnet) the object applies cleanly and enforces nothing, which would otherwise read as "isolation is on" when it is not. Defaulting it on would also break any cluster whose scrapers or clients live outside the pod network, with no signal beyond dropped packets.
                type: boolean
              observability:
                default: false
                description: Emit a ServiceMonitor + PrometheusRule. Requires the prometheus-operator CRDs (`monitoring.coreos.com/v1`) to be installed in the cluster.
                type: boolean
              peerTlsSecret:
                description: |-
                  Secret holding `tls.crt`, `tls.key`, and `ca.crt` — the instance-scoped X.509 identity every Raft member presents and verifies on the dedicated peer listener (#2890). Same field and Secret contract Relay and Defer already project, so one shared mechanism (`libs/peer-tls`) covers all three.

                  Required whenever `replicasPerShard > 1`: replicated Raft traffic carries committed index mutations between pods, and Kubernetes ServiceAccount tokens authenticate *callers*, not peers — nothing else on that port says who is dialing. A replicated instance without it does not fall back to plaintext; the operator reports `PeerIdentityReady=False` naming this Secret, and `lumen serve` refuses to start.

                  Omit only for a single-replica instance, which runs no consensus link at all.
                nullable: true
                type: string
              placement:
                default: {}
                description: Which nodes the serving pods may run on.
                properties:
                  nodeSelector:
                    additionalProperties:
                      type: string
                    description: '`spec.template.spec.nodeSelector` for the serving pods, e.g. `{ "cloud.google.com/gke-nodepool": "lumen-ssd" }`. Empty means the scheduler picks from every node, as before.'
                    type: object
                  tolerations:
                    description: 'Taint tolerations for the serving pods, so a dedicated node pool can carry a taint that keeps every other workload off it. Note this covers the serving StatefulSet only: the optional backup CronJob is a short-lived pod that reads over the network and is left schedulable on the cluster''s general pool.'
                    items:
                      description: |-
                        One entry of [`PlacementSpec::tolerations`], mirroring the Kubernetes `v1.Toleration` fields.

                        Declared here rather than reused from `k8s-openapi` because the CRD schema is derived with `schemars`, which `k8s-openapi`'s types do not implement. @spec apps/lumen/tech-design/semantic/source/apps-lumen-src-operator-crd-rs.md#source
                      properties:
                        effect:
                          description: '`NoSchedule`, `PreferNoSchedule`, or `NoExecute`. Unset tolerates every effect of the matching taint.'
                          nullable: true
                          type: string
                        key:
                          description: 'The taint key this tolerates. Empty with `operator: Exists` tolerates every taint.'
                          nullable: true
                          type: string
                        operator:
                          description: '`Exists` or `Equal`. Unset means `Equal` (the Kubernetes default).'
                          nullable: true
                          type: string
                        tolerationSeconds:
                          description: 'How long the pod stays bound after the node gains a matching taint. Only meaningful with `effect: NoExecute`.'
                          format: int64
                          nullable: true
                          type: integer
                        value:
                          description: 'The taint value to match. Only meaningful with `operator: Equal`.'
                          nullable: true
                          type: string
                      type: object
                    type: array
                type: object
              replicasPerShard:
                default: 1
                description: 'Raft replicas per shard. `1` (default) = a single-member serving StatefulSet with no raft consensus (still durable — the same PVC-backed `raft` volume). `> 1` adds raft-HA: a fixed peer set whose pods inject the downward-API env `raft_runtime::cluster` reads (raft needs a known membership).'
                type: integer
                minimum: 0.0
              reshardPolicy:
                default:
                  prepareAtPercent: 50
                  urgentAtPercent: 85
                  workflow:
                    phase: Complete
                    convergenceRemediationRestartCount: 0
                description: Operator-owned storage reshard policy. This policy only prepares/recommends explicit shard topology changes.
                properties:
                  maxShardBytes:
                    type: integer
                    minimum: 0.0
                    nullable: true
                  maxShards:
                    type: integer
                    minimum: 0.0
                    nullable: true
                  migrationBytesPerSec:
                    type: integer
                    minimum: 0.0
                    nullable: true
                  prepareAtPercent:
                    default: 50
                    format: uint8
                    minimum: 0.0
                    type: integer
                  startAtPercent:
                    format: uint8
                    minimum: 0.0
                    nullable: true
                    type: integer
                  urgentAtPercent:
                    default: 85
                    format: uint8
                    minimum: 0.0
                    type: integer
                  workflow:
                    default:
                      phase: Complete
                      convergenceRemediationRestartCount: 0
                    description: '@spec apps/lumen/tech-design/semantic/source/apps-lumen-src-operator-crd-rs.md#source'
                    properties:
                      convergedShardMapVersion:
                        description: '`shardMap.version` the reshard driver has confirmed every serving pod is `Ready` on (#1458 R1) — the persisted checkpoint `reshard_driver::advance_convergence` compares `spec.shardMap. version` against to decide whether the post-cutover write-pause fence must stay armed. `None` (or a value behind the current `shardMap.version`) means convergence for the current map is still pending or was never confirmed.'
                        type: integer
                        minimum: 0.0
                        nullable: true
                      convergenceRemediationRestartCount:
                        default: 0
                        description: 'Count of bounded remediation rolling-restart re-triggers `reshard_driver::advance_convergence` has fired for the current convergence-stall episode — the same wait `convergenceWaitStartedAt` tracks (#1485 R1). Bounded to at most `1`: once the stall budget is exceeded with the ConfigMap-race signature (StatefulSet rollout complete but some pod still reporting the old shard-map version), the driver calls `ClusterControl::trigger_rolling_restart` exactly once per episode and bumps this to `1`; a later stall in the same episode never re-triggers. Reset to `0` alongside `convergenceWaitStartedAt` once the episode resolves.'
                        type: integer
                        minimum: 0.0
                      convergenceRemediationRestartedAt:
                        description: Epoch-seconds timestamp of the last remediation rolling-restart re-trigger this episode, if any (#1485 R1) — surfaced alongside `convergenceRemediationRestartCount` in `status.reshard` so operators can see when the self-heal fired without reading driver logs. `None` until `convergenceRemediationRestartCount` first becomes non-zero; cleared together with it once the episode resolves.
                        type: integer
                        minimum: 0.0
                        nullable: true
                      convergenceWaitStartedAt:
                        description: Epoch-seconds wall-clock timestamp `reshard_driver::advance_convergence` first observed the *current* `shardMap.version`'s post-cutover convergence wait as pending (#1485 R2) — stamped once, on the first `AwaitingTopologyConvergence` tick, in the same `Patch::Merge` style `lastCutoverShardMapVersion` already uses (spec-is-checkpoint, not driver memory). Cleared (patched to `null`) the moment convergence is confirmed, so it is always either `None` or the start of the wait still in progress. `reshard_driver::convergence_stall_condition` computes the `topologyConvergenceStalled` budget directly from this field, so both the budget and the raised condition survive an operator restart — replacing the prior process-local-cache-only computation, which reset to zero on every restart.
                        type: integer
                        minimum: 0.0
                        nullable: true
                      lastCutoverShardMapVersion:
                        description: '`shardMap.version` the reshard driver''s own cutover last patched into `spec.shardMap.version` (#1467 R7), stamped in the exact same `advance_catching_up_fenced` patch call that sets `shardMap. version`/`phase: Complete`. The ONLY writer of this field — a hand-authored or backup-restored `spec.shardMap` never sets it, so it stays behind (usually `None`) forever for such a CR. `advance_convergence` requires this to equal the current `shardMap.version` before engaging the post-cutover write-pause fence loop at all, closing the gap where convergence would otherwise fence indefinitely over a topology the driver never actually changed.'
                        type: integer
                        minimum: 0.0
                        nullable: true
                      phase:
                        default: Complete
                        description: '@spec apps/lumen/tech-design/semantic/source/apps-lumen-src-operator-crd-rs.md#source'
                        enum:
                        - Complete
                        - PrepareSplit
                        - Splitting
                        - CatchingUp
                        type: string
                      targetShardCount:
                        type: integer
                        minimum: 0.0
                        nullable: true
                    type: object
                type: object
              serviceAccountAnnotations:
                additionalProperties:
                  type: string
                description: Annotations applied verbatim to both rendered ServiceAccounts (the workload SA when created, and the backup SA). Default empty.
                type: object
              serviceAccountName:
                description: Name of a pre-existing, externally-managed ServiceAccount for the workload pods. When set, the operator uses this SA and never creates, owns, updates, or deletes a ServiceAccount for the instance (the deployer owns its lifecycle and any Workload Identity annotations). When unset, the operator creates and owns `<instance>` as before.
                nullable: true
                type: string
              serving:
                default:
                  cpu: '1'
                  memory: 4Gi
                  graceSecs: 30
                  raftStorage: 20Gi
                  raftStorageClass: null
                description: Stateless serving-fleet shape.
                properties:
                  backup:
                    description: Optional scheduled backup (#808). When set, the operator renders a `<name>-backup` CronJob (see [`super::render::backup_cron_job`]) that invokes `lumen backup` on this schedule against the running serving fleet's own already-existing `/admin/backup` endpoint — no new snapshot mechanism, only scheduling + transport. Absent means no CronJob; the admin API (`GET /admin/backup`, `POST /admin/backup/local`, `POST /admin/restore`) is still reachable for manual/scripted use either way (see `lumen llm --topic storage`).
                    nullable: true
                    properties:
                      adminTokenSecret:
                        description: Name of a Secret whose `token` key holds a bearer token with `Role::Admin` on `*`. Deprecated; the backup runner authenticates with its own projected ServiceAccount token.
                        nullable: true
                        type: string
                      destination:
                        description: Destination URI accepted by [`BackupDestination::from_uri`].
                        type: string
                      retentionSecs:
                        description: Drop objects older than this many seconds after a successful put. `None` keeps every object.
                        type: integer
                        minimum: 0.0
                        nullable: true
                      schedule:
                        description: Cron expression rendered into `CronJob.spec.schedule`.
                        type: string
                    required:
                    - destination
                    - schedule
                    type: object
                  bootstrap:
                    description: Optional empty-PVC bootstrap seed. When set, serving pods restore this snapshot before WAL/raft catch-up. Supported seed URIs are exact `file://` SnapshotV1 JSON paths and, in backup-enabled builds, exact `s3://bucket/key` SnapshotV1 objects.
                    nullable: true
                    properties:
                      maxBytesPerSec:
                        description: Optional read throttle advertised to operators/status. The current source primitive reads one object per bootstrap; transfer shaping can be enforced by the object-store client/proxy or a future streaming reader.
                        type: integer
                        minimum: 0.0
                        nullable: true
                      seedUri:
                        description: 'SnapshotV1 JSON seed URI. Use an exact `file://` path or `s3://bucket/key` object, not a backup prefix. Note (#2514): the serving pod reads the seed object through its own (Workload-Identity) ServiceAccount, which needs storage read (e.g. roles/storage.objectViewer on GCS) on the seed bucket; see the README "Deployer note (seed-bucket IAM)".'
                        type: string
                    required:
                    - seedUri
                    type: object
                  cpu:
                    default: '1'
                    description: Per-pod CPU, applied as request==limit (Guaranteed QoS). e.g. `"2"`.
                    type: string
                  graceSecs:
                    default: 30
                    description: Graceful drain window on SIGTERM (seconds); tracks `terminationGracePeriodSeconds`.
                    type: integer
                    minimum: 0.0
                  memory:
                    default: 4Gi
                    description: Per-pod memory, applied as request==limit. e.g. `"4Gi"`.
                    type: string
                  raftStorage:
                    default: 20Gi
                    description: Per-pod WAL/raft hard-state PVC size. Always applied — the serving StatefulSet's `raft` volumeClaimTemplate exists at every `replicasPerShard` value, not only when raft consensus (`> 1`) is active.
                    type: string
                  raftStorageClass:
                    description: PVC StorageClass for the WAL/raft hard-state volume. Unset means cluster default — which, on most managed Kubernetes offerings, is **not** SSD-backed (e.g. GKE's default `standard-rwo` is pd-balanced, not pd-ssd). Raft/WAL write latency is sensitive to disk performance, so a deployer who cares about that latency should set this field explicitly to an SSD-backed StorageClass name rather than relying on the cluster default (see `lumen llm --topic storage` for example StorageClass names per common provider — informational reference only, not a value validated or defaulted by this field).
                    nullable: true
                    type: string
                type: object
              servingTlsSecret:
                description: |-
                  Secret holding `tls.crt`, `tls.key`, and `ca.crt` — the leaf every serving pod presents on the client port, issued for the Kubernetes Service DNS names callers actually dial (#3113 R1/R2).

                  A different identity from [`Self::peer_tls_secret`], and deliberately a different field: a serving certificate says "I am the Service you asked for" to a client that authenticates separately with a KSA token, while a peer certificate says "I am a member of this instance's Raft group". Sharing one Secret between them would let either listener's material authenticate on the other's port.

                  When set, the client port terminates TLS with ALPN `h2` and `http/1.1`, and refuses connections outright while no valid leaf is active — there is no plaintext fallback to notice too late. Omit it only for local/kind development, where the port stays h2c.

                  Callers verify this leaf against the public CA distributed separately by the deployment administrator or external certificate platform.
                nullable: true
                type: string
              shardCount:
                default: 1
                description: Physical storage shard count. Data ownership is resolved through the versioned virtual-bucket map, not permanent `hash % shardCount` routing.
                type: integer
                minimum: 0.0
              shardMap:
                default:
                  version: 0
                  virtualBucketCount: 4096
                description: Versioned virtual-bucket map metadata. The default one-shard map keeps existing installs compatible; future reshard workflows bump `version` and move selected virtual buckets to new physical shards.
                properties:
                  assignments:
                    description: Optional explicit `bucket -> physical shard` assignments. Empty means derive the deterministic balanced assignment `bucket % shardCount`; reshard workflows set this to move selected buckets without changing every key.
                    items:
                      type: integer
                      minimum: 0.0
                    type: array
                  version:
                    default: 0
                    type: integer
                    minimum: 0.0
                  virtualBucketCount:
                    default: 4096
                    type: integer
                    minimum: 0.0
                type: object
              voterCount:
                default: 1
                description: Voting members per shard (the rest are learners). Only meaningful when `replicasPerShard > 1`.
                type: integer
                minimum: 0.0
            required:
            - image
            type: object
          status:
            description: Status subresource, written back by the reconcile loop. @spec apps/lumen/tech-design/semantic/source/apps-lumen-src-operator-crd-rs.md#source
            nullable: true
            properties:
              conditions:
                description: |-
                  Kubernetes-convention convergence conditions (#2601): `Ready`, `Progressing`, `ReshardInProgress`. This is the surface `kubectl wait --for=condition=Ready`, Argo CD health assessment, and Flux readiness gates read; `phase` and `reshard.blockingConditions` are unchanged and still populated, so nothing already consuming them breaks.

                  `lastTransitionTime` is stamped by the reconcile loop, not here — see [`super::reconcile`]'s no-I/O `status_patch` contract.
                items:
                  description: |-
                    One entry of a Kubernetes `status.conditions[]` array, in the shape every controller-aware tool already reads — `kubectl wait --for=condition=…`, Argo CD health assessment, Flux readiness gates.

                    Hand-written rather than reused from `k8s_openapi::apimachinery::pkg::apis::meta::v1::Condition` because that type does not derive `JsonSchema`, so it cannot be embedded in a CRD schema generated by `kube`'s derive. @spec libs/service-k8s/tech-design/semantic/source/libs-service-k8s-src-service-rs.md#source
                  properties:
                    lastTransitionTime:
                      description: RFC3339 instant the status last *changed* — not the last time it was observed. Carried across reconciles by [`project`].
                      type: string
                    message:
                      default: ''
                      description: Human-readable detail. May be empty.
                      type: string
                    observedGeneration:
                      description: The `.metadata.generation` this condition was computed from.
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: CamelCase machine-readable cause of the current status.
                      type: string
                    status:
                      description: '`"True" | "False" | "Unknown"`.'
                      type: string
                    type:
                      description: CamelCase condition name, e.g. `Ready`.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
              desiredReplicas:
                default: 0
                description: Desired serving replicas (apply-time count, or the live count).
                format: int32
                type: integer
              message:
                default: ''
                description: Last human-readable reconcile message.
                type: string
              observedGeneration:
                default: 0
                description: The `.metadata.generation` this status reflects (drift detection).
                format: int64
                type: integer
              phase:
                default: ''
                description: '`Pending | Reconciling | Ready | Degraded`.'
                type: string
              reshard:
                default:
                  phase: ''
                  recommendationOnly: false
                  progressPercent: 0
                  message: ''
                  convergenceRemediationRestartCount: 0
                description: Reshard workflow status. Present even before a split starts so agents can distinguish "complete" from "unknown policy".
                properties:
                  blockingConditions:
                    items:
                      type: string
                    type: array
                  convergenceRemediationRestartCount:
                    default: 0
                    description: Mirrors `spec.reshardPolicy.workflow.convergenceRemediationRestartCount` (#1485 R1) — count of bounded remediation rolling-restart re-triggers the reshard driver has fired for the current convergence-stall episode, so operators can see the self-heal fired without reading `spec`. `status_patch` copies this straight from the spec field.
                    type: integer
                    minimum: 0.0
                  convergenceRemediationRestartedAt:
                    description: Mirrors `spec.reshardPolicy.workflow.convergenceRemediationRestartedAt` (#1485 R1) — epoch-seconds timestamp of the last remediation restart re-trigger, if any.
                    type: integer
                    minimum: 0.0
                    nullable: true
                  maxObservedPercent:
                    description: Highest observed percent of `maxShardBytes` across shards, from the live per-shard usage measurement (#1319 R1; [`super::reconcile`]'s pod-`/metrics` measurement loop is the only caller of [`LumenSpec::reshard_status_with_usage`], which sets this). `None` when `maxShardBytes` is unset or usage has not been measured yet — the plain [`LumenSpec::reshard_status`] never sets it.
                    format: uint8
                    minimum: 0.0
                    nullable: true
                    type: integer
                  message:
                    default: ''
                    type: string
                  migrationBytesPerSec:
                    type: integer
                    minimum: 0.0
                    nullable: true
                  phase:
                    default: ''
                    type: string
                  progressPercent:
                    default: 0
                    format: uint8
                    minimum: 0.0
                    type: integer
                  recommendationOnly:
                    default: true
                    type: boolean
                  targetShardCount:
                    type: integer
                    minimum: 0.0
                    nullable: true
                  usageMeasuredAtMapVersion:
                    description: 'The `spec.shardMap.version` live when [`Self::max_observed_percent`] was captured (#1386 R1/R2) — the usage measurement''s freshness generation. [`LumenSpec::reshard_status_with_usage`] only reports a crossed threshold when this equals the CR''s *current* `spec.shardMap.version`; a mismatch means the measurement predates the most recent split''s cutover (immediately after `Complete`, the shard-usage cache almost always still holds exactly this — the live #1384 proof bug this field closes) and the status instead reports `"usageStalePostCutover"`, holding until a fresh post-cutover scrape lands. `None` alongside `max_observed_percent == None` (no measurement yet).'
                    type: integer
                    minimum: 0.0
                    nullable: true
                type: object
              servingReadyReplicas:
                default: 0
                description: Ready serving replicas (from the StatefulSet status).
                format: int32
                type: integer
              shardCount:
                default: 0
                description: Effective shard count.
                type: integer
                minimum: 0.0
            type: object
        required:
        - spec
        title: Lumen
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: lumenfleets.lumen.dev
spec:
  group: lumen.dev
  names:
    categories: []
    kind: LumenFleet
    plural: lumenfleets
    shortNames:
    - lfleet
    singular: lumenfleet
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.desiredInstances
      name: Desired
      type: integer
    - jsonPath: .status.appliedInstances
      name: Applied
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for LumenFleetSpec via `CustomResource`
        properties:
          spec:
            description: '`lumen.dev/v1alpha1` `LumenFleet`. Cluster-scoped — see the module docs. @spec apps/lumen/tech-design/semantic/source/apps-lumen-src-operator-fleet-rs.md#source'
            properties:
              defaults:
                description: 'The complete `Lumen` spec every instance starts from — the platform team''s knowledge: which image, which node pool, which StorageClass, which auth mode. Required and fully schema-validated, because a fleet that cannot produce one valid instance is not a fleet.'
                properties:
                  admission:
                    description: Optional in-process request admission (bounded token-bucket rate limiting per endpoint class), mirroring the `LUMEN_ADMISSION_*` env grammar `libs/service-http::AdmissionConfig` already parses (see `bin/lumen.rs`'s `serve` wiring). Absent means admission stays disabled — the pre-existing default; no new semantics, only a declarative surface for the existing env-driven behavior.
                    nullable: true
                    properties:
                      adminCapacity:
                        description: Token-bucket capacity for admin-class requests (`LUMEN_ADMISSION_ADMIN_CAPACITY`). Unset leaves admin unbounded.
                        type: integer
                        minimum: 0.0
                        nullable: true
                      maxKeys:
                        description: Maximum distinct admission keys retained per class (`LUMEN_ADMISSION_MAX_KEYS`). Unset falls back to `AdmissionConfig::DEFAULT_MAX_KEYS` (1024).
                        type: integer
                        minimum: 0.0
                        nullable: true
                      readCapacity:
                        description: Token-bucket capacity for read-class requests (`LUMEN_ADMISSION_READ_CAPACITY`). Unset leaves reads unbounded.
                        type: integer
                        minimum: 0.0
                        nullable: true
