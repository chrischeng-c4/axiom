# The operator runs in its own namespace and needs cluster-wide permission to
# manage the child kinds it renders for every Lumen CR.
apiVersion: v1
kind: Namespace
metadata:
  name: lumen-system
  labels:
    app.kubernetes.io/name: lumen-operator
    app.kubernetes.io/part-of: lumen
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lumen-operator
  namespace: lumen-system
  labels:
    app.kubernetes.io/name: lumen-operator
    app.kubernetes.io/part-of: lumen
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lumen-operator
  labels:
    app.kubernetes.io/name: lumen-operator
    app.kubernetes.io/part-of: lumen
rules:
  # The custom resource it owns + its status subresource.
  - apiGroups: ["lumen.dev"]
    resources: ["lumens", "lumens/status", "lumens/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The cluster-scoped fleet the platform team applies, and the status the
  # fleet loop writes back to it. No `create`/`delete`: the fleet is authored
  # by a human, and the operator only ever reads it and reports on it.
  - apiGroups: ["lumen.dev"]
    resources: ["lumenfleets", "lumenfleets/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # Read-only, so the fleet can refuse an entry whose namespace does not exist
  # instead of leaving a Lumen that never schedules. Deliberately not `create`:
  # namespace lifecycle (quotas, labels, Workload Identity bindings) belongs to
  # whatever provisions the cluster, and granting it here would make one CR
  # edit a cluster-wide namespace-creation privilege.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # Serving workloads.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Serving Service/ConfigMap/ServiceAccount plus the dedicated backup
  # ServiceAccount. Secret reads are required by the reshard driver to resolve
  # the admin token registry; the operator never creates or mutates Secrets.
  - apiGroups: [""]
    resources: ["services", "configmaps", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  # Optional scheduled object-storage backups are rendered as CronJobs.
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Per-instance isolation (only used when spec.networkPolicy=true, #2603).
  # networking.k8s.io is a built-in group, so this grant is always resolvable
  # even where the cluster's CNI does not enforce the objects.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Observability objects (only used when spec.observability=true; harmless to
  # grant always — the CRDs may be absent on dev clusters).
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "prometheusrules"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Leader-election Lease (HA: only the holder reconciles).
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Reconcile narration on the CR itself (#2620). `create` writes a new Event,
  # `patch` updates the EventSeries count when the Recorder's 6-minute dedup
  # window collapses a repeating event — without `patch`, a repeatedly failing
  # reconcile would fail to report the repetition.
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  # The per-instance `system:auth-delegator` binding that lets a serving pod
  # ask the apiserver to review its callers (#2876). `delete` is not optional
  # here: the binding is cluster-scoped, so it cannot carry an owner reference
  # back to a namespaced Lumen, and the sweep loop is the only thing that
  # removes it when the CR goes away.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # RBAC refuses to let a subject hand out permissions it does not itself hold
  # (escalation prevention). `bind` on exactly this one ClusterRole is the
  # narrow alternative to giving the operator the delegated-review powers it is
  # granting away; `resourceNames` keeps it from binding anything else —
  # notably not `cluster-admin`.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["system:auth-delegator"]
    verbs: ["bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lumen-operator
  labels:
    app.kubernetes.io/name: lumen-operator
    app.kubernetes.io/part-of: lumen
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lumen-operator
subjects:
  - kind: ServiceAccount
    name: lumen-operator
    namespace: lumen-system
