# CODEGEN-BEGIN
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lumen

resources:
  - ../../base

# prod runs the prometheus-operator, so pull in the ServiceMonitor +
# PrometheusRule SLO alerts, and isolates the serving pod with a NetworkPolicy
# (enforced only where the CNI supports it — see components/network-policy).
components:
  - ../../components/network-policy
  - ../../components/observability

# The ServiceMonitor's own metadata.namespace already follows the `namespace:`
# field above. Its spec.namespaceSelector.matchNames is a plain string field
# kustomize won't infer for you, so it needs its own replacement, sourced
# from this same ServiceMonitor object after this file's `namespace:`
# transformer has run (the component itself can't do this — see the NOTE in
# components/observability/kustomization.yaml).
replacements:
  - source:
      kind: ServiceMonitor
      name: lumen
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: ServiceMonitor
          name: lumen
        fieldPaths:
          - spec.namespaceSelector.matchNames.0

# prod: direct single-node install with strict auth, json logs, full resources.
# Production HA uses the operator CR path (`replicasPerShard > 1`) so Lumen owns
# raft replication without an external broker.

replicas:
  - name: lumen
    count: 1

patches:
  # Prod ConfigMap values: 6 shards, json logs, strict auth.
  - target:
      kind: ConfigMap
      name: lumen-config
    patch: |-
      - op: replace
        path: /data/SHARD_COUNT
        value: "6"
      - op: replace
        path: /data/LUMEN_LOG_FORMAT
        value: "json"
      - op: add
        path: /data/LUMEN_AUTH
        value: "required"
  # Strict auth: project LUMEN_AUTH from the ConfigMap into the serving process.
  - target:
      kind: Deployment
      name: lumen
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LUMEN_AUTH
          valueFrom:
            configMapKeyRef:
              name: lumen-config
              key: LUMEN_AUTH
# CODEGEN-END
