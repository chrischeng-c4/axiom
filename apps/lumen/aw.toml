[project]
name = "lumen"
cap_path = "README.md"
label = "app:lumen"

[impl]
build = "cargo test --locked -p lumen --features operator --lib --no-run"
test = "cargo test --locked -p lumen --features operator --lib"
harness = "cargo"

[ec.efficiency]
tool = "meter"
meter = "apps/lumen"
command = "cd apps/lumen && ../../target/debug/vat run ec-efficiency-meter"

[ec.stability]
tool = "rig"
dir = "apps/lumen/e2e/rig/cases/resilience"
command = "cd apps/lumen && ../../target/debug/vat run rig-resilience"

[capability.profile]
traits = ["service", "long_running", "cli_facing", "competitive_replacement", "network_exposed", "stateful_storage", "agent_facing", "http2_api", "kubernetes_native", "primary_replicas"]

[[workspaces]]
name = "lumen"
paths = ["**"]
target = "rust"
test_cmd = "cargo test -p lumen --lib --bins"
codegen.profile = "rust/score-crate"

