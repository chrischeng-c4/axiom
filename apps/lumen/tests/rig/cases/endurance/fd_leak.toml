# File-descriptor / socket / thread leak guard. Sample all three independent
# process resource counts before and after sustained index+search work over a
# BOUNDED keyspace (re-indexing the same docs — unbounded ingest is growth, not
# a leak), then assert none of the counts grew unbounded.
#
# Portability: `helpers/process_resource_count.py` prefers Linux /proc and
# falls back to lsof/ps on macOS. It prints one integer so Rig can capture and
# compare the measurements without embedding fabricated evidence.
#
# Requires: lumen serving on {{upstream}} (its pid is resolved at run time).
[record]
suite = "lumen"
dimension = "endurance"
case = "fd_leak"
subject = "file-descriptor, socket, and thread counts stay bounded across sustained work"
kind = "e2e"
expected = "pass"
required = true

[env]
upstream = "127.0.0.1:7373"
collection = "users"
keyspace = "5000"

[vat]
runner = "rig-endurance"
services = ["lumen"]

[limits]
timeout_secs = 600

[[steps]]
type = "http"
name = "collection_exists"
method = "PUT"
url = "http://{{upstream}}/collections/{{collection}}"
body = '{"fields": {"bio": {"type": "text"}, "email": {"type": "keyword"}}}'
expect = { statuses = [200, 201, 400, 409] }

[[steps]]
type = "exec"
name = "resolve_lumen_pid"
cmd = ["python3", "tests/rig/helpers/listener_pid.py", "{{upstream}}"]
timeout_secs = 5
capture = { lumen_pid = "stdout" }

# -- warmup: establish the descriptor working set so it doesn't read as a leak

[[steps]]
type = "exec"
name = "warmup_index"
cmd = ["python3", "-c", "import json,sys,random,time,urllib.request\nupstream,coll,keyspace=sys.argv[1],sys.argv[2],int(sys.argv[3])\nrng=random.Random(time.time_ns())\nitems=[]\nfor i in range(1000):\n    ext=f'fd-{rng.randrange(keyspace)}'\n    items.append({'external_id':ext,'field':'bio','value':f'engineer {ext}'})\n    items.append({'external_id':ext,'field':'email','value':f'{ext}@example.com'})\nbody=json.dumps({'items':items}).encode()\nreq=urllib.request.Request(f'http://{upstream}/collections/{coll}/index',data=body,method='POST',headers={'content-type':'application/json'})\nwith urllib.request.urlopen(req,timeout=30) as r:\n    sys.exit(0 if r.status<400 else 2)", "{{upstream}}", "{{collection}}", "{{keyspace}}"]
timeout_secs = 60

[[steps]]
type = "sample"
name = "warmup_searches"
samples = 300
capture = { warmup_fail = "fail_count" }
[steps.request]
method = "POST"
url = "http://{{upstream}}/collections/{{collection}}/search"
body = '{"query": {"match": {"field": "bio", "text": "engineer"}}, "limit": 1}'
expect = { status = 200, timeout_ms = 10000 }

# -- independent resource counts BEFORE the sustained load ------------------

[[steps]]
type = "exec"
name = "fd_count_before"
cmd = ["python3", "tests/rig/helpers/process_resource_count.py", "fd", "{{lumen_pid}}"]
timeout_secs = 35
capture = { fd_before = "stdout" }

[[steps]]
type = "exec"
name = "socket_count_before"
cmd = ["python3", "tests/rig/helpers/process_resource_count.py", "socket", "{{lumen_pid}}"]
timeout_secs = 35
capture = { socket_before = "stdout" }

[[steps]]
type = "exec"
name = "thread_count_before"
cmd = ["python3", "tests/rig/helpers/process_resource_count.py", "thread", "{{lumen_pid}}"]
timeout_secs = 35
capture = { thread_before = "stdout" }

[[steps]]
type = "assert"
name = "resource_baselines_sane"
exprs = ["fd_before > 0", "socket_before > 0", "thread_before > 0"]

# -- sustained index+search load ---------------------------------------------

[[steps]]
type = "exec"
name = "sustained_index"
cmd = ["python3", "-c", "import json,sys,random,time,urllib.request\nupstream,coll,keyspace=sys.argv[1],sys.argv[2],int(sys.argv[3])\nrng=random.Random(time.time_ns())\nfor _round in range(5):\n    items=[]\n    for i in range(1000):\n        ext=f'fd-{rng.randrange(keyspace)}'\n        items.append({'external_id':ext,'field':'bio','value':f'engineer {ext}'})\n        items.append({'external_id':ext,'field':'email','value':f'{ext}@example.com'})\n    body=json.dumps({'items':items}).encode()\n    req=urllib.request.Request(f'http://{upstream}/collections/{coll}/index',data=body,method='POST',headers={'content-type':'application/json'})\n    with urllib.request.urlopen(req,timeout=30) as r:\n        if r.status>=400: sys.exit(2)", "{{upstream}}", "{{collection}}", "{{keyspace}}"]
timeout_secs = 180

[[steps]]
type = "sample"
name = "sustained_searches"
samples = 1500
capture = { sustained_fail = "fail_count" }
[steps.request]
method = "POST"
url = "http://{{upstream}}/collections/{{collection}}/search"
body = '{"query": {"match": {"field": "bio", "text": "engineer"}}, "limit": 1}'
expect = { status = 200, timeout_ms = 10000 }

# -- independent resource counts AFTER the sustained load -------------------

[[steps]]
type = "exec"
name = "fd_count_after"
cmd = ["python3", "tests/rig/helpers/process_resource_count.py", "fd", "{{lumen_pid}}"]
timeout_secs = 35
capture = { fd_after = "stdout" }

[[steps]]
type = "exec"
name = "socket_count_after"
cmd = ["python3", "tests/rig/helpers/process_resource_count.py", "socket", "{{lumen_pid}}"]
timeout_secs = 35
capture = { socket_after = "stdout" }

[[steps]]
type = "exec"
name = "thread_count_after"
cmd = ["python3", "tests/rig/helpers/process_resource_count.py", "thread", "{{lumen_pid}}"]
timeout_secs = 35
capture = { thread_after = "stdout" }

# -- gates -------------------------------------------------------------------

[[steps]]
type = "assert"
name = "no_search_errors"
exprs = [
  "warmup_fail == 0",
  "sustained_fail == 0",
]

[[steps]]
type = "assert"
name = "process_resources_bounded"
# Bounded growth, not zero growth: warmed pools may still tick up a few
# descriptors, sockets, or worker threads. The absolute allowance covers that
# churn while a request-proportional leak still trips the gate.
exprs = [
  "fd_after <= 1.20 * fd_before + 16",
  "socket_after <= 1.20 * socket_before + 16",
  "thread_after <= 1.20 * thread_before + 16",
]
