# Seeded defects for `scripts/td-ec-verify.py --mutations`.
#
# Controller-owned. This file is deliberately kept OUTSIDE `libs/peer-tls/` so
# it is never part of the material handed to an implementation worker: a worker
# that can read the seeded defects can special-case them instead of writing a
# contract that catches them on principle.
#
# Each mutation rewrites one anchor in `libs/peer-tls/tech-design/src/peer_tls/`
# into a plausible wrong implementation. At least one EC case must exit nonzero
# for every one of them. A mutation that no case notices is a hole in the EC,
# never a licence to delete the mutation.
#
# `old` must be a unique substring of the named file; the harness restores the
# original bytes after each run.

# ---------------------------------------------------------------------------
# rotation state machine
# ---------------------------------------------------------------------------

[[mutation]]
id = "retired-phase-admits-outgoing"
intent = "the retired phase keeps admitting the outgoing anchor, so rotation never actually retires trust"
file = "peer_tls/domain/rotation.py"
old = """        if self.phase == RotationPhase.OUTGOING_RETIRED:
            return self.incoming is not None and self.incoming.key_id == anchor_key_id
"""
new = ""

[[mutation]]
id = "retirement-guard-removed"
intent = "the outgoing anchor is retired before activation of the new generation is observed"
file = "peer_tls/domain/rotation.py"
old = """        if not state.activation_observed:
            return state
"""
new = ""

[[mutation]]
id = "reload-does-not-bump-generation"
intent = "reload returns the same generation number, so a no-op reload is indistinguishable from a swap"
file = "peer_tls/domain/rotation.py"
old = "            number=state.active.number + 1,"
new = "            number=state.active.number,"

[[mutation]]
id = "reload-keeps-old-leaf-label"
intent = "reload bumps the counter but keeps serving the previous leaf"
file = "peer_tls/domain/rotation.py"
old = "            leaf_label=next_generation.leaf_label,"
new = "            leaf_label=state.active.leaf_label,"

# ---------------------------------------------------------------------------
# material validation
# ---------------------------------------------------------------------------

[[mutation]]
id = "not-before-not-enforced"
intent = "a leaf is accepted before its validity window opens"
file = "peer_tls/domain/validation.py"
old = "    if instant < triple.leaf.not_before:"
new = "    if False and instant < triple.leaf.not_before:"

[[mutation]]
id = "not-after-not-enforced"
intent = "an expired leaf is accepted"
file = "peer_tls/domain/validation.py"
old = "    if instant > triple.leaf.not_after:"
new = "    if False and instant > triple.leaf.not_after:"

[[mutation]]
id = "rejection-reason-renamed"
intent = "a typed rejection reason silently changes its wire value"
file = "peer_tls/domain/verdict.py"
old = 'IDENTITY_MISMATCH = "identity_mismatch"'
new = 'IDENTITY_MISMATCH = "mismatch"'

[[mutation]]
id = "rejection-detail-emptied"
intent = "a refusal carries a typed reason but no operator-facing detail"
file = "peer_tls/domain/validation.py"
old = "            detail=f\"Issuer key ID '{triple.leaf.issuer_key_id}' not admitted by trust bundle\","
new = '            detail="",'

[[mutation]]
id = "validity-window-bounds-swapped"
intent = "an accepted verdict reports a validity window that does not describe the leaf it validated"
file = "peer_tls/domain/validation.py"
old = "        window=ValidityWindow(not_before=triple.leaf.not_before, not_after=triple.leaf.not_after),"
new = "        window=ValidityWindow(not_before=triple.leaf.not_after, not_after=triple.leaf.not_before),"

