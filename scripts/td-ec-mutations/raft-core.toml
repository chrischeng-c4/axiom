# Seeded defects for `scripts/td-ec-verify.py --mutations`.
#
# Controller-owned. This file is deliberately kept OUTSIDE `libs/raft-core/` so
# it is never part of the material handed to an implementation worker: a worker
# that can read the seeded defects can special-case them instead of writing a
# contract that catches them on principle.
#
# Each mutation rewrites one anchor in
# `libs/raft-core/tech-design/src/raft_core/` into a plausible wrong
# implementation — the kind of consensus bug that keeps a cluster looking
# healthy right up to the moment it loses a committed entry. At least one EC
# case must exit nonzero for every one of them. A mutation that no case notices
# is a hole in the EC, never a licence to delete the mutation.
#
# `old` must be a unique substring of the named file; the harness restores the
# original bytes after each run.

# ---------------------------------------------------------------------------
# domain/membership.py — who may vote, and how many of them make a majority
# ---------------------------------------------------------------------------

