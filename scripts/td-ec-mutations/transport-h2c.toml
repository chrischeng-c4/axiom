# Seeded defects for `scripts/td-ec-verify.py --mutations`.
#
# Controller-owned. This file is deliberately kept OUTSIDE `libs/transport-h2c/`
# so it is never part of the material handed to an implementation worker: a
# worker that can read the seeded defects can special-case them instead of
# writing a contract that catches them on principle.
#
# Each mutation rewrites one anchor in
# `libs/transport-h2c/tech-design/src/transport_h2c/` into a plausible wrong
# implementation. At least one EC case must exit nonzero for every one of them.
# A mutation that no case notices is a hole in the EC, never a licence to
# delete the mutation.
#
# `old` must be a unique substring of the named file; the harness restores the
# original bytes after each run.

# ---------------------------------------------------------------------------
# connection sizing — the logarithm and its two clamps
# ---------------------------------------------------------------------------

[[mutation]]
id = "sizing-log-base-two"
intent = "the heuristic uses log2 instead of the natural log, so a service sized for 256 concurrent requests opens 8 sockets instead of 6"
file = "transport_h2c/domain/sizing.py"
old = "    raw = math.ceil(math.log(concurrency))"
new = "    raw = math.ceil(math.log2(concurrency))"

[[mutation]]
id = "sizing-floors-instead-of-ceils"
intent = "the heuristic truncates instead of rounding up, so every concurrency lands one connection short"
file = "transport_h2c/domain/sizing.py"
old = "    raw = math.ceil(math.log(concurrency))"
new = "    raw = int(math.log(concurrency))"

[[mutation]]
id = "sizing-core-cap-dropped"
intent = "the core count stops being a ceiling, so a small container runs more connection drivers than it has cores"
file = "transport_h2c/domain/sizing.py"
old = "    return min(max(raw, 1), cap)"
new = "    return max(raw, 1)"

[[mutation]]
id = "sizing-parallelism-floor-dropped"
intent = "a reported parallelism of zero caps the pool at zero connections instead of one"
file = "transport_h2c/domain/sizing.py"
old = "    cap = max(parallelism, 1)"
new = "    cap = parallelism"

[[mutation]]
id = "sizing-small-concurrency-shortcut-removed"
intent = "the explicit one-connection answer for a concurrency of two or less is dropped and left to the logarithm"
file = "transport_h2c/domain/sizing.py"
old = """    if concurrency <= 2:
        return 1
"""
new = ""

