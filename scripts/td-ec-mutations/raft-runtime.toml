# Mutation suite for libs/raft-runtime.
#
# Controller-authored. Each entry seeds exactly one defect into the design
# package and asserts that at least one external-contract case notices. A
# mutation that no case catches means the contract is decorative for that
# behavior. This file is never part of a worker's readable material.

# ------------------------------------------------------------ domain/fencing --

[[mutation]]
id = "fence-first-epoch-zero"
intent = "The documented first epoch becomes 0, so a fresh assignment is indistinguishable from none."
file = "raft_runtime/domain/fencing.py"
old = 'FIRST_EPOCH: AssignmentEpoch = 1'
new = 'FIRST_EPOCH: AssignmentEpoch = 0'

[[mutation]]
id = "fence-epoch-does-not-advance"
intent = "The epoch stops being monotonic, so a superseded owner replays its old token."
file = "raft_runtime/domain/fencing.py"
old = '    return previous + 1'
new = '    return previous'

[[mutation]]
id = "fence-expiry-exclusive"
intent = "Expiry becomes strict, so the fence survives one millisecond past its stated end."
file = "raft_runtime/domain/fencing.py"
old = '    return now_ms >= expires_at_ms'
new = '    return now_ms > expires_at_ms'

[[mutation]]
id = "fence-expiry-inverted"
intent = "Expiry is decided backwards, so a live fence reads as expired."
file = "raft_runtime/domain/fencing.py"
old = 'def is_expired(expires_at_ms: int, now_ms: int) -> bool:'
new = 'def is_expired(now_ms: int, expires_at_ms: int) -> bool:'

[[mutation]]
id = "fence-unassigned-not-detected"
intent = "An absent assignment is no longer reported, so validate falls through on nothing."
file = "raft_runtime/domain/fencing.py"
old = '''
    if active is None:
        return Unassigned()
'''
new = '''
    if active is not None and active.token.owner == "":
        return Unassigned()
'''

[[mutation]]
id = "fence-stale-epoch-not-detected"
intent = "A superseded epoch validates, so two owners believe they hold the fence."
file = "raft_runtime/domain/fencing.py"
old = '    if epoch != active.token.epoch:'
new = '    if epoch == active.token.epoch:'

[[mutation]]
id = "fence-stale-epoch-fields-swapped"
intent = "The stale-epoch report names the supplied epoch as the expected one."
file = "raft_runtime/domain/fencing.py"
old = '        return StaleEpoch(expected=active.token.epoch, supplied=epoch)'
new = '        return StaleEpoch(expected=epoch, supplied=active.token.epoch)'

[[mutation]]
id = "fence-owner-mismatch-not-detected"
intent = "A different owner holding the current epoch is admitted."
file = "raft_runtime/domain/fencing.py"
old = '    if owner != active.token.owner:'
new = '    if owner == active.token.owner:'

[[mutation]]
id = "fence-owner-mismatch-fields-swapped"
intent = "The owner-mismatch report names the caller as the holder."
file = "raft_runtime/domain/fencing.py"
old = '        return OwnerMismatch(expected=active.token.owner, supplied=owner)'
new = '        return OwnerMismatch(expected=owner, supplied=active.token.owner)'

[[mutation]]
id = "fence-precedence-owner-before-epoch"
intent = "Owner mismatch is reported before a stale epoch, so a superseded owner is told the wrong recovery."
file = "raft_runtime/domain/fencing.py"
old = '''
    if epoch != active.token.epoch:
        return StaleEpoch(expected=active.token.epoch, supplied=epoch)
    if owner != active.token.owner:
        return OwnerMismatch(expected=active.token.owner, supplied=owner)
'''
new = '''
    if owner != active.token.owner:
        return OwnerMismatch(expected=active.token.owner, supplied=owner)
    if epoch != active.token.epoch:
        return StaleEpoch(expected=active.token.epoch, supplied=epoch)
'''

[[mutation]]
id = "fence-precedence-expiry-first"
intent = "Expiry outranks the stale-epoch and owner checks."
file = "raft_runtime/domain/fencing.py"
old = '''
    if epoch != active.token.epoch:
        return StaleEpoch(expected=active.token.epoch, supplied=epoch)
'''
new = '''
    if is_expired(active.expires_at_ms, now_ms):
        return Expired(expires_at_ms=active.expires_at_ms, now_ms=now_ms)
    if epoch != active.token.epoch:
        return StaleEpoch(expected=active.token.epoch, supplied=epoch)
'''

[[mutation]]
id = "fence-expired-report-fields-swapped"
intent = "The expiry report transposes the deadline and the supplied instant."
file = "raft_runtime/domain/fencing.py"
old = '        return Expired(expires_at_ms=active.expires_at_ms, now_ms=now_ms)'
new = '        return Expired(expires_at_ms=now_ms, now_ms=active.expires_at_ms)'

