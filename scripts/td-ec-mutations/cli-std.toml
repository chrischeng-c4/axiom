# Seeded defects for the cli-std tech-design package.
#
# The controller writes this answer key. It is never shown to the worker that
# writes the external-contract cases, and the mutation suite is the only gate
# that measures whether those cases have discriminating power at all.
#
# Every `old` below must occur exactly once in its file.

