# Seeded defects for `scripts/td-ec-verify.py apps/lumen --mutations`.
#
# Controller-owned. This file is deliberately kept OUTSIDE `apps/lumen/` so it is
# never part of the material handed to an implementation worker: a worker that
# can read the seeded defects can special-case them instead of writing a contract
# that catches them on principle.
#
# Each mutation rewrites one anchor in `apps/lumen/tech-design/src/lumen/` into a
# plausible wrong implementation. At least one EC case must exit nonzero for
# every one of them. A mutation that no case notices is a hole in the EC, never a
# licence to delete the mutation.
#
# `old` must be a unique substring of the named file; the harness restores the
# original bytes after each run.
#
# The topology block below was measured before it was written: every entry was
# run against the delivered #2937 design in the round's own worktree and the
# failing row was recorded, so no entry here is a hypothesis about what the
# contract would catch.

