# Mutation suite for libs/service-backup.
#
# Controller-authored. Each entry seeds exactly one defect into the design
# package and asserts that at least one external-contract case notices. A
# mutation that no case catches means the contract is decorative for that
# behavior. This file is never part of a worker's readable material.

# ------------------------------------------------------ domain/destination --

[[mutation]]
id = "dest-file-scheme"
intent = "The local scheme loses one slash, so a well-formed URI no longer matches."
file = "service_backup/domain/destination.py"
old = 'FILE_SCHEME = "file://"'
new = 'FILE_SCHEME = "file:/"'

[[mutation]]
id = "dest-s3-scheme"
intent = "The S3 scheme loses one slash."
file = "service_backup/domain/destination.py"
old = 'S3_SCHEME = "s3://"'
new = 'S3_SCHEME = "s3:/"'

[[mutation]]
id = "dest-gcs-scheme"
intent = "The Google scheme is spelled the way an operator guesses rather than the way the API names it."
file = "service_backup/domain/destination.py"
old = 'GCS_SCHEME = "gs://"'
new = 'GCS_SCHEME = "gcs://"'

[[mutation]]
id = "dest-local-identity"
intent = "The local identity prefix grows a pair of slashes, so a log line reads like a URI."
file = "service_backup/domain/destination.py"
old = 'LOCAL_IDENTITY = "local:"'
new = 'LOCAL_IDENTITY = "local://"'

[[mutation]]
id = "dest-default-prefix"
intent = "The default prefix is pluralized, so every unprefixed destination writes somewhere else."
file = "service_backup/domain/destination.py"
old = 'DEFAULT_PREFIX = "backup"'
new = 'DEFAULT_PREFIX = "backups"'

[[mutation]]
id = "dest-identity-local-unprefixed"
intent = "A local identity is rendered as a bare path, indistinguishable from an object key."
file = "service_backup/domain/destination.py"
old = '        return LOCAL_IDENTITY + destination.path'
new = '        return destination.path'

[[mutation]]
id = "dest-identity-s3-separator"
intent = "The S3 identity loses the separator between bucket and prefix."
file = "service_backup/domain/destination.py"
old = '        return S3_SCHEME + destination.bucket + "/" + destination.prefix'
new = '        return S3_SCHEME + destination.bucket + destination.prefix'

[[mutation]]
id = "dest-identity-gcs-swap"
intent = "The Google identity renders the prefix where the bucket belongs."
file = "service_backup/domain/destination.py"
old = '        return GCS_SCHEME + destination.bucket + "/" + destination.prefix'
new = '        return GCS_SCHEME + destination.prefix + "/" + destination.bucket'

[[mutation]]
id = "dest-default-prefix-local"
intent = "A local destination always answers the default prefix, ignoring the one it carries."
file = "service_backup/domain/destination.py"
old = '        return destination.prefix if destination.prefix is not None else DEFAULT_PREFIX'
new = '        return DEFAULT_PREFIX'

[[mutation]]
id = "dest-default-prefix-s3"
intent = "An S3 destination with no prefix answers the empty string instead of the default."
file = "service_backup/domain/destination.py"
old = '''
