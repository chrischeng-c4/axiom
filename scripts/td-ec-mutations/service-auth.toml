[[mutation]]
id = "M05-bearer-lookup-falls-back-to-identities"
intent = "`lookup_secret` falls back to the identities map, so a public verified identity string is accepted as a bearer secret"
file = "service_auth/domain/registry.py"
old = "    return registry.tokens.get(secret)"
new = "    return registry.tokens.get(secret) or registry.identities.get(secret)"

[[mutation]]
id = "M06-reserved-scan-order-inverted"
intent = "`reserved_subject_violation` scans identities before tokens, so a violation is attributed to the wrong section"
file = "service_auth/domain/registry.py"
old = """    token_hits = [
        (key, claims.subject)
        for key, claims in registry.tokens.items()
        if claims.subject in reserved_set
    ]
    if token_hits:
        min_key, min_subj = min(token_hits)
        return (TOKENS_SECTION, min_key, min_subj)

    identity_hits = [
        (key, claims.subject)
        for key, claims in registry.identities.items()
        if claims.subject in reserved_set
    ]
    if identity_hits:
        min_key, min_subj = min(identity_hits)
        return (IDENTITIES_SECTION, min_key, min_subj)
"""
new = """    identity_hits = [
        (key, claims.subject)
        for key, claims in registry.identities.items()
        if claims.subject in reserved_set
    ]
    if identity_hits:
        min_key, min_subj = min(identity_hits)
        return (IDENTITIES_SECTION, min_key, min_subj)

    token_hits = [
        (key, claims.subject)
        for key, claims in registry.tokens.items()
        if claims.subject in reserved_set
    ]
    if token_hits:
        min_key, min_subj = min(token_hits)
        return (TOKENS_SECTION, min_key, min_subj)
"""

