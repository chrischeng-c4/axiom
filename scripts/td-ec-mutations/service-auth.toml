# ---------------------------------------------------------------------------
# delegated Kubernetes authorization — decision order, deny, and cache
# ---------------------------------------------------------------------------

[[mutation]]
id = "M10-identity-shape-checked-before-audience"
intent = "`judge` reports the identity-shape rejection first, so a token minted for the wrong audience is reported as a shape problem"
file = "service_auth/application/delegate_authorization.py"
old = """    intersects = any(
        granted in config.audiences for granted in outcome.audiences
    )
    if not intersects:
        return AuthRejection.AUDIENCE_MISMATCH

    return principal_from_review(True, outcome.identity)
"""
new = """    shape = principal_from_review(True, outcome.identity)
    if isinstance(shape, PrincipalRejection):
        return shape

    intersects = any(
        granted in config.audiences for granted in outcome.audiences
    )
    if not intersects:
        return AuthRejection.AUDIENCE_MISMATCH

    return shape
"""

