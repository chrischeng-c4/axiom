# Seeded defects for `scripts/td-ec-verify.py --mutations`.
#
# Controller-owned. This file is deliberately kept OUTSIDE `libs/service-auth/`
# so it is never part of the material handed to an implementation worker: a
# worker that can read the seeded defects can special-case them instead of
# writing a contract that catches them on principle.
#
# Each mutation rewrites one anchor in
# `libs/service-auth/tech-design/src/service_auth/` into a plausible wrong
# implementation. At least one EC case must exit nonzero for every one of them.
# A mutation that no case notices is a hole in the EC, never a licence to
# delete the mutation.
#
# `old` must be a unique substring of the named file; the harness restores the
# original bytes after each run.
#
# Coverage plan — every one of the six cases owns at least two seeds, so a case
# that is green while blind shows up as an unbalanced catch count rather than
# as a single lucky detection:
#
#   static-role-map-authorization-behavior   M01 M02 M03 M04
#   static-role-map-authorization-security   M05 M06 M07
#   delegated-kubernetes-authorization-behavior  M10 M11 M12 M13
#   delegated-kubernetes-authorization-security  M08 M09 M14 M15
#   credential-reload-audit-behavior         M16 M17
#   credential-reload-audit-security         M18 M19 M20

# ---------------------------------------------------------------------------
# static role map — role hierarchy and claim resolution
# ---------------------------------------------------------------------------

[[mutation]]
id = "M01-role-does-not-cover-itself"
intent = "`covers` uses strict `>`, so a role no longer satisfies a requirement for itself"
file = "service_auth/domain/role.py"
old = "    return rank(held) >= rank(needed)"
new = "    return rank(held) > rank(needed)"

[[mutation]]
id = "M02-wildcard-beats-exact-grant"
intent = "`resolve_role` consults the wildcard entry before the exact resource, so a narrow grant is shadowed by a broad one"
file = "service_auth/domain/claims.py"
old = """    if resource in claims.roles:
        return claims.roles[resource]
    if WILDCARD_RESOURCE in claims.roles:
        return claims.roles[WILDCARD_RESOURCE]
"""
new = """    if WILDCARD_RESOURCE in claims.roles:
        return claims.roles[WILDCARD_RESOURCE]
    if resource in claims.roles:
        return claims.roles[resource]
"""

[[mutation]]
id = "M03-namespaced-detection-drops-subject-conjunct"
intent = "`parse` decides namespaced-vs-flat on section names alone, so a flat document whose sole key is `tokens` is misread as a namespaced one"
file = "service_auth/domain/registry.py"
old = """    namespaced = (
        all(key in (TOKENS_SECTION, IDENTITIES_SECTION) for key in document.keys())
        and not any(
            isinstance(val, Mapping) and "subject" in val
            for val in document.values()
        )
    )
"""
new = """    namespaced = all(
        key in (TOKENS_SECTION, IDENTITIES_SECTION) for key in document.keys()
    )
"""

[[mutation]]
id = "M04-merge-overwrites-duplicate-key"
intent = "`try_merge` silently lets a later source overwrite an existing token key instead of refusing the collision"
file = "service_auth/domain/registry.py"
old = """    merged_tokens = dict(base.tokens)
    for k, v in other.tokens.items():
        if k in merged_tokens:
            raise RegistryError("duplicate_registry_key")
        merged_tokens[k] = v
"""
new = """    merged_tokens = dict(base.tokens)
    for k, v in other.tokens.items():
        merged_tokens[k] = v
"""

