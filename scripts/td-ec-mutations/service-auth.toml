"""
new = """        stale = cache.get_stale(token, attributes, now)
        if stale is not None:
            return DelegatedOutcome.AUTHENTICATED if stale else DelegatedOutcome.DENIED
        return DelegatedOutcome.AUTHENTICATED
"""

