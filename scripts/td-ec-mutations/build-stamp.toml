# Seeded defects for `scripts/td-ec-verify.py --mutations`.
#
# Controller-owned. This file is deliberately kept OUTSIDE `libs/build-stamp/`
# so it is never part of the material handed to an implementation worker: a
# worker that can read the seeded defects can special-case them instead of
# writing a contract that catches them on principle.
#
# Each mutation rewrites one anchor in
# `libs/build-stamp/tech-design/src/build_stamp/` into a plausible wrong
# implementation. At least one EC case must exit nonzero for every one of them.
# A mutation that no case notices is a hole in the EC, never a licence to
# delete the mutation.
#
# `old` must be a unique substring of the named file; the harness restores the
# original bytes after each run.
#
# Coverage plan — every one of the six cases owns at least three seeds, so a
# case that is green while blind shows up as an unbalanced catch count rather
# than as a single lucky detection:
#
#   version-stamp-emission-behavior        M01 M02 M03 M04
#   version-stamp-emission-security        M05 M06 M07
#   best-effort-degradation-behavior       M08 M09 M10 M11
#   best-effort-degradation-security       M12 M13 M14
#   directive-channel-integrity-behavior   M15 M16 M17 M18
#   directive-channel-integrity-security   M19 M20 M21 M22

# ---------------------------------------------------------------------------
# version stamp emission — the directive set, its order, and its encoding
# ---------------------------------------------------------------------------

[[mutation]]
id = "M01-env-stamp-order-swapped"
intent = "the build time and the target triple trade places, so the directive list is right as a set and wrong as a sequence"
file = "build_stamp/application/emit_stamp.py"
old = """            ("_BUILT_AT", built_at),
            ("_TARGET", target_value),"""
new = """            ("_TARGET", target_value),
            ("_BUILT_AT", built_at),"""

[[mutation]]
id = "M02-rerun-hint-emitted-unconditionally"
intent = "the hint is emitted whether or not the path exists, so a source tarball with no `.git` gets a hint pointing nowhere"
file = "build_stamp/application/emit_stamp.py"
old = "        if self._probe.exists(request.git_head_path):"
new = "        if True or self._probe.exists(request.git_head_path):"

[[mutation]]
id = "M03-built-at-in-milliseconds"
intent = "the build time is encoded in milliseconds, which is a plausible unit and not the one the promise names"
file = "build_stamp/domain/build_time.py"
old = "    return str(epoch_seconds)"
new = "    return str(epoch_seconds * 1000)"

[[mutation]]
id = "M04-sha-directive-renamed"
intent = "the commit stamp is published as `<PREFIX>_SHA`, so every `env!(\"..._GIT_SHA\")` consumer stops resolving"
file = "build_stamp/application/emit_stamp.py"
old = '            ("_GIT_SHA", sha_value),'
new = '            ("_SHA", sha_value),'

# ---------------------------------------------------------------------------
# version stamp emission, security — the emitted set is exactly the stamps
# ---------------------------------------------------------------------------

[[mutation]]
id = "M05-duplicate-rerun-hint"
intent = "the hint is appended twice, so the emitted multiset gains a directive while every individual value stays correct"
file = "build_stamp/application/emit_stamp.py"
old = """            if isinstance(d, Directive):
                directives.append(d)"""
new = """            if isinstance(d, Directive):
                directives.append(d)
                directives.append(d)"""

[[mutation]]
id = "M06-rerun-hint-becomes-a-link-arg"
intent = "the rerun kind renders as `cargo:rustc-link-arg`, turning a build-cache hint into a linker instruction Cargo obeys"
file = "build_stamp/domain/directive.py"
old = '    RERUN_IF_CHANGED = "rerun-if-changed"'
new = '    RERUN_IF_CHANGED = "rustc-link-arg"'

[[mutation]]
id = "M07-fourth-env-stamp"
intent = "a fourth `rustc-env` key joins the set, so the stamp publishes a compile-time variable the caller never asked for"
file = "build_stamp/application/emit_stamp.py"
old = """            ("_TARGET", target_value),
        ]"""
new = """            ("_TARGET", target_value),
            ("_BUILD_HOST", "ci"),
        ]"""

# ---------------------------------------------------------------------------
# best-effort degradation — one stable fallback, applied independently
# ---------------------------------------------------------------------------

[[mutation]]
id = "M08-fallback-spelling-changed"
intent = "the single fallback constant becomes `UNKNOWN` in caps, which reads the same in prose and compares differently"
file = "build_stamp/domain/fallback.py"
old = 'UNKNOWN: Final[str] = "unknown"'
new = 'UNKNOWN: Final[str] = "UNKNOWN"'

[[mutation]]
id = "M09-second-fallback-for-the-sha"
intent = "the sha path grows its own fallback word, so the three degraded values are three similar strings rather than one value"
file = "build_stamp/application/emit_stamp.py"
old = "        sha_value = sha_decoded if sha_decoded is not None else UNKNOWN"
new = '        sha_value = sha_decoded if sha_decoded is not None else "unavailable"'

[[mutation]]
id = "M10-sha-failure-contaminates-the-target"
intent = "an unobtainable sha drags the target triple down with it, so degradation stops being independent"
file = "build_stamp/application/emit_stamp.py"
old = "        target_value = decode_target(self._target.target_triple())"
new = """        target_value = (
            decode_target(self._target.target_triple())
            if sha_decoded is not None
            else UNKNOWN
        )"""

[[mutation]]
id = "M11-degraded-directive-dropped"
intent = "a stamp it cannot answer is omitted instead of degraded, so the directive count becomes a function of the environment"
file = "build_stamp/application/emit_stamp.py"
old = """        for suffix, val in env_stamps:
            raw_key = request.prefix + suffix"""
new = """        for suffix, val in env_stamps:
            if val == UNKNOWN:
                continue
            raw_key = request.prefix + suffix"""

# ---------------------------------------------------------------------------
# best-effort degradation, security — no leakage, and the entry point is total
# ---------------------------------------------------------------------------

[[mutation]]
id = "M12-subprocess-output-leaks-on-failure"
intent = "a failed git invocation publishes its raw output as the sha, turning the stamp into a disclosure channel for the build host"
file = "build_stamp/application/emit_stamp.py"
old = "        sha_value = sha_decoded if sha_decoded is not None else UNKNOWN"
new = """        sha_value = (
            sha_decoded
            if sha_decoded is not None
            else stdout.decode("utf-8", errors="replace")
        )"""

[[mutation]]
id = "M13-unreadable-clock-raises"
intent = "the None guard on the clock disappears, so an unreadable clock fails the build instead of degrading"
file = "build_stamp/application/emit_stamp.py"
old = "        built_at = UNKNOWN if seconds is None else format_built_at(seconds)"
new = "        built_at = format_built_at(seconds)  # type: ignore[arg-type]"

[[mutation]]
id = "M14-entry-point-declared-partial"
intent = "the declared return type admits absence while every run still succeeds — a case that asserts totality by running the matrix cannot see this, and one that reads the annotation can"
file = "build_stamp/application/emit_stamp.py"
old = "    def plan(self, request: StampRequest) -> StampPlan:"
new = "    def plan(self, request: StampRequest) -> StampPlan | None:"

# ---------------------------------------------------------------------------
# directive channel integrity, behavior — the sha is normalized before use
# ---------------------------------------------------------------------------

[[mutation]]
id = "M15-trailing-only-trim"
intent = "the sha is trimmed on the right only, so leading whitespace from the subprocess is interpolated into the directive"
file = "build_stamp/domain/sha.py"
old = "    trimmed = text.strip()"
new = "    trimmed = text.rstrip()"

[[mutation]]
id = "M16-emptiness-tested-before-trimming"
intent = "an all-whitespace answer becomes the empty sha rather than no answer, so the stamp claims a commit it does not have"
file = "build_stamp/domain/sha.py"
old = "    if not trimmed:"
new = "    if not text:"

[[mutation]]
id = "M17-invalid-bytes-silently-dropped"
intent = "invalid UTF-8 is discarded rather than replaced, so a corrupted answer becomes a shorter plausible-looking sha"
file = "build_stamp/domain/sha.py"
old = '    text = stdout.decode("utf-8", errors="replace")'
new = '    text = stdout.decode("utf-8", errors="ignore")'

[[mutation]]
id = "M18-no-normalization-at-all"
intent = "the trim disappears, so the trailing newline `git rev-parse` always writes survives into the emission path"
file = "build_stamp/domain/sha.py"
old = "    trimmed = text.strip()"
new = "    trimmed = text"

# ---------------------------------------------------------------------------
# directive channel integrity, security — confinement to one directive
# ---------------------------------------------------------------------------

[[mutation]]
id = "M19-control-character-check-removed"
intent = "construction stops rejecting control characters, so a newline in the sha or the target opens a second directive line"
file = "build_stamp/domain/directive.py"
old = """    for ch in key + value:
        if ord(ch) < 0x20 or ord(ch) == 0x7F:
            return DirectiveRejection.CONTROL_CHARACTER"""
new = """    for ch in key + value:
        if False:
            return DirectiveRejection.CONTROL_CHARACTER"""

[[mutation]]
id = "M20-control-character-threshold-lowered"
intent = "the guard covers only the characters below newline, so `\\n` and `\\r` — the two that actually split a directive — pass"
file = "build_stamp/domain/directive.py"
old = """    for ch in key + value:
        if ord(ch) < 0x20 or ord(ch) == 0x7F:"""
new = """    for ch in key + value:
        if ord(ch) < 0x0A or ord(ch) == 0x7F:"""

[[mutation]]
id = "M21-injection-neutralized-by-dropping"
intent = "a rejected value drops its directive instead of degrading it, so a hostile input deletes a legitimate stamp — safe by the letter, wrong by the count"
file = "build_stamp/application/emit_stamp.py"
old = """                if isinstance(d, DirectiveRejection):
                    # Value was unusable -> emit sanitized key with UNKNOWN
                    d_fallback = make_directive(
                        DirectiveKind.RUSTC_ENV, sanitized_key, UNKNOWN
                    )
                    if isinstance(d_fallback, Directive):
                        directives.append(d_fallback)
                elif isinstance(d, Directive):"""
new = """                if isinstance(d, DirectiveRejection):
                    pass
                elif isinstance(d, Directive):"""

[[mutation]]
id = "M22-key-sanitizer-is-the-identity"
intent = "`sanitize_key` stops stripping anything, so a prefix carrying a control character loses its whole directive instead of degrading"
file = "build_stamp/domain/directive.py"
old = '    return "".join(ch for ch in key if not (ord(ch) < 0x20 or ord(ch) == 0x7F))'
new = '    return "".join(ch for ch in key)'
