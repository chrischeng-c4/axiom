# Mutation suite for libs/service-http.
#
# Controller-authored. Each entry seeds exactly one defect into the design
# package and asserts that at least one external-contract case notices. A
# mutation that no case catches means the contract is decorative for that
# behavior. This file is never part of a worker's readable material.

# ------------------------------------------------------ infrastructure/numbers --

[[mutation]]
id = "num-sign-is-minus"
intent = "The stripped sign becomes the minus, so a negative length parses as a size."
file = "service_http/infrastructure/numbers.py"
old = 'PLUS_SIGN = "+"'
new = 'PLUS_SIGN = "-"'

[[mutation]]
id = "num-strips-two-characters"
intent = "The sign strip eats a digit along with the sign."
file = "service_http/infrastructure/numbers.py"
old = '        body = body[1:]'
new = '        body = body[2:]'

[[mutation]]
id = "num-empty-body-accepted"
intent = "The empty-string guard tests identity instead of value, so a bare sign parses."
file = "service_http/infrastructure/numbers.py"
old = '    if body == "":'
new = '    if body is None:'

[[mutation]]
id = "num-any-becomes-all"
intent = "A single stray character no longer disqualifies the whole value."
file = "service_http/infrastructure/numbers.py"
old = '    if any(c not in ASCII_DIGITS for c in body):'
new = '    if all(c not in ASCII_DIGITS for c in body):'

[[mutation]]
id = "num-off-by-one"
intent = "Every parsed size is one byte larger than the header declared."
file = "service_http/infrastructure/numbers.py"
old = '    return int(body)'
new = '    return int(body) + 1'

[[mutation]]
id = "num-alphabet-admits-hex"
intent = "The decimal alphabet widens to hexadecimal, so a hex length is accepted."
file = "service_http/infrastructure/numbers.py"
old = 'ASCII_DIGITS = "0123456789"'
new = 'ASCII_DIGITS = "0123456789abcdef"'

[[mutation]]
id = "num-none-passthrough"
intent = "An absent header is treated as present and reaches the digit scan."
file = "service_http/infrastructure/numbers.py"
old = '    if raw is None:'
new = '    if raw is not None:'

[[mutation]]
id = "num-zero-is-positive"
intent = "Zero counts as a positive value, so a zero capacity configures a policy."
file = "service_http/infrastructure/numbers.py"
old = '    return value if value > 0 else None'
new = '    return value if value >= 0 else None'

