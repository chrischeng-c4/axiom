id = "M21-newline-in-a-label-value-is-not-escaped"
intent = "a label value carrying a newline ends the line early, so one sample becomes two rows and the second is attacker-shaped"
file = "metrics_prometheus/domain/escaping.py"
old = """        elif ch == "\\n":
            out.append("\\\\n")"""
new = """        elif ch == "\\n":
            out.append("\\n")"""
