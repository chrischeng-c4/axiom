# Seeded defects for `scripts/td-ec-verify.py --mutations`.
#
# Controller-owned. Kept OUTSIDE `libs/metrics-prometheus/` so it is never part
# of the material handed to an implementation worker: a worker that can read the
# seeded defects can special-case them instead of writing a contract that
# catches them on principle.
#
# Each mutation rewrites one anchor in
# `libs/metrics-prometheus/tech-design/src/metrics_prometheus/` into a plausible
# wrong implementation. At least one EC case must exit nonzero for every one of
# them. A mutation that no case notices is a hole in the EC, never a licence to
# delete the mutation.
#
# `old` must be a unique substring of the named file; the harness restores the
# original bytes after each run.
#
# Coverage plan — every one of the six cases owns at least three seeds:
#
#   lock-free-accumulation-behavior      M01 M02 M03 M04
#   lock-free-accumulation-security      M05 M06 M07
#   exposition-encoding-behavior         M08 M09 M10 M11
#   exposition-encoding-security         M12 M13 M14 M15
#   label-value-containment-behavior     M16 M17 M18
#   label-value-containment-security     M19 M20 M21

# ---------------------------------------------------------------------------
# lock-free accumulation — which cell moves, by how much, and in what order
# ---------------------------------------------------------------------------

[[mutation]]
id = "M01-bucket-assignment-excludes-its-own-bound"
intent = "the boundary value falls into the next bucket up, so every histogram reports one observation in the wrong row exactly at the bound"
file = "metrics_prometheus/domain/bucket.py"
old = "        if value <= bucket.upper_bound:"
new = "        if value < bucket.upper_bound:"

[[mutation]]
id = "M02-cumulative-reports-per-bucket-counts"
intent = "the cumulative pass returns the raw counts, which is indistinguishable from correct whenever only the first bucket was ever hit"
file = "metrics_prometheus/domain/bucket.py"
old = """    running = 0
    out: list[int] = []
    for c in counts:
        running += c
        out.append(running)
    return tuple(out)"""
new = """    out: list[int] = []
    for c in counts:
        out.append(c)
    return tuple(out)"""

[[mutation]]
id = "M03-observe-touches-the-count-before-the-sum"
intent = "the count is raised before the sum, so a reader that samples between the two ops sees a mean that is too small rather than too large"
file = "metrics_prometheus/application/accumulators.py"
old = """        self._sum.add(value)
        self._count.add(1)

    def bucket_counts"""
new = """        self._count.add(1)
        self._sum.add(value)

    def bucket_counts"""

[[mutation]]
id = "M04-counter-increment-is-a-store"
intent = "`incr` writes 1 instead of adding 1, so a counter under concurrent increment stays pinned at one"
file = "metrics_prometheus/application/accumulators.py"
old = """    def incr(self) -> None:
        self._cell.add(1)"""
new = """    def incr(self) -> None:
        self._cell.store(1)"""

[[mutation]]
id = "M05-counter-accepts-a-negative-delta"
intent = "a counter can be walked backwards, which breaks the monotonicity every rate() computation over this series assumes"
file = "metrics_prometheus/application/accumulators.py"
old = """        if delta < 0:
            raise ValueError("Counter delta cannot be negative")
"""
new = ""

[[mutation]]
id = "M06-overflow-observation-lands-in-the-last-bucket"
intent = "a value above every bound is clamped into the top bucket, so the bucket rows claim to have bounded an observation they never bounded"
file = "metrics_prometheus/application/accumulators.py"
old = """        index = assign(self.bounds, value)
        if index is not None:
            self._buckets[index].add(1)"""
new = """        index = assign(self.bounds, value)
        if index is None:
            index = len(self.bounds) - 1
        self._buckets[index].add(1)"""

[[mutation]]
id = "M07-overflow-observation-skips-the-total"
intent = "an out-of-range observation is dropped entirely, so the histogram silently under-reports exactly the outliers it exists to expose"
file = "metrics_prometheus/application/accumulators.py"
old = """        if index is not None:
            self._buckets[index].add(1)
        self._sum.add(value)
        self._count.add(1)"""
new = """        if index is None:
            return
        self._buckets[index].add(1)
        self._sum.add(value)
        self._count.add(1)"""

# ---------------------------------------------------------------------------
# exposition encoding — the bytes on the wire and the arithmetic behind them
# ---------------------------------------------------------------------------

[[mutation]]
id = "M08-lines-joined-without-a-terminator"
intent = "the last line loses its newline, which a lenient scraper tolerates and a strict one rejects for the whole response"
file = "metrics_prometheus/application/exposition.py"
old = """        lines.append(f"{s.name} {s.value}")
    return "".join(line + "\\n" for line in lines)"""
new = """        lines.append(f"{s.name} {s.value}")
    return "\\n".join(lines)"""

[[mutation]]
id = "M09-type-line-precedes-help"
intent = "the two metadata lines are emitted in the reverse of the documented order, which most parsers accept and the exposition format does not promise"
file = "metrics_prometheus/application/exposition.py"
old = """        lines.append(f"# HELP {s.name} {s.help}")
        lines.append(f"# TYPE {s.name} {s.kind.value}")"""
new = """        lines.append(f"# TYPE {s.name} {s.kind.value}")
        lines.append(f"# HELP {s.name} {s.help}")"""

[[mutation]]
id = "M10-inf-row-reads-the-last-cumulative-bucket"
intent = "the `+Inf` row repeats the top bucket instead of the total, so it agrees with the count on every histogram that never saw an outlier"
file = "metrics_prometheus/application/exposition.py"
old = """    lines.append(f'{name}_bucket{{le="+Inf"}} {histogram.count()}')"""
new = """    lines.append(f'{name}_bucket{{le="+Inf"}} {cumulative(histogram.bucket_counts())[-1]}')"""

[[mutation]]
id = "M11-histogram-bucket-rows-are-not-cumulative"
intent = "each bucket row carries its own count rather than the running total, which reads plausibly and makes every quantile wrong"
file = "metrics_prometheus/application/exposition.py"
old = "    for bucket, running in zip(histogram.bounds, cumulative(histogram.bucket_counts())):"
new = "    for bucket, running in zip(histogram.bounds, histogram.bucket_counts()):"

[[mutation]]
id = "M12-scaling-goes-through-a-float"
intent = "the decimal is produced by float division, which is exact for small values and silently lossy past 2**53"
file = "metrics_prometheus/domain/scaling.py"
old = '    return f"{value // divisor}.{value % divisor:0{places}d}"'
new = '    return f"{value / divisor:.{places}f}"'

[[mutation]]
id = "M13-remainder-loses-its-leading-zeros"
intent = "a remainder of 1 over 1000 renders as `0.1` instead of `0.001`, which is a thousand-fold error that looks like a formatting nit"
file = "metrics_prometheus/domain/scaling.py"
old = '    return f"{value // divisor}.{value % divisor:0{places}d}"'
new = '    return f"{value // divisor}.{value % divisor}"'

[[mutation]]
id = "M14-non-decimal-divisor-still-gets-a-fraction"
intent = "a divisor that is not a power of ten is formatted as though it were, so the digits after the point are not a decimal fraction of anything"
file = "metrics_prometheus/domain/scaling.py"
old = """    if divisor <= 1 or remaining != 1:
        return str(value // max(divisor, 1))"""
new = """    if divisor <= 1:
        return str(value // max(divisor, 1))"""

[[mutation]]
id = "M15-zero-divisor-divides"
intent = "the guard that keeps a zero divisor from dividing is dropped, turning a rendering call into a raised exception on the scrape path"
file = "metrics_prometheus/domain/scaling.py"
old = "        return str(value // max(divisor, 1))"
new = "        return str(value // divisor)"

