intent = "an unlabelled sample gains a `{}` suffix, which some parsers treat as a distinct series from the bare name"
file = "metrics_prometheus/application/exposition.py"
old = """    if not labels:
        return ""
"""
new = ""

[[mutation]]
id = "M18-label-ordering-ignores-the-value"
intent = "two labels sharing a name order nondeterministically, so a repeated name produces an unstable line"
file = "metrics_prometheus/domain/label_order.py"
old = "    return tuple(sorted(labels, key=lambda l: (l.name, l.value)))"
new = "    return tuple(sorted(labels, key=lambda l: l.name))"

[[mutation]]
id = "M19-quote-in-a-label-value-is-not-escaped"
intent = "a label value carrying a double quote closes the quoted field early, so the remainder of the value is parsed as label syntax"
file = "metrics_prometheus/domain/escaping.py"
old = """        elif ch == '"':
            out.append('\\\\"')"""
new = """        elif ch == '"':
            out.append('"')"""

[[mutation]]
id = "M20-escaping-runs-as-a-replace-chain-in-the-wrong-order"
intent = "quotes are escaped before backslashes, so the backslash the quote rule just emitted is doubled by the backslash rule and `a\"b` renders as `a\\\\\"b`"
file = "metrics_prometheus/domain/escaping.py"
old = """    out: list[str] = []
    for ch in value:
        if ch == "\\\\":
            out.append("\\\\\\\\")
        elif ch == '"':
            out.append('\\\\"')
        elif ch == "\\n":
            out.append("\\\\n")
        else:
            out.append(ch)
    return "".join(out)"""
new = """    return value.replace('"', '\\\\"').replace("\\\\", "\\\\\\\\").replace("\\n", "\\\\n")"""

