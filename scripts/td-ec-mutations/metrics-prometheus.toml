file = "metrics_prometheus/application/exposition.py"
old = "    parts = [f'{l.name}=\"{escape_label_value(l.value)}\"' for l in canonical(labels)]"
new = "    parts = [f'{l.name}=\"{escape_label_value(l.value)}\"' for l in labels]"

[[mutation]]
