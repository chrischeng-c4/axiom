# Seeded defects for `scripts/td-ec-verify.py --mutations`.
#
# Controller-owned. This file is deliberately kept OUTSIDE
# `libs/storage-durable/` so it is never part of the material handed to an
# implementation worker: a worker that can read the seeded defects can
# special-case them instead of writing a contract that catches them on
# principle.
#
# Each mutation rewrites one anchor in
# `libs/storage-durable/tech-design/src/storage_durable/` into a plausible wrong
# implementation. At least one EC case must exit nonzero for every one of them.
# A mutation that no case notices is a hole in the EC, never a licence to delete
# the mutation.
#
# `old` must be a unique substring of the named file; the harness restores the
# original bytes after each run.
#
# Not seeded here, deliberately: the rule that `read_frame_at` compares the
# declared length against the remaining buffer *before* slicing. Python clamps
# an over-long slice, so the safe and the unsafe order produce identical
# observations from outside the process. That rule is held by a controller-side
# AST check, not by the contract, because a contract cannot honestly claim to
# observe something the language hides.
#
# Coverage plan — every one of the six cases owns at least three seeds, so a
# case that is green while blind shows up as an unbalanced catch count rather
# than as a single lucky detection:
#
#   crash-safe-replacement-behavior        M01 M02 M03 M04
#   crash-safe-replacement-security        M05 M06 M07
#   torn-tail-recovery-behavior            M08 M09 M10 M11
#   torn-tail-recovery-security            M12 M13 M14 M15
#   sequence-ordered-snapshots-behavior    M16 M17 M18
#   sequence-ordered-snapshots-security    M19 M20 M21 M22

# ---------------------------------------------------------------------------
# crash-safe replacement — where the bytes go, in what order, and under which
# policy
# ---------------------------------------------------------------------------

[[mutation]]
id = "M01-staging-suffix-renamed"
intent = "the staging file is named `.staging` instead of `.tmp`, so a crash leaves litter no cleanup path recognises"
file = "storage_durable/domain/pathing.py"
old = 'STAGING_SUFFIX: Final[str] = ".tmp"'
new = 'STAGING_SUFFIX: Final[str] = ".staging"'

[[mutation]]
id = "M02-rename-before-flush"
intent = "the rename is committed before the payload is forced, so the directory entry can survive a crash the file contents did not"
file = "storage_durable/application/durable_replace.py"
old = """        if request.policy.forces_stable_storage():
            self._filesystem.sync_file(staging)
        self._filesystem.rename(staging, request.path)"""
new = """        self._filesystem.rename(staging, request.path)
        if request.policy.forces_stable_storage():
            self._filesystem.sync_file(staging)"""

[[mutation]]
id = "M03-file-flush-uses-the-streaming-policy-question"
intent = "the one-shot replacement asks the per-append question, so every policy but `always` silently stops forcing the payload"
file = "storage_durable/application/durable_replace.py"
old = """        if request.policy.forces_stable_storage():
            self._filesystem.sync_file(staging)"""
new = """        if request.policy.should_sync_immediately():
            self._filesystem.sync_file(staging)"""

[[mutation]]
id = "M04-parent-directory-never-created"
intent = "the target's directory is assumed to exist, which is true in every test that ran before it and false on a fresh node"
file = "storage_durable/application/durable_replace.py"
old = """        parent = parent_directory(request.path)
        if parent != "":
            self._filesystem.make_directories(parent)"""
new = """        parent = parent_directory(request.path)
        if False:
            self._filesystem.make_directories(parent)"""

[[mutation]]
id = "M05-stale-staging-file-not-discarded"
intent = "the staging path is written without first being cleared, so bytes from an earlier interrupted write stay reachable under the name the next rename will publish"
file = "storage_durable/application/durable_replace.py"
old = """        self._filesystem.remove(staging)
        self._filesystem.write(staging, request.payload)"""
new = """        self._filesystem.write(staging, request.payload)"""

[[mutation]]
id = "M06-real-io-failure-swallowed"
intent = "a genuine I/O error on the directory flush joins the tolerated set, so a durability failure is reported as success"
file = "storage_durable/domain/failure.py"
old = "    {FailureKind.PERMISSION_DENIED, FailureKind.UNSUPPORTED, FailureKind.OTHER}"
new = "    {FailureKind.PERMISSION_DENIED, FailureKind.UNSUPPORTED, FailureKind.OTHER, FailureKind.IO}"

[[mutation]]
id = "M07-every-directory-failure-tolerated"
intent = "the tolerance test degenerates to always-true, so a missing directory is indistinguishable from an unflushable one"
file = "storage_durable/domain/failure.py"
old = "    return kind in TOLERATED_DIRECTORY_SYNC_FAILURES"
new = "    return True"

# ---------------------------------------------------------------------------
# torn-tail recovery — the frame codec, the replay boundary, and what recovery
# is allowed to do to the file
# ---------------------------------------------------------------------------

[[mutation]]
id = "M08-header-field-order-swapped"
intent = "the header is written length-first, which is self-consistent within one process and unreadable by any log written before the change"
file = "storage_durable/domain/frame.py"
old = 'return struct.pack("<QII", seq, payload_length, crc)'
new = 'return struct.pack("<IIQ", payload_length, crc, seq)'

[[mutation]]
id = "M09-header-decoded-big-endian"
intent = "the reader decodes network byte order, so a sequence of 1 reads back as an astronomically large number"
file = "storage_durable/domain/frame.py"
old = 'seq, payload_length, crc = struct.unpack("<QII", header)'
new = 'seq, payload_length, crc = struct.unpack(">QII", header)'

[[mutation]]
id = "M10-replay-boundary-inclusive"
intent = "replay returns the frame it was told it already has, so a resuming reader reapplies its last record"
file = "storage_durable/domain/log_scan.py"
old = "return tuple(f for f in frames if f.seq > from_seq)"
new = "return tuple(f for f in frames if f.seq >= from_seq)"

[[mutation]]
id = "M11-replay-reports-the-whole-log"
intent = "the reported high-water mark comes from every admitted frame rather than the ones returned, so a caller that trusts it skips records it never saw"
file = "storage_durable/application/framed_log.py"
old = "return (selected, highest_seq(selected))"
new = "return (selected, highest_seq(result.frames))"

[[mutation]]
id = "M12-checksum-never-verified"
intent = "the stored checksum is decoded and then ignored, so silently corrupted payload bytes are handed to the caller as good data"
file = "storage_durable/domain/frame.py"
old = "    if checksum(payload) != stored_crc:"
new = "    if False:"

[[mutation]]
id = "M13-scan-resynchronises-past-damage"
intent = "the scan walks forward a byte at a time looking for the next parsable frame instead of ending the log, which repairs rather than refuses and makes two readers disagree"
file = "storage_durable/domain/log_scan.py"
old = """        if isinstance(outcome, FrameRejection):
            return ScanResult(tuple(frames), offset, outcome)"""
new = """        if isinstance(outcome, FrameRejection):
            offset += 1
            if offset >= len(buffer):
                return ScanResult(tuple(frames), offset, outcome)
            continue"""

[[mutation]]
id = "M14-damaged-tail-left-in-place"
intent = "the reopen truncates to the length it already had, so the next append lands after a partial frame"
file = "storage_durable/application/framed_log.py"
old = "            self._filesystem.truncate(path, result.good_end)"
new = "            self._filesystem.truncate(path, original_len)"

[[mutation]]
id = "M15-undamaged-log-truncated-anyway"
intent = "every reopen issues a truncate, which is a write on a path the promise says recovery only reads and shortens"
file = "storage_durable/application/framed_log.py"
old = "        if result.good_end < original_len:"
new = "        if True:"

