steps:
  - id: sift
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=acceptance/gcp/images/Dockerfile.sift
      - --build-arg=SOURCE_REVISION=${_GIT_SHA}
      - --tag=${_REGISTRY}/sift:${_TAG}
      - .

images:
  - ${_REGISTRY}/sift:${_TAG}

tags:
  - axiom-gcp-operator-acceptance
  - axiom-run-${_RUN_ID}

timeout: 2700s

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
