steps:
  - id: sift
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=acceptance/gcp/images/Dockerfile.sift
      - --tag=${_REGISTRY}/sift:${_TAG}
      - .
  - id: rig
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=acceptance/gcp/images/Dockerfile.rig
      - --tag=${_REGISTRY}/rig:${_TAG}
      - .

images:
  - ${_REGISTRY}/sift:${_TAG}
  - ${_REGISTRY}/rig:${_TAG}

timeout: 5400s

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
