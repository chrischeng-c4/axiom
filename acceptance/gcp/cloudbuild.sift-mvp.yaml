steps:
  - id: sift
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=acceptance/gcp/images/Dockerfile.sift
      - --build-arg=SOURCE_REVISION=${_GIT_SHA}
      - --tag=${_REGISTRY}/sift:${_TAG}
      - .
  - id: rig
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=acceptance/gcp/images/Dockerfile.rig
      - --tag=${_REGISTRY}/rig:${_TAG}
      - .
  - id: acceptance-runner
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=acceptance/gcp/images/Dockerfile.sift-acceptance-runner
      - --build-arg=SOURCE_REVISION=${_GIT_SHA}
      - --tag=${_REGISTRY}/sift-acceptance-runner:${_TAG}
      - .

images:
  - ${_REGISTRY}/sift:${_TAG}
  - ${_REGISTRY}/rig:${_TAG}
  - ${_REGISTRY}/sift-acceptance-runner:${_TAG}

tags:
  - axiom-gcp-operator-acceptance
  - sift-mvp
  - axiom-run-${_RUN_ID}
  - axiom-source-${_SOURCE_BUNDLE_SHA256}
  - axiom-acquisition-${_CANDIDATE_ACQUISITION_ID}

timeout: 5400s

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
