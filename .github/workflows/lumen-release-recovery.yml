name: lumen-release-recovery

on:
  workflow_dispatch:

concurrency:
  group: lumen-release-promotion-0.4.28
  cancel-in-progress: false

permissions:
  actions: read
  attestations: read
  contents: write
  packages: write
  pull-requests: read

jobs:
  recover:
    name: recover lumen@0.4.28 from frozen candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b1cbee3fcee0bfff54c425fe0f605b54125f4740
          fetch-depth: 0
      - name: Refuse non-main or workflow-identity dispatch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_REPOSITORY" == chrischeng-c4/axiom ]]
          [[ "$GITHUB_WORKFLOW_REF" == "chrischeng-c4/axiom/.github/workflows/lumen-release-recovery.yml@refs/heads/main" ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor b1cbee3fcee0bfff54c425fe0f605b54125f4740 origin/main
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Revalidate frozen candidate immediately before stable writes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          apps/lumen/scripts/verify-release-artifacts.sh \
            --repo chrischeng-c4/axiom \
            --tag lumen@0.4.28 \
            --commit b1cbee3fcee0bfff54c425fe0f605b54125f4740 \
            --candidate-run-id 32974297012 \
            --mode candidate \
            --output promotion-contract.json
          tag_object="$(gh api repos/chrischeng-c4/axiom/git/ref/tags/lumen@0.4.28 --jq '.object.sha')"
          [[ "$tag_object" == 5b7b4d9a8b8b5596cb9fcfa149008a8f1313da82 ]]
          jq -e --arg commit b1cbee3fcee0bfff54c425fe0f605b54125f4740 --arg run 32974297012 \
            --arg root sha256:59a85c96d807428c424ec8889ac830b14e02869da49c4b44ae12dcce3786d03d \
            --arg amd64 sha256:754b3c53b849f1a6de94897fe11d796d1ede0120ac9aa2e3d226f1edf08e7b00 \
            --arg arm64 sha256:0b15b56db206ce2a7d9e832b829fceb88acaa28656d21f0e28f731b41bb5580f \
            '.candidate_attempt == "1" and .commit == $commit and .candidate_run_id == $run and .root_digest == $root and .amd64_digest == $amd64 and .arm64_digest == $arm64' \
            promotion-contract.json >/dev/null
      - name: Inspect existing release and image tags
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          query='query($owner:String!, $name:String!, $tag:String!) { repository(owner:$owner, name:$name) { release(tagName:$tag) { id } } }'
          release="$(gh api graphql -f query="$query" -f owner=chrischeng-c4 -f name=axiom -f tag='lumen@0.4.28')"
          if [[ "$(jq -r '.data.repository.release | if . == null then "absent" else "present" end' <<<"$release")" == present ]]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'exists=false' >> "$GITHUB_OUTPUT"
      - name: Public-verify existing release only
        if: steps.state.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apps/lumen/scripts/verify-release-artifacts.sh --repo chrischeng-c4/axiom --tag lumen@0.4.28 --commit b1cbee3fcee0bfff54c425fe0f605b54125f4740 --candidate-run-id 32974297012 --mode public --output public-contract.json
      - name: Download exact candidate release bytes
        if: steps.state.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 32974297012 --repo "$GITHUB_REPOSITORY" --name lumen-release-candidate-32974297012-1 --dir candidate
          test -f candidate/lumen-aarch64-apple-darwin.tar.gz
          test -f candidate/lumen-aarch64-apple-darwin.tar.gz.sha256
          test -f candidate/lumen-x86_64-unknown-linux-gnu.tar.gz
          test -f candidate/lumen-x86_64-unknown-linux-gnu.tar.gz.sha256
          test -f candidate/lumen-aarch64-unknown-linux-gnu.tar.gz
          test -f candidate/lumen-aarch64-unknown-linux-gnu.tar.gz.sha256
          test -f candidate/lumen-x86_64-unknown-linux-musl.tar.gz
          test -f candidate/lumen-x86_64-unknown-linux-musl.tar.gz.sha256
          test -f candidate/lumen-aarch64-unknown-linux-musl.tar.gz
          test -f candidate/lumen-aarch64-unknown-linux-musl.tar.gz.sha256
          test -f candidate/spdx-amd64.json
          test -f candidate/spdx-arm64.json
      - name: Promote exact frozen digest
        if: steps.state.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apps/lumen/scripts/verify-release-artifacts.sh --repo chrischeng-c4/axiom --tag lumen@0.4.28 --commit b1cbee3fcee0bfff54c425fe0f605b54125f4740 --candidate-run-id 32974297012 --mode candidate --output promotion-contract-before-write.json
          jq -e --arg commit b1cbee3fcee0bfff54c425fe0f605b54125f4740 --arg run 32974297012 --arg root sha256:59a85c96d807428c424ec8889ac830b14e02869da49c4b44ae12dcce3786d03d --arg amd64 sha256:754b3c53b849f1a6de94897fe11d796d1ede0120ac9aa2e3d226f1edf08e7b00 --arg arm64 sha256:0b15b56db206ce2a7d9e832b829fceb88acaa28656d21f0e28f731b41bb5580f '(.candidate_attempt == "1" and .commit == $commit and .candidate_run_id == $run and .root_digest == $root and .amd64_digest == $amd64 and .arm64_digest == $arm64)' promotion-contract-before-write.json >/dev/null
          digest_or_absent() {
            local ref="$1" out status
            set +e
            out="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>/tmp/lumen-image-error)"
            status=$?
            set -e
            if [[ "$status" == 0 ]]; then jq -er '.digest' <<<"$out"; return; fi
            grep -Eqi 'manifest unknown|not found' /tmp/lumen-image-error && return 0
            cat /tmp/lumen-image-error >&2
            exit 1
          }
          semver="$(digest_or_absent ghcr.io/chrischeng-c4/lumen:0.4.28)"
          [[ -z "$semver" || "$semver" == sha256:59a85c96d807428c424ec8889ac830b14e02869da49c4b44ae12dcce3786d03d ]]
          root=ghcr.io/chrischeng-c4/lumen@sha256:59a85c96d807428c424ec8889ac830b14e02869da49c4b44ae12dcce3786d03d
          if [[ -z "$semver" ]]; then
            docker buildx imagetools create --tag ghcr.io/chrischeng-c4/lumen:0.4.28 "$root"
            [[ "$(docker buildx imagetools inspect ghcr.io/chrischeng-c4/lumen:0.4.28 --format '{{json .Manifest}}' | jq -er '.digest')" == "sha256:59a85c96d807428c424ec8889ac830b14e02869da49c4b44ae12dcce3786d03d" ]] || { echo "semver tag did not bind frozen root" >&2; exit 1; }
          fi
          latest="$(digest_or_absent ghcr.io/chrischeng-c4/lumen:latest)"
          [[ "$latest" == sha256:59a85c96d807428c424ec8889ac830b14e02869da49c4b44ae12dcce3786d03d || "$latest" == sha256:4a5748848d384b2fa56b130b48976c309942dcd9e613e000da7f89a7c858cff4 ]]
          if [[ "$latest" == sha256:4a5748848d384b2fa56b130b48976c309942dcd9e613e000da7f89a7c858cff4 ]]; then
            [[ "$(docker buildx imagetools inspect ghcr.io/chrischeng-c4/lumen:0.4.27 --format '{{json .Manifest}}' | jq -er '.digest')" == "sha256:4a5748848d384b2fa56b130b48976c309942dcd9e613e000da7f89a7c858cff4" ]] || { echo "published 0.4.27 root changed" >&2; exit 1; }
            latest="$(digest_or_absent ghcr.io/chrischeng-c4/lumen:latest)"
            [[ "$latest" == sha256:4a5748848d384b2fa56b130b48976c309942dcd9e613e000da7f89a7c858cff4 ]] || { echo "latest changed before write" >&2; exit 1; }
            docker buildx imagetools create --tag ghcr.io/chrischeng-c4/lumen:latest "$root"
            [[ "$(docker buildx imagetools inspect ghcr.io/chrischeng-c4/lumen:latest --format '{{json .Manifest}}' | jq -er '.digest')" == "sha256:59a85c96d807428c424ec8889ac830b14e02869da49c4b44ae12dcce3786d03d" ]] || { echo "latest tag did not bind frozen root" >&2; exit 1; }
          fi
      - name: Create exact GitHub Release
        if: steps.state.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          # lumen@0.4.28

          - Source commit: b1cbee3fcee0bfff54c425fe0f605b54125f4740
          - Pull request: https://github.com/chrischeng-c4/axiom/pull/3923
          - Candidate run: https://github.com/chrischeng-c4/axiom/actions/runs/32974297012/attempts/1
          - Promotion run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT
          - Recovery note: promotion run 32980139617 failed before public writes because of a jq precedence error; this recovery run revalidated and published the same frozen candidate.
          - Root index digest: sha256:59a85c96d807428c424ec8889ac830b14e02869da49c4b44ae12dcce3786d03d
          - linux/amd64 digest: sha256:754b3c53b849f1a6de94897fe11d796d1ede0120ac9aa2e3d226f1edf08e7b00
          - linux/arm64 digest: sha256:0b15b56db206ce2a7d9e832b829fceb88acaa28656d21f0e28f731b41bb5580f
          - Release path: landed main -> untagged candidate verification -> protected annotated tag -> promotion of the same candidate digest.
          - Placement path: a non-empty nodeSelector with the default initialMachineType skips the legacy capacity catalog.
          - Legacy placement path: an empty selector, tolerations-only placement, or a non-default initialMachineType still requires lumen-system/lumen-capacity-catalog.
          - Compatibility: no API, CRD, or runtime-default migration.
          EOF
          gh release create lumen@0.4.28 --repo "$GITHUB_REPOSITORY" --target b1cbee3fcee0bfff54c425fe0f605b54125f4740 --title lumen@0.4.28 --notes-file release-notes.md \
            candidate/lumen-aarch64-apple-darwin.tar.gz candidate/lumen-aarch64-apple-darwin.tar.gz.sha256 \
            candidate/lumen-x86_64-unknown-linux-gnu.tar.gz candidate/lumen-x86_64-unknown-linux-gnu.tar.gz.sha256 \
            candidate/lumen-aarch64-unknown-linux-gnu.tar.gz candidate/lumen-aarch64-unknown-linux-gnu.tar.gz.sha256 \
            candidate/lumen-x86_64-unknown-linux-musl.tar.gz candidate/lumen-x86_64-unknown-linux-musl.tar.gz.sha256 \
            candidate/lumen-aarch64-unknown-linux-musl.tar.gz candidate/lumen-aarch64-unknown-linux-musl.tar.gz.sha256 \
            candidate/spdx-amd64.json candidate/spdx-arm64.json
      - name: Publicly verify recovered release
        if: steps.state.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apps/lumen/scripts/verify-release-artifacts.sh --repo chrischeng-c4/axiom --tag lumen@0.4.28 --commit b1cbee3fcee0bfff54c425fe0f605b54125f4740 --candidate-run-id 32974297012 --mode public --output public-contract.json
