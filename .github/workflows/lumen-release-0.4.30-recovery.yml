name: lumen-release-0.4.30-recovery

on:
  workflow_dispatch:

concurrency:
  group: lumen-release-promotion-0.4.30
  cancel-in-progress: false

permissions:
  actions: read
  attestations: read
  contents: write
  packages: write
  pull-requests: read

jobs:
  recover:
    name: recover lumen@0.4.30 from frozen candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1130302c7caaf7a1798e1ce544a82859528f77e0
          fetch-depth: 0
      - name: Refuse non-main or workflow-identity dispatch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_REPOSITORY" == chrischeng-c4/axiom ]]
          [[ "$GITHUB_WORKFLOW_REF" == "chrischeng-c4/axiom/.github/workflows/lumen-release-0.4.30-recovery.yml@refs/heads/main" ]]
          git fetch --no-tags origin main
          [[ "$GITHUB_SHA" == "$(git rev-parse origin/main)" ]]
          git merge-base --is-ancestor 1130302c7caaf7a1798e1ce544a82859528f77e0 origin/main
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Decode and bind frozen standalone GKE receipt
        id: gke_receipt
        shell: bash
        env:
          RECEIPT_B64: 
          SIDECAR_B64: YTA0NTMyYTExMzA1ZWUzOTQzYzRiMzYzZTEyYTJmOTQzY2MwN2NjOWFkYjY5NjU5ZWRiZGQ0ZDE0ZDlkNDQ3YyAgbHVtZW4tc3RhbmRhbG9uZS1na2UtcmVjZWlwdC5qc29uCg==
        run: |
          set -euo pipefail
          canonical_b64() {
            local value="$1"
            [[ "$value" =~ ^[A-Za-z0-9+/]+={0,2}$ && $((${#value} % 4)) -eq 0 ]]
          }
          canonical_b64 "$RECEIPT_B64"
          canonical_b64 "$SIDECAR_B64"
          mkdir -p gke-receipt
          printf '%s' "$RECEIPT_B64" | base64 --decode > gke-receipt/lumen-standalone-gke-receipt.json
          printf '%s' "$SIDECAR_B64" | base64 --decode > gke-receipt/lumen-standalone-gke-receipt.json.sha256
          [[ "$(sha256sum gke-receipt/lumen-standalone-gke-receipt.json | awk '{print $1}')" == a04532a11305ee3943c4b363e12a2f943cc07cc9adb69659edbdd4d14d9d447c ]]
          [[ "$(sha256sum gke-receipt/lumen-standalone-gke-receipt.json.sha256 | awk '{print $1}')" == f626012691b2b9cb6f0cb0ee3d5f279ef62dd0d3e3f6ac8cc0b035266a6c6c6b ]]
          [[ "$(cat gke-receipt/lumen-standalone-gke-receipt.json.sha256)" == "a04532a11305ee3943c4b363e12a2f943cc07cc9adb69659edbdd4d14d9d447c  lumen-standalone-gke-receipt.json" ]]
          {
            echo "receipt=$PWD/gke-receipt/lumen-standalone-gke-receipt.json"
            echo "sidecar=$PWD/gke-receipt/lumen-standalone-gke-receipt.json.sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Revalidate frozen tag candidate receipt and failed promotion proof
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apps/lumen/scripts/verify-release-artifacts.sh \
            --repo chrischeng-c4/axiom \
            --tag lumen@0.4.30 \
            --commit 1130302c7caaf7a1798e1ce544a82859528f77e0 \
            --candidate-run-id 33323799806 \
            --mode candidate \
            --standalone-gke-receipt "${{ steps.gke_receipt.outputs.receipt }}" \
            --standalone-gke-receipt-sidecar "${{ steps.gke_receipt.outputs.sidecar }}" \
            --output promotion-contract.json
          tag_ref="$(gh api repos/chrischeng-c4/axiom/git/ref/tags/lumen%400.4.30)"
          [[ "$(jq -r '.object.type' <<<"$tag_ref")" == tag ]]
          [[ "$(jq -r '.object.sha' <<<"$tag_ref")" == e7456d237b3310b17fd2bd92d9682eb6467512ae ]]
          [[ "$(gh api repos/chrischeng-c4/axiom/git/tags/e7456d237b3310b17fd2bd92d9682eb6467512ae --jq '.object.sha')" == 1130302c7caaf7a1798e1ce544a82859528f77e0 ]]
          jq -e --arg commit 1130302c7caaf7a1798e1ce544a82859528f77e0 --arg run 33323799806 --arg root sha256:daad8be5af9950a3aa34525f0e81168864f0453eee72e8816d9644298e2ece24 --arg amd64 sha256:8e4b4ed085930ce8f474797e80c05f43ca93a6be847448c7bdc9037609ef9d2c --arg arm64 sha256:b27bf1ffc7a6f59082eef85f739fd3e15e08e38106a312f3614dd02c4fcc122a --arg receipt a04532a11305ee3943c4b363e12a2f943cc07cc9adb69659edbdd4d14d9d447c '(.candidate_attempt == "1" and .commit == $commit and .candidate_run_id == $run and .root_digest == $root and .amd64_digest == $amd64 and .arm64_digest == $arm64 and .standalone_gke_receipt_sha256 == $receipt)' promotion-contract.json >/dev/null
          failed="$(gh api repos/chrischeng-c4/axiom/actions/runs/33328319889)"
          jq -e --arg commit 1130302c7caaf7a1798e1ce544a82859528f77e0 '.id == 33328319889 and .run_attempt == 1 and .event == "workflow_dispatch" and .head_branch == "lumen@0.4.30" and .head_sha == $commit and .status == "completed" and .conclusion == "failure" and .path == ".github/workflows/lumen-release.yml"' <<<"$failed" >/dev/null
          gh api --paginate 'repos/chrischeng-c4/axiom/actions/runs/33328319889/attempts/1/jobs?per_page=100' | jq -cs '[.[] | .jobs[]]' > failed-promotion-jobs.json
          jq -e 'length == 2 and ([.[] | [.name,.conclusion]] | sort) == [["promote exact candidate root and publish release","failure"],["prove immutable tag and candidate receipt","success"]] and any(.[]; .name == "prove immutable tag and candidate receipt" and any(.steps[]; .name == "Verify tag ruleset, candidate receipt, and supply chain" and .conclusion == "success") and any(.steps[]; .name == "Export immutable candidate contract" and .conclusion == "success")) and any(.[]; .name == "promote exact candidate root and publish release" and any(.steps[]; .name == "Re-query exact candidate immediately before stable writes" and .conclusion == "success") and any(.steps[]; .name == "Download exact candidate release bytes" and .conclusion == "success") and any(.steps[]; .name == "Promote exact root digest to semver and safe latest" and .conclusion == "failure") and any(.steps[]; .name == "Create exact GitHub Release with candidate bytes" and .conclusion == "skipped") and any(.steps[]; .name == "Publicly verify immutable tag, release bytes, and promoted image" and .conclusion == "skipped"))' failed-promotion-jobs.json >/dev/null
      - name: Inspect existing release
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          query='query($owner:String!, $name:String!, $tag:String!) { repository(owner:$owner, name:$name) { release(tagName:$tag) { id } } }'
          release="$(gh api graphql -f query="$query" -f owner=chrischeng-c4 -f name=axiom -f tag='lumen@0.4.30')"
          if [[ "$(jq -r '.data.repository.release | if . == null then "absent" else "present" end' <<<"$release")" == present ]]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Public-verify existing release only
        if: steps.state.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apps/lumen/scripts/verify-release-artifacts.sh --repo chrischeng-c4/axiom --tag lumen@0.4.30 --commit 1130302c7caaf7a1798e1ce544a82859528f77e0 --candidate-run-id 33323799806 --mode public --standalone-gke-receipt "${{ steps.gke_receipt.outputs.receipt }}" --standalone-gke-receipt-sidecar "${{ steps.gke_receipt.outputs.sidecar }}" --output public-contract.json
      - name: Download exact candidate release bytes
        if: steps.state.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 33323799806 --repo "$GITHUB_REPOSITORY" --name lumen-release-candidate-33323799806-1 --dir candidate
          for target in aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            test -f "candidate/lumen-${target}.tar.gz"
            test -f "candidate/lumen-${target}.tar.gz.sha256"
          done
          test -f candidate/spdx-amd64.json
          test -f candidate/spdx-arm64.json
      - name: Re-query and promote only exact frozen root
        if: steps.state.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apps/lumen/scripts/verify-release-artifacts.sh --repo chrischeng-c4/axiom --tag lumen@0.4.30 --commit 1130302c7caaf7a1798e1ce544a82859528f77e0 --candidate-run-id 33323799806 --mode candidate --standalone-gke-receipt "${{ steps.gke_receipt.outputs.receipt }}" --standalone-gke-receipt-sidecar "${{ steps.gke_receipt.outputs.sidecar }}" --output promotion-contract-before-write.json
          jq -e --arg commit 1130302c7caaf7a1798e1ce544a82859528f77e0 --arg run 33323799806 --arg root sha256:daad8be5af9950a3aa34525f0e81168864f0453eee72e8816d9644298e2ece24 --arg amd64 sha256:8e4b4ed085930ce8f474797e80c05f43ca93a6be847448c7bdc9037609ef9d2c --arg arm64 sha256:b27bf1ffc7a6f59082eef85f739fd3e15e08e38106a312f3614dd02c4fcc122a --arg receipt a04532a11305ee3943c4b363e12a2f943cc07cc9adb69659edbdd4d14d9d447c '(.candidate_attempt == "1" and .commit == $commit and .candidate_run_id == $run and .root_digest == $root and .amd64_digest == $amd64 and .arm64_digest == $arm64 and .standalone_gke_receipt_sha256 == $receipt)' promotion-contract-before-write.json >/dev/null
          digest_or_absent() {
            local ref="$1" error manifest status
            error="$(mktemp)"
            set +e
            manifest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>"$error")"
            status=$?
            set -e
            if [[ "$status" == 0 ]]; then
              rm -f "$error"
              jq -er '.digest' <<<"$manifest"
              return 0
            fi
            if grep -Eqi 'manifest unknown|not found' "$error"; then
              rm -f "$error"
              return 0
            fi
            cat "$error" >&2
            rm -f "$error"
            exit 1
          }
          root=ghcr.io/chrischeng-c4/lumen@sha256:daad8be5af9950a3aa34525f0e81168864f0453eee72e8816d9644298e2ece24
          semver="$(digest_or_absent ghcr.io/chrischeng-c4/lumen:0.4.30)"
          [[ -z "$semver" || "$semver" == sha256:daad8be5af9950a3aa34525f0e81168864f0453eee72e8816d9644298e2ece24 ]]
          latest="$(digest_or_absent ghcr.io/chrischeng-c4/lumen:latest)"
          [[ "$latest" == sha256:3d05b74f665f7ffbfabfc7d50a06c5a4de22ca881d373d433142c83692e7f6e5 || "$latest" == sha256:daad8be5af9950a3aa34525f0e81168864f0453eee72e8816d9644298e2ece24 ]]
          if [[ -z "$semver" ]]; then
            [[ -z "$(digest_or_absent ghcr.io/chrischeng-c4/lumen:0.4.30)" ]]
            docker buildx imagetools create --tag ghcr.io/chrischeng-c4/lumen:0.4.30 "$root"
          fi
          [[ "$(digest_or_absent ghcr.io/chrischeng-c4/lumen:0.4.30)" == sha256:daad8be5af9950a3aa34525f0e81168864f0453eee72e8816d9644298e2ece24 ]]
          if [[ "$latest" == sha256:3d05b74f665f7ffbfabfc7d50a06c5a4de22ca881d373d433142c83692e7f6e5 ]]; then
            [[ "$(digest_or_absent ghcr.io/chrischeng-c4/lumen:0.4.29)" == sha256:3d05b74f665f7ffbfabfc7d50a06c5a4de22ca881d373d433142c83692e7f6e5 ]]
            [[ "$(digest_or_absent ghcr.io/chrischeng-c4/lumen:latest)" == sha256:3d05b74f665f7ffbfabfc7d50a06c5a4de22ca881d373d433142c83692e7f6e5 ]]
            docker buildx imagetools create --tag ghcr.io/chrischeng-c4/lumen:latest "$root"
          fi
          [[ "$(digest_or_absent ghcr.io/chrischeng-c4/lumen:latest)" == sha256:daad8be5af9950a3aa34525f0e81168864f0453eee72e8816d9644298e2ece24 ]]
      - name: Create exact GitHub Release
        if: steps.state.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          # lumen@0.4.30

          - Source commit: 1130302c7caaf7a1798e1ce544a82859528f77e0
          - Pull request: https://github.com/chrischeng-c4/axiom/pull/3990
          - Candidate run: https://github.com/chrischeng-c4/axiom/actions/runs/33323799806/attempts/1
          - Promotion run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT
          - Recovery note: promotion run 33328319889 failed before public writes because the safe latest guard rejected the exact published 0.4.29 root; this recovery run revalidated and published the same frozen candidate.
          - Root index digest: sha256:daad8be5af9950a3aa34525f0e81168864f0453eee72e8816d9644298e2ece24
          - linux/amd64 digest: sha256:8e4b4ed085930ce8f474797e80c05f43ca93a6be847448c7bdc9037609ef9d2c
          - linux/arm64 digest: sha256:b27bf1ffc7a6f59082eef85f739fd3e15e08e38106a312f3614dd02c4fcc122a
          - Standalone GKE receipt SHA-256: a04532a11305ee3943c4b363e12a2f943cc07cc9adb69659edbdd4d14d9d447c
          - Release path: landed main -> untagged candidate verification -> protected annotated tag -> promotion of the same candidate digest.
          - Placement path: a non-empty nodeSelector with the default initialMachineType skips the legacy capacity catalog.
          - Legacy placement path: an empty selector, tolerations-only placement, or a non-default initialMachineType still requires lumen-system/lumen-capacity-catalog.
          - Compatibility: shipped Docker images default to durable segment storage at /var/lib/lumen/data; bare lumen serve stays ephemeral without --data-dir or LUMEN_DATA_DIR. A 0.4.28 segment volume upgrades one way on first 0.4.29 start; in-place downgrade is unsupported.
          EOF
          gh release create lumen@0.4.30 --repo "$GITHUB_REPOSITORY" --target 1130302c7caaf7a1798e1ce544a82859528f77e0 --title lumen@0.4.30 --notes-file release-notes.md \
            candidate/lumen-aarch64-apple-darwin.tar.gz candidate/lumen-aarch64-apple-darwin.tar.gz.sha256 \
            candidate/lumen-x86_64-unknown-linux-gnu.tar.gz candidate/lumen-x86_64-unknown-linux-gnu.tar.gz.sha256 \
            candidate/lumen-aarch64-unknown-linux-gnu.tar.gz candidate/lumen-aarch64-unknown-linux-gnu.tar.gz.sha256 \
            candidate/lumen-x86_64-unknown-linux-musl.tar.gz candidate/lumen-x86_64-unknown-linux-musl.tar.gz.sha256 \
            candidate/lumen-aarch64-unknown-linux-musl.tar.gz candidate/lumen-aarch64-unknown-linux-musl.tar.gz.sha256 \
            candidate/spdx-amd64.json candidate/spdx-arm64.json \
            gke-receipt/lumen-standalone-gke-receipt.json gke-receipt/lumen-standalone-gke-receipt.json.sha256
      - name: Publicly verify recovered release
        if: steps.state.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apps/lumen/scripts/verify-release-artifacts.sh --repo chrischeng-c4/axiom --tag lumen@0.4.30 --commit 1130302c7caaf7a1798e1ce544a82859528f77e0 --candidate-run-id 33323799806 --mode public --standalone-gke-receipt "${{ steps.gke_receipt.outputs.receipt }}" --standalone-gke-receipt-sidecar "${{ steps.gke_receipt.outputs.sidecar }}" --output public-contract.json
