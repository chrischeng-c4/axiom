# Build and publish portable Sift binaries for the installer and release image.
name: sift-release

on:
  push:
    tags:
      - "sift@*"
  workflow_dispatch:
    inputs:
      image_version:
        description: >-
          Existing sift release tag to containerize and push to GHCR
          (e.g. sift@0.1.1). Leave empty for a build-only smoke run.
        required: false
        default: ""

permissions:
  contents: write  # needed to create / upload release assets
  packages: write  # needed to push the GHCR image (#2462)

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            cross: false
            musl: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
            musl: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
            musl: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: false
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            cross: false
            musl: true

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux aarch64 cross linker
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Install musl toolchain
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sift-${{ matrix.target }}

      - name: Build Sift binary
        run: cargo build --release --locked -p sift --bin sift --target ${{ matrix.target }}

      - name: Package artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="sift-${{ matrix.target }}"
          stage="pkg/${name}"
          mkdir -p "${stage}" out
          cp "target/${{ matrix.target }}/release/sift" "${stage}/sift"
          cp apps/sift/README.md "${stage}/README.md"
          tarball="out/${name}.tar.gz"
          tar -C pkg -czf "${tarball}" "${name}"
          if command -v shasum >/dev/null; then
            shasum -a 256 "${tarball}" | awk '{print $1}' > "${tarball}.sha256"
          else
            sha256sum "${tarball}" | awk '{print $1}' > "${tarball}.sha256"
          fi
          echo "tarball=${tarball}" >> "${GITHUB_OUTPUT}"
          echo "sha=${tarball}.sha256" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@v4
        with:
          name: sift-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.sha }}
          if-no-files-found: error
          overwrite: true

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/sift@')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/sift-*.tar.gz
            dist/**/sift-*.tar.gz.sha256
          generate_release_notes: true
          body: |
            `sift` release built from tag ${{ github.ref_name }}.

            ## Install

            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/apps/sift/install.sh | sh
            ```

  # #2462: durable, digest-pinned container images per release. Runs after
  # `release` because `Dockerfile.release` downloads the published tarballs;
  # also runnable retroactively for an EXISTING release via workflow_dispatch
  # with `image_version` (that path pays an unused smoke build — acceptable
  # for a rare retro fill).
  ghcr-image:
    name: publish ghcr image
    needs: release
    if: >-
      !cancelled() && (
        (startsWith(github.ref, 'refs/tags/sift@') && needs.release.result == 'success')
        || (github.event_name == 'workflow_dispatch' && inputs.image_version != '')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag and image tags
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ inputs.image_version || github.ref_name }}"
          [[ "$raw" == sift@* ]] || {
            echo "expected a sift@<version> tag, got: $raw" >&2
            exit 1
          }
          semver="${raw#sift@}"
          tags="ghcr.io/${{ github.repository_owner }}/sift:${semver}"
          # `latest` only when cutting a NEW release; a retro fill of an old
          # version must not steal the floating tag.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tags="${tags},ghcr.io/${{ github.repository_owner }}/sift:latest"
          fi
          echo "release_tag=${raw}" >> "$GITHUB_OUTPUT"
          echo "semver=${semver}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/sift/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SIFT_VERSION=${{ steps.ver.outputs.semver }}
          tags: ${{ steps.ver.outputs.tags }}

      - name: Append image digest to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.release_tag }}"
          image="ghcr.io/${{ github.repository_owner }}/sift:${{ steps.ver.outputs.semver }}@${{ steps.push.outputs.digest }}"
          body="$(gh release view "$tag" --repo "${{ github.repository }}" --json body --jq .body)"
          if grep -qF "${{ steps.push.outputs.digest }}" <<<"$body"; then
            echo "digest already recorded"
            exit 0
          fi
          printf '%s\n\n## Container image\n\n```text\n%s\n```\n' "$body" "$image" \
            | gh release edit "$tag" --repo "${{ github.repository }}" --notes-file -
