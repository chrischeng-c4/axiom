# Build and publish portable Sift binaries for the installer and release image.
name: sift-release

on:
  push:
    tags:
      - "sift@*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            cross: false
            musl: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
            musl: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
            musl: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: false
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            cross: false
            musl: true

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux aarch64 cross linker
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Install musl toolchain
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sift-${{ matrix.target }}

      - name: Build Sift binary
        run: cargo build --release --locked -p sift --bin sift --target ${{ matrix.target }}

      - name: Package artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="sift-${{ matrix.target }}"
          stage="pkg/${name}"
          mkdir -p "${stage}" out
          cp "target/${{ matrix.target }}/release/sift" "${stage}/sift"
          cp projects/sift/README.md "${stage}/README.md"
          tarball="out/${name}.tar.gz"
          tar -C pkg -czf "${tarball}" "${name}"
          if command -v shasum >/dev/null; then
            shasum -a 256 "${tarball}" | awk '{print $1}' > "${tarball}.sha256"
          else
            sha256sum "${tarball}" | awk '{print $1}' > "${tarball}.sha256"
          fi
          echo "tarball=${tarball}" >> "${GITHUB_OUTPUT}"
          echo "sha=${tarball}.sha256" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@v4
        with:
          name: sift-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.sha }}
          if-no-files-found: error
          overwrite: true

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/sift@')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/sift-*.tar.gz
            dist/**/sift-*.tar.gz.sha256
          generate_release_notes: true
          body: |
            `sift` release built from tag ${{ github.ref_name }}.

            ## Install

            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/projects/sift/install.sh | sh
            ```
