# Per-commit GHCR dev/test image for lumen — internal acceptance ONLY.
#
# Two-line image scheme (#2513):
#   - dev/test: ghcr.io/<owner>/lumen:sha-<git12>   (this workflow)  — never
#     user-facing, consumed only by acceptance harnesses that pin an
#     immutable `@sha256:` digest.
#   - release:  lumen:<semver> + latest             (lumen-release.yml)  — the
#     only line integrators ever consume. That workflow is unchanged.
#
# Mechanics mirror lumen-release.yml's `build` job exactly, restricted to the
# two Linux musl legs (the archetype the acceptance harness actually pulls;
# see Dockerfile.test): same rustup/musl-tools setup, same
# Swatinem/rust-cache pattern (distinct `lumen-test-<target>` keys so this
# workflow's cache never collides with the release workflow's), same
# `cargo build --release --locked -p lumen --bin lumen --features "..."`.
#
# `workflow_call` outputs mirror the `publish` job's outputs so a caller
# workflow (e.g. a future acceptance orchestrator) can consume the pinned
# image/digest directly as a real workflow output, not just a log line.
name: lumen-test-image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Git ref (branch, tag, or commit SHA) to build. Leave empty to
          default to the ref that triggered this dispatch.
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        description: >-
          Git ref (branch, tag, or commit SHA) to build. Leave empty to
          default to the ref that triggered this call.
        required: false
        default: ""
        type: string
    outputs:
      image:
        description: >-
          Pushed dev/test image pinned by digest, e.g.
          ghcr.io/<owner>/lumen:sha-<git12>@sha256:<digest>.
        value: ${{ jobs.publish.outputs.image }}
      digest:
        description: Pushed image digest (sha256:...).
        value: ${{ jobs.publish.outputs.digest }}
      tag:
        description: Pushed image tag without the digest (sha-<git12> line).
        value: ${{ jobs.publish.outputs.tag }}

permissions:
  packages: write
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only the two Linux musl legs: Dockerfile.test's runtime stage is
          # the same glibc-free distroless/static-debian12 base as
          # Dockerfile.release, so it needs a static musl binary regardless
          # of build arch (see lumen-release.yml / #1195 for why).
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            arch: amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            arch: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        # Both legs build native (same CPU arch as the runner), so
        # `musl-tools`' `musl-gcc` is sufficient — no cross linker needed,
        # same as the musl legs in lumen-release.yml.
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lumen-test-${{ matrix.target }}

      # `delegated-auth` is what makes `spec.auth: required` -- the CRD default --
      # servable. Without it the binary refuses to start, so an acceptance run
      # that pins this image by digest would crash-loop every auth-mode
      # instance. lumen-release.yml already builds with it; this leg lagged.
      - name: Build lumen binary
        run: cargo build --release --locked -p lumen --bin lumen --features release --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-test-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/lumen
          if-no-files-found: error
          overwrite: true

  publish:
    name: publish ghcr test image
    needs: build
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.digest.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve commit SHA and image tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          full_sha="$(git rev-parse HEAD)"
          git12="${full_sha:0:12}"
          tag="ghcr.io/${{ github.repository_owner }}/lumen:sha-${git12}"
          echo "git12=${git12}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # Standard multi-arch-from-prebuilt-binaries pattern: stage each arch's
      # binary at dist/linux/<arch>/lumen so Dockerfile.test's TARGETARCH-aware
      # COPY picks the right one per --platform leg during the buildx build.
      - uses: actions/download-artifact@v4
        with:
          name: lumen-test-amd64
          path: dist/linux/amd64

      - uses: actions/download-artifact@v4
        with:
          name: lumen-test-arm64
          path: dist/linux/arm64

      - name: Make staged binaries executable
        run: chmod +x dist/linux/amd64/lumen dist/linux/arm64/lumen

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch test image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/lumen/Dockerfile.test
          platforms: linux/amd64,linux/arm64
          push: true
          # NEVER add `latest` or a semver tag here — this is the dev/test
          # line only (#2513). The release line is lumen-release.yml's
          # `ghcr-image` job, untouched by this workflow.
          tags: ${{ steps.ver.outputs.tag }}

      - name: Record pushed digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.ver.outputs.tag }}@${{ steps.push.outputs.digest }}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          {
            echo "### lumen dev/test image pushed"
            echo
            echo '```text'
            echo "${image}"
            echo '```'
            echo
            echo "Internal acceptance use ONLY — never hand this tag to users."
          } >> "$GITHUB_STEP_SUMMARY"
