name: lumen-perf-diagnostic

# This workflow is diagnostic evidence only. It never creates a candidate or a
# qualifying performance receipt.
on:
  workflow_dispatch:
    inputs:
      harness_commit:
        description: Exact full commit SHA for the landed Lumen performance harness.
        required: true
        type: string
      image:
        description: Exact immutable Lumen GHCR index reference.
        required: true
        type: string
      scenario:
        description: Fixed non-qualifying flat index diagnostic cell.
        required: true
        type: choice
        options:
          - index-1000-flat-cpu
          - index-1-flat-cpu
        default: index-1000-flat-cpu

concurrency:
  group: lumen-perf-diagnostic-${{ inputs.image }}
  cancel-in-progress: false

jobs:
  flat-capacity-diagnostic:
    name: non-qualifying ${{ inputs.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: lumen-perf-diagnostic-job-${{ inputs.image }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Refuse any ref except the main workflow
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || { echo 'diagnostic is workflow_dispatch only' >&2; exit 1; }
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'diagnostic must dispatch from main' >&2; exit 1; }
          [[ "$WORKFLOW_REF" == "${GITHUB_REPOSITORY}/.github/workflows/lumen-perf-diagnostic.yml@refs/heads/main" ]] || { echo 'diagnostic workflow ref must be main' >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Validate requested harness_commit before checking out its code.
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prove the exact landed harness and image inputs
        env:
          HARNESS_COMMIT: ${{ inputs.harness_commit }}
          IMAGE: ${{ inputs.image }}
          SCENARIO: ${{ inputs.scenario }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HARNESS_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'harness_commit must be a full lowercase SHA' >&2; exit 1; }
          [[ "$IMAGE" =~ ^ghcr\.io/chrischeng-c4/lumen@sha256:[0-9a-f]{64}$ ]] || { echo 'image must be ghcr.io/chrischeng-c4/lumen@sha256:<64 lowercase hex>' >&2; exit 1; }
          case "$SCENARIO" in
            index-1000-flat-cpu|index-1-flat-cpu) ;;
            *) echo 'scenario must be index-1000-flat-cpu or index-1-flat-cpu' >&2; exit 1 ;;
          esac
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin "$HARNESS_COMMIT"
          git merge-base --is-ancestor "$HARNESS_COMMIT" origin/main || { echo 'harness_commit is not landed on origin/main' >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.harness_commit }}
          fetch-depth: 0
      - name: Prove the validated harness checkout
        env:
          HARNESS_COMMIT: ${{ inputs.harness_commit }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$HARNESS_COMMIT" ]] || { echo 'checkout did not resolve harness_commit' >&2; exit 1; }
      - name: Reclaim runner disk before the diagnostic cargo test
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/share/boost \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Log in to GHCR with read-only job access
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull and record the exact AMD64 diagnostic image
        env:
          HARNESS_COMMIT: ${{ inputs.harness_commit }}
          IMAGE: ${{ inputs.image }}
          SCENARIO: ${{ inputs.scenario }}
          BATCH: ${{ inputs.scenario == 'index-1-flat-cpu' && '1' || '1000' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic
          docker pull "$IMAGE"
          resolved_repo_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")"
          image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE")"
          architecture="$(docker image inspect --format '{{.Architecture}}' "$IMAGE")"
          oci_revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")"
          [[ "$resolved_repo_digest" =~ ^ghcr\.io/chrischeng-c4/lumen@sha256:[0-9a-f]{64}$ ]] || { echo 'pulled image did not resolve to the expected repository digest' >&2; exit 1; }
          [[ "$resolved_repo_digest" == "$IMAGE" ]] || { echo 'pulled image digest differs from the requested immutable image' >&2; exit 1; }
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'selected AMD64 image ID is invalid' >&2; exit 1; }
          [[ "$architecture" == amd64 ]] || { echo 'selected image architecture is not amd64' >&2; exit 1; }
          [[ "$oci_revision" =~ ^[0-9a-f]{40}$ ]] || { echo 'OCI revision label is invalid' >&2; exit 1; }
          git cat-file -e "$oci_revision^{commit}" || { echo 'OCI revision is not available in the validated harness history' >&2; exit 1; }
          git merge-base --is-ancestor "$oci_revision" "$HARNESS_COMMIT" || { echo 'OCI revision is not an ancestor of harness_commit' >&2; exit 1; }
          case "$SCENARIO:$BATCH" in
            index-1000-flat-cpu:1000|index-1-flat-cpu:1) ;;
            *) echo 'scenario and fixed batch do not match' >&2; exit 1 ;;
          esac
          jq -n \
            --arg input_image "$IMAGE" \
            --arg resolved_repo_digest "$resolved_repo_digest" \
            --arg selected_amd64_image_id "$image_id" \
            --arg architecture "$architecture" \
            --arg oci_revision "$oci_revision" \
            --arg harness_commit "$HARNESS_COMMIT" \
            --arg scenario "$SCENARIO" \
            --argjson batch "$BATCH" \
            '{kind:"non-qualifying-lumen-performance-diagnostic",input_image:$input_image,resolved_repo_digest:$resolved_repo_digest,selected_amd64_image_id:$selected_amd64_image_id,architecture:$architecture,oci_revision:$oci_revision,harness_commit:$harness_commit,cell:{scenario:$scenario,endpoint:"index",batch:$batch,backend:"flat-cpu"}}' \
            > diagnostic/identity.json
      - name: Run the fixed non-qualifying diagnostic cell (${{ inputs.scenario }})
        env:
          CARGO_INCREMENTAL: '0'
          LUMEN_PERF_DIAGNOSTIC: '1'
          LUMEN_PERF_IMAGE: ${{ inputs.image }}
          LUMEN_PERF_ENDPOINT: index
          LUMEN_PERF_BATCH: ${{ inputs.scenario == 'index-1-flat-cpu' && '1' || '1000' }}
          LUMEN_PERF_BACKEND: flat-cpu
          SCENARIO: ${{ inputs.scenario }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo test --release --locked -p lumen --test perf_gate -- --ignored --exact durable_workload::approved_30_minute_durable_workload --test-threads=1 --nocapture 2>&1 | tee diagnostic/test-output.full.log
          test_status=${PIPESTATUS[0]}
          set -e
          # Keep all bounded one-second pump rows as a separate artifact file.
          awk '$1 == "PERF_REQUEST_PUMP" { print }' diagnostic/test-output.full.log > diagnostic/request-pump-telemetry.log
          telemetry_rows=$(wc -l < diagnostic/request-pump-telemetry.log | tr -d ' ')
          telemetry_bytes=$(wc -c < diagnostic/request-pump-telemetry.log | tr -d ' ')
          telemetry_input_seconds=$(awk '$1 == "PERF_REQUEST_PUMP" { split($2, item, "="); second = item[2] + 0; if (second >= 0 && second < 1800) seen[second] = 1 } END { for (second = 0; second < 1800; second++) if (second in seen) count++; print count + 0 }' diagnostic/request-pump-telemetry.log)
          telemetry_index_seconds=$(awk -v scenario="$SCENARIO" '$1 == "PERF_REQUEST_PUMP" { split($2, second_item, "="); split($3, endpoint_item, "="); second = second_item[2] + 0; endpoint = endpoint_item[2]; if (endpoint == "index" && second >= 0 && second < 1800 && (scenario != "index-1-flat-cpu" || second % 3 == 0)) seen[second] = 1 } END { for (second in seen) count++; print count + 0 }' diagnostic/request-pump-telemetry.log)
          [[ "$telemetry_rows" -le 8000 ]] || { echo 'pump telemetry row count exceeds its fixed bound' >&2; exit 1; }
          [[ "$telemetry_bytes" -le 4194304 ]] || { echo 'pump telemetry exceeds its 4 MiB bound' >&2; exit 1; }
          if [[ "$test_status" == 0 ]]; then
            [[ "$telemetry_input_seconds" == 1800 ]] || { echo 'successful diagnostic did not retain telemetry for all 1800 input seconds' >&2; exit 1; }
            if [[ "$SCENARIO" == index-1-flat-cpu ]]; then
              [[ "$telemetry_index_seconds" == 600 ]] || { echo 'successful index-1 diagnostic did not retain index telemetry for all 600 index seconds' >&2; exit 1; }
            else
              [[ "$telemetry_index_seconds" -ge 1 ]] || { echo 'successful batch-1000 diagnostic did not retain an index telemetry row' >&2; exit 1; }
            fi
          fi
          # The full runner log remains in GitHub Actions. Keep only a bounded
          # tail of it as a summary artifact; pump telemetry is retained above.
          tail -c 262144 diagnostic/test-output.full.log > diagnostic/test-output.log
          rm diagnostic/test-output.full.log
          exit "$test_status"
      - name: Write bounded diagnostic trace
        if: ${{ always() }}
        env:
          HARNESS_COMMIT: ${{ inputs.harness_commit }}
          IMAGE: ${{ inputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic
          jq -n \
            --arg harness_commit "$HARNESS_COMMIT" \
            --arg image "$IMAGE" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{harness_commit:$harness_commit,image:$image,workflow_ref:$workflow_ref,run_id:$run_id,run_attempt:$run_attempt,qualifying:false}' \
            > diagnostic/trace.json
      - name: Upload small diagnostic identity and trace
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lumen-perf-diagnostic-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            diagnostic/identity.json
            diagnostic/trace.json
            diagnostic/test-output.log
            diagnostic/request-pump-telemetry.log
          if-no-files-found: warn
          overwrite: false
      - name: Upload bounded diagnostic failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lumen-perf-diagnostic-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/lumen-perf-failure-*
          if-no-files-found: warn
          overwrite: false
