name: lumen-release-0.4.29-public-verify

on:
  workflow_dispatch:

permissions:
  actions: read
  attestations: read
  contents: read
  packages: read
  pull-requests: read

jobs:
  verify:
    name: public verify lumen@0.4.29 from frozen candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dc7596a57d88e1d7925f5e3599c6c8c992fd2eb4
          path: product
          fetch-depth: 1
      - name: Refuse non-main or workflow-identity dispatch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_REPOSITORY" == chrischeng-c4/axiom ]]
          [[ "$GITHUB_WORKFLOW_REF" == "chrischeng-c4/axiom/.github/workflows/lumen-release-0.4.29-public-verify.yml@refs/heads/main" ]]
          [[ "$GITHUB_SHA" == "$(git -C controller rev-parse HEAD)" ]]
          git -C controller fetch --no-tags origin main
          [[ "$GITHUB_SHA" == "$(git -C controller rev-parse origin/main)" ]]
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Bind controller and frozen product candidate verifier bytes
        shell: bash
        run: |
          set -euo pipefail
          controller_sha="$(sha256sum controller/apps/lumen/scripts/verify-release-candidate.sh | awk '{print $1}')"
          product_sha="$(sha256sum product/apps/lumen/scripts/verify-release-candidate.sh | awk '{print $1}')"
          [[ "$controller_sha" == 4fa31b498bab56f7d46e1f7b630893cf509607c8444b5b498e38438fd54529f7 ]]
          [[ "$product_sha" == "$controller_sha" ]]
          cmp -s controller/apps/lumen/scripts/verify-release-candidate.sh product/apps/lumen/scripts/verify-release-candidate.sh
      - name: Download and bind the sanitized public receipt
        working-directory: product
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir public-receipt
          gh release download lumen@0.4.29 --repo chrischeng-c4/axiom --dir public-receipt \
            --pattern lumen-standalone-gke-receipt.json \
            --pattern lumen-standalone-gke-receipt.json.sha256
          [[ "$(sha256sum public-receipt/lumen-standalone-gke-receipt.json | awk '{print $1}')" == 8ee8a506952d116bc842c57fc86898ff15f7660a6074146c2b8ffb89a1fca374 ]]
          [[ "$(sha256sum public-receipt/lumen-standalone-gke-receipt.json.sha256 | awk '{print $1}')" == e398531ba1b06c621f3484b2d25cdc9e4c88047a7af5dea0a6af4c877f40c9d4 ]]
          cmp -s public-receipt/lumen-standalone-gke-receipt.json.sha256 <(printf '%s  lumen-standalone-gke-receipt.json\n' 8ee8a506952d116bc842c57fc86898ff15f7660a6074146c2b8ffb89a1fca374)
      - name: Publicly verify the frozen release from the product checkout
        working-directory: product
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ../controller/apps/lumen/scripts/verify-release-artifacts.sh \
            --repo chrischeng-c4/axiom \
            --tag lumen@0.4.29 \
            --commit dc7596a57d88e1d7925f5e3599c6c8c992fd2eb4 \
            --candidate-run-id 33277878629 \
            --mode public \
            --standalone-gke-receipt public-receipt/lumen-standalone-gke-receipt.json \
            --standalone-gke-receipt-sidecar public-receipt/lumen-standalone-gke-receipt.json.sha256 \
            --output public-contract.json
          jq -e \
            --arg tag lumen@0.4.29 \
            --arg commit dc7596a57d88e1d7925f5e3599c6c8c992fd2eb4 \
            --arg run 33277878629 \
            --arg root sha256:3d05b74f665f7ffbfabfc7d50a06c5a4de22ca881d373d433142c83692e7f6e5 \
            --arg amd64 sha256:cf6ee1bd1c2547287ae93e601a6fa462be7c741dd82ca0bfa6833db26adb9463 \
            --arg arm64 sha256:5c84c723bf46c165a141341b3cf46690b1ae47bcf06c91fe73220f50fd1d57b4 \
            --arg receipt 8ee8a506952d116bc842c57fc86898ff15f7660a6074146c2b8ffb89a1fca374 \
            '.repository == "chrischeng-c4/axiom" and .tag == $tag and .commit == $commit and .candidate_run_id == $run and .candidate_attempt == "1" and .root_digest == $root and .amd64_digest == $amd64 and .arm64_digest == $arm64 and .standalone_gke_receipt_sha256 == $receipt' \
            public-contract.json >/dev/null
