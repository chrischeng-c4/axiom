# Per-commit GHCR dev/test image for loom — internal acceptance ONLY.
#
# Same two-line image scheme as lumen-test-image.yml (#2513): this dev/test
# line (sha-<git12> tags, digest-pinned by consumers) is separate from any
# release line and is pruned by ghcr-test-image-cleanup.yml. Unlike lumen's,
# this build has no musl/multi-arch matrix: the acceptance cluster's nodes are
# amd64 e2 machines, and apps/loom/Dockerfile is a from-source workspace
# build whose context must be the repo root.
#
# `workflow_call` outputs mirror the publish job's outputs so
# gke-acceptance.yml can consume the pinned image directly.
name: loom-test-image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Git ref (branch, tag, or commit SHA) to build. Leave empty to
          default to the ref that triggered this dispatch.
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        description: >-
          Git ref (branch, tag, or commit SHA) to build. Leave empty to
          default to the ref that triggered this call.
        required: false
        default: ""
        type: string
    outputs:
      image:
        description: >-
          Pushed dev/test image pinned by digest, e.g.
          ghcr.io/<owner>/loom:sha-<git12>@sha256:<digest>.
        value: ${{ jobs.publish.outputs.image }}
      digest:
        description: Pushed image digest (sha256:...).
        value: ${{ jobs.publish.outputs.digest }}
      tag:
        description: Pushed image tag without the digest (sha-<git12> line).
        value: ${{ jobs.publish.outputs.tag }}

permissions:
  packages: write
  contents: read

jobs:
  publish:
    name: build + publish ghcr test image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.digest.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve commit SHA and image tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          full_sha="$(git rev-parse HEAD)"
          git12="${full_sha:0:12}"
          tag="ghcr.io/${{ github.repository_owner }}/loom:sha-${git12}"
          echo "git12=${git12}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push test image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/loom/Dockerfile
          platforms: linux/amd64
          push: true
          # NEVER add `latest` or a semver tag here — dev/test line only.
          tags: ${{ steps.ver.outputs.tag }}
          cache-from: type=gha,scope=loom-test-image
          cache-to: type=gha,mode=max,scope=loom-test-image

      - name: Record pushed digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.ver.outputs.tag }}@${{ steps.push.outputs.digest }}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          {
            echo "### loom dev/test image pushed"
            echo
            echo '```text'
            echo "${image}"
            echo '```'
            echo
            echo "Internal acceptance use ONLY — never hand this tag to users."
          } >> "$GITHUB_STEP_SUMMARY"
