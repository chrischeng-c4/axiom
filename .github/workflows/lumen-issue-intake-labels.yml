name: lumen-issue-intake-labels

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  label-lumen-report:
    name: label canonical Lumen CLI report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Classify the issue body
        id: classify
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        shell: bash
        run: |
          set -euo pipefail
          labels_json="$(printf '%s' "${ISSUE_BODY:-}" | python3 scripts/meta/lumen_issue_intake_labels.py)"
          case "$labels_json" in
            '[]'|'["app:lumen","type:report"]') ;;
            *) echo "classifier returned an unsupported label set" >&2; exit 1 ;;
          esac
          echo "labels_json=$labels_json" >> "$GITHUB_OUTPUT"
      - name: Add canonical labels
        if: steps.classify.outputs.labels_json != '[]'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABELS_JSON: ${{ steps.classify.outputs.labels_json }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/lumen-issue-labels.json"
          printf '%s' "$LABELS_JSON" | jq -e '{labels: .}' > "$payload"
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/labels" \
            --input "$payload"
