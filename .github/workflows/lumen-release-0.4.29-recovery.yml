name: lumen-release-0.4.29-recovery

on:
  workflow_dispatch:

concurrency:
  group: lumen-release-promotion-0.4.29
  cancel-in-progress: false

permissions:
  actions: read
  attestations: read
  contents: write
  packages: write
  pull-requests: read

jobs:
  recover:
    name: recover lumen@0.4.29 from frozen candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dc7596a57d88e1d7925f5e3599c6c8c992fd2eb4
          fetch-depth: 0
      - name: Refuse non-main or workflow-identity dispatch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_REPOSITORY" == chrischeng-c4/axiom ]]
          [[ "$GITHUB_WORKFLOW_REF" == "chrischeng-c4/axiom/.github/workflows/lumen-release-0.4.29-recovery.yml@refs/heads/main" ]]
          git fetch --no-tags origin main
          [[ "$GITHUB_SHA" == "$(git rev-parse origin/main)" ]]
          git merge-base --is-ancestor dc7596a57d88e1d7925f5e3599c6c8c992fd2eb4 origin/main
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Decode and bind frozen standalone GKE receipt
        id: gke_receipt
        shell: bash
        env:
          RECEIPT_B64: 
          SIDECAR_B64: OGVlOGE1MDY5NTJkMTE2YmM4NDJjNTdmYzg2ODk4ZmYxNWY3NjYwYTYwNzQxNDZjMmI4ZmZiODlhMWZjYTM3NCAgbHVtZW4tc3RhbmRhbG9uZS1na2UtcmVjZWlwdC5qc29uCg==
        run: |
          set -euo pipefail
          canonical_b64() {
            local value="$1"
            [[ "$value" =~ ^[A-Za-z0-9+/]+={0,2}$ && $((${#value} % 4)) -eq 0 ]]
          }
          canonical_b64 "$RECEIPT_B64"
          canonical_b64 "$SIDECAR_B64"
          mkdir -p gke-receipt
          printf '%s' "$RECEIPT_B64" | base64 --decode > gke-receipt/lumen-standalone-gke-receipt.json
          printf '%s' "$SIDECAR_B64" | base64 --decode > gke-receipt/lumen-standalone-gke-receipt.json.sha256
          [[ "$(sha256sum gke-receipt/lumen-standalone-gke-receipt.json | awk '{print $1}')" == 8ee8a506952d116bc842c57fc86898ff15f7660a6074146c2b8ffb89a1fca374 ]]
          [[ "$(sha256sum gke-receipt/lumen-standalone-gke-receipt.json.sha256 | awk '{print $1}')" == e398531ba1b06c621f3484b2d25cdc9e4c88047a7af5dea0a6af4c877f40c9d4 ]]
          [[ "$(cat gke-receipt/lumen-standalone-gke-receipt.json.sha256)" == "8ee8a506952d116bc842c57fc86898ff15f7660a6074146c2b8ffb89a1fca374  lumen-standalone-gke-receipt.json" ]]
          {
            echo "receipt=$PWD/gke-receipt/lumen-standalone-gke-receipt.json"
            echo "sidecar=$PWD/gke-receipt/lumen-standalone-gke-receipt.json.sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Revalidate frozen tag candidate receipt and failed promotion proof
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apps/lumen/scripts/verify-release-artifacts.sh \
            --repo chrischeng-c4/axiom \
            --tag lumen@0.4.29 \
            --commit dc7596a57d88e1d7925f5e3599c6c8c992fd2eb4 \
            --candidate-run-id 33277878629 \
            --mode candidate \
            --standalone-gke-receipt "${{ steps.gke_receipt.outputs.receipt }}" \
            --standalone-gke-receipt-sidecar "${{ steps.gke_receipt.outputs.sidecar }}" \
            --output promotion-contract.json
          tag_ref="$(gh api repos/chrischeng-c4/axiom/git/ref/tags/lumen%400.4.29)"
          [[ "$(jq -r '.object.type' <<<"$tag_ref")" == tag ]]
          [[ "$(jq -r '.object.sha' <<<"$tag_ref")" == fda6cf765f2f58bec75f4fe3a4086fc1df62ced5 ]]
          [[ "$(gh api repos/chrischeng-c4/axiom/git/tags/fda6cf765f2f58bec75f4fe3a4086fc1df62ced5 --jq '.object.sha')" == dc7596a57d88e1d7925f5e3599c6c8c992fd2eb4 ]]
          jq -e --arg commit dc7596a57d88e1d7925f5e3599c6c8c992fd2eb4 --arg run 33277878629 --arg root sha256:3d05b74f665f7ffbfabfc7d50a06c5a4de22ca881d373d433142c83692e7f6e5 --arg amd64 sha256:cf6ee1bd1c2547287ae93e601a6fa462be7c741dd82ca0bfa6833db26adb9463 --arg arm64 sha256:5c84c723bf46c165a141341b3cf46690b1ae47bcf06c91fe73220f50fd1d57b4 --arg receipt 8ee8a506952d116bc842c57fc86898ff15f7660a6074146c2b8ffb89a1fca374 '(.candidate_attempt == "1" and .commit == $commit and .candidate_run_id == $run and .root_digest == $root and .amd64_digest == $amd64 and .arm64_digest == $arm64 and .standalone_gke_receipt_sha256 == $receipt)' promotion-contract.json >/dev/null
          failed="$(gh api repos/chrischeng-c4/axiom/actions/runs/33283293722)"
          jq -e --arg commit dc7596a57d88e1d7925f5e3599c6c8c992fd2eb4 '.id == 33283293722 and .run_attempt == 1 and .event == "workflow_dispatch" and .head_branch == "lumen@0.4.29" and .head_sha == $commit and .status == "completed" and .conclusion == "failure" and .path == ".github/workflows/lumen-release.yml"' <<<"$failed" >/dev/null
          gh api --paginate 'repos/chrischeng-c4/axiom/actions/runs/33283293722/attempts/1/jobs?per_page=100' | jq -cs '[.[] | .jobs[]]' > failed-promotion-jobs.json
          jq -e 'length == 2 and ([.[] | [.name,.conclusion]] | sort) == [["promote exact candidate root and publish release","skipped"],["prove immutable tag and candidate receipt","failure"]] and any(.[]; .name == "prove immutable tag and candidate receipt" and any(.steps[]; .name == "Verify tag ruleset, candidate receipt, and supply chain" and .conclusion == "success") and any(.steps[]; .name == "Export immutable candidate contract" and .conclusion == "failure"))' failed-promotion-jobs.json >/dev/null
      - name: Inspect existing release
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          query='query($owner:String!, $name:String!, $tag:String!) { repository(owner:$owner, name:$name) { release(tagName:$tag) { id } } }'
          release="$(gh api graphql -f query="$query" -f owner=chrischeng-c4 -f name=axiom -f tag='lumen@0.4.29')"
          if [[ "$(jq -r '.data.repository.release | if . == null then "absent" else "present" end' <<<"$release")" == present ]]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Public-verify existing release only
        if: steps.state.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apps/lumen/scripts/verify-release-artifacts.sh --repo chrischeng-c4/axiom --tag lumen@0.4.29 --commit dc7596a57d88e1d7925f5e3599c6c8c992fd2eb4 --candidate-run-id 33277878629 --mode public --standalone-gke-receipt "${{ steps.gke_receipt.outputs.receipt }}" --standalone-gke-receipt-sidecar "${{ steps.gke_receipt.outputs.sidecar }}" --output public-contract.json
      - name: Download exact candidate release bytes
        if: steps.state.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 33277878629 --repo "$GITHUB_REPOSITORY" --name lumen-release-candidate-33277878629-1 --dir candidate
          for target in aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            test -f "candidate/lumen-${target}.tar.gz"
            test -f "candidate/lumen-${target}.tar.gz.sha256"
          done
          test -f candidate/spdx-amd64.json
          test -f candidate/spdx-arm64.json
      - name: Re-query and promote only exact frozen root
        if: steps.state.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apps/lumen/scripts/verify-release-artifacts.sh --repo chrischeng-c4/axiom --tag lumen@0.4.29 --commit dc7596a57d88e1d7925f5e3599c6c8c992fd2eb4 --candidate-run-id 33277878629 --mode candidate --standalone-gke-receipt "${{ steps.gke_receipt.outputs.receipt }}" --standalone-gke-receipt-sidecar "${{ steps.gke_receipt.outputs.sidecar }}" --output promotion-contract-before-write.json
          jq -e --arg commit dc7596a57d88e1d7925f5e3599c6c8c992fd2eb4 --arg run 33277878629 --arg root sha256:3d05b74f665f7ffbfabfc7d50a06c5a4de22ca881d373d433142c83692e7f6e5 --arg amd64 sha256:cf6ee1bd1c2547287ae93e601a6fa462be7c741dd82ca0bfa6833db26adb9463 --arg arm64 sha256:5c84c723bf46c165a141341b3cf46690b1ae47bcf06c91fe73220f50fd1d57b4 --arg receipt 8ee8a506952d116bc842c57fc86898ff15f7660a6074146c2b8ffb89a1fca374 '(.candidate_attempt == "1" and .commit == $commit and .candidate_run_id == $run and .root_digest == $root and .amd64_digest == $amd64 and .arm64_digest == $arm64 and .standalone_gke_receipt_sha256 == $receipt)' promotion-contract-before-write.json >/dev/null
          digest_or_absent() {
            local ref="$1" error manifest status
            error="$(mktemp)"
            set +e
            manifest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>"$error")"
            status=$?
            set -e
            if [[ "$status" == 0 ]]; then
              rm -f "$error"
              jq -er '.digest' <<<"$manifest"
              return 0
            fi
            if grep -Eqi 'manifest unknown|not found' "$error"; then
              rm -f "$error"
              return 0
            fi
            cat "$error" >&2
            rm -f "$error"
            exit 1
          }
          root=ghcr.io/chrischeng-c4/lumen@sha256:3d05b74f665f7ffbfabfc7d50a06c5a4de22ca881d373d433142c83692e7f6e5
          semver="$(digest_or_absent ghcr.io/chrischeng-c4/lumen:0.4.29)"
          [[ -z "$semver" || "$semver" == sha256:3d05b74f665f7ffbfabfc7d50a06c5a4de22ca881d373d433142c83692e7f6e5 ]]
          latest="$(digest_or_absent ghcr.io/chrischeng-c4/lumen:latest)"
          [[ "$latest" == sha256:59a85c96d807428c424ec8889ac830b14e02869da49c4b44ae12dcce3786d03d || "$latest" == sha256:3d05b74f665f7ffbfabfc7d50a06c5a4de22ca881d373d433142c83692e7f6e5 ]]
          if [[ -z "$semver" ]]; then
            [[ -z "$(digest_or_absent ghcr.io/chrischeng-c4/lumen:0.4.29)" ]]
            docker buildx imagetools create --tag ghcr.io/chrischeng-c4/lumen:0.4.29 "$root"
          fi
          [[ "$(digest_or_absent ghcr.io/chrischeng-c4/lumen:0.4.29)" == sha256:3d05b74f665f7ffbfabfc7d50a06c5a4de22ca881d373d433142c83692e7f6e5 ]]
          if [[ "$latest" == sha256:59a85c96d807428c424ec8889ac830b14e02869da49c4b44ae12dcce3786d03d ]]; then
            [[ "$(digest_or_absent ghcr.io/chrischeng-c4/lumen:0.4.28)" == sha256:59a85c96d807428c424ec8889ac830b14e02869da49c4b44ae12dcce3786d03d ]]
            [[ "$(digest_or_absent ghcr.io/chrischeng-c4/lumen:latest)" == sha256:59a85c96d807428c424ec8889ac830b14e02869da49c4b44ae12dcce3786d03d ]]
            docker buildx imagetools create --tag ghcr.io/chrischeng-c4/lumen:latest "$root"
          fi
          [[ "$(digest_or_absent ghcr.io/chrischeng-c4/lumen:latest)" == sha256:3d05b74f665f7ffbfabfc7d50a06c5a4de22ca881d373d433142c83692e7f6e5 ]]
      - name: Create exact GitHub Release
        if: steps.state.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          # lumen@0.4.29

          - Source commit: dc7596a57d88e1d7925f5e3599c6c8c992fd2eb4
          - Pull request: https://github.com/chrischeng-c4/axiom/pull/3982
          - Candidate run: https://github.com/chrischeng-c4/axiom/actions/runs/33277878629/attempts/1
          - Promotion run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT
          - Recovery note: promotion run 33283293722 failed before public writes because the immutable contract jq expression had incorrect precedence; this recovery run revalidated and published the same frozen candidate.
          - Root index digest: sha256:3d05b74f665f7ffbfabfc7d50a06c5a4de22ca881d373d433142c83692e7f6e5
          - linux/amd64 digest: sha256:cf6ee1bd1c2547287ae93e601a6fa462be7c741dd82ca0bfa6833db26adb9463
          - linux/arm64 digest: sha256:5c84c723bf46c165a141341b3cf46690b1ae47bcf06c91fe73220f50fd1d57b4
          - Standalone GKE receipt SHA-256: 8ee8a506952d116bc842c57fc86898ff15f7660a6074146c2b8ffb89a1fca374
          - Release path: landed main -> untagged candidate verification -> protected annotated tag -> promotion of the same candidate digest.
          - Placement path: a non-empty nodeSelector with the default initialMachineType skips the legacy capacity catalog.
          - Legacy placement path: an empty selector, tolerations-only placement, or a non-default initialMachineType still requires lumen-system/lumen-capacity-catalog.
          - Compatibility: shipped Docker images default to durable segment storage at /var/lib/lumen/data; bare lumen serve stays ephemeral without --data-dir or LUMEN_DATA_DIR. A 0.4.28 segment volume upgrades one way on first 0.4.29 start; in-place downgrade is unsupported.
          EOF
          gh release create lumen@0.4.29 --repo "$GITHUB_REPOSITORY" --target dc7596a57d88e1d7925f5e3599c6c8c992fd2eb4 --title lumen@0.4.29 --notes-file release-notes.md \
            candidate/lumen-aarch64-apple-darwin.tar.gz candidate/lumen-aarch64-apple-darwin.tar.gz.sha256 \
            candidate/lumen-x86_64-unknown-linux-gnu.tar.gz candidate/lumen-x86_64-unknown-linux-gnu.tar.gz.sha256 \
            candidate/lumen-aarch64-unknown-linux-gnu.tar.gz candidate/lumen-aarch64-unknown-linux-gnu.tar.gz.sha256 \
            candidate/lumen-x86_64-unknown-linux-musl.tar.gz candidate/lumen-x86_64-unknown-linux-musl.tar.gz.sha256 \
            candidate/lumen-aarch64-unknown-linux-musl.tar.gz candidate/lumen-aarch64-unknown-linux-musl.tar.gz.sha256 \
            candidate/spdx-amd64.json candidate/spdx-arm64.json \
            gke-receipt/lumen-standalone-gke-receipt.json gke-receipt/lumen-standalone-gke-receipt.json.sha256
      - name: Publicly verify recovered release
        if: steps.state.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apps/lumen/scripts/verify-release-artifacts.sh --repo chrischeng-c4/axiom --tag lumen@0.4.29 --commit dc7596a57d88e1d7925f5e3599c6c8c992fd2eb4 --candidate-run-id 33277878629 --mode public --standalone-gke-receipt "${{ steps.gke_receipt.outputs.receipt }}" --standalone-gke-receipt-sidecar "${{ steps.gke_receipt.outputs.sidecar }}" --output public-contract.json
