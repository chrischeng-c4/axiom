# Build `lumen` binaries for all supported targets.
#
# Triggers:
#   - push of a tag matching `lumen@*`  → build + attach to GitHub release
#                                         (e.g. lumen@1.0, lumen@1.2.3)
#   - workflow_dispatch                 → build artifacts only (manual smoke)
#
# Targets (macOS Intel intentionally dropped — Apple Silicon only):
#   - aarch64-apple-darwin        (Apple Silicon,      macos-14 native)
#   - x86_64-unknown-linux-gnu    (most Linux servers, ubuntu-latest native)
#   - aarch64-unknown-linux-gnu   (Linux on ARM,       ubuntu-latest cross)
#   - x86_64-unknown-linux-musl   (static Linux,       ubuntu-latest native)
#   - aarch64-unknown-linux-musl  (static Linux ARM,   ubuntu-24.04-arm native)
#
# lumen's serving binary speaks REST/OpenAPI and uses rustls-backed HTTP clients
# for raft/CLI online paths, so there is no openssl in the build graph — the
# aarch64 Linux cross leg needs only the gcc cross-linker, same as cap/vat/meter.
# The two musl legs are fully static (see #1195: `Dockerfile.release`'s runtime
# stage is glibc-free `distroless/static-debian12`, so it needs a static
# binary — a gnu binary built on ubuntu-latest's glibc otherwise outpaces the
# base image's). Both musl legs build native (same CPU arch as the runner), so
# `musl-tools`' `musl-gcc` is enough — no cross toolchain, unlike aarch64-gnu.
name: lumen-release

on:
  push:
    tags:
      - "lumen@*"
  workflow_dispatch:
    inputs:
      image_version:
        description: >-
          Existing lumen release tag to containerize and push to GHCR
          (e.g. lumen@0.4.23). Leave empty for a build-only smoke run.
        required: false
        default: ""

permissions:
  contents: write  # needed to create / upload release assets
  packages: write  # needed to push the GHCR image (#2462)

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            cross: false
            musl: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
            musl: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
            musl: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: false
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            cross: false
            musl: true

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation toolchain (Linux aarch64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Install musl toolchain (Linux musl targets)
        # Both musl legs build native (same CPU arch as the runner), so
        # `musl-tools`' `musl-gcc` is sufficient — no cross linker needed.
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lumen-${{ matrix.target }}

      - name: Build lumen binary
        # --bin lumen: only the serving binary (skip lumen-consumer / -bench /
        # -openapi-dump; lumen-operator is feature-gated off by default anyway).
        run: cargo build --release --locked -p lumen --bin lumen --features "otel operator raft-wal self-update issue" --target ${{ matrix.target }}

      - name: Package artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="lumen-${{ matrix.target }}"
          # Build inside a `pkg/` staging dir, then tar with -C so the
          # archive layout is `lumen-<target>/{lumen,README.md}` — matches
          # what install.sh expects on extract.
          stage="pkg/${name}"
          mkdir -p "${stage}"
          cp "target/${{ matrix.target }}/release/lumen" "${stage}/lumen"
          cp apps/lumen/README.md "${stage}/README.md"
          # Emit the tarball + sha256 into `out/` (workspace root) so
          # upload-artifact's preserved `out/` prefix is shallow and
          # the release glob below is predictable.
          mkdir -p out
          tarball="out/${name}.tar.gz"
          tar -C pkg -czf "${tarball}" "${name}"
          if command -v shasum >/dev/null; then
            shasum -a 256 "${tarball}" | awk '{print $1}' > "${tarball}.sha256"
          else
            sha256sum "${tarball}" | awk '{print $1}' > "${tarball}.sha256"
          fi
          echo "tarball=${tarball}" >> "${GITHUB_OUTPUT}"
          echo "sha=${tarball}.sha256" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.sha }}
          if-no-files-found: error
          overwrite: true

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/lumen@')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # upload-artifact@v4 preserves the source path (`out/...`) inside
      # the artifact, so after merge-multiple the layout is
      # `dist/out/lumen-*.tar.gz`. Glob with `**` so the release picks
      # them up regardless of nesting depth.
      - name: List artifacts (debug)
        run: find dist -type f -maxdepth 4 -print

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/lumen-*.tar.gz
            dist/**/lumen-*.tar.gz.sha256
          generate_release_notes: true
          body: |
            `lumen` release built from tag ${{ github.ref_name }}.

            ## Install

            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/apps/lumen/install.sh | sh
            ```

            Or pick a target tarball below and extract it manually.

  # #2462: durable, digest-pinned container images per release. Runs after
  # `release` because `Dockerfile.release` downloads the published tarballs;
  # also runnable retroactively for an EXISTING release via workflow_dispatch
  # with `image_version` (that path pays an unused smoke build — acceptable
  # for a rare retro fill).
  ghcr-image:
    name: publish ghcr image
    needs: release
    if: >-
      !cancelled() && (
        (startsWith(github.ref, 'refs/tags/lumen@') && needs.release.result == 'success')
        || (github.event_name == 'workflow_dispatch' && inputs.image_version != '')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag and image tags
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ inputs.image_version || github.ref_name }}"
          [[ "$raw" == lumen@* ]] || {
            echo "expected a lumen@<version> tag, got: $raw" >&2
            exit 1
          }
          semver="${raw#lumen@}"
          tags="ghcr.io/${{ github.repository_owner }}/lumen:${semver}"
          # `latest` only when cutting a NEW release; a retro fill of an old
          # version must not steal the floating tag.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tags="${tags},ghcr.io/${{ github.repository_owner }}/lumen:latest"
          fi
          echo "release_tag=${raw}" >> "$GITHUB_OUTPUT"
          echo "semver=${semver}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/lumen/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            LUMEN_VERSION=${{ steps.ver.outputs.release_tag }}
          tags: ${{ steps.ver.outputs.tags }}

      - name: Append image digest to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.release_tag }}"
          image="ghcr.io/${{ github.repository_owner }}/lumen:${{ steps.ver.outputs.semver }}@${{ steps.push.outputs.digest }}"
          body="$(gh release view "$tag" --repo "${{ github.repository }}" --json body --jq .body)"
          if grep -qF "${{ steps.push.outputs.digest }}" <<<"$body"; then
            echo "digest already recorded"
            exit 0
          fi
          printf '%s\n\n## Container image\n\n```text\n%s\n```\n' "$body" "$image" \
            | gh release edit "$tag" --repo "${{ github.repository }}" --notes-file -
            macOS is Apple Silicon only; for Linux choose x86_64 or aarch64.
