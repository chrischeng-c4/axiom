# GKE acceptance harness for the four uncovered StatefulSet apps
# (keep / defer / relay / loom): build per-commit GHCR test images, wake the
# shared free-tier cluster's node pool, deploy each app from its kustomize
# template overlay, run the three-step durability verify (readyz -> data
# round-trip -> pod-kill survives), tear the namespace down, and ALWAYS park
# the pool back to 0 nodes so idle cost stays ~zero.
#
# v1 is manual-only (workflow_dispatch). The image workflows are already
# workflow_call, so a PR-label or nightly trigger later is a thin layer on
# top of this file, not a rewrite.
#
# One-time setup (bootstrap terraform + repo variables + GHCR visibility) is
# documented in acceptance/gke-harness/README.md.
#
# Reusable-workflow `uses:` cannot take a matrix expression, so the four
# build jobs are written out longhand with `contains(inputs.apps, ...)`
# guards. A deselected app's build job is SKIPPED, and a skipped `needs`
# entry would normally skip the acceptance job too — hence the explicit
# `!cancelled() && result != 'failure'` needs-guards below.
name: gke-acceptance
# gh run list exposes no workflow_dispatch inputs, so the app list rides on
# the run title — scripts/gh/gke-acceptance.sh reads it back from there.
run-name: gke-acceptance ${{ inputs.apps }} @ ${{ inputs.ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      apps:
        description: >-
          Space-separated subset of "keep defer relay loom" to build and
          verify.
        required: false
        default: "keep defer relay loom"
        type: string
      ref:
        description: >-
          Git ref (branch, tag, or commit SHA) to build and test. Leave
          empty to use the dispatching ref.
        required: false
        default: ""
        type: string

# The four apps share one physical cluster and one acceptance-pool with the
# lumen/sift/tape acceptance flow: two runs resizing the pool under each
# other would kill each other's pods, so runs queue instead of overlapping.
# cancel-in-progress stays false — cancelling a run mid-flight is the one
# path where the run.sh EXIT trap may not fire (runner teardown), which is
# why the park step below is `if: always()` belt-and-suspenders.
concurrency:
  group: gke-acceptance
  cancel-in-progress: false

permissions:
  id-token: write # GCP Workload Identity Federation (keyless auth)
  packages: write # called *-test-image.yml workflows push to GHCR
  contents: read

jobs:
  build-keep:
    if: contains(inputs.apps, 'keep')
    uses: ./.github/workflows/keep-test-image.yml
    permissions:
      packages: write
      contents: read
    with:
      ref: ${{ inputs.ref }}

  build-defer:
    if: contains(inputs.apps, 'defer')
    uses: ./.github/workflows/defer-test-image.yml
    permissions:
      packages: write
      contents: read
    with:
      ref: ${{ inputs.ref }}

  build-relay:
    if: contains(inputs.apps, 'relay')
    uses: ./.github/workflows/relay-test-image.yml
    permissions:
      packages: write
      contents: read
    with:
      ref: ${{ inputs.ref }}

  build-loom:
    if: contains(inputs.apps, 'loom')
    uses: ./.github/workflows/loom-test-image.yml
    permissions:
      packages: write
      contents: read
    with:
      ref: ${{ inputs.ref }}

  acceptance:
    name: deploy + verify on GKE
    needs: [build-keep, build-defer, build-relay, build-loom]
    # Run when every SELECTED app's image built (deselected builds are
    # skipped, which must not skip this job); refuse to burn cluster time
    # when any selected build failed.
    if: >-
      ${{ !cancelled()
          && needs.build-keep.result != 'failure'
          && needs.build-defer.result != 'failure'
          && needs.build-relay.result != 'failure'
          && needs.build-loom.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      TFSTATE_BUCKET: ${{ vars.GCP_TFSTATE_BUCKET }}
      APPS: ${{ inputs.apps }}
      RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
      # A deselected app's build job is skipped and its output is empty;
      # run.sh only requires <APP>_IMAGE for apps actually listed in APPS.
      KEEP_IMAGE: ${{ needs.build-keep.outputs.image }}
      DEFER_IMAGE: ${{ needs.build-defer.outputs.image }}
      RELAY_IMAGE: ${{ needs.build-relay.outputs.image }}
      LOOM_IMAGE: ${{ needs.build-loom.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # runner.temp is not available in job-level env, so the evidence dir
      # lands in GITHUB_ENV here for the harness and the upload step alike.
      - name: Prepare evidence directory
        run: echo "EVIDENCE_DIR=${RUNNER_TEMP}/gke-harness-evidence" >> "$GITHUB_ENV"

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud + GKE auth plugin
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      # terraform, kubectl, kustomize, jq, curl are all preinstalled on
      # ubuntu-latest runners; the harness scripts assert their own inputs.
      - name: Run acceptance harness
        run: acceptance/gke-harness/scripts/run.sh

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gke-acceptance-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 14

      # run.sh's EXIT trap already parks on every in-process failure path;
      # this catches the paths where the process itself was torn down
      # (runner cancellation, timeout-minutes kill). park.sh exits 0 when
      # the cluster does not exist, so this never fails a green run.
      - name: Park node pool (belt and suspenders)
        if: always()
        run: acceptance/gke-harness/scripts/park.sh
