name: relay-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Relay semver without the relay@ prefix.
        required: true
        type: string
      candidate_run_id:
        description: Exact successful relay-release-candidate run ID.
        required: true
        type: string
      candidate_run_attempt:
        description: Exact successful relay-release-candidate run attempt.
        required: true
        type: string
      gke_receipt_b64:
        description: Base64 of the sanitized relay-gke-receipt.json bytes.
        required: true
        type: string
      gke_receipt_sha256:
        description: Lowercase SHA-256 of the sanitized relay-gke-receipt.json bytes.
        required: true
        type: string
      gke_receipt_sidecar_b64:
        description: Base64 of the exact relay-gke-receipt.json.sha256 sidecar bytes.
        required: true
        type: string
      gke_receipt_sidecar_sha256:
        description: Lowercase SHA-256 of the exact relay-gke-receipt.json.sha256 sidecar bytes.
        required: true
        type: string

concurrency:
  group: relay-release-promotion-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify-inputs:
    name: prove immutable tag and candidate receipt
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
      pull-requests: read
    outputs:
      root_digest: ${{ steps.contract.outputs.root_digest }}
      amd64_digest: ${{ steps.contract.outputs.amd64_digest }}
      arm64_digest: ${{ steps.contract.outputs.arm64_digest }}
      candidate_attempt: ${{ steps.contract.outputs.candidate_attempt }}
      candidate_url: ${{ steps.contract.outputs.candidate_url }}
      pr_url: ${{ steps.contract.outputs.pr_url }}
      gke_receipt_sha256: ${{ steps.contract.outputs.gke_receipt_sha256 }}
      gke_receipt_sidecar_sha256: ${{ steps.contract.outputs.gke_receipt_sidecar_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Refuse the retired tag-first route
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || { echo "promotion is workflow_dispatch only" >&2; exit 1; }
          [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid version input" >&2; exit 1; }
          [[ "$GITHUB_REF" == "refs/tags/relay@${{ inputs.version }}" ]] || { echo "promotion must dispatch the exact annotated release tag" >&2; exit 1; }
          [[ "$GITHUB_WORKFLOW_REF" == "${GITHUB_REPOSITORY}/.github/workflows/relay-release.yml@${GITHUB_REF}" ]] || { echo "promotion workflow identity mismatch" >&2; exit 1; }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Decode and bind sanitized GKE receipt
        id: gke_receipt
        env:
          GKE_RECEIPT_B64: ${{ inputs.gke_receipt_b64 }}
          GKE_RECEIPT_SHA256: ${{ inputs.gke_receipt_sha256 }}
          GKE_RECEIPT_SIDECAR_B64: ${{ inputs.gke_receipt_sidecar_b64 }}
          GKE_RECEIPT_SIDECAR_SHA256: ${{ inputs.gke_receipt_sidecar_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gke-receipt
          decode_exact() {
            local encoded="$1" expected="$2" output="$3" actual
            [[ "$encoded" =~ ^[A-Za-z0-9+/]+={0,2}$ && $((${#encoded} % 4)) -eq 0 ]] || { echo "receipt input is not canonical base64" >&2; exit 1; }
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || { echo "receipt input SHA-256 is invalid" >&2; exit 1; }
            printf '%s' "$encoded" | base64 --decode > "$output"
            actual="$(sha256sum "$output" | awk '{print $1}')"
            [[ "$actual" == "$expected" ]] || { echo "receipt input SHA-256 does not bind decoded bytes" >&2; exit 1; }
          }
          decode_exact "$GKE_RECEIPT_B64" "$GKE_RECEIPT_SHA256" gke-receipt/relay-gke-receipt.json
          decode_exact "$GKE_RECEIPT_SIDECAR_B64" "$GKE_RECEIPT_SIDECAR_SHA256" gke-receipt/relay-gke-receipt.json.sha256
          {
            echo "receipt=$PWD/gke-receipt/relay-gke-receipt.json"
            echo "sidecar=$PWD/gke-receipt/relay-gke-receipt.json.sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Verify tag ruleset, candidate receipt, and supply chain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/release/verify-release-artifacts.sh --app relay \
            --repo chrischeng-c4/axiom \
            --tag "relay@${{ inputs.version }}" \
            --commit "$GITHUB_SHA" \
            --candidate-run-id "${{ inputs.candidate_run_id }}" \
            --candidate-run-attempt "${{ inputs.candidate_run_attempt }}" \
            --mode candidate \
            --gke-receipt "${{ steps.gke_receipt.outputs.receipt }}" \
            --gke-receipt-sidecar "${{ steps.gke_receipt.outputs.sidecar }}" \
            --output promotion-contract.json
      - name: Export immutable candidate contract
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg commit "$GITHUB_SHA" --arg run "${{ inputs.candidate_run_id }}" --arg attempt "${{ inputs.candidate_run_attempt }}" --arg receipt "${{ inputs.gke_receipt_sha256 }}" --arg sidecar "${{ inputs.gke_receipt_sidecar_sha256 }}" '
            .commit == $commit and .candidate_run_id == $run and
            .candidate_attempt == $attempt and
            .gke_receipt_sha256 == $receipt and
            .gke_receipt_sidecar_sha256 == $sidecar and
            ([.root_digest,.amd64_digest,.arm64_digest] | all(test("^sha256:[0-9a-f]{64}$")))
          ' promotion-contract.json >/dev/null
          {
            echo "root_digest=$(jq -r .root_digest promotion-contract.json)"
            echo "amd64_digest=$(jq -r .amd64_digest promotion-contract.json)"
            echo "arm64_digest=$(jq -r .arm64_digest promotion-contract.json)"
            echo "candidate_attempt=$(jq -r .candidate_attempt promotion-contract.json)"
            echo "candidate_url=$(jq -r .candidate_url promotion-contract.json)"
            echo "pr_url=$(jq -r .pr_url promotion-contract.json)"
            echo "gke_receipt_sha256=$(jq -r .gke_receipt_sha256 promotion-contract.json)"
            echo "gke_receipt_sidecar_sha256=$(jq -r .gke_receipt_sidecar_sha256 promotion-contract.json)"
          } >> "$GITHUB_OUTPUT"

  publish-release:
    name: promote exact candidate root and publish release
    needs: verify-inputs
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: read
      contents: write
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Decode and bind sanitized GKE receipt
        id: gke_receipt
        env:
          GKE_RECEIPT_B64: ${{ inputs.gke_receipt_b64 }}
          GKE_RECEIPT_SHA256: ${{ inputs.gke_receipt_sha256 }}
          GKE_RECEIPT_SIDECAR_B64: ${{ inputs.gke_receipt_sidecar_b64 }}
          GKE_RECEIPT_SIDECAR_SHA256: ${{ inputs.gke_receipt_sidecar_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gke-receipt
          decode_exact() {
            local encoded="$1" expected="$2" output="$3" actual
            [[ "$encoded" =~ ^[A-Za-z0-9+/]+={0,2}$ && $((${#encoded} % 4)) -eq 0 ]] || { echo "receipt input is not canonical base64" >&2; exit 1; }
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || { echo "receipt input SHA-256 is invalid" >&2; exit 1; }
            printf '%s' "$encoded" | base64 --decode > "$output"
            actual="$(sha256sum "$output" | awk '{print $1}')"
            [[ "$actual" == "$expected" ]] || { echo "receipt input SHA-256 does not bind decoded bytes" >&2; exit 1; }
          }
          decode_exact "$GKE_RECEIPT_B64" "$GKE_RECEIPT_SHA256" gke-receipt/relay-gke-receipt.json
          decode_exact "$GKE_RECEIPT_SIDECAR_B64" "$GKE_RECEIPT_SIDECAR_SHA256" gke-receipt/relay-gke-receipt.json.sha256
          {
            echo "receipt=$PWD/gke-receipt/relay-gke-receipt.json"
            echo "sidecar=$PWD/gke-receipt/relay-gke-receipt.json.sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Re-query exact candidate immediately before stable writes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/release/verify-release-artifacts.sh --app relay \
            --repo chrischeng-c4/axiom \
            --tag "relay@${{ inputs.version }}" \
            --commit "$GITHUB_SHA" \
            --candidate-run-id "${{ inputs.candidate_run_id }}" \
            --candidate-run-attempt "${{ inputs.candidate_run_attempt }}" \
            --mode candidate \
            --gke-receipt "${{ steps.gke_receipt.outputs.receipt }}" \
            --gke-receipt-sidecar "${{ steps.gke_receipt.outputs.sidecar }}" \
            --output promotion-contract.json
          jq -e \
            --arg root "${{ needs.verify-inputs.outputs.root_digest }}" \
            --arg amd64 "${{ needs.verify-inputs.outputs.amd64_digest }}" \
            --arg arm64 "${{ needs.verify-inputs.outputs.arm64_digest }}" \
            --arg receipt "${{ needs.verify-inputs.outputs.gke_receipt_sha256 }}" \
            --arg sidecar "${{ needs.verify-inputs.outputs.gke_receipt_sidecar_sha256 }}" \
            '.root_digest == $root and .amd64_digest == $amd64 and .arm64_digest == $arm64 and .gke_receipt_sha256 == $receipt and .gke_receipt_sidecar_sha256 == $sidecar' \
            promotion-contract.json >/dev/null
      - name: Exit safely if this exact public release already exists
        id: existing_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          query="query(\$owner:String!, \$name:String!, \$tag:String!) { repository(owner:\$owner, name:\$name) { release(tagName:\$tag) { id } } }"
          json="$(gh api graphql -f query="$query" -f owner="$GITHUB_REPOSITORY_OWNER" -f name="${GITHUB_REPOSITORY#*/}" -f tag="relay@${{ inputs.version }}")"
          if [[ "$(jq -r '.data.repository.release | if . == null then "absent" else "present" end' <<<"$json")" == present ]]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Verify existing public release without moving latest
        if: steps.existing_release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/release/verify-release-artifacts.sh --app relay \
            --repo chrischeng-c4/axiom \
            --tag "relay@${{ inputs.version }}" \
            --commit "$GITHUB_SHA" \
            --candidate-run-id "${{ inputs.candidate_run_id }}" \
            --candidate-run-attempt "${{ inputs.candidate_run_attempt }}" \
            --mode public \
            --gke-receipt "${{ steps.gke_receipt.outputs.receipt }}" \
            --gke-receipt-sidecar "${{ steps.gke_receipt.outputs.sidecar }}" \
            --output promotion-contract.json
      - name: Download exact candidate release bytes
        if: steps.existing_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "${{ inputs.candidate_run_id }}" --repo "$GITHUB_REPOSITORY" --name "relay-release-candidate-${{ inputs.candidate_run_id }}-${{ needs.verify-inputs.outputs.candidate_attempt }}" --dir candidate
          [[ -f candidate/final-candidate-manifest.json && -f candidate/final-candidate-manifest.json.sha256 ]] || { echo "candidate receipt bytes are incomplete" >&2; exit 1; }
      - name: Promote exact root digest to semver and safe latest
        if: steps.existing_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          image_repo=ghcr.io/chrischeng-c4/relay
          root_digest="${{ needs.verify-inputs.outputs.root_digest }}"
          version="${{ inputs.version }}"
          root_ref="${image_repo}@${root_digest}"
          semver_ref="${image_repo}:${version}"
          digest_or_absent() {
            local ref="$1" error manifest status
            error="$(mktemp)"
            set +e
            manifest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>"$error")"
            status=$?
            set -e
            if [[ "$status" == 0 ]]; then
              rm -f "$error"
              jq -er '.digest' <<<"$manifest"
              return 0
            fi
            if grep -Eqi 'manifest unknown|not found' "$error"; then
              rm -f "$error"
              return 0
            fi
            cat "$error" >&2
            rm -f "$error"
            echo "cannot prove GHCR image state: $ref" >&2
            exit 1
          }
          semver_current="$(digest_or_absent "$semver_ref")"
          [[ -z "$semver_current" || "$semver_current" == "$root_digest" ]] || { echo "semver tag already points at a different root" >&2; exit 1; }
          latest_current="$(digest_or_absent "${image_repo}:latest")"
          latest_target=true
          if [[ -n "$latest_current" && "$latest_current" != "$root_digest" ]]; then
            newer_published=false
            latest_matches_newer=false
            latest_matches_older=false
            while IFS= read -r tag; do
              next="${tag#relay@}"
              [[ "$tag" =~ ^relay@[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
              if [[ "$(printf '%s\n%s\n' "$version" "$next" | sort -V | tail -n1)" == "$next" && "$next" != "$version" ]]; then
                newer_published=true
                digest="$(digest_or_absent "${image_repo}:${next}")"
                [[ -n "$digest" ]] || { echo "newer published semver image is absent: $next" >&2; exit 1; }
                [[ "$digest" == "$latest_current" ]] && latest_matches_newer=true
                continue
              fi
              [[ "$next" != "$version" ]] || continue
              digest="$(digest_or_absent "${image_repo}:${next}")"
              [[ -n "$digest" ]] || continue
              [[ "$digest" == "$latest_current" ]] && latest_matches_older=true
            done < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft | jq -r '.[] | select(.isDraft == false) | .tagName')
            if [[ "$newer_published" == true ]]; then
              if [[ "$latest_matches_newer" == true ]]; then
                latest_target=false
              else
                echo "latest does not match a newer published semver root" >&2
                exit 1
              fi
            elif [[ "$latest_matches_older" != true ]]; then
              echo "latest does not match an older published semver root" >&2
              exit 1
            fi
          fi
          docker buildx imagetools create --tag "$semver_ref" "$root_ref"
          [[ "$(docker buildx imagetools inspect "$semver_ref" --format '{{json .Manifest}}' | jq -er '.digest')" == "$root_digest" ]] || { echo "semver tag did not bind candidate root" >&2; exit 1; }
          if [[ "$latest_target" == true ]]; then
            [[ "$(digest_or_absent "${image_repo}:latest")" == "$latest_current" ]] || { echo "latest changed before write" >&2; exit 1; }
            docker buildx imagetools create --tag "${image_repo}:latest" "$root_ref"
            [[ "$(docker buildx imagetools inspect "${image_repo}:latest" --format '{{json .Manifest}}' | jq -er '.digest')" == "$root_digest" ]] || { echo "latest tag did not bind candidate root" >&2; exit 1; }
          fi
      - name: Create exact GitHub Release with candidate bytes
        if: steps.existing_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          # relay@${{ inputs.version }}

          - Source commit: $GITHUB_SHA
          - Pull request: ${{ needs.verify-inputs.outputs.pr_url }}
          - Candidate run: ${{ needs.verify-inputs.outputs.candidate_url }}
          - Promotion run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT
          - Root index digest: ${{ needs.verify-inputs.outputs.root_digest }}
          - linux/amd64 digest: ${{ needs.verify-inputs.outputs.amd64_digest }}
          - linux/arm64 digest: ${{ needs.verify-inputs.outputs.arm64_digest }}
          - GKE receipt SHA-256: ${{ needs.verify-inputs.outputs.gke_receipt_sha256 }}
          - GKE receipt sidecar SHA-256: ${{ needs.verify-inputs.outputs.gke_receipt_sidecar_sha256 }}
          - Release path: landed main -> immutable candidate -> digest-pinned GKE acceptance -> protected annotated tag -> no-rebuild promotion.
          - Compatibility: no HTTP, CLI, wire format, on-disk format, or Kubernetes manifest shape changed in this release.
          - Image: ghcr.io/chrischeng-c4/relay:${{ inputs.version }} is the root index digest above; latest moves only when this is the newest semver.
          EOF
          gh release create "relay@${{ inputs.version }}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "relay@${{ inputs.version }}" --notes-file release-notes.md \
            candidate/relay-*.tar.gz candidate/relay-*.tar.gz.sha256 candidate/spdx-amd64.json candidate/spdx-arm64.json gke-receipt/relay-gke-receipt.json gke-receipt/relay-gke-receipt.json.sha256
      - name: Publicly verify immutable tag, release bytes, and promoted image
        if: steps.existing_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/release/verify-release-artifacts.sh --app relay \
            --repo chrischeng-c4/axiom \
            --tag "relay@${{ inputs.version }}" \
            --commit "$GITHUB_SHA" \
            --candidate-run-id "${{ inputs.candidate_run_id }}" \
            --candidate-run-attempt "${{ inputs.candidate_run_attempt }}" \
            --mode public \
            --gke-receipt "${{ steps.gke_receipt.outputs.receipt }}" \
            --gke-receipt-sidecar "${{ steps.gke_receipt.outputs.sidecar }}" \
            --output promotion-contract.json
