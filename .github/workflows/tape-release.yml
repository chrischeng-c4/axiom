# Build `tape` binaries for its supported targets.
#
# Triggers:
#   - push of a tag matching `tape@*`   → build + attach to GitHub release
#                                         (e.g. tape@0.4.10, tape@1.2.3)
#   - workflow_dispatch                 → build artifacts only (manual smoke)
#
# Targets — 3, not the 5-target lumen matrix: tape's own release-asset
# consumers only understand these three. `apps/tape/install.sh` maps
# `uname -s`/`uname -m` to exactly `aarch64-apple-darwin` (rejecting Intel
# macOS outright), `x86_64-unknown-linux-gnu`, and `aarch64-unknown-linux-gnu`
# — no musl legs. `apps/tape/Dockerfile.release`'s fetch stage matches: its
# TARGETARCH case only has `amd64 → x86_64-unknown-linux-gnu` and
# `arm64 → aarch64-unknown-linux-gnu`, and its runtime base is
# `gcr.io/distroless/cc-debian12` (glibc-based), not the musl-only
# `static-debian12` lumen uses. Adding musl targets here would produce
# tarballs neither consumer downloads. (`cargo tree -p tape --features
# "operator self-update issue otel backup"` confirms tape's whole dependency
# graph is rustls-based with no openssl-sys, so this is a target-convention
# choice, not a musl-vs-openssl compatibility constraint.)
#
#   - aarch64-apple-darwin        (Apple Silicon,      macos-14 native)
#   - x86_64-unknown-linux-gnu    (most Linux servers, ubuntu-latest native)
#   - aarch64-unknown-linux-gnu   (Linux on ARM,       ubuntu-latest cross)
name: tape-release

on:
  push:
    tags:
      - "tape@*"
  workflow_dispatch:
    inputs:
      image_version:
        description: >-
          Existing tape release tag to containerize and push to GHCR
          (e.g. tape@0.4.10). Leave empty for a build-only smoke run.
        required: false
        default: ""

permissions:
  contents: write  # needed to create / upload release assets
  packages: write  # needed to push the GHCR image (#2462)

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation toolchain (Linux aarch64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tape-${{ matrix.target }}

      - name: Build tape binary
        # --bin tape: only the serving/CLI binary (skip tape-bench).
        # Features mirror lumen-release.yml's non-backup subset: `operator`
        # (k8s CRD/controller, matches apps/tape/Dockerfile's source-build
        # feature set) plus `self-update`/`issue`/`otel` for the published
        # CLI-convention trio and OTLP export. `backup` is deliberately
        # excluded, same as lumen's release build (apps/lumen/Cargo.toml
        # ships a `backup` feature that lumen-release.yml also does not
        # enable).
        run: cargo build --release --locked -p tape --bin tape --features "operator self-update issue otel" --target ${{ matrix.target }}

      - name: Package artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="tape-${{ matrix.target }}"
          # Build inside a `pkg/` staging dir, then tar with -C so the
          # archive layout is `tape-<target>/{tape,README.md}` — matches
          # what install.sh expects on extract.
          stage="pkg/${name}"
          mkdir -p "${stage}"
          cp "target/${{ matrix.target }}/release/tape" "${stage}/tape"
          cp apps/tape/README.md "${stage}/README.md"
          # Emit the tarball + sha256 into `out/` (workspace root) so
          # upload-artifact's preserved `out/` prefix is shallow and
          # the release glob below is predictable.
          mkdir -p out
          tarball="out/${name}.tar.gz"
          tar -C pkg -czf "${tarball}" "${name}"
          if command -v shasum >/dev/null; then
            shasum -a 256 "${tarball}" | awk '{print $1}' > "${tarball}.sha256"
          else
            sha256sum "${tarball}" | awk '{print $1}' > "${tarball}.sha256"
          fi
          echo "tarball=${tarball}" >> "${GITHUB_OUTPUT}"
          echo "sha=${tarball}.sha256" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@v4
        with:
          name: tape-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.sha }}
          if-no-files-found: error
          overwrite: true

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/tape@')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # upload-artifact@v4 preserves the source path (`out/...`) inside
      # the artifact, so after merge-multiple the layout is
      # `dist/out/tape-*.tar.gz`. Glob with `**` so the release picks
      # them up regardless of nesting depth.
      - name: List artifacts (debug)
        run: find dist -type f -maxdepth 4 -print

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/tape-*.tar.gz
            dist/**/tape-*.tar.gz.sha256
          generate_release_notes: true
          body: |
            `tape` release built from tag ${{ github.ref_name }}.

            ## Install

            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/apps/tape/install.sh | sh
            ```

            Or pick a target tarball below and extract it manually.
            macOS is Apple Silicon only; for Linux choose x86_64 or aarch64
            (glibc, not musl).

  # #2462: durable, digest-pinned container images per release. Runs after
  # `release` because `Dockerfile.release` downloads the published tarballs;
  # also runnable retroactively for an EXISTING release via workflow_dispatch
  # with `image_version` (that path pays an unused smoke build — acceptable
  # for a rare retro fill).
  ghcr-image:
    name: publish ghcr image
    needs: release
    if: >-
      !cancelled() && (
        (startsWith(github.ref, 'refs/tags/tape@') && needs.release.result == 'success')
        || (github.event_name == 'workflow_dispatch' && inputs.image_version != '')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag and image tags
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ inputs.image_version || github.ref_name }}"
          [[ "$raw" == tape@* ]] || {
            echo "expected a tape@<version> tag, got: $raw" >&2
            exit 1
          }
          semver="${raw#tape@}"
          tags="ghcr.io/${{ github.repository_owner }}/tape:${semver}"
          # `latest` only when cutting a NEW release; a retro fill of an old
          # version must not steal the floating tag.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tags="${tags},ghcr.io/${{ github.repository_owner }}/tape:latest"
          fi
          echo "release_tag=${raw}" >> "$GITHUB_OUTPUT"
          echo "semver=${semver}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/tape/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TAPE_VERSION=${{ steps.ver.outputs.release_tag }}
          tags: ${{ steps.ver.outputs.tags }}

      - name: Append image digest to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.release_tag }}"
          image="ghcr.io/${{ github.repository_owner }}/tape:${{ steps.ver.outputs.semver }}@${{ steps.push.outputs.digest }}"
          body="$(gh release view "$tag" --repo "${{ github.repository }}" --json body --jq .body)"
          if grep -qF "${{ steps.push.outputs.digest }}" <<<"$body"; then
            echo "digest already recorded"
            exit 0
          fi
          printf '%s\n\n## Container image\n\n```text\n%s\n```\n' "$body" "$image" \
            | gh release edit "$tag" --repo "${{ github.repository }}" --notes-file -
