[package]
name = "issue-client"
version = "0.1.0"
edition = "2021"
description = "Axiom Issue Client SDK (handles direct GitHub and Courier proxy modes)"

[dependencies]
anyhow = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
async-trait = "0.1"
percent-encoding = "2.3.1"

# We depend on cli-std to implement its IssueBackend trait!
cli-std = { path = "../../libs/cli-std" }
