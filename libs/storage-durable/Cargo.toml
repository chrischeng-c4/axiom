[package]
name = "storage-durable"
version = "0.1.0"
edition = "2021"
autotests = false
description = "Shared durable local-storage primitives: fsync policy, atomic replacement, CRC-framed logs, and sequence-named snapshot file stores."

[lib]
name = "storage_durable"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
crc32fast = "1.4"
fs2 = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "capacity_guard"
path = "e2e/capacity_guard.rs"

[[test]]
name = "data_root"
path = "e2e/data_root.rs"
