[project]
name = "storage-durable-external-contracts"
version = "0.0.0"
requires-python = ">=3.11"

[tool.aw.python-artifact]
protocol = "aw.python-artifact.v1"
entrypoint = "src/runner.py"
source_roots = ["src"]
dependency_files = ["pyproject.toml", "uv.lock"]
evidence_dir = "evidence"

[tool.aw.python-ec]
protocol = "aw.python-ec.v1"
author = "chrischeng"
efficiency_policy = "optional"

[[tool.aw.python-ec.cases]]
id = "crash-safe-replacement-behavior"
artifact_id = "artifact:storage-durable/crash-safe-replacement-behavior"
capability_id = "crash-safe-replacement"
use_case_id = "crash-safe-replacement"
dimension = "behavior"
applicability = "td"
test_path = "src/crash-safe-replacement-behavior.py"
promise = "Replacing a durable file writes the bytes to a staging path, flushes according to the caller's policy, renames the staging path onto the target, and then forces the parent directory. The target path is exactly the path the caller named, a repeated write replaces the contents rather than extending them, and the step order does not change with the policy."
oracle = "The contract drives the design against its own recording filesystem double, which appends one entry per operation, and compares the recorded operation sequence against a literal sequence the contract writes out itself for each of the four policies. It states the staging path as a literal derived from a target path it chose, so a design that stages beside the target under a different name, or in a different directory, fails the comparison. Replacement is checked by writing two different payloads to one path and pinning the final stored bytes as a literal. No expectation is read back from the design's own constants."
target = "rust"
command = "crash-safe-replacement-behavior"
evidence_paths = ["evidence/crash-safe-replacement-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "crash-safe-replacement-security"
artifact_id = "artifact:storage-durable/crash-safe-replacement-security"
capability_id = "crash-safe-replacement"
use_case_id = "crash-safe-replacement"
dimension = "security"
applicability = "td"
test_path = "src/crash-safe-replacement-security.py"
promise = "A replacement that fails before the rename publishes nothing: the target path still holds the complete previous version, and the partially written staging file is never visible under the target name. A staging file left behind by an earlier interrupted write is discarded before the new write begins, so its contents can never be renamed into place."
oracle = "The contract injects failure at each pre-rename step in turn — the staging create, the payload write, the file flush — through a filesystem double it programs itself, and after each failure requires the target path to hold the exact previous payload it seeded, byte for byte. It separately seeds a stale staging file whose contents differ from both the old and the new payload, runs a write that fails after the stale file was seeded, and requires that the stale bytes appear at neither the target path nor in the published result. The set of directory-open failure classes the design may tolerate is enumerated as a contract literal, and a class outside that set must propagate rather than be swallowed."
target = "rust"
command = "crash-safe-replacement-security"
evidence_paths = ["evidence/crash-safe-replacement-security.json"]

[[tool.aw.python-ec.cases]]
id = "torn-tail-recovery-behavior"
artifact_id = "artifact:storage-durable/torn-tail-recovery-behavior"
capability_id = "torn-tail-recovery"
use_case_id = "torn-tail-recovery"
dimension = "behavior"
applicability = "td"
test_path = "src/torn-tail-recovery-behavior.py"
promise = "A whole frame round-trips its sequence and its payload through the fixed-width header. Replay returns the frames whose sequence is strictly greater than the requested one, in file order, and reports the highest sequence it saw. Compaction rewrites the log to exactly the frames past the retention point, preserving their order and their payloads."
oracle = "The contract encodes a frame header itself from a sequence, a payload length, and a checksum it computes independently of the design, then requires the design to decode that byte string into the same sequence and payload — so a design that changes the field order, the field widths, or the byte order is caught by a buffer the contract built. Replay is exercised with a from-sequence in the middle of a log the contract laid out, and the expected surviving sequences are a literal list. Compaction is checked on a log whose retained and dropped frames the contract names explicitly, including the boundary frame whose sequence equals the retention point."
target = "rust"
command = "torn-tail-recovery-behavior"
evidence_paths = ["evidence/torn-tail-recovery-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "torn-tail-recovery-security"
artifact_id = "artifact:storage-durable/torn-tail-recovery-security"
capability_id = "torn-tail-recovery"
use_case_id = "torn-tail-recovery"
dimension = "security"
applicability = "td"
test_path = "src/torn-tail-recovery-security.py"
promise = "A damaged frame is refused, never repaired and never returned. A header cut short, a declared payload length larger than the file holds, and a payload whose checksum does not match the stored bytes each end the log at that offset for every reader. Recovery only ever shortens the file, and a declared length is never used to allocate before it has been checked against what the file actually holds."
oracle = "The contract builds a good log, records the offset it considers the good end, then appends each damage class in turn — a truncated header, a header declaring a length past end-of-file, a header declaring an enormous length, and a frame whose payload bytes were flipped after its checksum was computed — and requires the recovered frame list to equal the good prefix and the good end to equal the offset it recorded. It asserts refusal rather than repair by requiring the damaged bytes to be absent from every returned payload. It asserts the reopen never lengthens the file by comparing the file length before and after against literals it derived from its own frame layout. The enormous-length row requires the refusal to be reached by arithmetic rather than by attempting the allocation, observed as a refusal returned within a wall-clock bound the contract states; the stricter claim that the length comparison textually precedes the slice sized by it is not observable from outside the process, because Python clamps an over-long slice, and is held by a controller-side source check instead."
target = "rust"
command = "torn-tail-recovery-security"
evidence_paths = ["evidence/torn-tail-recovery-security.json"]

[[tool.aw.python-ec.cases]]
id = "sequence-ordered-snapshots-behavior"
artifact_id = "artifact:storage-durable/sequence-ordered-snapshots-behavior"
capability_id = "sequence-ordered-snapshots"
use_case_id = "sequence-ordered-snapshots"
dimension = "behavior"
applicability = "td"
test_path = "src/sequence-ordered-snapshots-behavior.py"
promise = "Listing a snapshot store returns its snapshots ascending by parsed sequence, the latest snapshot is the highest sequence regardless of the order the snapshots were written, and pruning to a retention count keeps the highest sequences and reports how many files it removed."
oracle = "The contract writes snapshots in an order chosen so that sequence order and lexicographic name order disagree — it includes a pair such as 9 and 10 under the same prefix — and pins the expected listing as a literal ascending sequence list. Latest is asserted against a payload the contract associates with the highest sequence, so returning the last-written file rather than the highest-sequence file fails. Pruning is exercised at a retention count below, equal to, and above the stored count, with the expected removed count and the expected surviving sequence list stated as literals for each."
target = "rust"
command = "sequence-ordered-snapshots-behavior"
evidence_paths = ["evidence/sequence-ordered-snapshots-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "sequence-ordered-snapshots-security"
artifact_id = "artifact:storage-durable/sequence-ordered-snapshots-security"
capability_id = "sequence-ordered-snapshots"
use_case_id = "sequence-ordered-snapshots"
dimension = "security"
applicability = "td"
test_path = "src/sequence-ordered-snapshots-security.py"
promise = "A file in the snapshot directory that does not parse as a snapshot of this store is not a snapshot of this store: another prefix, another extension, or an unparsable sequence means the file is absent from the listing, is never returned as the latest, and is never removed by pruning. Pruning removes at most the listed count minus the retention count and never touches a file it did not list."
oracle = "The contract seeds the directory with a foreign-name matrix it authors itself — the store's prefix with a non-numeric sequence, the store's prefix with a negative and with an overlong numeric sequence, another store's prefix with this store's extension, this store's prefix with another extension, a name with no separator, and a name whose sequence carries a leading zero or surrounding whitespace — and requires each to be absent from the listing. It then runs a prune and requires every seeded foreign file to still exist afterwards, with the removed count equal to a literal it computed from the legitimate snapshots alone. The legitimate set and the foreign set are both contract literals; neither is derived from what the design listed."
target = "rust"
command = "sequence-ordered-snapshots-security"
evidence_paths = ["evidence/sequence-ordered-snapshots-security.json"]
