[package]
name = "service-backup"
version = "0.1.0"
edition = "2021"
description = "Shared backup contract for axiom services: destination/policy schema, sink trait, local sink, and runner primitive. Services produce consistent snapshots; backup runners upload them."
autotests = false

[lib]
name = "service_backup"
path = "src/lib.rs"

[features]
default = []
http-client = ["dep:tokio", "dep:service-auth"]
s3 = ["dep:aws-config", "dep:aws-sdk-s3", "dep:tokio"]

[dependencies]
anyhow = { workspace = true }
aws-config = { version = "1", optional = true }
aws-sdk-s3 = { version = "1", optional = true }
cli-std = { path = "../cli-std", default-features = false }
storage-durable = { path = "../storage-durable" }
storage-object = { path = "../storage-object" }
serde = { workspace = true }
schemars = "0.8"
chrono = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
serde_json = { workspace = true }
tokio = { workspace = true, optional = true }
service-auth = { path = "../service-auth", optional = true }
urlencoding = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
jsonwebtoken = { workspace = true }
tempfile = "3"

[[test]]
name = "projected_admin_transport"
path = "e2e/projected_admin_transport.rs"
required-features = ["http-client"]
