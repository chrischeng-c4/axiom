promise = "Writing and restoring need different URI shapes. A destination names a prefix to write under; an object reference names one object to read. The reader accepts the same three schemes as the writer, resolving a `file://` URI to the exact path it was given and an object-store URI to its bucket and key."
oracle = "Row 2 reads the resolved local object's path field rather than a rendering, so a reader that keeps the scheme in the path is visible. Rows 4 and 5 hold the bucket fixed and vary only where the key's internal slashes fall, so a reader that splits on the last separator rather than the first fails row 5 alone. Row 7 proves leading slashes on the key are trimmed while internal ones survive, so a blanket strip is visible. Row 9 resolves the same URI text through the object reader and the destination parser and reads both results, so the two shapes are proven distinct rather than assumed."
target = "rust"
command = "exact-object-restore-fetch-behavior"
evidence_paths = ["evidence/exact-object-restore-fetch-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "exact-object-restore-fetch-security"
artifact_id = "artifact:service-backup/exact-object-restore-fetch-security"
capability_id = "exact-object-restore-fetch"
use_case_id = "exact-object-restore-fetch"
dimension = "security"
applicability = "td"
test_path = "src/exact-object-restore-fetch-security.py"
promise = "A bucket with no key, a key with no bucket, and a bucket with an empty key are all rejected, so a restore cannot be pointed at a prefix and read something arbitrary. An unsupported scheme's refusal names every supported scheme rather than a stale subset. The reader is deliberately narrower than the writer: the writer permits an empty prefix, the reader never permits an empty key."
oracle = "Row 1 rejects all three degenerate object forms in one observation and reads each refusal's own type name, so a reader that collapses them into one generic failure is visible. Row 3 pairs each degenerate form with the writer's verdict on the same text, so the deliberate asymmetry is proven rather than asserted. Row 5 supplies a key that is only slashes, so a check written against the empty string rather than against the trimmed key is caught. Row 7 reads the unsupported-scheme refusal's carried tuple and compares it with the scheme inventory, so the read path cannot drift from the write path. Row 10 proves the unlinked-adapter refusal is reached only after the bucket and key are validated, so a build without the feature still rejects a keyless URI as keyless."
target = "rust"
command = "exact-object-restore-fetch-security"
evidence_paths = ["evidence/exact-object-restore-fetch-security.json"]

