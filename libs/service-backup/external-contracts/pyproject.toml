[project]
name = "service-backup-external-contracts"
version = "0.0.0"
requires-python = ">=3.11"

[tool.aw.python-artifact]
protocol = "aw.python-artifact.v1"
entrypoint = "src/runner.py"
source_roots = ["src"]
dependency_files = ["pyproject.toml", "uv.lock"]
evidence_dir = "evidence"

[tool.aw.python-ec]
protocol = "aw.python-ec.v1"
author = "chrischeng"
efficiency_policy = "optional"

[[tool.aw.python-ec.cases]]
id = "destination-uri-contract-behavior"
artifact_id = "artifact:service-backup/destination-uri-contract-behavior"
capability_id = "destination-uri-contract"
use_case_id = "destination-uri-contract"
dimension = "behavior"
applicability = "td"
test_path = "src/destination-uri-contract-behavior.py"
promise = "One operator-written string is read by exactly one parser, which accepts three schemes: `file://` for a local path, `s3://` for an S3-compatible object store, and `gs://` for Google Cloud Storage. For the two object-store forms the first path segment is the bucket and the remainder is the prefix, with surrounding slashes trimmed. `identity` renders a parsed destination back to a canonical string for logs and status, and `default_prefix` supplies `backup` when none was given."
oracle = "Rows 1 through 3 parse one well-formed URI per scheme and read the parsed value's own fields rather than its identity string, so a parser that produces the right rendering from the wrong split still fails. Row 4 renders all three identities in one tuple, so a scheme whose rendering drifts is visible as one changed element rather than as a whole-case failure. Rows 6 and 7 hold the bucket fixed and vary only the slashes around the prefix, so a trim applied on the wrong side is visible as an asymmetric result. Row 9 pins that a prefix-less object-store URI yields the empty prefix while `default_prefix` still answers `backup`, so the two are proven distinct rather than conflated."
target = "rust"
command = "destination-uri-contract-behavior"
evidence_paths = ["evidence/destination-uri-contract-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "destination-uri-contract-security"
artifact_id = "artifact:service-backup/destination-uri-contract-security"
capability_id = "destination-uri-contract"
use_case_id = "destination-uri-contract"
dimension = "security"
applicability = "td"
test_path = "src/destination-uri-contract-security.py"
promise = "A URI whose bucket is empty is rejected rather than silently producing a bucketless request. Anything outside the three accepted schemes is refused with an error that names every scheme this build accepts, so an operator who typed `ftp://` learns the alternatives from the failure instead of from the source. The accepted set is a single constant which also records whether a live sink for that scheme is linked into this build."
oracle = "Row 1 rejects an empty bucket for both object-store schemes in one observation, so a guard added to only one arm fails visibly. Row 4 reads the refusal's carried scheme tuple rather than its rendered sentence, so a message that happens to mention a scheme it does not accept still fails. Row 5 compares that carried tuple against the scheme inventory the parser itself publishes, so a stale subset is caught without the case restating the list. Row 8 proves the refusal is a returned value and not a raised exception, so a caller that forgets to check the return cannot mistake a refusal for a parse."
target = "rust"
command = "destination-uri-contract-security"
evidence_paths = ["evidence/destination-uri-contract-security.json"]

[[tool.aw.python-ec.cases]]
id = "crd-safe-scheduled-policy-behavior"
artifact_id = "artifact:service-backup/crd-safe-scheduled-policy-behavior"
capability_id = "crd-safe-scheduled-policy"
use_case_id = "crd-safe-scheduled-policy"
dimension = "behavior"
applicability = "td"
test_path = "src/crd-safe-scheduled-policy-behavior.py"
promise = "The operator-facing shape is flat — a cron string, a destination string, and an optional retention in seconds — and its generated schema has no `oneOf`, `anyOf`, or `allOf`, so a Kubernetes structural schema can hold it. Serialization is camelCase throughout, and an absent retention is omitted from the JSON rather than emitted as null. A valid conversion carries schedule, destination and retention through to the runtime policy unchanged."
oracle = "Row 2 reads the serialized key tuple in order, so a field emitted under a snake_case name is visible as a changed key rather than as a missing value. Row 3 omits the retention and reads the key set again, so an implementation that emits a null retention fails while one that omits it passes. Rows 6 and 7 hold the destination fixed and vary only the retention between a value and absent, so a conversion that defaults an absent retention to zero fails row 7 alone. Row 9 walks the generated schema for all three combinator keys, so adding only a `oneOf` guard leaves `anyOf` visible."
target = "rust"
command = "crd-safe-scheduled-policy-behavior"
evidence_paths = ["evidence/crd-safe-scheduled-policy-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "crd-safe-scheduled-policy-security"
artifact_id = "artifact:service-backup/crd-safe-scheduled-policy-security"
capability_id = "crd-safe-scheduled-policy"
use_case_id = "crd-safe-scheduled-policy"
dimension = "security"
applicability = "td"
test_path = "src/crd-safe-scheduled-policy-security.py"
promise = "Crossing from the flat projection to the runtime policy happens through exactly one method, which is also the only validation point: an empty or whitespace-only schedule is rejected, and the destination string is run through the same parser the writer uses, so an unparseable destination fails at admission rather than at 03:00 when the CronJob fires."
oracle = "Rows 1 and 2 hold the destination valid and vary only the schedule across empty, spaces, and tabs, so a check that tests only for the empty string fails row 2 alone. Row 4 holds the schedule valid and supplies an unparseable destination, and reads the returned error's own type name, so a conversion that swallows the parse failure into a generic rejection is visible. Row 6 proves the schedule is checked before the destination by supplying both invalid at once and reading which refusal came back. Row 9 proves a rejection returns rather than raises, so admission code that inspects the return value is enough."
target = "rust"
command = "crd-safe-scheduled-policy-security"
evidence_paths = ["evidence/crd-safe-scheduled-policy-security.json"]

[[tool.aw.python-ec.cases]]
id = "retained-object-write-behavior"
artifact_id = "artifact:service-backup/retained-object-write-behavior"
capability_id = "retained-object-write"
use_case_id = "retained-object-write"
dimension = "behavior"
applicability = "td"
test_path = "src/retained-object-write-behavior.py"
promise = "One backup run is one call. It takes an already-consistent payload and a timestamp, plans the object it writes, then applies the policy's age retention, and returns what it actually did: the sink identity, the key written, the payload's byte count, and how many objects retention removed. A policy with no maximum age prunes nothing and reports zero rather than skipping the field. The key is derived from the timestamp, so objects sort by time and retention has something to work with."
oracle = "Row 3 reads the run result's four fields as one tuple against the four values handed in, so a summary constructed from defaults rather than from the inputs fails. Rows 5 and 6 hold the existing keys fixed and vary only the retention between absent and a finite age, so an implementation that prunes unconditionally fails row 5 alone. Row 8 proves the object just written is itself a prune candidate at zero age, so a runner that excludes its own key from retention is visible. Row 10 pins the local and object-store key shapes in one observation, so a sink kind that borrows the other's naming is visible as one changed element."
target = "rust"
command = "retained-object-write-behavior"
evidence_paths = ["evidence/retained-object-write-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "retained-object-write-security"
artifact_id = "artifact:service-backup/retained-object-write-security"
capability_id = "retained-object-write"
use_case_id = "retained-object-write"
dimension = "security"
applicability = "td"
test_path = "src/retained-object-write-security.py"
promise = "The key built for a normalized nested prefix is exact, and the inverse parser recovers the timestamp from it while returning nothing for a key it did not write — so retention on a shared prefix deletes only this crate's own objects, never a foreign object that merely shares the prefix."
oracle = "Row 2 feeds the inverse parser a name with this crate's prefix but a foreign body, so a parser that only checks the prefix is visible. Row 3 varies the timestamp body across empty, non-decimal, and signed forms, so an implementation that reaches for a permissive integer conversion fails on the signed form alone. Row 5 offers a key under a sibling prefix whose name begins with the real one, so a prefix test written as a bare string prefix rather than a path-segment boundary is caught. Row 7 runs a whole prune plan over a mixed listing and reads exactly which keys it selected, so a plan that returns the right count from the wrong set still fails. Row 10 proves an expiry boundary is exclusive on the cutoff second itself."
target = "rust"
command = "retained-object-write-security"
evidence_paths = ["evidence/retained-object-write-security.json"]

[[tool.aw.python-ec.cases]]
id = "fail-loud-unlinked-adapter-behavior"
artifact_id = "artifact:service-backup/fail-loud-unlinked-adapter-behavior"
capability_id = "fail-loud-unlinked-adapter"
use_case_id = "fail-loud-unlinked-adapter"
dimension = "behavior"
applicability = "td"
test_path = "src/fail-loud-unlinked-adapter-behavior.py"
promise = "S3 support is a build feature, so a runner can be built without it. A policy naming an `s3://` destination still parses in such a build — the schema is stable regardless of what is linked — but the sink it resolves to is an unsupported placeholder whose failure names the destination, the missing feature, and the exact remedy. Per-build sink availability is published alongside each scheme, so an operator can see which of the parseable schemes can actually store anything."
oracle = "Row 1 proves the parse of an `s3://` URI is identical with and without the feature, so a build that refuses to parse what it cannot store fails. Row 3 reads the selected sink kind for the same destination under both builds, so a build that silently selects the local sink is visible as a changed kind rather than as an error. Row 5 reads the refusal's carried destination and feature fields rather than its sentence, so a message that names the remedy for the wrong destination still fails. Row 8 reads sink availability per scheme under both builds in one observation, so a flag hand-maintained apart from the feature is visible as a scheme whose availability does not move."
target = "rust"
command = "fail-loud-unlinked-adapter-behavior"
evidence_paths = ["evidence/fail-loud-unlinked-adapter-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "fail-loud-unlinked-adapter-security"
artifact_id = "artifact:service-backup/fail-loud-unlinked-adapter-security"
capability_id = "fail-loud-unlinked-adapter"
use_case_id = "fail-loud-unlinked-adapter"
dimension = "security"
applicability = "td"
test_path = "src/fail-loud-unlinked-adapter-security.py"
promise = "A destination carrying a credentials secret is rejected at sink construction with the secret name in the refusal, because secret-mounted credentials are not implemented — so an unimplemented credential path cannot silently degrade to ambient credentials that may belong to a different account. A build silently falling back to a local path would report a successful backup while the bytes never reached the bucket the operator asked for; that fallback does not exist."
oracle = "Row 1 supplies a credentials secret on both object-store schemes in one observation, so a rejection wired into only one arm is visible. Row 3 reads the refusal's carried destination and secret fields, so a refusal that names a different destination than the one supplied still fails. Row 5 holds the credentials secret fixed and varies only the build feature, so a rejection reachable only in one build is visible. Row 7 proves the empty string is a present secret rather than an absent one, so a check written as a truthiness test rather than an absence test is caught. Row 9 proves no destination anywhere in the matrix resolves to the local sink, so a fallback introduced later fails this row rather than passing quietly."
target = "rust"
command = "fail-loud-unlinked-adapter-security"
evidence_paths = ["evidence/fail-loud-unlinked-adapter-security.json"]

