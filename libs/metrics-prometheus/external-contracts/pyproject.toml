[project]
name = "metrics-prometheus-external-contracts"
version = "0.0.0"
requires-python = ">=3.11"

[tool.aw.python-artifact]
protocol = "aw.python-artifact.v1"
entrypoint = "src/runner.py"
source_roots = ["src"]
dependency_files = ["pyproject.toml", "uv.lock"]
evidence_dir = "evidence"

[tool.aw.python-ec]
protocol = "aw.python-ec.v1"
author = "chrischeng"
efficiency_policy = "optional"

[[tool.aw.python-ec.cases]]
id = "lock-free-accumulation-behavior"
artifact_id = "artifact:metrics-prometheus/lock-free-accumulation-behavior"
capability_id = "lock-free-accumulation"
use_case_id = "lock-free-accumulation"
dimension = "behavior"
applicability = "td"
test_path = "src/lock-free-accumulation-behavior.py"
promise = "A counter accumulates additively and its total does not depend on the order the increments arrived in. A gauge holds the last value written and nothing else. A latency records a sum and a count that agree with the durations fed to it. A histogram assigns each observation to the first bucket whose upper bound it does not exceed, so an observation lands in exactly one stored bucket, and its sum and total count agree with what was observed."
oracle = "The contract feeds a fixed multiset of observations it authored itself, once in the order it wrote them and once in a permutation it also wrote itself, and requires the two runs to produce the same per-bucket counts, the same sum, and the same total — an order-dependent accumulator is caught by a permutation the design never sees. Per-bucket counts are pinned as a literal tuple the contract derived by hand from its bounds and its observations, so a design that assigns an observation to the wrong bucket, or to more than one, fails the comparison. Boundary observations exactly equal to a bound are stated explicitly as belonging to that bound's bucket rather than the next. No expected value is read back from the design's own constants or from a second call into the design."
target = "rust"
command = "lock-free-accumulation-behavior"
evidence_paths = ["evidence/lock-free-accumulation-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "lock-free-accumulation-security"
artifact_id = "artifact:metrics-prometheus/lock-free-accumulation-security"
capability_id = "lock-free-accumulation"
use_case_id = "lock-free-accumulation"
dimension = "security"
applicability = "td"
test_path = "src/lock-free-accumulation-security.py"
promise = "No observation is lost and none is counted twice. An observation above every declared bound increments no stored bucket but still reaches the sum and the total count, so the total is never smaller than the number of observations made. A counter cannot be moved backwards by any operation the surface exposes, and the sum is accumulated as an integer so it carries no rounding error."
oracle = "The contract observes a value strictly greater than the largest declared bound and requires the total count to have risen by exactly one and the sum to have risen by exactly that value, both stated as literals, while the tuple of stored bucket counts is required to be unchanged from a literal the contract recorded beforehand — a design that silently drops the overflow observation, or that folds it into the last bucket, fails a different row in each case. It separately requires the sum of the stored bucket counts to equal the total count minus a literal overflow count the contract computed itself. It drives a counter through the full set of mutating operations the surface exposes and requires the value after each to be greater than or equal to the value before, comparing against literals rather than against the previous reading."
target = "rust"
command = "lock-free-accumulation-security"
evidence_paths = ["evidence/lock-free-accumulation-security.json"]

[[tool.aw.python-ec.cases]]
id = "exposition-encoding-behavior"
artifact_id = "artifact:metrics-prometheus/exposition-encoding-behavior"
capability_id = "exposition-encoding"
use_case_id = "exposition-encoding"
dimension = "behavior"
applicability = "td"
test_path = "src/exposition-encoding-behavior.py"
promise = "Each metric family emits its HELP line, then its TYPE line, then its value lines, and families appear in the order the caller supplied them. Histogram bucket rows are cumulative, ascend by bound, and close with an +Inf row whose value is the total observation count, followed by the sum and the count. Rendering the same input twice produces the same bytes."
oracle = "The contract pins the rendered output of a small family list as a literal line list it wrote out itself, so a design that reorders families, sorts them, drops a declaration line, or changes the separator fails on a byte comparison against text the design never produced. Cumulative bucket rows are checked by pinning the expected running totals as a literal ascending tuple whose last element the contract states independently as the total count, so a design that emits exclusive counts fails on the interior rows while a design that miscounts fails on the +Inf row. Determinism is checked by rendering the identical input twice and requiring the two outputs to be equal to each other and to the contract's literal."
target = "rust"
command = "exposition-encoding-behavior"
evidence_paths = ["evidence/exposition-encoding-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "exposition-encoding-security"
artifact_id = "artifact:metrics-prometheus/exposition-encoding-security"
capability_id = "exposition-encoding"
use_case_id = "exposition-encoding"
dimension = "security"
applicability = "td"
test_path = "src/exposition-encoding-security.py"
promise = "The published sum is derived by exact integer arithmetic and never by a floating-point division, so it neither gains nor loses precision as the observed total grows. A power-of-ten divisor yields an integer part and a zero-padded remainder of exactly as many digits as the divisor has zeros; a divisor that is not a power of ten degrades to integer division rather than publishing a fraction that is not the real one; and a zero divisor does not abort the render. Cumulative bucket values never decrease along the row order."
oracle = "The contract states each scaling result as a literal string it computed by hand — including a remainder whose leading zeros are significant, such as a value whose fractional digits begin with a zero, which a naive integer-to-string conversion of the remainder would silently shorten — and a total large enough that a float division would round it. Non-power-of-ten and zero divisors are stated as literal expected strings so a design that raises, returns an empty string, or emits a decimal point with no digits is caught. Monotonicity of the cumulative rows is checked by extracting the rendered bucket values with the contract's own parser and comparing against a literal ascending tuple, not by asking the design for its running total."
target = "rust"
command = "exposition-encoding-security"
evidence_paths = ["evidence/exposition-encoding-security.json"]

[[tool.aw.python-ec.cases]]
id = "label-value-containment-behavior"
artifact_id = "artifact:metrics-prometheus/label-value-containment-behavior"
capability_id = "label-value-containment"
use_case_id = "label-value-containment"
dimension = "behavior"
applicability = "td"
test_path = "src/label-value-containment-behavior.py"
promise = "Labels within a row are emitted in a canonical order — ascending by name, then by value — so the same label set built in two different orders renders identically. A row with no labels renders without a brace group at all, and a value containing no special character passes through unchanged."
oracle = "The contract builds one label set twice, in two orders it chose so that insertion order and canonical order disagree, and requires the two rendered lines to be equal to each other and to a literal line the contract wrote out. It pins the unlabeled row as a literal that contains no brace character, so a design that emits an empty brace group fails. It pins the pass-through of an ordinary value as an equality against the input string stated as its own literal, so a design that escapes unconditionally is caught."
target = "rust"
command = "label-value-containment-behavior"
evidence_paths = ["evidence/label-value-containment-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "label-value-containment-security"
artifact_id = "artifact:metrics-prometheus/label-value-containment-security"
capability_id = "label-value-containment"
use_case_id = "label-value-containment"
dimension = "security"
applicability = "td"
test_path = "src/label-value-containment-security.py"
promise = "A label value is data and can never become structure. A value carrying a double quote, a backslash, a newline, or a fully formed injected label set renders as exactly one sample line whose label count is the one the caller declared, and the injected text appears only inside the escaped value."
oracle = "The contract seeds a label-value matrix it authors itself — a bare double quote, a bare backslash, a newline, a backslash immediately followed by a quote, and a payload shaped like a complete closing brace plus a second sample line — and for each requires the rendered output to contain exactly one newline-terminated sample line, stated as a literal line count, and the number of top-level label separators inside the brace group to equal a literal the contract derived from the label set it supplied, counted by the contract's own scan over the escaped text rather than by asking the design. It pins the escaped form of each seeded value as a literal string, so a design that escapes into the wrong sequence, escapes only the first occurrence, or double-escapes an already escaped backslash is caught by a value the design never chose."
target = "rust"
command = "label-value-containment-security"
evidence_paths = ["evidence/label-value-containment-security.json"]
