[package]
name = "service-tls"
version = "0.1.0"
edition = "2021"
description = "Shared peer-mTLS material loading for the ecosystem's mutually-authenticated peer/replication ports: PEM cert/key/CA loaders, rustls server/client config builders, and the Once-guarded default-crypto-provider install, parameterized by a caller-supplied env prefix. lumen's `LUMEN_PEER_TLS_*`/`LUMEN_PEER_MTLS` loading moves here verbatim; keep/relay/beam are future adopters."

[lib]
name = "service_tls"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
rustls = "0.23"
rustls-pemfile = "2"
