[package]
name = "server-tcp"
version = "0.1.0"
edition = "2021"
description = "Shared TCP protocol runtime built on server-lifecycle: accept loop, per-connection supervision, admission budgeting, drain-aware shutdown, and handler traits."


# e2e tests live in e2e/, not Cargo's autodiscovered tests/, so every one
# of them has to be declared below. The list is this crate's e2e inventory.
autotests = false

[lib]
name = "server_tcp"
path = "src/lib.rs"

[dependencies]
server-lifecycle = { path = "../server-lifecycle" }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
socket2 = "0.6"

[[test]]
name = "lifecycle_report"
path = "e2e/lifecycle_report.rs"
