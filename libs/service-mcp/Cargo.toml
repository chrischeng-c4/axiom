[package]
name = "service-mcp"
version = "0.1.0"
edition = "2021"
description = "Shared MCP stdio and streamable HTTP transport with browser security policy."
autotests = false

[dependencies]
anyhow.workspace = true
axum.workspace = true
rmcp = { version = "3.1.4", features = ["server", "transport-io", "transport-streamable-http-server"] }
service-auth = { path = "../service-auth" }
tokio.workspace = true
tower.workspace = true

[[test]]
name = "mcp_transport_contract"
path = "e2e/mcp_transport_contract.rs"
