[package]
name = "service-k8s"
version = "0.1.0"
edition = "2021"
description = "Shared Kubernetes integration for Axiom services: managed-service reconciliation, leader election, CRD and workload rendering, stateful capacity planning, and resize primitives."


# e2e tests live in e2e/, not Cargo's autodiscovered tests/, so every one
# of them has to be declared below. The list is this crate's e2e inventory.
autotests = false

[lib]
name = "service_k8s"
path = "src/lib.rs"

[features]
# `full` is the compatibility profile used by existing operators.  The
# render-only profile is intentionally additive: it names the pure rendering
# surface without changing the default build or the source-compatible adapter.
default = ["full"]
render-only = []
controller = ["render-only", "dep:kube", "dep:k8s-openapi", "dep:axum", "dep:metrics-prometheus", "dep:cli-std"]
certificate = ["dep:rcgen", "dep:x509-parser", "dep:kube", "dep:k8s-openapi"]
gcp-cas-client = ["certificate", "dep:reqwest", "dep:serde_urlencoded"]
# Compatibility alias retained for downstream manifests.
gcp-cas = ["full"]
full = ["controller", "certificate", "gcp-cas-client"]

[dependencies]
# Pinned to Lumen's operator surface so the workspace lock stays single-versioned.
kube = { version = "0.98", features = ["runtime", "derive", "client"], optional = true }
k8s-openapi = { version = "0.24", features = ["v1_32"], optional = true }
cli-std = { path = "../cli-std", default-features = false, optional = true }
metrics-prometheus = { path = "../metrics-prometheus", optional = true }
# HTTP/1.1 on purpose: the controller's `/metrics` is a Prometheus scrape
# target, so the kit's h2c `service-http` is the wrong transport here (#2620).
axum = { workspace = true, optional = true }
schemars = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
# Certificate lifecycle (#3110). `rcgen` needs `x509-parser` to parse a CSR back
# out of PEM, which the in-process signer does on every issuance.
rcgen = { version = "0.13", features = ["pem", "x509-parser"], optional = true }
x509-parser = { version = "0.17", optional = true }
sha2 = "0.10"
base64 = { workspace = true }
time = { version = "0.3", default-features = false }
# Optional: only the CA Service requester talks to a network.
reqwest = { workspace = true, optional = true }
serde_urlencoded = { version = "0.7", optional = true }

[dev-dependencies]
http = { workspace = true }
tower = { workspace = true }
# The certificate lifecycle tests drive an async loop with no runtime of their
# own: every future in it is already resolved, so `block_on` is honest here in a
# way a tokio runtime would only obscure.
futures = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[[test]]
name = "certificate_kubernetes_store"
path = "e2e/certificate_kubernetes_store.rs"
required-features = ["certificate"]

[[test]]
name = "certificate_lifecycle"
path = "e2e/certificate_lifecycle.rs"
required-features = ["certificate"]

[[test]]
name = "certificate_ownership"
path = "e2e/certificate_ownership.rs"
required-features = ["certificate"]

[[test]]
name = "certificate_rotation"
path = "e2e/certificate_rotation.rs"
required-features = ["certificate"]

[[test]]
name = "certificate_status"
path = "e2e/certificate_status.rs"
required-features = ["certificate"]

[[test]]
name = "lifecycle_render"
path = "e2e/lifecycle_render.rs"

[[test]]
name = "stateful_instance_render"
path = "e2e/stateful_instance_render.rs"

[[test]]
name = "stateful_adapter_equivalence"
path = "e2e/stateful_adapter_equivalence.rs"

[[test]]
name = "workload_plan"
path = "e2e/workload_plan.rs"

[[test]]
name = "prune_unserved_api_is_scoped"
path = "e2e/prune_unserved_api_is_scoped.rs"
required-features = ["controller"]

[[test]]
name = "status_conditions_survive_the_recovery_pass"
path = "e2e/status_conditions_survive_the_recovery_pass.rs"
required-features = ["controller"]

[[test]]
name = "reconcile_once_does_not_assume_leadership"
path = "e2e/reconcile_once_does_not_assume_leadership.rs"
required-features = ["controller"]

[[test]]
name = "certificate_rbac_least_privilege"
path = "e2e/certificate_rbac_least_privilege.rs"
required-features = ["certificate"]
