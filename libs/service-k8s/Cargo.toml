[package]
name = "service-k8s"
version = "0.1.0"
edition = "2021"
description = "Shared Kubernetes integration for Axiom services: managed-service reconciliation, leader election, CRD and workload rendering, stateful capacity planning, and resize primitives."


# e2e tests live in e2e/, not Cargo's autodiscovered tests/, so every one
# of them has to be declared below. The list is this crate's e2e inventory.
autotests = false

[lib]
name = "service_k8s"
path = "src/lib.rs"

[features]
# The certificate lifecycle builds and tests with no cloud dependency at all
# (#3110 R8): `--no-default-features` drops the CA Service requester and leaves
# the state machine, the projection, and the in-process signer intact.
default = ["gcp-cas"]
gcp-cas = ["dep:reqwest", "dep:serde_urlencoded"]

[dependencies]
# Pinned to Lumen's operator surface so the workspace lock stays single-versioned.
kube = { version = "0.98", features = ["runtime", "derive", "client"] }
k8s-openapi = { version = "0.24", features = ["v1_32"] }
cli-std = { path = "../cli-std", default-features = false }
metrics-prometheus = { path = "../metrics-prometheus" }
# HTTP/1.1 on purpose: the controller's `/metrics` is a Prometheus scrape
# target, so the kit's h2c `service-http` is the wrong transport here (#2620).
axum = { workspace = true }
schemars = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
# Certificate lifecycle (#3110). `rcgen` needs `x509-parser` to parse a CSR back
# out of PEM, which the in-process signer does on every issuance.
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
x509-parser = "0.17"
sha2 = "0.10"
base64 = { workspace = true }
time = { version = "0.3", default-features = false }
# Optional: only the CA Service requester talks to a network.
reqwest = { workspace = true, optional = true }
serde_urlencoded = { version = "0.7", optional = true }

[dev-dependencies]
http = { workspace = true }
tower = { workspace = true }
# The certificate lifecycle tests drive an async loop with no runtime of their
# own: every future in it is already resolved, so `block_on` is honest here in a
# way a tokio runtime would only obscure.
futures = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[[test]]
name = "certificate_kubernetes_store"
path = "e2e/certificate_kubernetes_store.rs"

[[test]]
name = "certificate_lifecycle"
path = "e2e/certificate_lifecycle.rs"

[[test]]
name = "certificate_ownership"
path = "e2e/certificate_ownership.rs"

[[test]]
name = "certificate_rotation"
path = "e2e/certificate_rotation.rs"

[[test]]
name = "certificate_status"
path = "e2e/certificate_status.rs"

[[test]]
name = "lifecycle_render"
path = "e2e/lifecycle_render.rs"
