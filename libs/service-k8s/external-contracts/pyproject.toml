[[tool.aw.python-ec.cases]]
id = "scope-validated-certificate-identity-behavior"
artifact_id = "artifact:service-k8s/scope-validated-certificate-identity-behavior"
capability_id = "scope-validated-certificate-identity"
use_case_id = "scope-validated-certificate-identity"
dimension = "behavior"
applicability = "td"
test_path = "src/scope-validated-certificate-identity-behavior.py"
promise = "A certificate profile states what a service is asking a certificate for, and every derived value follows from the instance scope rather than from a caller-supplied literal. Purpose selects extended key usages exactly and not at least: a serving leaf carries serverAuth alone and a peer leaf carries both directions. The Secret name and the SPIFFE prefix are derived from the scope. The identity digest covers the certified content — purpose, common name, sorted DNS names, SPIFFE URI, and usages — and deliberately excludes the lifetime and the renewal cadence, so changing how often a certificate is renewed does not throw away a valid identity."
oracle = "Reads both purposes' usage sets as exact token tuples and as counts, so an over-broad list fails one of the two. Compares identity digests four ways — the same names in two orders, one changed name, an unchanged identity under three different lifetimes, and the two purposes over otherwise identical content — so a digest that ignores names entirely and a digest that is order-sensitive fail different rows. Row 13 pins the maximum accepted lifetime and row 14 pins jitter exactly equal to the whole renewal window, which the bound admits."
target = "rust"
command = "scope-validated-certificate-identity-behavior"
evidence_paths = ["evidence/scope-validated-certificate-identity-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "scope-validated-certificate-identity-security"
artifact_id = "artifact:service-k8s/scope-validated-certificate-identity-security"
capability_id = "scope-validated-certificate-identity"
use_case_id = "scope-validated-certificate-identity"
dimension = "security"
applicability = "td"
test_path = "src/scope-validated-certificate-identity-security.py"
promise = "Validation is a tenancy boundary, not a lint, and it runs at construction: a profile naming another namespace's DNS name, a namespace prefix rather than a namespace, a public name, or another tenant's SPIFFE URI is not rejected later — it cannot be built. A peer profile without a SPIFFE URI cannot be built either. Lifetime, renewal-window, and jitter bounds are refused locally rather than learned from a rejected CSR, and each refusal names the offending value so an operator reading it in a condition does not have to diff two lists."
oracle = "Every row builds a profile and observes the refusal's exception class name, or the literal string built when construction succeeded, so a dropped check is visible as an acceptance rather than as a differently-worded error. Row 2 uses lumen.lumen-prod.svc.cluster.local against namespace lumen, which both a prefix and a suffix check would accept. Row 8 reads the offending value straight off the refusal for three separate channels. Row 9 hides one bad name between two good ones."
target = "rust"
command = "scope-validated-certificate-identity-security"
evidence_paths = ["evidence/scope-validated-certificate-identity-security.json"]

[[tool.aw.python-ec.cases]]
id = "memoryless-rotation-decision-behavior"
artifact_id = "artifact:service-k8s/memoryless-rotation-decision-behavior"
capability_id = "memoryless-rotation-decision"
use_case_id = "memoryless-rotation-decision"
dimension = "behavior"
applicability = "td"
test_path = "src/memoryless-rotation-decision-behavior.py"
promise = "next_action decides the single next step from what the service wants, what the cluster currently shows, and what time it is, keeping no memory of its own past decisions. The ladder is ordered by what fails worst: trust, then bootstrap, then issuer change, then identity change, then expiry, then the rotation tail, then renewal. Each issuance carries a reason, so an operator can tell a routine renewal from a scramble. Renewal jitter is derived from the leaf's own fingerprint, so every process computes the same instant for the same certificate while different certificates still spread out, and retry backoff climbs to a five-minute ceiling and stays there."
oracle = "Walks every rung of the ladder with an observation that reaches exactly that rung, observing the action's type name together with its payload — the issue reason, the published issuer list, the retired issuer list, or the wait instant as an ISO string. Row 12 pins the two distinct jittered instants two different fingerprints produce over the same window, which a constant-jitter implementation cannot reproduce. Rows 14 and 15 pin the doubling curve and its saturation separately."
target = "rust"
command = "memoryless-rotation-decision-behavior"
evidence_paths = ["evidence/memoryless-rotation-decision-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "memoryless-rotation-decision-security"
artifact_id = "artifact:service-k8s/memoryless-rotation-decision-security"
capability_id = "memoryless-rotation-decision"
use_case_id = "memoryless-rotation-decision"
dimension = "security"
applicability = "td"
test_path = "src/memoryless-rotation-decision-security.py"
promise = "Trust is published before anything is issued, including when the observation is wholly empty and when the leaf is already expired and its identity has already moved — an identity-first ladder would issue from an issuer nobody trusts. Anchors are narrowed only after the runtime reports it is presenting the new leaf, never because a write succeeded. No reachable action removes the current leaf, and the closed action set contains no removal variant at all: it is not a rule the module follows but a sentence it cannot say. Backoff stays inside its base and its ceiling, and jitter never pushes a renewal past expiry."
oracle = "Row 3 reads the closed action set off the Action union itself and compares it to a sorted literal, so a new removal variant fails without anyone remembering to write a case for it. Rows 4 and 5 hold the observation fixed and vary only the activated fingerprint — absent, matching, and mismatched — so retirement gated on a write rather than on activation fails two rows. Rows 11 and 12 sweep twenty-one failure counts and bound the whole range rather than sampling one point."
target = "rust"
command = "memoryless-rotation-decision-security"
evidence_paths = ["evidence/memoryless-rotation-decision-security.json"]

[[tool.aw.python-ec.cases]]
id = "whole-layer-capacity-planning-behavior"
artifact_id = "artifact:service-k8s/whole-layer-capacity-planning-behavior"
capability_id = "whole-layer-capacity-planning"
use_case_id = "whole-layer-capacity-planning"
dimension = "behavior"
applicability = "td"
test_path = "src/whole-layer-capacity-planning-behavior.py"
promise = "A sharded service scales as a layer, not as a pod count. The replica planner takes CPU and memory utilization as two independent axes, computes a desired replica count per shard from each, and keeps the larger, so relieving one axis cannot starve the other. The ratio rounds up, so a shard that is over target is never left under-provisioned by truncation, and the resulting pod total is always a whole number of shard layers. A missing metric is a gap, not a zero: the layer holds. The shard planner splits on durable bytes, adds exactly one shard per decision, and breaks ties toward the lowest shard index so the same observation always names the same busiest shard."
oracle = "Reads desired replicas per shard and the derived pod total as one tuple per row, so a planner that scales correctly but multiplies by the wrong shard count fails on the second element. Row 3 gives CPU and memory opposing signals and pins the larger; row 4 pins a ratio whose exact quotient is fractional; row 5 sweeps five shard counts against one desired layer. Row 7 holds both metrics absent and pins the hold together with its membership-change flag. Row 12 pins the threshold at exactly one gibibyte from both sides, and row 14 presents the same tie in two observation orders."
target = "rust"
command = "whole-layer-capacity-planning-behavior"
evidence_paths = ["evidence/whole-layer-capacity-planning-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "whole-layer-capacity-planning-security"
artifact_id = "artifact:service-k8s/whole-layer-capacity-planning-security"
capability_id = "whole-layer-capacity-planning"
use_case_id = "whole-layer-capacity-planning"
dimension = "security"
applicability = "td"
test_path = "src/whole-layer-capacity-planning-security.py"
promise = "A scaling plan is a membership change to a consensus group, so every input is validated before any arithmetic runs and every refusal names its reason in the operator's words. A zero shard count, a zero current replica count, a zero minimum, inverted bounds, and an out-of-range utilization target are all refused locally. A pod total that would overflow the wire's u32 replica field is refused rather than truncated, and a split that would push the shard count past u32 is refused the same way. The ladder is ordered, so the cheapest structural check reports first and an operator is not told about a bad target when the topology itself is empty."
oracle = "Every row observes the refusal's variant name, so a dropped check is visible as an acceptance rather than as a differently-worded error. Rows 5 and 6 push each utilization target past both ends of 1..=100 and require the same refusal from both directions. Rows 8 and 15 stack two independent violations and pin which one reports, so a reordered ladder fails without changing any single-fault row. Rows 9 and 16 read every refusal message as one sorted-by-construction tuple, so a refusal that keeps its variant but loses its sentence still fails."
target = "rust"
command = "whole-layer-capacity-planning-security"
evidence_paths = ["evidence/whole-layer-capacity-planning-security.json"]

[[tool.aw.python-ec.cases]]
id = "clock-free-condition-projection-behavior"
artifact_id = "artifact:service-k8s/clock-free-condition-projection-behavior"
capability_id = "clock-free-condition-projection"
use_case_id = "clock-free-condition-projection"
dimension = "behavior"
applicability = "td"
test_path = "src/clock-free-condition-projection-behavior.py"
promise = "Conditions are projected from what the service currently reports plus what was already published, with the instant injected by the caller rather than read from a clock. A condition whose status is unchanged keeps its original transition instant while its reason, message, and observed generation all refresh, so an operator reading lastTransitionTime learns when the state actually changed and not when the controller last ran. A status flip, a first sighting, and a resurrection after an absence all take the injected instant. The emitted order is the order the service reported. The serialized shape is exactly metav1.Condition's, with an absent observed generation omitted rather than written as null."
oracle = "Row 1 and row 3 hold everything but the status fixed and differ only in whether it changed, so a projector that always refreshes and one that never refreshes each fail exactly one. Row 6 walks a condition out of the report and back in across three projections and pins that the instant did not survive the gap. Row 7 projects the same three facts in two orders and pins both sequences. Rows 9 through 11 read the serialized mapping by key with .get, so a renamed key is observed as an absence rather than raising."
target = "rust"
command = "clock-free-condition-projection-behavior"
evidence_paths = ["evidence/clock-free-condition-projection-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "clock-free-condition-projection-security"
artifact_id = "artifact:service-k8s/clock-free-condition-projection-security"
capability_id = "clock-free-condition-projection"
use_case_id = "clock-free-condition-projection"
dimension = "security"
applicability = "td"
test_path = "src/clock-free-condition-projection-security.py"
promise = "The projection reads no clock of its own: every instant in its output came either from the prior status it was handed or from the instant the caller injected, so the same inputs project to the same result on every process and every replay. A prior donates its transition instant only to a fact of the same type carrying the same status, and it donates nothing else — never its reason, its message, its observed generation, or its own continued existence. Projected conditions and the facts they are built from are frozen, and the projection returns an immutable sequence, so a published status cannot be edited in place after the decision was made."
oracle = "Row 1 projects the identical inputs twice and compares the two results for equality, which a clock-reading implementation cannot satisfy. Row 2 reads all three instants a single projection can produce and pins each to its source. Row 11 forges a prior instant from 1999 and pins that it is honored under a matching status and discarded under a differing one, so an implementation that carries the instant unconditionally and one that discards it unconditionally fail different halves of the same row. Rows 4 through 6 observe the exception class raised by an in-place write, so a dataclass that loses frozen=True is visible as a successful assignment."
target = "rust"
command = "clock-free-condition-projection-security"
evidence_paths = ["evidence/clock-free-condition-projection-security.json"]

[[tool.aw.python-ec.cases]]
id = "owner-scoped-material-projection-behavior"
artifact_id = "artifact:service-k8s/owner-scoped-material-projection-behavior"
capability_id = "owner-scoped-material-projection"
use_case_id = "owner-scoped-material-projection"
dimension = "behavior"
applicability = "td"
test_path = "src/owner-scoped-material-projection-behavior.py"
promise = "Certificate material is projected into the instance's own namespace as a Secret whose name is derived from the instance and the purpose it serves, owned by the custom resource that asked for it. A trust bundle is a set of anchors keyed by issuer, ordered by issuer id rather than by insertion, and re-adding an issuer replaces its anchor instead of accumulating a second copy. A material write carries the leaf, its private key, and the bundle; a trust-only write carries the bundle alone, so trust can be published before any leaf exists. Reading a Secret back reconstructs the leaf's validity and fingerprint from the certificate itself and the bundle from its annotation. Published status names the issuer, the leaf, the expiry, and the issuers currently trusted."
oracle = "Row 2 builds the same two anchors in both insertion orders and pins that the issuer sequence is identical, which an implementation preserving insertion order cannot satisfy. Row 3 adds one issuer twice with different anchors and pins both the entry count and the surviving PEM, separating replace from append. Rows 5 and 6 read the key sets of a material write and a trust-only write, so a projector that always writes three keys fails row 6 while one that always writes one fails row 5. Row 11 parses two different leaves through the same injected validity reader and pins that their fingerprints differ, so a fingerprint computed from anything but the DER is visible. Row 16 pins the sixteen-character prefix against a fingerprint whose seventeenth character onward is distinct."
target = "rust"
command = "owner-scoped-material-projection-behavior"
evidence_paths = ["evidence/owner-scoped-material-projection-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "owner-scoped-material-projection-security"
artifact_id = "artifact:service-k8s/owner-scoped-material-projection-security"
capability_id = "owner-scoped-material-projection"
use_case_id = "owner-scoped-material-projection"
dimension = "security"
applicability = "td"
test_path = "src/owner-scoped-material-projection-security.py"
promise = "A trust-only write never carries a leaf or a private key, so publishing trust cannot leak the material it is meant to anchor. Every projected Secret carries a controlling owner reference with the owner's uid and blocks owner deletion, so material cannot outlive the instance it belongs to. A trust bundle whose annotation disagrees with its PEM contents is emptied rather than guessed at, and an absent or empty annotation yields an empty bundle rather than an unattributed set of anchors. Anything published into status is stripped of PEM blocks, bearer tokens, and projected tokens first. A leaf's validity and fingerprint are read from the certificate rather than from the annotations that accompany it, and a leaf that cannot be read yields no leaf at all rather than a partially reconstructed one."
oracle = "Row 1 counts the keys of a trust-only write and separately searches its joined values for the private key text, so both an extra key and an inlined key are caught. Row 3 feeds two blocks with one id and one block with two ids and pins that both empty, so an implementation that zips whatever it has fails both halves. Rows 6 through 8 pin the redacted text exactly and separately assert the secret substring is absent, so a redactor that returns a fixed constant still fails row 9, which pins that ordinary text passes through byte-for-byte. Row 12 hands read_state an annotation naming the wrong issuer and pins that validity and fingerprint are unchanged. Row 15 reads CertificateFacts.__annotations__ so a field added later that carries key or PEM material fails the row."
target = "rust"
command = "owner-scoped-material-projection-security"
evidence_paths = ["evidence/owner-scoped-material-projection-security.json"]

[[tool.aw.python-ec.cases]]
id = "cluster-compatibility-surfaces-behavior"
artifact_id = "artifact:service-k8s/cluster-compatibility-surfaces-behavior"
capability_id = "cluster-compatibility-surfaces"
use_case_id = "cluster-compatibility-surfaces"
dimension = "behavior"
applicability = "td"
test_path = "src/cluster-compatibility-surfaces-behavior.py"
promise = "A CRD derived from Rust types is normalized until a live API server will accept it: unsigned integer formats are removed at every depth, including inside JSON arrays, and the unsigned contract is retained as `minimum: 0`. Cross-field invariants attach as CEL rules to every version the CRD declares, accumulating rather than replacing, and the attach function returns how many versions it reached. YAML 1.1 boolean spellings are quoted in both mapping and sequence slots so a string default does not arrive as a boolean. Storage quantities parse with Kubernetes `resource.Quantity` semantics — binary suffixes are powers of 1024 and decimal ones powers of 1000, a bare integer is already a byte count, and a fractional quantity is scaled and rounded to whole bytes. The comparison falls into exactly four kinds, equality is measured in bytes rather than in spelling, and the plan patches only `spec.resources.requests.storage`, only on PVCs the filter admits whose StorageClass allows expansion, and only outside a dry run."
oracle = "Rows 1 and 2 pin all twelve multipliers as literals, so a binary suffix scaled decimally or a decimal one scaled binarily is visible per suffix. Row 4 includes `0.6Mi`, whose correct value 629146 is one byte above what truncation yields, so rounding is separated from `int()`. Row 5 reads `' 1 Gi '` so a parser that stops trimming fails while one that trims only the outside still passes. Rows 12 through 14 run the same eight-PVC fixture three ways and pin the full seven-element patched vector, so a plan that patches everything, patches nothing, or patches during a dry run each fails a different row. Row 16 places an unsigned format under a mapping, under an array's `items`, and inside an `anyOf` list, so a normalizer that skips list children fails only on the third element. Row 18 attaches two rules to a two-version CRD and pins both counts, the first rule's text, and the second rule's message, separating accumulate from replace."
target = "rust"
command = "cluster-compatibility-surfaces-behavior"
evidence_paths = ["evidence/cluster-compatibility-surfaces-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "cluster-compatibility-surfaces-security"
artifact_id = "artifact:service-k8s/cluster-compatibility-surfaces-security"
capability_id = "cluster-compatibility-surfaces"
use_case_id = "cluster-compatibility-surfaces"
dimension = "security"
applicability = "td"
test_path = "src/cluster-compatibility-surfaces-security.py"
promise = "A quantity that is not a Kubernetes storage quantity is an error naming the offending string, never a byte count: an empty quantity, a negative one, a non-numeric mantissa, a bare count spelled with Python's underscore, sign, unicode-digit, or hex forms, and a bare fractional count are all refused. A CEL rule comparing against null is refused under any whitespace spelling, because such a rule fails to compile and produces a CRD that passes every local gate and cannot be installed. A CRD without a spec schema attaches nothing rather than raising, and a tighter existing minimum survives normalization rather than being loosened to zero. A real boolean is left unquoted because JSON never spells it as `on` or `yes`, and the quoter preserves prose and the document's trailing-newline shape. No PVC is patched unless its current size parses, its comparison is a grow, its StorageClass is present in the expansion map and allows expansion, and the run is not a dry run."
oracle = "Row 4 pins four distinct refusal messages for `5_0`, `+5`, an Arabic-Indic five, and `0x10`, so a parser widened to Python's `int()` fails on all four while the ASCII-digit floor passes. Row 12 spells the same null comparison five ways — no space, spaces around the operator, an interior space inside the field path, a tab, and an embedded newline — so a guard that strips only literal spaces fails the tab and newline rows. Row 9 pins both a StorageClass present in the map with `False` and one absent from it entirely, so `get(name, True)` fails only the second half. Row 11 asserts a filtered-out PVC is in the input and not in the outcomes and that a reject-all filter yields zero outcomes, so an inverted filter and a bypassed filter fail different halves. Row 14 pins that a `minimum: 1` field keeps its own value and that its format is gone, separating the removal from the bound."
target = "rust"
command = "cluster-compatibility-surfaces-security"
evidence_paths = ["evidence/cluster-compatibility-surfaces-security.json"]
