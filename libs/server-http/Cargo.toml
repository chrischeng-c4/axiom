[package]
name = "server-http"
version = "0.1.0"
edition = "2021"
description = "Shared HTTP protocol runtime built on server-lifecycle and server-tcp: HTTP/1.1 plus h2c serving, request tracing, and hooks for service shells and development servers."


# e2e tests live in e2e/, not Cargo's autodiscovered tests/, so every one
# of them has to be declared below. The list is this crate's e2e inventory.
autotests = false

[lib]
name = "server_http"
path = "src/lib.rs"

[dependencies]
server-lifecycle = { path = "../server-lifecycle" }
server-tcp = { path = "../server-tcp" }
transport-h2c = { path = "../transport-h2c", features = ["server"] }
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true, features = ["trace"] }
tracing = { workspace = true }
anyhow = { workspace = true }
# Serving TLS on the shared listener (#3112). The listener terminates TLS; it
# never parses PEM or decides what is fit to serve — that stays in `peer-tls`,
# which is why there is no dependency on it here.
rustls = "0.23"
tokio-rustls = "0.26"

[dev-dependencies]
# The certificate lifecycle under test is `peer-tls`'s; this direction of the
# dependency exists only in tests, and proves the two seams compose.
peer-tls = { path = "../peer-tls" }
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
sha2 = "0.10"
time = { version = "0.3", default-features = false }
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio"] }
http-body-util = "0.1"
bytes = { workspace = true }
http = { workspace = true }

[[test]]
name = "lifecycle_composition"
path = "e2e/lifecycle_composition.rs"

[[test]]
name = "ownership"
path = "e2e/ownership.rs"

[[test]]
name = "tls_reload"
path = "e2e/tls_reload.rs"
