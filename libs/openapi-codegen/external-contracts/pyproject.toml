command = "deterministic-identifier-naming-behavior"
evidence_paths = ["evidence/deterministic-identifier-naming-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "deterministic-identifier-naming-security"
artifact_id = "artifact:openapi-codegen/deterministic-identifier-naming-security"
capability_id = "deterministic-identifier-naming"
use_case_id = "deterministic-identifier-naming"
dimension = "security"
applicability = "td"
test_path = "src/deterministic-identifier-naming-security.py"
promise = "A spec-controlled schema key that is not a legal identifier is quoted and backslash-escaped rather than emitted bare, preventing hostile keys from breaking out of generated declarations."
oracle = "Independent Python oracle reserves component type names in NameRegistry prior to operation names and feeds hostile property keys with quotes and backslashes to prop_key and param_access, asserting component reservation precedence, backslash-before-quote escaping, and bracket-access fallbacks."
target = "rust"
command = "deterministic-identifier-naming-security"
evidence_paths = ["evidence/deterministic-identifier-naming-security.json"]

