promise = "Every generated identifier comes from one word-splitting law where Pascal, camel, and snake conversions share identical word splits, acronyms flatten, empty input produces documented placeholders, digit-prefixed inputs add a prefix, and NameRegistry provides deterministic numbered suffixes for collisions."
oracle = "Independent Python oracle invokes to_pascal, to_camel, and to_snake on acronyms, empty strings, and digit-prefixed inputs, verifying one shared word split, placeholder stability, and NameRegistry deterministic numbered suffix allocation."
