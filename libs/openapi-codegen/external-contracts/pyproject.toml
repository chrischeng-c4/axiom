[project]
name = "openapi-codegen-external-contracts"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[tool.aw.python-artifact]
protocol = "aw.python-artifact.v1"
entrypoint = "src/runner.py"
source_roots = ["src"]
dependency_files = ["pyproject.toml", "uv.lock"]
evidence_dir = "evidence"

[tool.aw.python-ec]
protocol = "aw.python-ec.v1"
author = "chrischeng"
efficiency_policy = "optional"

[[tool.aw.python-ec.cases]]
id = "tolerant-openapi-document-subset-behavior"
artifact_id = "artifact:openapi-codegen/tolerant-openapi-document-subset-behavior"
capability_id = "tolerant-openapi-document-subset"
use_case_id = "tolerant-openapi-document-subset"
dimension = "behavior"
applicability = "td"
test_path = "src/tolerant-openapi-document-subset-behavior.py"
promise = "The document model deserializes only emitter-consumed keywords, tolerates unknown fields without error, reconciles 3.0 nullable and 3.1 null-union spellings into one nullability answer while stripping null from type_names, normalizes single-string and array type declarations, falls through from RefOr to inline schema when $ref is absent, and parses 3.2 query path-item keyword and additionalOperations."
oracle = "Independent Python oracle evaluates Spec/PathItem/Schema models across 3.0, 3.1, and 3.2 specs, proving 3.0 nullable: true and 3.1 ['T', 'null'] converge, null is stripped from type_names, single/array types normalize, $ref fall-through succeeds, and 3.2 query and additionalOperations parse."
target = "rust"
command = "tolerant-openapi-document-subset-behavior"
evidence_paths = ["evidence/tolerant-openapi-document-subset-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "tolerant-openapi-document-subset-security"
artifact_id = "artifact:openapi-codegen/tolerant-openapi-document-subset-security"
capability_id = "tolerant-openapi-document-subset"
use_case_id = "tolerant-openapi-document-subset"
dimension = "security"
applicability = "td"
test_path = "src/tolerant-openapi-document-subset-security.py"
promise = "An unknown or wrongly-typed keyword is tolerated rather than aborting generation, so an untrusted spec cannot deny service by carrying a field the model does not know."
oracle = "Independent Python oracle parses specs containing unknown vendor extensions, arbitrary validation keywords, and boolean or numeric exclusiveMinimum values, asserting parsing succeeds without raising exceptions."
target = "rust"
command = "tolerant-openapi-document-subset-security"
evidence_paths = ["evidence/tolerant-openapi-document-subset-security.json"]

[[tool.aw.python-ec.cases]]
