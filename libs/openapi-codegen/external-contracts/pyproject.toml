oracle = "Independent Python oracle runs operation IR build across multi-method paths, asserting fixed method order, additionalOperations de-duplication, path-before-operation parameter order, forced required path parameters, application/json body extraction, every response ladder rung, and QUERY POST-twin default and x-post-twin override resolution."
target = "rust"
command = "language-neutral-operation-ir-behavior"
evidence_paths = ["evidence/language-neutral-operation-ir-behavior.json"]

