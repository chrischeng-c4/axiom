[package]
name = "openapi-codegen"
version = "0.5.0"
publish = false
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Generate typed TypeScript, Python, and Rust API clients from an OpenAPI 3.0/3.1/3.2 document"


# e2e tests live in e2e/, not Cargo's autodiscovered tests/, so every one
# of them has to be declared below. The list is this crate's e2e inventory.
autotests = false

[lib]
name = "openapi_codegen"
path = "src/lib.rs"

[dependencies]
cli-std = { path = "../cli-std", default-features = false }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
toml = "0.8"

[[test]]
name = "target_profile_matrix"
path = "e2e/target_profile_matrix.rs"

[[test]]
name = "file_bearer_auth"
path = "e2e/file_bearer_auth.rs"
