[package]
name = "openapi-codegen"
version = "0.5.0"
publish = false
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Generate typed TypeScript, Python, and Rust API clients from an OpenAPI 3.0/3.1/3.2 document"

[lib]
name = "openapi_codegen"
path = "src/lib.rs"

[dependencies]
cli-std = { path = "../cli-std", default-features = false }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
toml = "0.8"
