[package]
name = "index-text"
version = "0.1.0"
edition = "2021"
description = "Rebuildable text-index base for Axiom products."
autotests = false

[lib]
name = "index_text"
path = "src/lib.rs"

[features]
default = []
jieba = ["dep:jieba-rs"]

[dependencies]
jieba-rs = { version = "0.7", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "text_index_contract"
path = "e2e/text_index_contract.rs"
