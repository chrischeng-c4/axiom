[package]
name = "server-lifecycle"
version = "0.1.0"
edition = "2021"
description = "Shared protocol-neutral server lifecycle primitives: bind configuration, drain and readiness signals, connection budgets, shutdown hooks, and metrics hooks."


# e2e tests live in e2e/, not Cargo's autodiscovered tests/, so every one
# of them has to be declared below. The list is this crate's e2e inventory.
autotests = false

[lib]
name = "server_lifecycle"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "compatibility"
path = "e2e/compatibility.rs"

[[test]]
name = "drain_prestart"
path = "e2e/drain_prestart.rs"

[[test]]
name = "lifecycle_concurrency"
path = "e2e/lifecycle_concurrency.rs"

[[test]]
name = "lifecycle_hooks"
path = "e2e/lifecycle_hooks.rs"

[[test]]
name = "lifecycle_state"
path = "e2e/lifecycle_state.rs"

[[test]]
name = "shutdown_deadline"
path = "e2e/shutdown_deadline.rs"

[[test]]
name = "shutdown_deadline_publication"
path = "e2e/shutdown_deadline_publication.rs"
