[package]
name = "service-auth"
version = "0.1.0"
edition = "2021"
description = "Shared request-auth middleware for the ecosystem's HTTP services: the generic extract -> verify -> reject -> inject plumbing plus a `Verifier` trait each service implements. Token crypto lives in `libs/claim-token`; per-resource authorization (RBAC, scope-vs-key) stays in the service handlers. The common shape lumen/keep/relay/loom each hand-roll today."
autotests = false

[lib]
name = "service_auth"
path = "src/lib.rs"

[features]
# The kube-rs transport for TokenReview/SubjectAccessReview. Off by default:
# the delegated decision logic is pure and every service that links this crate
# should not have to link a Kubernetes client to get the middleware.
k8s = ["dep:kube", "dep:k8s-openapi"]

[dependencies]
# Inherit the workspace pins so the lock stays single-versioned.
axum = { workspace = true }
cli-std = { path = "../cli-std", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
# `net` is the loopback proxy's listener (k8s::loopback_proxy); `rt`/`time`
# carry the delegated cache and the token refresh clock.
tokio = { workspace = true, features = ["net", "rt", "time"] }
# `AsyncVerifier` carries an async method behind a `dyn`-usable trait.
async-trait = { workspace = true }
# Offline verification of Google ID tokens against the published JWKS.
jsonwebtoken = { workspace = true }
# Fetching that JWKS, and introspecting opaque access tokens. The workspace pin
# is rustls-only on purpose: an auth library must not drag a system OpenSSL
# into every service that links it.
reqwest = { workspace = true }
# The delegated-auth cache is keyed by a token digest, never the token.
sha2 = "0.10"
# Credential-free counters for the delegated path, on the same primitives every
# other service in the kit renders its scrape from.
metrics-prometheus = { path = "../metrics-prometheus" }
# Only the `k8s` feature's TokenReview/SubjectAccessReview transport needs a
# Kubernetes client; the decision logic above it does not.
kube = { version = "0.98", features = ["client"], optional = true }
k8s-openapi = { version = "0.24", features = ["v1_32"], optional = true }

[dev-dependencies]
# tokio drives the `#[tokio::test]` oneshot middleware tests.
tokio = { workspace = true, features = ["macros"] }
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"

[[test]]
name = "scoped_authorization"
path = "e2e/scoped_authorization.rs"
