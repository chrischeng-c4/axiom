[project]
name = "service-auth-external-contracts"
version = "0.0.0"
requires-python = ">=3.11"

[tool.aw.python-artifact]
protocol = "aw.python-artifact.v1"
entrypoint = "src/runner.py"
source_roots = ["src"]
dependency_files = ["pyproject.toml", "uv.lock"]
evidence_dir = "evidence"

[tool.aw.python-ec]
protocol = "aw.python-ec.v1"
author = "chrischeng"
efficiency_policy = "optional"

[[tool.aw.python-ec.cases]]
id = "static-role-map-authorization-behavior"
artifact_id = "artifact:service-auth/static-role-map-authorization-behavior"
capability_id = "static-role-map-authorization"
use_case_id = "static-role-map-authorization"
dimension = "behavior"
applicability = "td"
test_path = "src/static-role-map-authorization-behavior.py"
promise = "The domain decides authorization from the registry document alone: a role covers exactly itself and every role below it, an exact resource entry is preferred over the wildcard entry and a resource named by neither is denied, the explicit open mode allows every action without consulting any grant, a document is interpreted as namespaced or flat by a stated rule rather than by guessing, and a merge that collides inside one namespace fails at load time leaving no partial registry behind."
oracle = "The contract writes its own role-ordering table and its own registry documents, derives the expected covers/allow/deny verdict for every (holder role, required role) pair and every (resource, grant set) pair from that table by rules it states itself, then drives the service-auth tech-design domain decision with the same inputs and compares. The role-ordering table is enumerated exhaustively over the closed role set, so a design that adds or removes a role fails rather than passing on a subset. Expected values are literals written in the contract; they are never read back from the design under test, and the contract never imports the service-auth Rust crate."
target = "rust"
command = "static-role-map-authorization-behavior"
evidence_paths = ["evidence/static-role-map-authorization-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "static-role-map-authorization-security"
artifact_id = "artifact:service-auth/static-role-map-authorization-security"
capability_id = "static-role-map-authorization"
use_case_id = "static-role-map-authorization"
dimension = "security"
applicability = "td"
test_path = "src/static-role-map-authorization-security.py"
promise = "The secret-keyed and the identity-keyed credential namespaces never resolve one another. A secret whose text is identical to a granted public identity resolves to nothing, and a public identity whose text is identical to a granted secret resolves to nothing. A registry that grants a reserved subject is refused at load time and names the offending key, subject, and reason. A loader declared to accept only secrets refuses a document that carries identity grants rather than ignoring them, and a credential that is required but absent is a refusal, never an open request."
oracle = "The contract builds a single registry in which one string appears as a key in both namespaces with deliberately different grants, then requires each lookup path to return only its own namespace's grant; a design that shares one map fails because the two lookups would agree. It enumerates the reserved subject names itself and requires a refusal for each, asserting the returned key, subject, and reason triple against literals it writes. It walks every reachable construction path of the principal and requires that no combination of (credential required, credential absent) yields an allowing principal. Expected values are literals in the contract; the reserved-name list is the contract's own, so a design that recognizes fewer names fails rather than passing vacuously."
target = "rust"
command = "static-role-map-authorization-security"
evidence_paths = ["evidence/static-role-map-authorization-security.json"]

[[tool.aw.python-ec.cases]]
id = "delegated-kubernetes-authorization-behavior"
artifact_id = "artifact:service-auth/delegated-kubernetes-authorization-behavior"
capability_id = "delegated-kubernetes-authorization"
use_case_id = "delegated-kubernetes-authorization"
dimension = "behavior"
applicability = "td"
test_path = "src/delegated-kubernetes-authorization-behavior.py"
promise = "Delegated judgement follows a stated order — authenticated, then audience intersection, then identity shape — so a credential failing two rules reports the earlier one. An access review that is both allowed and denied is a denial. A cache lookup is classified hit, miss, or stale by the caller-supplied clock, an expired entry is never returned by the ordinary lookup path, and the worst-case interval during which a revoked credential can still be honored equals the allow lifetime plus the stale window."
oracle = "The contract enumerates the failure rules in the order it states, constructs one fixture per rule that violates exactly that rule while satisfying every earlier one, plus a fixture that violates two rules at once, and requires the reported reason to be the earlier rule's; the ordering therefore has a witness that a design checking in any other order fails. It builds the allowed/denied truth table for the access review as four literal rows. It drives the cache through a manual clock it advances itself, asserting the classification at each named instant against literals, and computes the expected revocation bound as the sum of the two lifetimes it configured rather than reading the design's own accessor."
target = "rust"
command = "delegated-kubernetes-authorization-behavior"
evidence_paths = ["evidence/delegated-kubernetes-authorization-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "delegated-kubernetes-authorization-security"
artifact_id = "artifact:service-auth/delegated-kubernetes-authorization-security"
capability_id = "delegated-kubernetes-authorization"
use_case_id = "delegated-kubernetes-authorization"
dimension = "security"
applicability = "td"
test_path = "src/delegated-kubernetes-authorization-security.py"
promise = "Only a username of the exact service-account form whose namespace and name are both valid DNS-1123 labels is admitted; an unauthenticated review, an anonymous username, a username in the unauthenticated group, a non-service-account username, and a malformed one each carry their own stable rejection reason. A configuration naming no audience is refused at construction. No failure of the delegated authority produces an allow: transport failure with no usable cached decision is unavailable, a malformed response is unavailable, and an evaluation error is a refusal. A raw credential never appears in a cache key or in a rejection."
oracle = "The contract writes its own DNS-1123 label predicate and its own admissible/inadmissible username corpus covering length bounds, leading and trailing non-alphanumerics, uppercase, wrong segment count, and the empty string, derives the expected admitted-or-reason verdict from its own predicate, and requires the design to agree on every row; the corpus is the contract's own, so a design with a looser parse fails. It enumerates the rejection reasons as literals and requires the set observed across the corpus to equal that set exactly, so a design that collapses two reasons into one fails on the count. For the outage rules it drives a backend port it implements itself, returning each failure class in turn, and requires that no path yields an allow. For redaction it asserts a structural property of the design's cache key and rejection types rather than a string absence, so a design that merely omits the credential today but could carry one fails."
target = "rust"
command = "delegated-kubernetes-authorization-security"
evidence_paths = ["evidence/delegated-kubernetes-authorization-security.json"]

[[tool.aw.python-ec.cases]]
id = "credential-reload-audit-behavior"
artifact_id = "artifact:service-auth/credential-reload-audit-behavior"
capability_id = "credential-reload-audit"
use_case_id = "credential-reload-audit"
dimension = "behavior"
applicability = "td"
test_path = "src/credential-reload-audit-behavior.py"
promise = "A replacement registry is validated before it is installed. An applied replacement advances the revision by exactly one and reports the entry count it installed; a rejected replacement advances nothing and installs nothing. A multi-source reload is all-or-nothing: if any source fails, none of the sources are installed. A read failure, a parse failure, and a validation failure are each reported as their own failure class, and each leaves the previously serving registry intact and still answering."
oracle = "The contract drives the design's reload sequence with registry documents it authors itself, asserting revisions against its own counter rather than the design's, and asserting installed entry counts against counts it computes from its own documents. For each of the three failure classes it constructs a source that fails in exactly that way, then asserts three things after the failure: the failure class value, the unchanged revision, and that a lookup answered by the pre-failure registry still returns the pre-failure grant. For all-or-nothing it supplies a good source and a bad source together and requires that a key present only in the good source is absent afterwards, so a design that installs sources incrementally fails."
target = "rust"
command = "credential-reload-audit-behavior"
evidence_paths = ["evidence/credential-reload-audit-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "credential-reload-audit-security"
artifact_id = "artifact:service-auth/credential-reload-audit-security"
capability_id = "credential-reload-audit"
use_case_id = "credential-reload-audit"
dimension = "security"
applicability = "td"
test_path = "src/credential-reload-audit-security.py"
promise = "The observation schema has no field that can carry a credential: an authorization event names the subject, the resource, and the required role, and a reload event names whether it applied, the revision, the entry count, and the failure class, and nothing else. An unpresented or unrecognized credential is reported only as a stable classification value, never by echoing what was presented. A registry that fails validation never becomes servable, and every validation rule the design states has a fixture that exercises it."
oracle = "The contract asserts the event schema structurally — it enumerates the fields of every event variant and requires the observed field set to equal the literal set it writes, so adding a credential-carrying field fails the case even if nothing populates it. It then drives a sink it implements itself through an allow, a deny for each denial classification, and a reload of each outcome, requiring that the credential string it presented appears in no field of any emitted event. For validation it enumerates the rejection rules itself, builds one document violating exactly one rule each, and requires both a rejection and a distinct reason per rule, asserting the distinct-reason count against a literal so that two rules collapsing into one reason fails."
target = "rust"
command = "credential-reload-audit-security"
evidence_paths = ["evidence/credential-reload-audit-security.json"]
