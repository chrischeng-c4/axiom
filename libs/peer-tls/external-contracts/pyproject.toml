[project]
name = "peer-tls-external-contracts"
version = "0.0.0"
requires-python = ">=3.11"

[tool.aw.python-artifact]
protocol = "aw.python-artifact.v1"
entrypoint = "src/runner.py"
source_roots = ["src"]
dependency_files = ["pyproject.toml", "uv.lock"]
evidence_dir = "evidence"

[tool.aw.python-ec]
protocol = "aw.python-ec.v1"
author = "chrischeng"
efficiency_policy = "optional"

[[tool.aw.python-ec.cases]]
id = "material-validation-behavior"
artifact_id = "artifact:peer-tls/material-validation-behavior"
capability_id = "material-validation"
use_case_id = "material-validation"
dimension = "behavior"
applicability = "td"
test_path = "src/material-validation-behavior.py"
promise = "The domain decides identity binding, rejection reason, and validity window from the certificate's own attributes: a leaf carrying the expected DNS names or SPIFFE URI is accepted, every rejection carries a typed stable reason with a detail string, and validity is answered against a caller-supplied instant rather than wall-clock time."
oracle = "The contract constructs its own certificate-attribute fixtures and its own expectation matrix, derives the accept/reject verdict, the reason, and the validity answer from that matrix by rules it states itself, then drives the peer-tls tech-design domain decision with the same inputs and compares. Expected values never come from the design under test, and the contract never imports the peer-tls Rust crate."
target = "rust"
command = "material-validation-behavior"
evidence_paths = ["evidence/material-validation-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "material-validation-security"
artifact_id = "artifact:peer-tls/material-validation-security"
capability_id = "material-validation"
use_case_id = "material-validation"
dimension = "security"
applicability = "td"
test_path = "src/material-validation-security.py"
promise = "Material that does not carry the expected identity is refused outright. There is no warn verdict, no accepted-with-caveat verdict, and no caller-overridable flag that turns a refusal into an acceptance."
oracle = "The contract enumerates near-miss fixtures it constructs itself (wrong DNS name, wrong SPIFFE trust domain, right identity in the wrong extension, expired leaf, key that does not match the leaf) and requires a refusal verdict for every one. It also inspects the design's verdict type: if the verdict domain admits any value other than accept and refuse, or if any decision entry point takes a parameter that can force acceptance, the case fails regardless of the verdicts observed."
target = "rust"
command = "material-validation-security"
evidence_paths = ["evidence/material-validation-security.json"]

[[tool.aw.python-ec.cases]]
id = "mtls-config-construction-behavior"
artifact_id = "artifact:peer-tls/mtls-config-construction-behavior"
capability_id = "mtls-config-construction"
use_case_id = "mtls-config-construction"
dimension = "behavior"
applicability = "td"
test_path = "src/mtls-config-construction-behavior.py"
promise = "One prefix-driven environment contract resolves the same material triple for every caller, reports an unset prefix as absence rather than as a failure, and installs the default crypto provider once regardless of caller initialization order."
oracle = "The contract drives the design's environment resolution with prefix and variable matrices it authors itself, asserting the resolved triple, the absence-versus-failure distinction, and order independence by resolving the same matrix under permuted initialization orders and requiring identical outcomes. It supplies the environment through the design's own port rather than through the real process environment, so the case never depends on the host."
target = "rust"
command = "mtls-config-construction-behavior"
evidence_paths = ["evidence/mtls-config-construction-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "mtls-config-construction-security"
artifact_id = "artifact:peer-tls/mtls-config-construction-security"
capability_id = "mtls-config-construction"
use_case_id = "mtls-config-construction"
dimension = "security"
applicability = "td"
test_path = "src/mtls-config-construction-security.py"
promise = "A server configuration this capability produces requires and verifies a peer certificate against the configured trust bundle, and the client configuration presents one. No reachable construction path yields a permissive configuration."
oracle = "The contract walks every construction entry point the design exposes and requires each resulting server configuration to carry a mandatory peer-certificate requirement bound to the configured trust anchors, and each client configuration to carry client material. It then asserts the negative: a peer presenting no certificate, or one issued by an unrelated authority the contract names itself, is refused. A configuration surface that can even express a permissive mode fails the case, whatever its default."
target = "rust"
command = "mtls-config-construction-security"
evidence_paths = ["evidence/mtls-config-construction-security.json"]

[[tool.aw.python-ec.cases]]
id = "rotation-and-reload-behavior"
artifact_id = "artifact:peer-tls/rotation-and-reload-behavior"
capability_id = "rotation-and-reload"
use_case_id = "rotation-and-reload"
dimension = "behavior"
applicability = "td"
test_path = "src/rotation-and-reload-behavior.py"
promise = "Reload swaps material in place and returns a monotonic generation. Connections established before a swap keep serving, and the next handshake after a swap uses the new leaf."
oracle = "The contract drives the design's reload sequence with two generations of material it labels itself, asserting that the generation counter is strictly increasing across every swap including repeated and no-op reloads, that a session opened before a swap still resolves to its original generation afterwards, and that a session opened after a swap resolves to the second generation. Expected generations come from the contract's own counter, not from the design's."
target = "rust"
command = "rotation-and-reload-behavior"
evidence_paths = ["evidence/rotation-and-reload-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "rotation-and-reload-security"
artifact_id = "artifact:peer-tls/rotation-and-reload-security"
capability_id = "rotation-and-reload"
use_case_id = "rotation-and-reload"
dimension = "security"
applicability = "td"
test_path = "src/rotation-and-reload-security.py"
promise = "During rotation both the outgoing and the incoming trust anchor are admitted, and the outgoing anchor is retired only once activation of the new generation is observed. No state of the reload path serves or dials without mutual authentication, and no unrelated authority is admitted by the overlap."
oracle = "The contract names an outgoing anchor, an incoming anchor, and a third unrelated authority, then walks every state of the design's rotation state machine. It requires the first two to be admitted throughout the overlap, the third never, the outgoing anchor to remain admitted after the bundle stops naming it and until activation is observed, and every state to report mutual authentication as required. The state enumeration is the contract's own, so a design that omits a state fails rather than passing vacuously."
target = "rust"
command = "rotation-and-reload-security"
evidence_paths = ["evidence/rotation-and-reload-security.json"]
