[package]
name = "peer-tls"
version = "0.1.0"
edition = "2021"
description = "Shared peer-mTLS material loading for mutually authenticated peer and replication ports: PEM loaders, rustls client/server builders, and process crypto-provider setup."


# e2e tests live in e2e/, not Cargo's autodiscovered tests/, so every one
# of them has to be declared below. The list is this crate's e2e inventory.
autotests = false

[lib]
name = "peer_tls"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
rustls = "0.23"
rustls-pemfile = "2"
# Hot-reload validation (#3112). A candidate leaf has to be inspected for its
# validity window, SPIFFE SANs, and fingerprint before it is allowed to serve;
# rustls answers "would this handshake?" but not "what is in this certificate".
x509-parser = "0.17"
# Fingerprints must be byte-identical to the certificate controller's, which
# uses sha2 the same way (`service_k8s::certificate::digest`).
sha2 = "0.10"
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
tokio-rustls = "0.26"
tempfile = "3"
# Fixtures need to place a leaf's validity window deliberately; rcgen states it
# in `time`'s types.
time = { version = "0.3", default-features = false }

[[test]]
name = "material_rejection"
path = "e2e/material_rejection.rs"

[[test]]
name = "peer_rotation"
path = "e2e/peer_rotation.rs"

[[test]]
name = "tls_reload"
path = "e2e/tls_reload.rs"

[[test]]
name = "trust_overlap"
path = "e2e/trust_overlap.rs"
