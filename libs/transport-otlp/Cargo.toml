[package]
name = "transport-otlp"
version = "0.1.0"
edition = "2021"
description = "Official OTLP HTTP and gRPC transport shell."
autotests = false

[lib]
name = "transport_otlp"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
flate2 = "1"
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic", "logs", "metrics", "trace"] }
prost = "0.14"
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["gzip"] }

[[test]]
name = "otlp_transport"
path = "e2e/otlp_transport.rs"
