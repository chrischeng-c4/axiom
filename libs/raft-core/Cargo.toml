[package]
name = "raft-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Self-contained, step-driven Raft consensus core — transport- and storage-agnostic. Consumers (relay, keep) supply the network, persistence, and state machine."


# e2e tests live in e2e/, not Cargo's autodiscovered tests/, so every one
# of them has to be declared below. The list is this crate's e2e inventory.
autotests = false

[lib]
name = "raft_core"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[[test]]
name = "consensus"
path = "e2e/consensus.rs"

[[test]]
name = "snapshot"
path = "e2e/snapshot.rs"

[[test]]
name = "membership_durability"
path = "e2e/membership_durability.rs"

[[test]]
name = "learner_admission"
path = "e2e/learner_admission.rs"

[[test]]
name = "learner_freshness"
path = "e2e/learner_freshness.rs"

[[test]]
name = "joint_promotion"
path = "e2e/joint_promotion.rs"

[[test]]
name = "leadership_transfer"
path = "e2e/leadership_transfer.rs"

[[test]]
name = "demotion_removal"
path = "e2e/demotion_removal.rs"
