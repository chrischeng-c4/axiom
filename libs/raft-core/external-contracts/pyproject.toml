[[tool.aw.python-ec.cases]]
id = "election-safety-behavior"
artifact_id = "artifact:raft-core/election-safety-behavior"
capability_id = "election-safety"
use_case_id = "election-safety"
dimension = "behavior"
applicability = "td"
test_path = "src/election-safety-behavior.py"
promise = "A group elects a leader by itself, from nothing but ticks. The derived voter set is odd at every group size and the trailing even node becomes a learner, so a majority is always strict. Each node's election timer is offset by its own id, so one voter fires first rather than every voter campaigning together. Campaigning bumps the term, spends the candidate's own vote, and asks every other voter for theirs, carrying the candidate's own last index and term. A majority of grants promotes the candidate, which initialises every peer's cursors from its own log and begins heartbeating on its own cadence. A learner waits forever without campaigning. The term and the vote survive a restart."
oracle = "Row 1 derives membership at six group sizes including zero and pins voters and learners as one nested tuple, so a derivation that rounds the wrong way and one that is one-based fail different elements. Row 4 reads three nodes' timeouts and pins their spread, which an implementation using a single constant cannot reproduce. Row 5 ticks to one short of the timeout, then onto it, so a timer that fires late and one that fires early each fail a different element. Row 10 reads the per-peer cursors at the instant of promotion, before any message is pumped, so a leader that seeds match indices from its own log is visible as a nonzero match rather than as a later commit. Row 14 pins the fields of a default-constructed PersistedState alongside a real restart, so a default that carries a spent vote or a nonzero commit point fails without any node being built."
target = "rust"
command = "election-safety-behavior"
evidence_paths = ["evidence/election-safety-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "election-safety-security"
artifact_id = "artifact:raft-core/election-safety-security"
capability_id = "election-safety"
use_case_id = "election-safety"
dimension = "security"
applicability = "td"
test_path = "src/election-safety-security.py"
promise = "A term elects at most one leader. A voter spends its single vote once, and the second candidate in that term is refused; a repeat from the same candidate costs nothing. The up-to-date comparison ranks term first and length second, so a candidate missing committed entries is refused even by a voter that has not yet voted. A request from a term the voter has not entered is refused without moving it, and a request carrying a higher term releases the vote before the grant is decided rather than after. A higher term seen in a vote response, a replication message, or anywhere else ends the campaign or the leadership that observed it — including a term exactly one ahead. Only members of the voter set are counted towards a majority, and every refusal is still answered so no candidate is left waiting."
oracle = "Row 2 walks the up-to-date comparison across five term/length combinations as one tuple, so an implementation that compares length first and one that accepts an equal term as newer fail different elements. Row 4 exercises the grant rule directly across five request/current-term and vote-state combinations. Row 6 pins that a higher-term request leaves the voter at the new term having granted, which an implementation that decides the grant before stepping down cannot produce. Row 7 ends two campaigns — one by a distant term and one by a term exactly one ahead — so a comparison relaxed by a single unit is visible. Row 10 gives a candidate grants from five responders of whom only three are voters, and pins that it is still a candidate at three grants and a leader only once the voter-set majority is real. Row 13 reads the voter set at four group sizes and pins that a learner is outside it at every one."
target = "rust"
command = "election-safety-security"
evidence_paths = ["evidence/election-safety-security.json"]

[[tool.aw.python-ec.cases]]
id = "log-replication-consistency-behavior"
artifact_id = "artifact:raft-core/log-replication-consistency-behavior"
capability_id = "log-replication-consistency"
use_case_id = "log-replication-consistency"
dimension = "behavior"
applicability = "td"
test_path = "src/log-replication-consistency-behavior.py"
promise = "Only a leader accepts a proposal, and successive proposals take successive indices in the leader's own term. A proposal is broadcast to every peer at once, and draining the outbox hands each message over exactly once. An append names the entry the follower must already hold; an accepted append is answered with the index now matched, and a success response advances that peer's match and next cursors together. A follower adopts the leader's commit point clamped to what it actually holds. An entry a majority holds is committed on every node, and committed entries are handed to the driver in index order and exactly once. A refused append answers with the index to retreat to, the hint never runs past either end of the log, and a follower that has fallen behind is caught up by that retreat and its retry — inside the same exchange, without waiting for new traffic."
oracle = "Row 14 reads the follower logs at two moments: once immediately after the election's own message pump, and once after a further proposal. An implementation that retreats but never retries still fills the followers on the next broadcast, so it passes the second observation and fails the first. Row 5 pins the prev-index, prev-term, entry payload, and leader commit of a single append as one tuple, so a leader that names the entry it is sending rather than the one before it is visible. Row 13 sweeps the backoff hint at both ends of the log. Row 9 drains committed entries twice and pins that the second drain is empty. Row 10 reads highest_committed directly across four voter/match combinations, including a five-voter group in which three voters have never answered, so a rule that credits an unheard voter with the leader's own log fails that element alone."
target = "rust"
command = "log-replication-consistency-behavior"
evidence_paths = ["evidence/log-replication-consistency-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "log-replication-consistency-security"
artifact_id = "artifact:raft-core/log-replication-consistency-security"
capability_id = "log-replication-consistency"
use_case_id = "log-replication-consistency"
dimension = "security"
applicability = "td"
test_path = "src/log-replication-consistency-security.py"
promise = "An append whose preceding entry disagrees is refused, not applied, and the match check refuses a prefix beyond the end of the log. A divergent suffix is discarded rather than interleaved, and only the conflicting suffix is dropped — never the agreed prefix before it. An entry below the compaction point is never grafted back on. An entry from an earlier term is not committed by count alone, and the commit point never walks backwards. A delayed success response never walks a peer's progress backwards, and a stale refusal for a prefix a newer response already proved replicated is discarded. Retreating steps back but never below the first real index. An append carrying an older term is refused without touching the log and without leaking the follower's progress. Committing is a leader-only act, a node that is not leader ignores a replication response, and a response from an older term is ignored."
oracle = "Row 7 advances a peer to match 3 and then reads its next cursor ahead to 6, as a pipelining leader would, before delivering a stale success naming index 1; an implementation that recomputes the next cursor from the matched index rather than keeping the larger fails on that element while still passing the match element. Row 4 places the forged sub-snapshot entry last in the batch behind a real one, so relaxing the compaction-point guard by one is visible as a truncation rather than as an extra entry. Row 9 retreats twice — once against a peer that has proved nothing and once against a peer that has proved a prefix — so the floor at index 1 and the retreat-to-hint-plus-one are pinned separately. Row 10 pins that a stale-term append leaves the log, the commit point, and the recorded leader all untouched, and that the refusal it answers with reports match index 0."
target = "rust"
command = "log-replication-consistency-security"
evidence_paths = ["evidence/log-replication-consistency-security.json"]

[[tool.aw.python-ec.cases]]
id = "snapshot-compaction-behavior"
artifact_id = "artifact:raft-core/snapshot-compaction-behavior"
capability_id = "snapshot-compaction"
use_case_id = "snapshot-compaction"
dimension = "behavior"
applicability = "td"
test_path = "src/snapshot-compaction-behavior.py"
promise = "Compaction drops the applied prefix without renumbering anything: the highest index is the same before and after, and the surviving entries keep their original indices. It records the index and the term it stopped at, and an index below that point still reads back its term. A peer whose next entry was compacted away is sent the snapshot; a peer still inside the resident log is sent an ordinary append. A strictly newer snapshot replaces the follower's resident log and carries its commit and applied cursors up to the snapshot point, and the installed bytes are surfaced to the driver exactly once. The follower answers with the snapshot point it now holds, the leader resumes ordinary replication from there, and a follower caught up by snapshot accepts ordinary appends again. A restart re-offers the snapshot the node was holding."
oracle = "The compaction fixture holds four applied entries spanning four different terms, so an implementation that records the leader's current term as the snapshot term, or that reads the term at the wrong index, is visible in row 2 and row 3 rather than hidden behind a log whose terms all agree. Row 3 reads the term at index 0, at two indices below the compaction point, and at two above it, so the boundary is pinned from both sides. Rows 5 and 6 hold the same leader fixed and vary only one peer's next cursor across the compaction point, so a leader that always ships the snapshot fails row 6 and one that never ships it fails row 5. Row 9 polls the installed snapshot twice and pins that the second poll is empty. Row 13 pins that a restart carrying a snapshot index but empty bytes offers nothing."
target = "rust"
command = "snapshot-compaction-behavior"
evidence_paths = ["evidence/snapshot-compaction-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "snapshot-compaction-security"
artifact_id = "artifact:raft-core/snapshot-compaction-security"
capability_id = "snapshot-compaction"
use_case_id = "snapshot-compaction"
dimension = "security"
applicability = "td"
test_path = "src/snapshot-compaction-security.py"
promise = "Compaction refuses to run past what has actually been applied, stops exactly at the applied cursor, and refuses to move backwards or to stand still. No index is renumbered by compaction at any compaction point. An older snapshot does not truncate a follower that is ahead, and a snapshot at the point already held changes nothing — neither the log, nor the cursors, nor what the driver is offered. A snapshot from a stale term is answered without being installed. The driver is never handed the same snapshot twice. A higher term in a snapshot response drops leadership, a node that is not leader ignores a snapshot response, and a response from an older term is ignored. A restart never resumes below the compaction point and never claims to have committed more than it holds."
oracle = "Rows 1 and 2 attempt compaction one index past the applied cursor and exactly at it, observing the resident log length and the snapshot bytes as a decoded string, so a refusal that silently succeeds is visible as a shortened log rather than only as a changed counter. Row 3 attempts to move backwards and to stand still from the same state and pins both refusals plus the untouched log. Row 6 delivers a snapshot at exactly the point already held and pins the log length, the cursors, and that the driver is offered nothing. Row 12 revives from a persisted state whose commit index sits below the snapshot point and row 13 from one whose commit index runs past the log, including a state carrying a compaction point with no bytes at all, so the clamp is pinned from both directions and the offer is withheld when there is nothing to offer."
target = "rust"
command = "snapshot-compaction-security"
evidence_paths = ["evidence/snapshot-compaction-security.json"]
