use_case_id = "github-credential-resolution-order"
dimension = "security"
applicability = "td"
test_path = "src/github-credential-resolution-order-security.py"
promise = "A blank or whitespace-only value is treated as absent everywhere — it never shadows the working credential behind it, never becomes a bearer header, and never switches routing to a courier that was not configured."
oracle = "The blank-shadowing row sets the higher-precedence variable to whitespace and the lower one to a real token, so a design that returns the first present value returns the empty string where the literal names the real one. Blankness is checked after trimming, so a guard written against the empty string alone fails the whitespace row."
target = "rust"
command = "github-credential-resolution-order-security"
evidence_paths = ["evidence/github-credential-resolution-order-security.json"]

[[tool.aw.python-ec.cases]]
id = "courier-proxy-routing-behavior"
artifact_id = "artifact:cli-std/courier-proxy-routing-behavior"
capability_id = "courier-proxy-routing"
use_case_id = "courier-proxy-routing"
dimension = "behavior"
applicability = "td"
test_path = "src/courier-proxy-routing-behavior.py"
promise = "A configured courier URL routes every issue verb through the courier's `/v1/issues/{owner}/{name}` surface with a base-URL slash normalised away, and no courier routes directly to GitHub with the `application/vnd.github+json` Accept header ahead of the bearer; a comment on a closed issue is planned as a reopen followed by the comment, in that order."
oracle = "The two routes are observed for the same verb and repository, so a design that ignores the courier still produces the direct URL and is red. The reopen is observed as the ordered pair of full request plans, so posting the comment alone, or posting it before the state change, are distinguishable from the one documented answer."
target = "rust"
command = "courier-proxy-routing-behavior"
evidence_paths = ["evidence/courier-proxy-routing-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "courier-proxy-routing-security"
artifact_id = "artifact:cli-std/courier-proxy-routing-security"
capability_id = "courier-proxy-routing"
use_case_id = "courier-proxy-routing"
dimension = "security"
applicability = "td"
test_path = "src/courier-proxy-routing-security.py"
promise = "A malformed repository is refused before any URL is built, every interpolated query value is percent-encoded, a direct search stays scoped to its repository, and an unauthenticated create opens a prefilled browser form rather than posting to the API."
oracle = "The refusal is observed as the classified value carrying the offending repository, so a design that built a URL with an empty owner is red. Encoding is observed with a query containing a structural byte, so an unencoded interpolation produces a different URL than the literal. The unauthenticated path is a distinct outcome type, so it cannot be confused with a request plan carrying no bearer."
target = "rust"
command = "courier-proxy-routing-security"
evidence_paths = ["evidence/courier-proxy-routing-security.json"]

