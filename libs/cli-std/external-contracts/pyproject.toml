[[tool.aw.python-ec.cases]]
id = "diagnostics-bearing-issue-surface-security"
artifact_id = "artifact:cli-std/diagnostics-bearing-issue-surface-security"
capability_id = "diagnostics-bearing-issue-surface"
use_case_id = "diagnostics-bearing-issue-surface"
dimension = "security"
applicability = "td"
test_path = "src/diagnostics-bearing-issue-surface-security.py"
promise = "Every byte outside the unreserved set is percent-encoded as uppercase hex over UTF-8, so a title carrying `&`, `#`, `=` or a newline cannot inject a query parameter into the prefilled issue URL, and a blank message yields diagnostics alone rather than an empty leading section."
oracle = "The encoder's output is an exact literal for an input containing each structural byte and one multi-byte character, so a code-point encoder, a lowercase-hex encoder, or one that passes reserved characters through each diverge. The unreserved set is exercised at its boundary — the tilde specifically — so a nearly-correct table is caught."
target = "rust"
command = "diagnostics-bearing-issue-surface-security"
evidence_paths = ["evidence/diagnostics-bearing-issue-surface-security.json"]

[[tool.aw.python-ec.cases]]
id = "self-update-from-release-assets-behavior"
artifact_id = "artifact:cli-std/self-update-from-release-assets-behavior"
capability_id = "self-update-from-release-assets"
use_case_id = "self-update-from-release-assets"
dimension = "behavior"
applicability = "td"
test_path = "src/self-update-from-release-assets-behavior.py"
promise = "An unpinned upgrade selects the highest stable release for this project's tag prefix, plans the target-specific asset and the binary path inside it, decides install versus up-to-date from the version comparison, and the read-only check verb reports the same selection with the command that would apply it."
oracle = "Selection is observed against a tag list containing a higher pre-release, an equal-valued duplicate and a tag belonging to another project, so a selector that ignored stability, ordering or the prefix is red. The plan's asset and inner path are exact strings derived from the tool identity, so a flattened archive layout cannot match."
target = "rust"
command = "self-update-from-release-assets-behavior"
evidence_paths = ["evidence/self-update-from-release-assets-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "self-update-from-release-assets-security"
artifact_id = "artifact:cli-std/self-update-from-release-assets-security"
capability_id = "self-update-from-release-assets"
use_case_id = "self-update-from-release-assets"
dimension = "security"
applicability = "td"
test_path = "src/self-update-from-release-assets-security.py"
promise = "A downloaded asset is accepted only when its SHA-256 matches the published digest, compared case-insensitively after trimming; a version string with whitespace, a leading zero, a non-ASCII digit or a bare trailing hyphen is refused rather than coerced; an unreadable installed version stops the upgrade before any release is considered; and an archive missing the expected binary is reported."
oracle = "The mismatch is observed as the classified report carrying both digests in their documented fields, so a design that reports success, reports nothing, or transposes the fields is red. Each malformed version is its own row, so a parser that only rejects the empty string passes one and fails the rest. The precedence between the two upgrade failures is observed with both faults present at once."
target = "rust"
command = "self-update-from-release-assets-security"
evidence_paths = ["evidence/self-update-from-release-assets-security.json"]

[[tool.aw.python-ec.cases]]
