[project]
name = "cli-std-external-contracts"
version = "0.0.0"
requires-python = ">=3.11"

[tool.aw.python-artifact]
protocol = "aw.python-artifact.v1"
entrypoint = "src/runner.py"
source_roots = ["src"]
dependency_files = ["pyproject.toml", "uv.lock"]
evidence_dir = "evidence"

[tool.aw.python-ec]
protocol = "aw.python-ec.v1"
author = "chrischeng"
efficiency_policy = "optional"

[[tool.aw.python-ec.cases]]
id = "chainable-output-conformance-behavior"
artifact_id = "artifact:cli-std/chainable-output-conformance-behavior"
capability_id = "chainable-output-conformance"
use_case_id = "chainable-output-conformance"
dimension = "behavior"
applicability = "td"
test_path = "src/chainable-output-conformance-behavior.py"
promise = "A JSON payload is chainable when it carries either a runnable command — a bare `next` string, a nested `next.command`, or an `invoke.command` — or a terminal marker, and a plain-text output is chainable when its last non-blank line is `next: done` or `next: <command>`."
oracle = "Each of the three command carriers is a separate row, so a reader that only understands the bare string passes one and fails the others. The text path is observed as the classified `NextLine` rather than as a boolean, so an output that is merely accepted but misclassified as terminal when it names a command is red."
target = "rust"
command = "chainable-output-conformance-behavior"
evidence_paths = ["evidence/chainable-output-conformance-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "chainable-output-conformance-security"
artifact_id = "artifact:cli-std/chainable-output-conformance-security"
capability_id = "chainable-output-conformance"
use_case_id = "chainable-output-conformance"
dimension = "security"
applicability = "td"
test_path = "src/chainable-output-conformance-security.py"
promise = "Completion is only claimed by a real boolean `true`, empty output and an inert JSON payload are both refused, a blank or `done` command is never runnable, and only the last non-blank line can carry the marker."
oracle = "The truthy-but-not-boolean value `1` is a row of its own, so a check written as `if wf:` is red while a correct `type(wf) is bool` passes. Refusal is observed as the violation value, not as falsiness, so a design that returned `None` for an inert payload cannot borrow the accepted rows' answer. A marker placed on the first of several lines is a separate row from the same marker placed last."
target = "rust"
command = "chainable-output-conformance-security"
evidence_paths = ["evidence/chainable-output-conformance-security.json"]

[[tool.aw.python-ec.cases]]
id = "offline-agent-orientation-behavior"
artifact_id = "artifact:cli-std/offline-agent-orientation-behavior"
capability_id = "offline-agent-orientation"
use_case_id = "offline-agent-orientation"
dimension = "behavior"
applicability = "td"
test_path = "src/offline-agent-orientation-behavior.py"
promise = "`llm` with no topic renders an outline listing every topic id with its summary plus the standard command set, a named topic renders its body in markdown and its id, summary and body in JSON, and a sectioned topic renders prose and generated sections in declaration order joined by a blank line."
oracle = "The outline is compared as an exact rendered string, so a list that dropped the summaries or the command block is red. Section identity and kind are observed per section, so a generated section reported as prose fails even though its content is right. The join is observed through two adjacent sections, so a single-newline join is distinguishable."
target = "rust"
command = "offline-agent-orientation-behavior"
evidence_paths = ["evidence/offline-agent-orientation-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "offline-agent-orientation-security"
artifact_id = "artifact:cli-std/offline-agent-orientation-security"
capability_id = "offline-agent-orientation"
use_case_id = "offline-agent-orientation"
dimension = "security"
applicability = "td"
test_path = "src/offline-agent-orientation-security.py"
promise = "An unknown topic is reported as such together with the full list of known ids rather than silently rendering some other topic, topic lookup is exact rather than a prefix match, an unrecognised format falls back to markdown, and a topic set that renders nothing, renders an empty generated section, or reuses a generated id is refused at authoring time."
oracle = "The known-id list is observed as a tuple, so an error that names the topic but not the alternatives is red. Prefix matching is caught by a topic whose id is a strict prefix of another. The three authoring refusals are separate rows against otherwise valid topic sets, so a validator that only checks emptiness passes one and fails the rest."
target = "rust"
command = "offline-agent-orientation-security"
evidence_paths = ["evidence/offline-agent-orientation-security.json"]

[[tool.aw.python-ec.cases]]
