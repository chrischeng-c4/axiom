[package]
name = "storage-object"
version = "0.1.0"
edition = "2021"
description = "Shared local and cloud object-store boundary with conditional writes and versioned metadata."
autotests = false

[lib]
name = "storage_object"
path = "src/lib.rs"

[features]
default = ["gcs"]
gcs = ["dep:reqwest", "dep:urlencoding"]
s3 = ["dep:aws-config", "dep:aws-sdk-s3", "dep:tokio"]

[dependencies]
anyhow = { workspace = true }
aws-config = { version = "1", optional = true }
aws-sdk-s3 = { version = "1", optional = true }
chrono = { workspace = true }
fs2 = "0.4"
reqwest = { workspace = true, features = ["blocking"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
storage-durable = { path = "../storage-durable" }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
urlencoding = { workspace = true, optional = true }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { workspace = true }

[[test]]
name = "local_object_store"
path = "e2e/local_object_store.rs"

[[test]]
name = "gcs_conditional_put"
path = "e2e/gcs_conditional_put.rs"
required-features = ["gcs"]
