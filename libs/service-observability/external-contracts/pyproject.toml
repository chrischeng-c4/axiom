[project]
name = "service-observability-external-contracts"
version = "0.0.0"
requires-python = ">=3.11"

[tool.aw.python-artifact]
protocol = "aw.python-artifact.v1"
entrypoint = "src/runner.py"
source_roots = ["src"]
dependency_files = ["pyproject.toml", "uv.lock"]
evidence_dir = "evidence"

[tool.aw.python-ec]
protocol = "aw.python-ec.v1"
author = "chrischeng"
efficiency_policy = "optional"

[[tool.aw.python-ec.cases]]
id = "versioned-log-envelope-behavior"
artifact_id = "artifact:service-observability/versioned-log-envelope-behavior"
capability_id = "versioned-log-envelope"
use_case_id = "versioned-log-envelope"
dimension = "behavior"
applicability = "td"
test_path = "src/versioned-log-envelope-behavior.py"
promise = "Every event a service emits is one line of JSON carrying the schema tag `axiom.service.log.v1`, and that line always has a timestamp, a severity, a service identity with a name and a version, an event name, and a message, in that fixed order. The event name is the caller's own `event` field when it supplied a non-empty one, the enclosing span's when the event carried none, and the tracing metadata name otherwise. The message is the caller's `message` field when present and the resolved event name otherwise, so neither is ever empty. The event name and the service name are cut to the event byte bound and the message to the value byte bound. Everything the envelope does not claim becomes an attribute. Only the JSON format is collector-compatible."
oracle = "Row 2 reads the envelope's key order as a tuple rather than as a set, so a formatter that emits every required field in a different order fails while one that drops a field fails differently. Rows 4, 5, and 6 hold the metadata name fixed and vary only where the `event` field lives - event, absent, empty, span - so an implementation that lets the enclosing span outrank the event fails row 4 alone. Rows 10, 11, and 12 truncate a message, an event name, and a service name past three different bounds in the same observation shape, so a formatter that applies the event bound to the message is visible as a shortened message rather than as a generic length failure. Row 15 round-trips the serialized line through a JSON parse and pins that it contains no newline, so a line that is valid JSON but spans two lines still fails."
target = "rust"
command = "versioned-log-envelope-behavior"
evidence_paths = ["evidence/versioned-log-envelope-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "versioned-log-envelope-security"
artifact_id = "artifact:service-observability/versioned-log-envelope-security"
capability_id = "versioned-log-envelope"
use_case_id = "versioned-log-envelope"
dimension = "security"
applicability = "td"
test_path = "src/versioned-log-envelope-security.py"
promise = "An absent correlation field is omitted from the line, never serialized as null, and a present one appears in the published slot order. The serialized keys are exactly the published set: a caller cannot add an envelope key by recording a field with that name, and cannot reach the correlation slots through the attributes bag. A service identity with a blank or whitespace-only name or version is refused at construction, and the refusal is a `ValueError` an existing handler already catches. A newline in a message or in an attribute value cannot break one event into two lines, and a non-ASCII message survives the line intact rather than being escaped away. The pretty format is not collector-compatible."
oracle = "Row 1 pins the serialized key set for an event with no correlation at all and row 2 for one with every slot filled, so an implementation that emits nulls fails row 1 while one that reorders the slots fails row 2. Row 4 records `timestamp`, `severity`, `service`, and `schema` as caller fields and pins both the resulting envelope values and the attribute keys, so a formatter that lets a caller shadow an envelope field is visible as a changed envelope value rather than as an extra attribute. Row 8 asserts the refusal type is a `ValueError` subclass rather than only that a refusal occurred, so a rebased exception hierarchy fails even though the refusal still happens. Rows 9 and 10 embed a newline in a message and in an attribute value and pin the serialized line's newline count at zero in both, so escaping only one of the two paths is visible."
target = "rust"
command = "versioned-log-envelope-security"
evidence_paths = ["evidence/versioned-log-envelope-security.json"]

[[tool.aw.python-ec.cases]]
id = "correlation-field-integrity-behavior"
artifact_id = "artifact:service-observability/correlation-field-integrity-behavior"
capability_id = "correlation-field-integrity"
use_case_id = "correlation-field-integrity"
dimension = "behavior"
applicability = "td"
test_path = "src/correlation-field-integrity-behavior.py"
promise = "A trace id of 32 lower-case hex characters, a span id and a parent span id of 16, and trace flags of 2 reach the envelope unchanged. All-zero trace flags are kept, because zero is a legitimate flag value even though an all-zero id is not. For every correlation slot the event's own field outranks the enclosing span's, and the span's is used when the event records none. A request id is searched under its published spellings in a published order; each spelling alone is honored, the first present one wins, and an event-level value outranks any span-level spelling. Only a string field is a candidate at all. All five slots fill from one formatting call."
oracle = "Row 3 pins all-zero trace flags as kept while the security case pins an all-zero id as refused, so an implementation that applies one zero rule to all four hex fields fails exactly one of the two. Row 6 reads the request-id spellings as an ordered tuple, so a set-valued or alphabetized spelling list is visible without any event being formatted. Row 8 records two spellings at once and pins which one is published, and row 9 puts the later spelling on the event and the earlier one on the span, so an implementation whose outer loop is over spellings rather than over sources fails row 9 while still passing row 8. Row 12 fills all five slots in a single call and reads them as one tuple, so a slot wired to the wrong source is visible as a swapped element rather than as an absence."
target = "rust"
command = "correlation-field-integrity-behavior"
evidence_paths = ["evidence/correlation-field-integrity-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "correlation-field-integrity-security"
artifact_id = "artifact:service-observability/correlation-field-integrity-security"
capability_id = "correlation-field-integrity"
use_case_id = "correlation-field-integrity"
dimension = "security"
applicability = "td"
test_path = "src/correlation-field-integrity-security.py"
promise = "An identifier of the wrong length, in upper-case hex, or carrying any non-hex character is refused, and the W3C all-zero invalid value is refused for the three ids. An invalid identifier is omitted from its slot rather than repaired into shape, and an invalid event-level value falls through to the enclosing span rather than suppressing it. A request id is refused when empty, one byte past its byte bound, or carrying any Unicode control-category character - not only the ASCII control range. An invalid request id falls through to the next spelling. A non-string field is ignored rather than coerced, and no rejected correlation value is ever published in any slot or leaked into the attributes bag."
oracle = "Row 1 sweeps the length check one below, at, and one above the published length for a 32-character and a 16-character field in one tuple, so an implementation that compares with the wrong relational operator fails one element and one with the wrong constant fails another. Row 10 uses four request ids differing only by an invisible character - a soft hyphen, a zero-width space, a plane-14 tag character, and a plain hyphen - so an implementation screening only the ASCII control range passes the fourth and fails the first three. Row 11 records an invalid value under the first spelling and a valid one under the second and pins that the second is published, so a lookup that stops at the first present key rather than the first valid one is visible. Row 14 records an invalid trace id and pins both that the slot is absent and that no attribute carries the rejected text, so a formatter that demotes a rejected id into attributes is caught."
target = "rust"
command = "correlation-field-integrity-security"
evidence_paths = ["evidence/correlation-field-integrity-security.json"]

[[tool.aw.python-ec.cases]]
id = "attribute-containment-behavior"
artifact_id = "artifact:service-observability/attribute-containment-behavior"
capability_id = "attribute-containment"
use_case_id = "attribute-containment"
dimension = "behavior"
applicability = "td"
test_path = "src/attribute-containment-behavior.py"
promise = "An ordinary caller field reaches the attributes bag with its JSON type intact, and attributes are published in sorted key order rather than arrival order. The tracing target is recorded when the caller supplied none and a caller-supplied target wins over it. An event field overrides the same field on the enclosing span. A scalar value passes the value bound untouched and a non-scalar one is rendered to a bounded string. The published bounds are the ones the promise names: 64 attributes, 128 key bytes, 4096 value bytes, 128 event bytes, 128 request-id bytes. A key and a value at their exact bound survive unchanged."
oracle = "Row 2 records keys in reverse-sorted arrival order and pins the published order, so an implementation that preserves insertion order fails here rather than in the count-bound row. Row 8 reads the five published bounds as one tuple straight from the design, so a changed constant is visible without formatting any event. Row 9 offers one attribute under the count bound and one over it in the same observation, so a ceiling relaxed or tightened by one is visible as a changed count on one element only. Row 10 uses a key of exactly the key bound and a value of exactly the value bound and pins them unchanged, so an off-by-one truncation is visible as a shortened survivor rather than as a dropped key. Row 11 formats an event with no caller fields at all and pins that the attributes bag still carries exactly the tracing target."
target = "rust"
command = "attribute-containment-behavior"
evidence_paths = ["evidence/attribute-containment-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "attribute-containment-security"
artifact_id = "artifact:service-observability/attribute-containment-security"
capability_id = "attribute-containment"
use_case_id = "attribute-containment"
dimension = "security"
applicability = "td"
test_path = "src/attribute-containment-security.py"
promise = "A key naming an envelope field is dropped rather than allowed to shadow it, and every reserved name - including each request-id spelling - is refused, so a caller cannot forge correlation through the attributes bag. Each credential-bearing name is refused bare, the comparison folds case, a dash is normalized to an underscore before comparing, and a namespaced key is caught as a trailing segment after a dot, a slash, or an underscore. A name that merely contains a credential word is not a match. A screened key never reaches the published attributes. Beyond the count bound the sorted tail is cut; an over-long key or value is cut to its exact byte bound, truncation steps back to a character boundary, a truncated multi-byte value is still valid JSON, and a key that truncates away entirely is dropped."
oracle = "Row 2 walks every reserved name in one tuple, so a list that loses one entry fails on that element alone. Row 7 compares a key namespaced with a dot, a slash, and an underscore against one namespaced with a character that is none of the three, so an implementation that treats any suffix match as a hit fails the fourth element while one that screens only the dotted form fails the second and third. Row 8 offers names that merely contain a credential word and pins them as ordinary attributes, so a prefix or substring comparison is visible as a wrongly screened key. Row 10 offers more attributes than the count bound with keys chosen so the cut lands on known names, so a tail cut over an unsorted map is visible as a different survivor set. Row 13 truncates a value whose bound falls mid-character and pins the surviving byte length as strictly below the bound, so a cut that splits a character is visible as a longer survivor or as an invalid line in row 14."
target = "rust"
command = "attribute-containment-security"
evidence_paths = ["evidence/attribute-containment-security.json"]

[[tool.aw.python-ec.cases]]
id = "degraded-telemetry-fallback-behavior"
artifact_id = "artifact:service-observability/degraded-telemetry-fallback-behavior"
capability_id = "degraded-telemetry-fallback"
use_case_id = "degraded-telemetry-fallback"
dimension = "behavior"
applicability = "td"
test_path = "src/degraded-telemetry-fallback-behavior.py"
promise = "No configured endpoint resolves to logging-only, which is a normal mode and not a failure. A valid endpoint with the exporter compiled in resolves to exporting and carries the service identity; a valid endpoint without it resolves to a named fallback. Both `http` and `https` are accepted schemes. The configuration round-trips its settings unchanged, its defaults are the documented ones, and it says nothing about how traffic is served. The two fallback reasons and the two log formats are each a published enumeration. Resolving is pure, so the same configuration resolves the same way twice."
oracle = "Row 1 pins that an unset endpoint resolves to logging-only rather than to any unavailable variant, so an implementation that reports absence as a failure is visible as a changed variant name rather than as a missing endpoint. Rows 2 and 4 hold the endpoint fixed and vary only the compiled-exporter flag, so a resolver reading that flag the wrong way round fails both with each other's answers. Row 7 pins the three configuration defaults as one tuple, so a default level, format, or endpoint changed in isolation fails on its own element. Rows 9 and 10 read the two enumerations as ordered tuples of their published string values, so a renamed variant is visible without resolving anything. Row 11 resolves twice from the same configuration and pins equality, so a resolver that caches or mutates state is caught."
target = "rust"
command = "degraded-telemetry-fallback-behavior"
evidence_paths = ["evidence/degraded-telemetry-fallback-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "degraded-telemetry-fallback-security"
artifact_id = "artifact:service-observability/degraded-telemetry-fallback-security"
capability_id = "degraded-telemetry-fallback"
use_case_id = "degraded-telemetry-fallback"
dimension = "security"
applicability = "td"
test_path = "src/degraded-telemetry-fallback-security.py"
promise = "An endpoint that is not a URI, one whose scheme is outside the published set, one carrying no authority, and an empty or relative one are each refused as an invalid-endpoint fallback rather than dialled. The scheme comparison is folded by the URI split itself. An invalid endpoint is refused whether or not the exporter is compiled in, and the rejected endpoint is reported back so an operator can see which value was refused. No unavailable path raises, so a bad endpoint cannot fail startup; an unset endpoint never turns into a dial; and resolving builds no connection, so it is safe on a host where nothing is listening."
oracle = "Rows 2 and 3 separate the two halves of endpoint validity: row 2 supplies a well-formed URI with a refused scheme and row 3 a right-scheme URI with no authority, so an implementation checking only one half passes one row and fails the other. Row 6 holds one invalid endpoint fixed and varies only the compiled-exporter flag, pinning the same invalid-endpoint reason in both, so an implementation that reports a disabled exporter first is visible as a changed reason rather than as a changed variant. Row 7 pins the rejected endpoint text carried on the fallback, so an implementation that blanks it still resolves correctly and still fails. Rows 8 and 10 resolve against an endpoint on a closed port and pin that no exception is raised and that the result is a pure value, so a resolver that eagerly dials is caught as a raised error rather than as a wrong verdict."
target = "rust"
command = "degraded-telemetry-fallback-security"
evidence_paths = ["evidence/degraded-telemetry-fallback-security.json"]

[[tool.aw.python-ec.cases]]
id = "connection-lifecycle-metrics-behavior"
artifact_id = "artifact:service-observability/connection-lifecycle-metrics-behavior"
capability_id = "connection-lifecycle-metrics"
use_case_id = "connection-lifecycle-metrics"
dimension = "behavior"
applicability = "td"
test_path = "src/connection-lifecycle-metrics-behavior.py"
promise = "A fresh set of counters reads zero on every series. An accepted, a rejected, and a closed connection each increment only their own counter, and mixed traffic reads back the exact counts. The three canonical series appear in their fixed order, every sample contributes exactly three lines, and each series carries a HELP line and a TYPE line ahead of its value. The value rendered is the current count, the exposition ends with a newline, and the canonical names are owned by this crate rather than borrowed from a runtime."
oracle = "Rows 2, 3, and 4 each drive one lifecycle edge and read all three counters as one tuple, so a counter wired to the wrong series is visible as a nonzero neighbour rather than as a missing increment. Row 5 drives an asymmetric mix so that an implementation which increments by two, or which shares one counter across series, cannot reproduce the tuple. Row 8 pins the leading token of each of a series' three lines, so a renderer that drops or reorders a preamble line is visible per line. Row 10 pins the last character of the exposition, so an implementation that joins with newlines rather than terminating each line fails on that character alone."
target = "rust"
command = "connection-lifecycle-metrics-behavior"
evidence_paths = ["evidence/connection-lifecycle-metrics-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "connection-lifecycle-metrics-security"
artifact_id = "artifact:service-observability/connection-lifecycle-metrics-security"
capability_id = "connection-lifecycle-metrics"
use_case_id = "connection-lifecycle-metrics"
dimension = "security"
applicability = "td"
test_path = "src/connection-lifecycle-metrics-security.py"
promise = "A provider with no samples renders an empty body, and a counter value cannot inject a HELP line into the exposition. The rendered body is a pure function of the counts and rendering does not disturb the counters it read. The order is fixed by the crate rather than by arrival order. Every series is declared a counter, no rendered line is blank, a rejected connection is never also counted as accepted, and a closed connection does not decrement the accepted count. Two independent providers do not share counter state, and the help text is the crate's own."
oracle = "Row 2 renders a body and pins the number of `# HELP` lines at exactly one per series, so a renderer interpolating an attacker-shaped value into the preamble is visible as an extra line. Row 3 renders twice from the same counts and pins equality, and row 4 reads the counters back after rendering, so a renderer that resets or increments while reading is caught by row 4 while a non-deterministic one is caught by row 3. Row 5 drives the lifecycle edges in a deliberately non-canonical order and pins the same rendered series order, so an implementation keyed off arrival order is visible. Row 10 drives one provider only and reads both, so shared class-level counter state appears as a nonzero count on the untouched provider."
target = "rust"
command = "connection-lifecycle-metrics-security"
evidence_paths = ["evidence/connection-lifecycle-metrics-security.json"]

[[tool.aw.python-ec.cases]]
id = "portable-process-sampling-behavior"
artifact_id = "artifact:service-observability/portable-process-sampling-behavior"
capability_id = "portable-process-sampling"
use_case_id = "portable-process-sampling"
dimension = "behavior"
applicability = "td"
test_path = "src/portable-process-sampling-behavior.py"
promise = "The two-field `MM:SS` clock, the three-field `HH:MM:SS` clock, and the day-prefixed `D-HH:MM:SS` shape each convert to exact seconds, and a fractional second survives the conversion. A resident size reported in KiB is published in bytes. One sample carries both readings together, whitespace between the fields is tolerated, and extra trailing fields beyond the two read are ignored. The sample is a plain value, so two identical readings compare equal. A long soak reading keeps its day component rather than folding it away."
oracle = "Rows 1, 2, and 3 use clock strings whose fields are chosen so that reading a two-field clock as hours-and-minutes, or a three-field clock as minutes-minutes-seconds, produces a different number rather than the same one - an implementation with the wrong multiplier fails one row while still passing the others. Row 4 uses a fractional second that is not representable as an integer, so a parser routing through an integer conversion is visible as a truncated value. Row 5 pins one KiB reading in bytes, so a decimal factor is visible as a changed magnitude. Row 10 uses a multi-day reading whose day component exceeds the clock component, so an implementation that drops or under-weights the day prefix cannot land on the same total."
target = "rust"
command = "portable-process-sampling-behavior"
evidence_paths = ["evidence/portable-process-sampling-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "portable-process-sampling-security"
artifact_id = "artifact:service-observability/portable-process-sampling-security"
capability_id = "portable-process-sampling"
use_case_id = "portable-process-sampling"
dimension = "security"
applicability = "td"
test_path = "src/portable-process-sampling-security.py"
promise = "Output with no fields at all, a non-numeric resident size, a missing CPU time field, a non-numeric clock field, an unrecognized clock shape, and a non-numeric day prefix are each an error rather than a zero. Every refusal is one named error type, and that type is a `ValueError` an existing handler already catches. A resident reading past the representable range is refused; inside the range the byte count saturates rather than wrapping, and the saturation boundary is exact on the low side. A negative resident reading is refused, and only a plain ASCII decimal - optionally signed positive - is a resident size. A valid reading still parses after all of those refusals."
oracle = "Row 3 supplies a resident size with no CPU field at all and pins a refusal, so an implementation that defaults a missing CPU time to zero is visible as a parsed sample rather than as a wrong number. Row 7 collects the error type name from six different malformed inputs into one tuple, so a parser that raises the platform's own exception for one of them fails on that element. Row 8 asserts the type is a `ValueError` subclass rather than only that a refusal occurred. Rows 9, 10, and 11 walk the representable range: one reading past the ceiling, one whose KiB-to-byte multiplication would exceed it, and one exactly at the boundary below, so an implementation that saturates where it should refuse and one that wraps where it should saturate fail different rows. Row 13 offers a digit-grouping separator, a non-ASCII numeral, and a leading `+` in one tuple, so a parser delegating to a permissive conversion is visible on the elements it wrongly accepts."
target = "rust"
command = "portable-process-sampling-security"
evidence_paths = ["evidence/portable-process-sampling-security.json"]
