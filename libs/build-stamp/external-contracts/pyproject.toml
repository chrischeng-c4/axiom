[project]
name = "build-stamp-external-contracts"
version = "0.0.0"
requires-python = ">=3.11"

[tool.aw.python-artifact]
protocol = "aw.python-artifact.v1"
entrypoint = "src/runner.py"
source_roots = ["src"]
dependency_files = ["pyproject.toml", "uv.lock"]
evidence_dir = "evidence"

[tool.aw.python-ec]
protocol = "aw.python-ec.v1"
author = "chrischeng"
efficiency_policy = "optional"

[[tool.aw.python-ec.cases]]
id = "version-stamp-emission-behavior"
artifact_id = "artifact:build-stamp/version-stamp-emission-behavior"
capability_id = "version-stamp-emission"
use_case_id = "version-stamp-emission"
dimension = "behavior"
applicability = "td"
test_path = "src/version-stamp-emission-behavior.py"
promise = "One stamp call emits exactly three prefixed `cargo:rustc-env` directives — `_GIT_SHA`, `_BUILT_AT`, `_TARGET` — in that order, with the build time encoded as whole seconds since the Unix epoch, plus a `cargo:rerun-if-changed` hint emitted when and only when the git HEAD path it names exists."
oracle = "The contract authors its own prefix matrix and its own expected directive names by joining each prefix to the three suffixes itself, then drives the tech-design emission with a supplied clock, sha, and target and compares the produced directive list position by position. The epoch encoding is checked against a duration the contract chooses and converts itself. The rerun hint is exercised under both an existing and an absent path supplied through the design's own filesystem port, so the case never reads the real repository. Expected values are contract literals; none is read back from the design."
target = "rust"
command = "version-stamp-emission-behavior"
evidence_paths = ["evidence/version-stamp-emission-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "version-stamp-emission-security"
artifact_id = "artifact:build-stamp/version-stamp-emission-security"
capability_id = "version-stamp-emission"
use_case_id = "version-stamp-emission"
dimension = "security"
applicability = "td"
test_path = "src/version-stamp-emission-security.py"
promise = "The emitted set is exactly the stamp directives and nothing else. A stamp cannot acquire a link flag, a cfg, a feature, a second rerun hint, or any other instruction Cargo would obey."
oracle = "The contract enumerates the `cargo:` instruction families it forbids as its own literal list — `rustc-link-lib`, `rustc-link-search`, `rustc-cfg`, `rustc-flags`, `rustc-cdylib-link-arg`, `warning`, `error` — and requires that no emission under any input in its matrix produces a line beginning with one of them. It also pins the exact multiset of emitted directive keys: a run that emits a fourth `rustc-env` key, or two rerun hints, fails even when every individual value is correct. The allowed set is stated by the contract, never derived from what the design emitted."
target = "rust"
command = "version-stamp-emission-security"
evidence_paths = ["evidence/version-stamp-emission-security.json"]

[[tool.aw.python-ec.cases]]
id = "best-effort-degradation-behavior"
artifact_id = "artifact:build-stamp/best-effort-degradation-behavior"
capability_id = "best-effort-degradation"
use_case_id = "best-effort-degradation"
dimension = "behavior"
applicability = "td"
test_path = "src/best-effort-degradation-behavior.py"
promise = "Every input the build environment cannot answer becomes the same stable value `unknown`, each degrading independently, and the directive set stays complete: a failed git invocation, an empty git answer, an absent target triple, and a clock before the epoch each affect only their own directive."
oracle = "The contract builds a failure-mode matrix it authors itself — one row per unobtainable input, plus rows with two and three simultaneous failures — and states for each row which directives must hold real values and which must hold the fallback. It supplies each failure through the design's ports rather than by manipulating the host, then compares the full directive list against the row's expectation. The fallback string is a contract literal written once and reused, so a design that spells one fallback differently from another is caught by the comparison rather than by inspection."
target = "rust"
command = "best-effort-degradation-behavior"
evidence_paths = ["evidence/best-effort-degradation-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "best-effort-degradation-security"
artifact_id = "artifact:build-stamp/best-effort-degradation-security"
capability_id = "best-effort-degradation"
use_case_id = "best-effort-degradation"
dimension = "security"
applicability = "td"
test_path = "src/best-effort-degradation-security.py"
promise = "A degraded stamp reports only that it does not know. It never carries stderr text, an exit status, a filesystem path, an environment-variable name, or partial subprocess output onto the directive channel, and no failure class turns into a build failure."
oracle = "The contract drives each failure mode with a distinctive poison payload it chooses itself — a fake stderr string, an absolute path, an environment-variable name, a numeric exit status — and requires that no emitted directive value contains any of those payloads as a substring. It separately asserts that the stamp entry point is total over the whole failure matrix: every row returns a complete directive list, and the design exposes no error type, no result type, and no panic-carrying path from that entry point. Totality is asserted by inspecting the design's declared return annotation, not by observing that the matrix happened not to raise."
target = "rust"
command = "best-effort-degradation-security"
evidence_paths = ["evidence/best-effort-degradation-security.json"]

[[tool.aw.python-ec.cases]]
id = "directive-channel-integrity-behavior"
artifact_id = "artifact:build-stamp/directive-channel-integrity-behavior"
capability_id = "directive-channel-integrity"
use_case_id = "directive-channel-integrity"
dimension = "behavior"
applicability = "td"
test_path = "src/directive-channel-integrity-behavior.py"
promise = "The sha read from the subprocess is normalized before it is interpolated: surrounding whitespace is stripped from the decoded value, an answer that is empty or entirely whitespace is treated as no answer rather than as an empty sha, and invalid UTF-8 is decoded with replacement rather than propagated or refused."
oracle = "The contract supplies raw byte payloads it constructs itself — trailing newline, leading and trailing spaces, tabs, an empty body, an all-whitespace body, and a byte sequence that is not valid UTF-8 — and states the expected normalized outcome for each as a literal, including which payloads must map to no-answer rather than to a value. It asserts the trim is defined on the decoded string by supplying a payload whose byte length and decoded length differ and requiring the documented decoded result."
target = "rust"
command = "directive-channel-integrity-behavior"
evidence_paths = ["evidence/directive-channel-integrity-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "directive-channel-integrity-security"
artifact_id = "artifact:build-stamp/directive-channel-integrity-security"
capability_id = "directive-channel-integrity"
use_case_id = "directive-channel-integrity"
dimension = "security"
applicability = "td"
test_path = "src/directive-channel-integrity-security.py"
promise = "Nothing interpolated into a stamp can introduce a directive the calling crate did not ask for. A prefix, sha, or target carrying a newline, a carriage return, or a `cargo:` sequence is confined to the single directive it belongs to."
oracle = "The contract authors an injection matrix — a value carrying `\\n`, one carrying `\\r\\n`, one carrying a bare `\\r`, one carrying a literal `cargo:rustc-link-arg=` payload, and one combining a newline with a `cargo:` payload — and applies each to the prefix, the sha, and the target in turn. For every cell it requires that the number of parsable `cargo:` lines produced equals the number the same code path produces for a benign value, so a design that neutralizes injection by dropping a legitimate directive fails too. The benign baseline count is computed by the contract from its own expectation of the code path, not read from an injected run."
target = "rust"
command = "directive-channel-integrity-security"
evidence_paths = ["evidence/directive-channel-integrity-security.json"]
