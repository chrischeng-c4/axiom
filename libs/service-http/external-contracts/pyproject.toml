[project]
name = "service-http-external-contracts"
version = "0.0.0"
requires-python = ">=3.11"

[tool.aw.python-artifact]
protocol = "aw.python-artifact.v1"
entrypoint = "src/runner.py"
source_roots = ["src"]
dependency_files = ["pyproject.toml", "uv.lock"]
evidence_dir = "evidence"

[tool.aw.python-ec]
protocol = "aw.python-ec.v1"
author = "chrischeng"
efficiency_policy = "optional"

[[tool.aw.python-ec.cases]]
id = "standard-probe-surface-behavior"
artifact_id = "artifact:service-http/standard-probe-surface-behavior"
capability_id = "standard-probe-surface"
use_case_id = "standard-probe-surface"
dimension = "behavior"
applicability = "td"
test_path = "src/standard-probe-surface-behavior.py"
promise = "Each of the five always-on routes answers with its documented status and body, including the empty-provider `/metrics` case serving an empty 200 rather than a 404, and the canonical-JSON variant returning the producer's exact bytes."
oracle = "The expected status, content type and body of every route are fixed by the promise, not read back from the design: a 404 for an absent metrics provider, a re-serialized OpenAPI document, or a `/docs` page pointing at some other pod's document each differ from a literal written before the design was consulted."
target = "rust"
command = "standard-probe-surface-behavior"
evidence_paths = ["evidence/standard-probe-surface-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "standard-probe-surface-security"
artifact_id = "artifact:service-http/standard-probe-surface-security"
capability_id = "standard-probe-surface"
use_case_id = "standard-probe-surface"
dimension = "security"
applicability = "td"
test_path = "src/standard-probe-surface-security.py"
promise = "`/readyz` returns 503 `draining` when the readiness hook reports a drain, reading the flag on every hit rather than caching it, so a draining pod cannot keep receiving traffic by reporting ready."
oracle = "Both directions are pinned against the same state, so a hook that is always ready and a hook that is always draining are each red. Re-reading the flag after it flips is observed as a second, differing answer from one router, which a cached first answer cannot produce."
target = "rust"
command = "standard-probe-surface-security"
evidence_paths = ["evidence/standard-probe-surface-security.json"]

[[tool.aw.python-ec.cases]]
id = "accept-or-generate-trace-context-behavior"
artifact_id = "artifact:service-http/accept-or-generate-trace-context-behavior"
capability_id = "accept-or-generate-trace-context"
use_case_id = "accept-or-generate-trace-context"
dimension = "behavior"
applicability = "td"
test_path = "src/accept-or-generate-trace-context-behavior.py"
promise = "A valid inbound `traceparent` yields a context whose trace id matches the header and whose parent span id is the header's span id, while a fresh span id is minted for this hop and the header's `trace_flags` are preserved."
oracle = "The expected trace id and parent span id are the literal hex fields of a header written into the case, so a parse that dropped or transposed a field cannot match. The minted span id is observed as differing from the parent rather than as a value, which a pass-through implementation fails."
target = "rust"
command = "accept-or-generate-trace-context-behavior"
evidence_paths = ["evidence/accept-or-generate-trace-context-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "accept-or-generate-trace-context-security"
artifact_id = "artifact:service-http/accept-or-generate-trace-context-security"
capability_id = "accept-or-generate-trace-context"
use_case_id = "accept-or-generate-trace-context"
dimension = "security"
applicability = "td"
test_path = "src/accept-or-generate-trace-context-security.py"
promise = "A malformed, wrong-version, uppercase-hex, all-zero, or duplicated `traceparent` produces a safe local root with no parent and `00` flags, and never fails the request, so a hostile or broken upstream header can neither deny service nor forge a trace lineage."
oracle = "Every rejection class is enumerated with its own hostile input and each is required to be indistinguishable from no header at all — same absent parent, same zero flags. A parser that normalized uppercase, accepted version `01`, or admitted an all-zero id would preserve that id and diverge from the literal."
target = "rust"
command = "accept-or-generate-trace-context-security"
evidence_paths = ["evidence/accept-or-generate-trace-context-security.json"]

[[tool.aw.python-ec.cases]]
id = "shared-error-envelope-behavior"
artifact_id = "artifact:service-http/shared-error-envelope-behavior"
capability_id = "shared-error-envelope"
use_case_id = "shared-error-envelope"
dimension = "behavior"
applicability = "td"
test_path = "src/shared-error-envelope-behavior.py"
promise = "A built error renders the intended status with `error` and `message` carrying the supplied kind and text, and the envelope round-trips back to the same two values."
oracle = "The status and both field values are literals supplied by the case, so an envelope that dropped `message`, renamed a field, or substituted a generic status is red. The round trip is observed as equality with the original record rather than as a successful parse, which a lossy decode passes but a byte-preserving one does not."
target = "rust"
command = "shared-error-envelope-behavior"
evidence_paths = ["evidence/shared-error-envelope-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "shared-error-envelope-security"
artifact_id = "artifact:service-http/shared-error-envelope-security"
capability_id = "shared-error-envelope"
use_case_id = "shared-error-envelope"
dimension = "security"
applicability = "td"
test_path = "src/shared-error-envelope-security.py"
promise = "The serialized field order is pinned to `error` then `message`, and no third field appears, so a client contract or byte-compared fixture cannot be broken by a silent reordering or an added field."
oracle = "The whole serialized body is compared as an exact byte string, not as a decoded mapping, so a reordering that is semantically equivalent is still red. The field name tuple is observed separately, so an added field fails even where the first two stay in place."
