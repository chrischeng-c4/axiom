evidence_paths = ["evidence/shared-error-envelope-security.json"]

[[tool.aw.python-ec.cases]]
id = "request-body-byte-cap-behavior"
artifact_id = "artifact:service-http/request-body-byte-cap-behavior"
capability_id = "request-body-byte-cap"
use_case_id = "request-body-byte-cap"
dimension = "behavior"
applicability = "td"
test_path = "src/request-body-byte-cap-behavior.py"
promise = "A body under the cap and a body exactly at the cap both pass through, and a streamed body with no `Content-Length` that stays under the cap also passes."
oracle = "The boundary is observed on both sides at once — cap minus one, cap, cap plus one — so an off-by-one that refuses the exact-cap body is red even though the under-cap body still passes. The header-absent case is a separate row, so a limiter that only ever consults the header cannot borrow that row's answer."
target = "rust"
command = "request-body-byte-cap-behavior"
evidence_paths = ["evidence/request-body-byte-cap-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "request-body-byte-cap-security"
artifact_id = "artifact:service-http/request-body-byte-cap-security"
capability_id = "request-body-byte-cap"
use_case_id = "request-body-byte-cap"
dimension = "security"
applicability = "td"
test_path = "src/request-body-byte-cap-security.py"
promise = "A declared-oversized body is refused with the structured 413, and a streamed body with no `Content-Length` that grows past the cap is also refused, so the header path cannot be bypassed by omitting the header."
oracle = "The refusal is observed as the full structured outcome — status and classification together — so a bare connection drop or a 400 is red. The two refusal paths are separate rows against the same cap, so a design that trusts a declared length and never counts streamed bytes fails the second while passing the first."
target = "rust"
command = "request-body-byte-cap-security"
evidence_paths = ["evidence/request-body-byte-cap-security.json"]

[[tool.aw.python-ec.cases]]
id = "opaque-key-admission-control-behavior"
artifact_id = "artifact:service-http/opaque-key-admission-control-behavior"
capability_id = "opaque-key-admission-control"
use_case_id = "opaque-key-admission-control"
dimension = "behavior"
applicability = "td"
test_path = "src/opaque-key-admission-control-behavior.py"
promise = "A capacity-2 class allows twice and denies the third request at the same instant, reports the exact refill wait, and admits again once that wait has elapsed; an unconfigured class bypasses rather than denying."
oracle = "Every admission is observed at an explicit instant, so a decision that depends on wall-clock time cannot be reproduced and is red. The reported wait is a literal nanosecond count derived from the configured window, not a nonzero-ness check, so a limiter that always advises one second fails. Bypass is a third distinct outcome, so a design that conflates it with allow is caught by the outcome tuple."
target = "rust"
command = "opaque-key-admission-control-behavior"
evidence_paths = ["evidence/opaque-key-admission-control-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "opaque-key-admission-control-security"
artifact_id = "artifact:service-http/opaque-key-admission-control-security"
capability_id = "opaque-key-admission-control"
use_case_id = "opaque-key-admission-control"
dimension = "security"
applicability = "td"
test_path = "src/opaque-key-admission-control-security.py"
promise = "The observable admission events carry none of the raw keys fed in, nor any field that could hold one, and a class configured for a bounded key count holds exactly that many after more distinct keys arrive, so neither credential leakage nor unbounded ledger growth is possible."
oracle = "Absence is observed as the exact tuple of published field names plus the published value types, not as a substring scan for a sample key, so a design that added a key-bearing field is red even when this case's particular key does not appear in it. The bound is observed as the tracked-key count after each arrival, so an eviction that runs only at some later threshold is caught mid-sequence."
target = "rust"
command = "opaque-key-admission-control-security"
evidence_paths = ["evidence/opaque-key-admission-control-security.json"]

