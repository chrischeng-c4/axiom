[package]
name = "service-http"
version = "0.1.0"
edition = "2021"
description = "Shared HTTP-service policy and adapters: standard probe routes, observability compatibility, lifecycle readiness, runtime delegation, and the {error, message} envelope."


# e2e tests live in e2e/, not Cargo's autodiscovered tests/, so every one
# of them has to be declared below. The list is this crate's e2e inventory.
autotests = false

[lib]
name = "service_http"
path = "src/lib.rs"

[features]
# The default service shell stays logging-only. Applications opt into trace
# export and retain ownership of their service identity and endpoint.
otlp = [
    "service-observability/otlp",
    "dep:opentelemetry",
    "dep:tracing-opentelemetry",
]

[dependencies]
# Inherit the workspace pins so the lock stays single-versioned.
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["trace"] }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
sha2 = "0.10"
http-body-util = "0.1"
opentelemetry = { version = "0.21", optional = true }
tracing-opentelemetry = { version = "0.22", optional = true }

# The HTTP runtime (HTTP/1.1 + h2c on one port) is composed, not re-implemented.
server-http = { path = "../server-http" }
server-lifecycle = { path = "../server-lifecycle" }
service-observability = { path = "../service-observability" }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true, features = ["util"] }
futures-util = "0.3"
tracing-subscriber = { workspace = true, features = ["fmt", "json", "env-filter", "registry"] }

[[test]]
name = "access_log"
path = "e2e/access_log.rs"

[[test]]
name = "body_limit"
path = "e2e/body_limit.rs"

[[test]]
name = "lifecycle_observability"
path = "e2e/lifecycle_observability.rs"

[[test]]
name = "lifecycle_probes"
path = "e2e/lifecycle_probes.rs"

[[test]]
name = "lifecycle_signal"
path = "e2e/lifecycle_signal.rs"

[[test]]
name = "otlp_tracing"
path = "e2e/otlp_tracing.rs"

[[test]]
name = "request_trace_context"
path = "e2e/request_trace_context.rs"

[[test]]
name = "server_timing"
path = "e2e/server_timing.rs"
