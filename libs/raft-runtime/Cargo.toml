[package]
name = "raft-runtime"
version = "0.1.0"
edition = "2021"
description = "Shared Raft runtime that drives raft-core for a service state machine over transport-h2c, including apply, snapshot, compaction, topology, and read-your-write proposal handling."

# e2e tests live in e2e/, not Cargo's autodiscovered tests/, so every one of
# them has to be declared below. The list is the crate's e2e inventory.
autotests = false

[lib]
name = "raft_runtime"
path = "src/lib.rs"

[[test]]
name = "fenced_assignment"
path = "e2e/fenced_assignment.rs"

[[test]]
name = "peer_mtls"
path = "e2e/peer_mtls.rs"

[[test]]
name = "applied_watch"
path = "e2e/applied_watch.rs"

[[test]]
name = "concurrent_host"
path = "e2e/concurrent_host.rs"

[dependencies]
raft-core = { path = "../raft-core" }
storage-durable = { path = "../storage-durable" }
transport-h2c = { path = "../transport-h2c", features = ["server"] }
peer-tls = { path = "../peer-tls" }
cli-std = { path = "../cli-std", default-features = false }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
rustls = "0.23"
tokio-rustls = "0.26"

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
