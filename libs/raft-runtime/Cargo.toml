[package]
name = "raft-runtime"
version = "0.1.0"
edition = "2021"
description = "Shared Raft runtime that drives raft-core for a service state machine over transport-h2c, including apply, snapshot, compaction, topology, and read-your-write proposal handling."

[lib]
name = "raft_runtime"
path = "src/lib.rs"

[dependencies]
raft-core = { path = "../raft-core" }
storage-durable = { path = "../storage-durable" }
transport-h2c = { path = "../transport-h2c" }
cli-std = { path = "../cli-std", default-features = false }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

