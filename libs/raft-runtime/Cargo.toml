[package]
name = "raft-runtime"
version = "0.1.0"
edition = "2021"
description = "Shared Raft runtime that drives raft-core for a service state machine over transport-h2c, including apply, snapshot, compaction, topology, and read-your-write proposal handling."

# e2e tests live in e2e/, not Cargo's autodiscovered tests/, so every one of
# them has to be declared below. The list is the crate's e2e inventory.
autotests = false

[lib]
name = "raft_runtime"
path = "src/lib.rs"

[[test]]
name = "fenced_assignment"
path = "e2e/fenced_assignment.rs"

[[test]]
name = "peer_mtls"
path = "e2e/peer_mtls.rs"

[[test]]
name = "applied_watch"
path = "e2e/applied_watch.rs"

[[test]]
name = "concurrent_host"
path = "e2e/concurrent_host.rs"

[[test]]
name = "durable_persistence"
path = "e2e/durable_persistence.rs"

[[test]]
name = "group_identity"
path = "e2e/group_identity.rs"

[[test]]
name = "durable_layout"
path = "e2e/durable_layout.rs"

[[test]]
name = "snapshot_generations"
path = "e2e/snapshot_generations.rs"

[[test]]
name = "group_registry"
path = "e2e/group_registry.rs"

[[test]]
name = "legacy_store_migration"
path = "e2e/legacy_store_migration.rs"

[[test]]
name = "conf_state_durability"
path = "e2e/conf_state_durability.rs"

[[test]]
name = "group_membership_isolation"
path = "e2e/group_membership_isolation.rs"

[[test]]
name = "leadership_transfer"
path = "e2e/leadership_transfer.rs"

[[test]]
name = "snapshot_peak_memory"
path = "e2e/snapshot_peak_memory.rs"

[[test]]
name = "membership_changes"
path = "e2e/membership_changes.rs"

[[test]]
name = "member_admission"
path = "e2e/member_admission.rs"

[dependencies]
raft-core = { path = "../raft-core" }
storage-durable = { path = "../storage-durable" }
transport-h2c = { path = "../transport-h2c", features = ["server"] }
peer-tls = { path = "../peer-tls" }
cli-std = { path = "../cli-std", default-features = false }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true }
tracing = { workspace = true }
rustls = "0.23"
tokio-rustls = "0.26"

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
