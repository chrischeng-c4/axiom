oracle = "Every rejection is observed as its own classified error record with its exact fields, so a design that validated the dimensions but reported them all under one error type is red, and one that reported the first key it read rather than the one at fault is red on the rows where those differ. Both ends of the voter range and both ends of the node-id range are pinned, so an off-by-one that admits a voter count equal to the replica count plus one, or rejects one equal to the replica count, is distinguishable from the documented bounds."
