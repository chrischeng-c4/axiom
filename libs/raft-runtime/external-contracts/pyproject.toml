[[tool.aw.python-ec.cases]]
id = "idempotent-proposal-outcomes-behavior"
artifact_id = "artifact:raft-runtime/idempotent-proposal-outcomes-behavior"
capability_id = "idempotent-proposal-outcomes"
use_case_id = "idempotent-proposal-outcomes"
dimension = "behavior"
applicability = "td"
test_path = "src/idempotent-proposal-outcomes-behavior.py"
promise = "A repeated insert under one key returns and retains the first recorded outcome, snapshot and restore preserve insertion order and collapse a duplicated key to its first value, and `advance` keeps the entry exactly at the cutoff index while dropping everything strictly below it."
oracle = "The retained value is the first outcome's exact bytes and the returned value of the second insert is required to equal it, so a last-write-wins cache is red on both observations rather than only on the stored one. Snapshot order is compared as an exact tuple of pairs, so a mapping that happened to contain the right entries in another order fails. The cutoff index and the index one below it are separate rows against the same window, so an inclusive comparison drops the boundary entry and is caught."
target = "rust"
command = "idempotent-proposal-outcomes-behavior"
evidence_paths = ["evidence/idempotent-proposal-outcomes-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "idempotent-proposal-outcomes-security"
artifact_id = "artifact:raft-runtime/idempotent-proposal-outcomes-security"
capability_id = "idempotent-proposal-outcomes"
use_case_id = "idempotent-proposal-outcomes"
dimension = "security"
applicability = "td"
test_path = "src/idempotent-proposal-outcomes-security.py"
promise = "Retention is bounded twice over — by entry count and by applied index — so an unbounded retry stream cannot grow host memory without limit: a cache at capacity evicts its oldest key on the next new key, a restore of more entries than the capacity is trimmed to it, an insert below the advanced floor is refused outright, and a non-positive capacity is rejected at construction."
oracle = "The bound is observed as the entry count after each arrival rather than only after the final one, so an eviction that runs at some later threshold is caught mid-sequence. The evicted key is named, so a cache that evicted the newest or an arbitrary key still holds the right number and is red. The below-floor insert is observed as an absent lookup afterwards, so a store that accepted it and merely hid it from one accessor is distinguishable."
target = "rust"
command = "idempotent-proposal-outcomes-security"
evidence_paths = ["evidence/idempotent-proposal-outcomes-security.json"]

