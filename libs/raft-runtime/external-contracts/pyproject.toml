promise = "An absent header, an empty value, an unknown mode, and every malformed `bounded(...)` form — empty parentheses, a sign, a decimal point, a non-numeric argument, a missing closing parenthesis — all resolve to the leader mode, never to a weaker one, and the header name itself is the exact documented string."
oracle = "Each rejection class is its own row required to equal the leader mode exactly, so a fallback to the any mode or to a bounded mode with a default figure is red on every one of them. A signed and a fractional argument are separate rows from a wholly non-numeric one, so a parser that accepted whatever an integer conversion tolerated would pass the alphabetic row and fail these. The strongest-mode predicate is observed alongside, so a mode that reported itself strongest without being the leader mode is caught."
target = "rust"
command = "read-consistency-header-contract-security"
evidence_paths = ["evidence/read-consistency-header-contract-security.json"]

