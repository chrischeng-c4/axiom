[[tool.aw.python-ec.cases]]
id = "static-membership-guard-security"
artifact_id = "artifact:raft-runtime/static-membership-guard-security"
capability_id = "static-membership-guard"
use_case_id = "static-membership-guard"
dimension = "security"
applicability = "td"
test_path = "src/static-membership-guard-security.py"
promise = "The refusal is a configuration-time value, not a runtime effect: the guard reads only the two counts handed to it, returns the refusal to its caller rather than mutating anything, and classifies the refusal apart from every dimension-validation error so a scaled StatefulSet cannot be mistaken for a mistyped environment."
oracle = "The refusal record's type is compared against the topology errors a bad dimension produces, so a design that reported a membership change as a non-positive dimension is red even though both refuse. Purity is observed by calling the guard twice with the same arguments and once with the arguments reversed and requiring the answers to depend on nothing but those arguments, which a guard consulting stored state cannot satisfy."
target = "rust"
command = "static-membership-guard-security"
evidence_paths = ["evidence/static-membership-guard-security.json"]

