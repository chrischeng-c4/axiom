[project]
name = "raft-runtime-external-contracts"
version = "0.0.0"
requires-python = ">=3.11"

[tool.aw.python-artifact]
protocol = "aw.python-artifact.v1"
entrypoint = "src/runner.py"
source_roots = ["src"]
dependency_files = ["pyproject.toml", "uv.lock"]
evidence_dir = "evidence"

[tool.aw.python-ec]
protocol = "aw.python-ec.v1"
author = "chrischeng"
efficiency_policy = "optional"

[[tool.aw.python-ec.cases]]
id = "fenced-single-writer-assignment-behavior"
artifact_id = "artifact:raft-runtime/fenced-single-writer-assignment-behavior"
capability_id = "fenced-single-writer-assignment"
use_case_id = "fenced-single-writer-assignment"
dimension = "behavior"
applicability = "td"
test_path = "src/fenced-single-writer-assignment-behavior.py"
promise = "The epoch is monotonic across assign/release/assign, `validate` reports an unassigned fence before a stale epoch, a stale epoch before an owner mismatch, and an owner mismatch before expiry, and `renew` rejects an equal or earlier expiry while accepting a strictly later one."
oracle = "The first three epochs are literal integers written into the case, so an implementation that restarted numbering at release, or that reused the released epoch, is red. The precedence order is observed by feeding one state that is simultaneously stale, misowned and expired and requiring the single named error, which any of the three other orderings fails. Renewal is pinned on both sides of its boundary — the current expiry itself and one millisecond later — so an inclusive comparison is distinguishable from the exclusive one."
target = "rust"
command = "fenced-single-writer-assignment-behavior"
evidence_paths = ["evidence/fenced-single-writer-assignment-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "fenced-single-writer-assignment-security"
artifact_id = "artifact:raft-runtime/fenced-single-writer-assignment-security"
capability_id = "fenced-single-writer-assignment"
use_case_id = "fenced-single-writer-assignment"
dimension = "security"
applicability = "td"
test_path = "src/fenced-single-writer-assignment-security.py"
promise = "A released or superseded owner cannot act, a non-owner cannot extend or release a fence, an already-past expiry is refused at proposal time, and every expiry decision is taken against the proposer-supplied instant so a replica with a skewed clock cannot grant itself a longer window."
oracle = "Each refusal is observed as its exact classified error with its exact fields, so a design that refused everything with one generic error, or that reported expiry where it should report a stale epoch, is red. The clock-skew row replays the identical call sequence at two different supplied instants and requires the two answers to differ exactly as the supplied instants dictate, which an implementation reading any ambient clock cannot reproduce."
target = "rust"
command = "fenced-single-writer-assignment-security"
evidence_paths = ["evidence/fenced-single-writer-assignment-security.json"]

[[tool.aw.python-ec.cases]]
id = "deterministic-replicated-state-machine-behavior"
artifact_id = "artifact:raft-runtime/deterministic-replicated-state-machine-behavior"
capability_id = "deterministic-replicated-state-machine"
use_case_id = "deterministic-replicated-state-machine"
dimension = "behavior"
applicability = "td"
test_path = "src/deterministic-replicated-state-machine-behavior.py"
promise = "A replay plan drawn from the machine's own applied floor covers exactly the committed indices above that floor in ascending order with duplicates collapsed, entries are applied once each in index order, an index at or below the floor is skipped rather than reapplied, and a missing applied-index payload reads as 0 while a stored floor round-trips byte for byte."
oracle = "The applied and skipped index tuples are literals, so an implementation that reapplied the floor entry, that emitted an index twice, or that returned the plan in arrival order rather than ascending order is red. The absent-payload answer and the round-tripped floor are separate rows against the same encoder, so a decoder that treated an empty payload as an error would still pass the round trip and fail here."
target = "rust"
command = "deterministic-replicated-state-machine-behavior"
evidence_paths = ["evidence/deterministic-replicated-state-machine-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "deterministic-replicated-state-machine-security"
artifact_id = "artifact:raft-runtime/deterministic-replicated-state-machine-security"
capability_id = "deterministic-replicated-state-machine"
use_case_id = "deterministic-replicated-state-machine"
dimension = "security"
applicability = "td"
test_path = "src/deterministic-replicated-state-machine-security.py"
promise = "A corrupt applied-index payload — non-ASCII bytes, a sign, a decimal point, embedded text — raises rather than yielding a silently lowered floor, and `seed_snapshot` refuses a path that already exists so seeding a node cannot overwrite committed state."
oracle = "Each corrupt payload is a separate row observed as the raised error type rather than as a returned number, so a decoder that fell back to 0 on any of them is red precisely where a lowered floor would silently skip entries. The seeding row is observed as the refusal record carrying the offending path, so a refusal that dropped the path, or a design that returned the path anyway, is distinguishable from the one documented answer."
target = "rust"
command = "deterministic-replicated-state-machine-security"
evidence_paths = ["evidence/deterministic-replicated-state-machine-security.json"]

[[tool.aw.python-ec.cases]]
id = "leader-routed-proposal-behavior"
artifact_id = "artifact:raft-runtime/leader-routed-proposal-behavior"
capability_id = "leader-routed-proposal"
use_case_id = "leader-routed-proposal"
dimension = "behavior"
applicability = "td"
test_path = "src/leader-routed-proposal-behavior.py"
promise = "A view whose role is leader routes locally, a view naming another replica as leader routes to that replica's derived address, a view with no known leader routes to the unknown outcome that the host retries, and the retry budget is exhausted exactly when the elapsed time reaches the configured propose timeout."
oracle = "The three routes are three distinct outcome values observed as records, so a design that conflated `unknown` with a failure, or that returned the local route whenever the leader id happened to equal this node's id regardless of role, is red. The deadline is pinned one millisecond on either side of the configured timeout as well as at it, so an exclusive comparison is distinguishable from the inclusive one."
target = "rust"
command = "leader-routed-proposal-behavior"
evidence_paths = ["evidence/leader-routed-proposal-behavior.json"]

[[tool.aw.python-ec.cases]]
id = "leader-routed-proposal-security"
artifact_id = "artifact:raft-runtime/leader-routed-proposal-security"
capability_id = "leader-routed-proposal"
use_case_id = "leader-routed-proposal"
dimension = "security"
applicability = "td"
test_path = "src/leader-routed-proposal-security.py"
promise = "A forwarding target is drawn only from the peer list carried by the derived cluster view: a leader id absent from that list yields no target at all rather than a synthesized address, and the forwarded path is the fixed publish route which is a peer path but not a consensus path."
oracle = "The absent-leader row requires the empty answer rather than a constructed URL, so a design that built an address from the leader id and a template would return a plausible peer and be red. The route classification is observed as three separate predicates over the exact path string, so a router that admitted the publish path to the consensus set — or that failed to require peer identity on it — is caught even though the path constant itself is unchanged."
target = "rust"
command = "leader-routed-proposal-security"
evidence_paths = ["evidence/leader-routed-proposal-security.json"]

[[tool.aw.python-ec.cases]]
