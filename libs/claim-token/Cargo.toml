[package]
name = "claim-token"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Scoped claim-check access tokens (HMAC-SHA256). Loom's schema layer signs; Keep verifies, so a worker reaches Keep directly only within its key scope."


# e2e tests live in e2e/, not Cargo's autodiscovered tests/, so every one
# of them has to be declared below. The list is this crate's e2e inventory.
autotests = false

[lib]
name = "claim_token"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
sha2 = "0.10"

[[test]]
name = "behavior_scoped_claim_tokens_contract"
path = "e2e/behavior_scoped_claim_tokens_contract.rs"
