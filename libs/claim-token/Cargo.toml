[package]
name = "claim-token"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Scoped claim-check access tokens (HMAC-SHA256). Loom's schema layer signs; Keep verifies, so a worker reaches Keep directly only within its key scope."

[lib]
name = "claim_token"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
sha2 = "0.10"
