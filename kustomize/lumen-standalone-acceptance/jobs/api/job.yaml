apiVersion: batch/v1
kind: Job
metadata:
  name: INVALID_API_JOB
  namespace: INVALID_CLIENT_NAMESPACE
  labels: &labels
    app.kubernetes.io/managed-by: lumen-standalone-gke-acceptance
    lumen.axiom.dev/gke-acceptance-run: INVALID_RUN_ID
    lumen.axiom.dev/gke-acceptance-job: INVALID_API_JOB
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels: *labels
    spec:
      serviceAccountName: INVALID_APP_KSA
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: memory
          emptyDir: {medium: Memory}
      containers:
        - name: api
          image: docker.io/curlimages/curl@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
          command: [/bin/sh, -ec]
          args:
            - |-
              set -eu
              work=/run/lumen
              printf '%s' "$LUMEN_REQUEST_BODY_B64" | base64 -d >"$work/request.json"
              url="http://${LUMEN_SERVICE}.${LUMEN_RUNTIME_NAMESPACE}.svc.cluster.local:7373${LUMEN_PATH}"
              : >"$work/header"
              case "$LUMEN_TOKEN_MODE" in
                default)
                  printf 'Authorization: Bearer %s\n' "$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" >"$work/header"
                  ;;
                projected)
                  printf 'Authorization: Bearer %s\n' "$(cat /run/lumen/projected/token)" >"$work/header"
                  ;;
                bad)
                  printf 'Authorization: Bearer %s\n' "$LUMEN_BAD_TOKEN" >"$work/header"
                  ;;
                missing) ;;
                *) exit 1 ;;
              esac
              if test -s "$work/header"; then
                status="$(curl --silent --show-error \
                  --output "$work/response.json" \
                  --write-out '%{http_code}' \
                  --header 'content-type: application/json' \
                  --header @"$work/header" \
                  --request "$LUMEN_METHOD" \
                  --data-binary @"$work/request.json" \
                  "$url")"
              else
                status="$(curl --silent --show-error \
                  --output "$work/response.json" \
                  --write-out '%{http_code}' \
                  --header 'content-type: application/json' \
                  --request "$LUMEN_METHOD" \
                  --data-binary @"$work/request.json" \
                  "$url")"
              fi
              if test "$LUMEN_EXPECTED_STATUS" = 2xx; then
                case "$status" in 2??) ;; *) exit 1 ;; esac
              else
                test "$status" = "$LUMEN_EXPECTED_STATUS"
              fi
              if test -n "$LUMEN_REQUIRED_ID"; then
                grep -E -- "\"external_id\"[[:space:]]*:[[:space:]]*\"$LUMEN_REQUIRED_ID\"" "$work/response.json" >/dev/null
              fi
              if test -n "$LUMEN_REJECTED_ID"; then
                ! grep -E -- "\"external_id\"[[:space:]]*:[[:space:]]*\"$LUMEN_REJECTED_ID\"" "$work/response.json" >/dev/null
              fi
              printf 'row=%s status=%s\n' "$LUMEN_ROW_LABEL" "$status"
          env:
            - {name: LUMEN_TOKEN_MODE, value: INVALID_TOKEN_MODE}
            - {name: LUMEN_RUNTIME_NAMESPACE, value: INVALID_RUNTIME_NAMESPACE}
            - {name: LUMEN_SERVICE, value: INVALID_SERVICE}
            - {name: LUMEN_METHOD, value: INVALID_METHOD}
            - {name: LUMEN_PATH, value: INVALID_PATH}
            - {name: LUMEN_REQUEST_BODY_B64, value: INVALID_REQUEST_BODY_B64}
            - {name: LUMEN_EXPECTED_STATUS, value: INVALID_EXPECTED_STATUS}
            - {name: LUMEN_REQUIRED_ID, value: INVALID_REQUIRED_ID}
            - {name: LUMEN_REJECTED_ID, value: INVALID_REJECTED_ID}
            - {name: LUMEN_ROW_LABEL, value: INVALID_ROW_LABEL}
            - {name: LUMEN_BAD_TOKEN, value: invalid-gke-token}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: memory, mountPath: /run/lumen}
