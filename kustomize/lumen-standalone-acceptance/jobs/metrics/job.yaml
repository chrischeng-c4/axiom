apiVersion: batch/v1
kind: Job
metadata:
  name: INVALID_METRICS_JOB
  namespace: INVALID_CLIENT_NAMESPACE
  labels: &labels
    app.kubernetes.io/managed-by: lumen-standalone-gke-acceptance
    lumen.axiom.dev/gke-acceptance-run: INVALID_RUN_ID
    lumen.axiom.dev/gke-acceptance-job: INVALID_METRICS_JOB
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels: *labels
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: memory
          emptyDir: {medium: Memory}
      containers:
        - name: metrics
          image: docker.io/curlimages/curl@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
          command: [/bin/sh, -ec]
          args:
            - |-
              set -eu
              work=/run/lumen
              url="http://${LUMEN_SERVICE}.${LUMEN_RUNTIME_NAMESPACE}.svc.cluster.local:7373/metrics"
              status="$(curl --silent --show-error \
                --output "$work/metrics" \
                --write-out '%{http_code}' \
                "$url")"
              test "$status" = 200
              test -s "$work/metrics"
              printf 'row=%s status=200\n' "$LUMEN_ROW_LABEL"
              cat "$work/metrics"
          env:
            - {name: LUMEN_RUNTIME_NAMESPACE, value: INVALID_RUNTIME_NAMESPACE}
            - {name: LUMEN_SERVICE, value: INVALID_SERVICE}
            - {name: LUMEN_ROW_LABEL, value: INVALID_ROW_LABEL}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: memory, mountPath: /run/lumen}
