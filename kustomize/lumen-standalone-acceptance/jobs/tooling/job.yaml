apiVersion: batch/v1
kind: Job
metadata:
  name: INVALID_TOOLING_JOB
  namespace: INVALID_CLIENT_NAMESPACE
  labels: &labels
    app.kubernetes.io/managed-by: lumen-standalone-gke-acceptance
    lumen.axiom.dev/gke-acceptance-run: INVALID_RUN_ID
    lumen.axiom.dev/gke-acceptance-job: INVALID_TOOLING_JOB
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels: *labels
    spec:
      serviceAccountName: INVALID_APP_KSA
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: memory
          emptyDir: {medium: Memory}
      containers:
        - name: tooling
          image: docker.io/curlimages/curl@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
          command: [/bin/sh, -ec]
          args:
            - >-
              set -eu; test -x /bin/sh; command -v curl >/dev/null;
              command -v base64 >/dev/null; command -v grep >/dev/null;
              printf 'row=client-tools status=passed\n'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: memory, mountPath: /run/lumen}
