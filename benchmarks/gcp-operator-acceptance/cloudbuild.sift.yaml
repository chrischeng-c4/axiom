steps:
  - id: sift
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=benchmarks/gcp-operator-acceptance/images/Dockerfile.services
      - --target=sift
      - --tag=${_REGISTRY}/sift:${_TAG}
      - .

images:
  - ${_REGISTRY}/sift:${_TAG}

timeout: 2700s

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
