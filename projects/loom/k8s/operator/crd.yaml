apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: looms.loom.dev
spec:
  group: loom.dev
  names:
    categories: []
    kind: Loom
    plural: looms
    shortNames:
    - lm
    singular: loom
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .spec.voterCount
      name: Voters
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for LoomSpec via `CustomResource`
        properties:
          spec:
            description: '`loom.dev/v1alpha1` `Loom`. Namespaced: every child object the operator renders lands in this object''s namespace, so multiple independent loom deployments can coexist by name.'
            properties:
              backupDestination:
                description: Backup destination URI (`file:///path`, `s3://bucket/prefix`, `gs://bucket/prefix`); required when `backupSchedule` is set.
                nullable: true
                type: string
              backupSchedule:
                description: Cron schedule for the raft-snapshot backup CronJob (omit to disable).
                nullable: true
                type: string
              completionShards:
                default: 8
                description: Completion-consumer shard count (must match the workers' sink).
                type: integer
                minimum: 0.0
              cpu:
                default: 500m
                type: string
              gcRetentionSecs:
                default: 3600
                description: Completed-DAG GC retention window (seconds); 0 disables.
                type: integer
                minimum: 0.0
              image:
                description: Controller container image (all roles run from it).
                type: string
              imagePullPolicy:
                nullable: true
                type: string
              keep:
                default: http://keep.keep.svc.cluster.local:7117
                description: keep store base URL (claim-check payloads).
                type: string
              memory:
                default: 512Mi
                type: string
              relay:
                default: http://relay.relay.svc.cluster.local:7400
                description: relay broker base URL (loom → relay dispatch).
                type: string
              replicasPerShard:
                default: 1
                type: integer
                minimum: 0.0
              shardCount:
                default: 1
                description: Raft topology. `replicasPerShard > 1` turns on the raft HA group.
                type: integer
                minimum: 0.0
              storage:
                default: 5Gi
                description: Per-pod raft data volume size.
                type: string
              voterCount:
                default: 1
                type: integer
                minimum: 0.0
            required:
            - image
            type: object
          status:
            description: The `Loom` `.status` subresource the operator writes each reconcile.
            nullable: true
            properties:
              desiredReplicas:
                default: 0
                format: int32
                type: integer
              message:
                default: ''
                type: string
              observedGeneration:
                default: 0
                format: int64
                type: integer
              phase:
                default: ''
                type: string
              readyReplicas:
                default: 0
                format: int32
                type: integer
              shardCount:
                default: 0
                type: integer
                minimum: 0.0
            type: object
        required:
        - spec
        title: Loom
        type: object
    served: true
    storage: true
    subresources:
      status: {}
