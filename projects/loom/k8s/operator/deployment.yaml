# The loom operator control plane. Runs `loom k8s operator run` (the reconcile
# controller); 2 replicas with a coordination Lease → HA, only the leader
# applies. Lives in loom-system, separate from the app namespaces it manages.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loom-operator
  namespace: loom-system
  labels:
    app.kubernetes.io/name: loom
    app.kubernetes.io/component: operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: loom
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loom
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: loom-operator
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: loom:latest
          imagePullPolicy: IfNotPresent
          command: ["loom", "k8s", "operator", "run"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RUST_LOG
              value: "info"
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
