# The relay operator runs in its own namespace and needs cluster-wide
# permission to manage the child kinds it renders for every Relay custom
# resource.
apiVersion: v1
kind: Namespace
metadata:
  name: relay-system
  labels:
    app.kubernetes.io/name: relay-operator
    app.kubernetes.io/part-of: relay
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: relay-operator
  namespace: relay-system
  labels:
    app.kubernetes.io/name: relay-operator
    app.kubernetes.io/part-of: relay
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: relay-operator
  labels:
    app.kubernetes.io/name: relay-operator
    app.kubernetes.io/part-of: relay
rules:
  # The custom resource it owns + its status subresource.
  - apiGroups: ["relay.dev"]
    resources: ["relays", "relays/status", "relays/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The durable broker workload.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Serving Service/ServiceAccount.
  - apiGroups: [""]
    resources: ["services", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Leader-election Lease (HA: only the holder reconciles).
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: relay-operator
  labels:
    app.kubernetes.io/name: relay-operator
    app.kubernetes.io/part-of: relay
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: relay-operator
subjects:
  - kind: ServiceAccount
    name: relay-operator
    namespace: relay-system
