# Raft-backed relay as a StatefulSet: stable identity (relay-<ordinal>), a
# per-pod PVC for the durable log + raft hard state, and the STANDARD
# downward-API contract raft-host reads (#544): POD_NAME + the
# SHARD_COUNT / REPLICAS_PER_SHARD / VOTER_COUNT quartet. The single `relay`
# entrypoint auto-flips into replica/HA mode when REPLICAS_PER_SHARD > 1 —
# there is no separate raft bin. Keep spec.replicas ==
# SHARD_COUNT * REPLICAS_PER_SHARD and VOTER_COUNT odd.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: relay
  labels:
    app: relay
spec:
  serviceName: relay # the headless Service above (raft peer DNS)
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: relay:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Standard raft-host downward-API contract: pod name -> ordinal ->
            # (shard, replica); replica_mode() flips HA when
            # REPLICAS_PER_SHARD > 1. relay is single-group: SHARD_COUNT=1.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SHARD_COUNT
              value: "1"
            - name: REPLICAS_PER_SHARD
              value: "3" # must match spec.replicas (x SHARD_COUNT)
            - name: VOTER_COUNT
              value: "3"
            # Headless Service for peer DNS: relay-<ordinal>.relay:<port>.
            - name: RELAY_PEER_SERVICE
              value: "relay"
            - name: RELAY_BIND
              value: "0.0.0.0:8080"
            - name: RELAY_DATA_DIR
              value: "/data"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
