# HANDWRITE-BEGIN gap="missing-generator:config:7d099e74" tracker="pending-tracker" reason="Manifest for the standalone HTTP/2 queue core (no external project deps)."
[package]
name = "relay"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "relay core — durable ordered log per subject/shard serving broadcast (replay) and work-queue (lease/ack/redeliver) delivery."

[lib]
name = "relay"
path = "src/lib.rs"

[[bin]]
name = "relay"
path = "src/bin/relay.rs"

[[bench]]
name = "relay_bench"
harness = false

[dependencies]
# The broker core is payload-agnostic (epic #120: "knows nothing about
# workflows"): a message body is carried as opaque JSON. relay stays standalone
# — it depends on no other axiom project, only third-party crates.
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

# HTTP/2 (h2c) + OpenAPI transport (#115).
tokio = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
utoipa = { workspace = true, features = ["axum_extras"] }
ciborium = "0.2"
crc32fast = "1.4"

# Shared raft driver (#544): RaftHost tick/pump/h2c transport + RaftStore +
# ClusterTopology (k8s downward-API derive) + OutcomeWindow. relay supplies
# only the RelayStateMachine; the hand-rolled driver/store/config are gone.
raft-host = { path = "../../libs/raft-host" }

# Shared service shell (#1205): standard probe routes (/healthz /readyz
# /metrics /openapi.json /docs), the h2c + HTTP/1.1 one-port serve loop,
# SIGTERM-aware graceful drain, and the {error, message} ApiErr envelope.
service-http = { path = "../../libs/service-http" }
# Shared request-auth contract (#1206): Bearer extraction + auth_middleware +
# the role_map StaticRoleMapVerifier implementing RELAY_AUTH=off|required +
# RELAY_TOKEN_REGISTRY_FILE, with the shared {error, message} 401/403 shape.
service-auth = { path = "../../libs/service-auth" }
# Prometheus metric primitives (Counter/Latency + text-format render) for
# RelayMetrics.
service-metrics = { path = "../../libs/service-metrics" }
# Serve-path tracing init (RUST_LOG wins, else info EnvFilter — keep's pattern).
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# The single `relay` CLI bin (CONTRIBUTING.md CLI convention): clap parsing +
# the standard llm/upgrade/issue ops via the shared cli-std lib. Offline paths
# always build; the HTTPS paths are pulled in by the `self-update`/`issue`
# features via `cli-std/online`.
anyhow = { workspace = true }
clap = { workspace = true, features = ["env"] }
cli-std = { path = "../../libs/cli-std", default-features = false }

# K8s operator (feature `operator`) — the shared libs/operator scaffold + render
# toolkit (#1208). relay supplies a RelaySpec CRD + ManagedService and gets the
# reconcile controller for free. Versions mirror the workspace's existing
# kube-rs users (keep / lumen / mambalibs) so the lockfile stays
# single-versioned. Optional so the serving image never links kube-rs unless
# built with `--features operator`.
kube = { version = "0.98", features = ["runtime", "derive", "client"], optional = true }
k8s-openapi = { version = "0.24", features = ["v1_32"], optional = true }
schemars = { version = "0.8", optional = true }
operator = { path = "../../libs/operator", optional = true }
# YAML serialization for the generated CRD (`relay k8s crd render` in the
# operator build). Optional: the default build renders from checked-in fixtures.
serde_yaml = { workspace = true, optional = true }
# Process-level rustls crypto provider install (operator/kube and the online
# CLI ops link rustls). Optional so the default build stays provider-free.
rustls = { version = "0.23", optional = true }

[build-dependencies]
# Stamp RELAY_GIT_SHA / RELAY_BUILT_AT / RELAY_TARGET for cli-std's ToolInfo.
build-stamp = { path = "../../libs/build-stamp" }

[features]
default = []
# self-update / issue — enable the online (HTTPS) paths of the shared CLI-ops
# lib. Offline builds still ship both commands (`upgrade --check` / the issue
# create dry-run + pre-filled-URL fallback); release builds enable them.
self-update = ["cli-std/online", "rustls-provider"]
issue = ["cli-std/online", "rustls-provider"]
# operator — the shared libs/operator scaffold: a RelaySpec CRD + ManagedService
# render, driven by operator::run. Ships the `relay k8s operator run` controller
# and the CRD generator; pulls kube-rs, so the serving image stays kube-free
# unless built with this feature (#1208).
operator = [
    "dep:kube",
    "dep:k8s-openapi",
    "dep:schemars",
    "dep:operator",
    "dep:serde_yaml",
    "rustls-provider",
]
# Private: link rustls + install its process-level crypto provider at startup
# (src/tls.rs). Enabled by every feature that links a rustls path (operator /
# online CLI ops), so the default build pays nothing.
rustls-provider = ["dep:rustls"]

[dev-dependencies]
# Deploy-CLI render round-trip assertions (tests/deploy_cli.rs, tests/operator.rs).
serde_yaml = { workspace = true }
tempfile = "3"
criterion = "0.5"
# The deterministic consensus simulation (tests/raft_core.rs) drives the core
# directly; production code reaches raft only through raft-host.
raft-core = { path = "../../libs/raft-core" }
# h2c test clients for the transport/cluster integration tests.
reqwest = { workspace = true }
h2c = { path = "../../libs/h2c" }
# HANDWRITE-END
