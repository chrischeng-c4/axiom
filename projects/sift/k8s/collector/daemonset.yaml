apiVersion: v1
kind: ServiceAccount
metadata:
  name: sift-collector
  namespace: REPLACE_NAMESPACE
  labels:
    app.kubernetes.io/name: sift-collector
    app.kubernetes.io/part-of: sift
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sift-collector
  namespace: REPLACE_NAMESPACE
  labels:
    app.kubernetes.io/name: sift-collector
    app.kubernetes.io/part-of: sift
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sift-collector
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 10%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sift-collector
        app.kubernetes.io/part-of: sift
    spec:
      serviceAccountName: sift-collector
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-state
          image: busybox:1.36.1
          command: ["sh", "-ec", "chown 65532:65532 /var/lib/sift-collector && chmod 0700 /var/lib/sift-collector"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 50m, memory: 32Mi }
          volumeMounts:
            - name: state
              mountPath: /var/lib/sift-collector
      containers:
        - name: collector
          image: ghcr.io/chrischeng-c4/axiom/sift:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - collect
            - --cri-root
            - /var/log/pods
            - --checkpoint
            - /var/lib/sift-collector/checkpoint.json
            - --quarantine
            - /var/lib/sift-collector/rejected.jsonl
            - --project
            - $(SIFT_PROJECT)
            - --environment
            - $(SIFT_ENVIRONMENT)
            - --gcp-project
            - $(GCP_PROJECT_ID)
            - --cluster
            - $(GKE_CLUSTER_NAME)
            - --location
            - $(GKE_LOCATION)
            - --node
            - $(NODE_NAME)
            - --follow
          env:
            - name: SIFT_URL
              valueFrom:
                configMapKeyRef:
                  name: sift-collector
                  key: endpoint
            - name: SIFT_PROJECT
              valueFrom:
                configMapKeyRef:
                  name: sift-collector
                  key: project
            - name: SIFT_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: sift-collector
                  key: environment
            - name: GCP_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: sift-collector
                  key: gcpProjectId
            - name: GKE_CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: sift-collector
                  key: clusterName
            - name: GKE_LOCATION
              valueFrom:
                configMapKeyRef:
                  name: sift-collector
                  key: location
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SIFT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sift-collector
                  key: token
          securityContext:
            # GKE owns /var/log/pods as root.  The collector needs UID 0 only
            # to traverse that read-only host mount; it still has no Kubernetes
            # API token, Linux capabilities, privilege escalation, or writable
            # root filesystem.
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: state
              mountPath: /var/lib/sift-collector
      volumes:
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: state
          hostPath:
            path: /var/lib/sift-collector
            type: DirectoryOrCreate
# HANDWRITE-END
