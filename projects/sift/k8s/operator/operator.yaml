apiVersion: v1
# Controller entrypoint: sift k8s operator run
kind: ServiceAccount
metadata:
  name: sift-operator
  namespace: sift-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sift-operator
rules:
  - apiGroups: ["sift.axiom.dev"]
    resources: ["sifts", "sifts/status"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sift-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sift-operator
subjects:
  - kind: ServiceAccount
    name: sift-operator
    namespace: sift-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sift-operator
  namespace: sift-system
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: sift-operator }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sift-operator }
    spec:
      serviceAccountName: sift-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: operator
          image: ghcr.io/chrischeng-c4/axiom/sift:0.1.0
          args: ["k8s", "operator", "run"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
