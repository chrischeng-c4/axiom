[package]
name = "sift"
version = "0.1.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Sift — GCP/GKE-first operational event service"

[lib]
name = "sift"
path = "src/lib.rs"

[[bin]]
name = "sift"
path = "src/bin/sift.rs"

[dependencies]
anyhow.workspace = true
axiom-operator = { package = "service-k8s", path = "../../libs/service-k8s" }
axum.workspace = true
base64 = "0.22"
bytes.workspace = true
chrono.workspace = true
clap = { workspace = true, features = ["env"] }
cli-std = { path = "../../libs/cli-std", default-features = false, features = ["online", "k8s"] }
cclab-openapi-codegen = { path = "../../libs/openapi-codegen" }
flate2 = "1"
hex = "0.4"
k8s-openapi = { version = "0.24", features = ["v1_32"] }
kube = { version = "0.98", features = ["runtime", "derive", "client"] }
lumen = { path = "../../apps/lumen", default-features = false }
prost = "0.13"
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
service-auth = { path = "../../libs/service-auth" }
service-backup = { path = "../../libs/service-backup" }
service-durability = { package = "storage-durable", path = "../../libs/storage-durable" }
service-http = { path = "../../libs/service-http" }
service-metrics = { package = "metrics-prometheus", path = "../../libs/metrics-prometheus" }
service-observability = { path = "../../libs/service-observability" }
raft-core = { path = "../../libs/raft-core" }
raft-host = { package = "raft-runtime", path = "../../libs/raft-runtime" }
peer-tls = { path = "../../libs/peer-tls" }
schemars = "0.8"
sha2 = "0.10"
tokio.workspace = true
tower.workspace = true
tracing.workspace = true
utoipa = { workspace = true, features = ["axum_extras"] }

[dev-dependencies]
rustls = "0.23"
serde_yaml.workspace = true
tempfile = "3"
vat = { path = "../../apps/vat", default-features = false, features = ["emulator"] }

[build-dependencies]
build-stamp = { path = "../../libs/build-stamp" }
