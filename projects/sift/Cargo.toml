[package]
name = "sift"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Sift — GCP/GKE-first operational event service"

[lib]
name = "sift"
path = "src/lib.rs"

[[bin]]
name = "sift"
path = "src/bin/sift.rs"

[dependencies]
anyhow.workspace = true
axiom-operator = { package = "operator", path = "../../libs/operator" }
axum.workspace = true
base64 = "0.22"
bytes.workspace = true
chrono.workspace = true
clap = { workspace = true, features = ["env"] }
cli-std = { path = "../../libs/cli-std", default-features = false, features = ["online", "k8s"] }
cclab-openapi-codegen = { path = "../../libs/openapi-codegen" }
flate2 = "1"
hex = "0.4"
k8s-openapi = { version = "0.24", features = ["v1_32"] }
kube = { version = "0.98", features = ["runtime", "derive", "client"] }
lumen = { path = "../../apps/lumen", default-features = false }
prost = "0.13"
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
service-auth = { path = "../../libs/service-auth" }
service-backup = { path = "../../libs/service-backup" }
service-durability = { path = "../../libs/service-durability" }
service-http = { path = "../../libs/service-http" }
service-metrics = { path = "../../libs/service-metrics" }
raft-core = { path = "../../libs/raft-core" }
raft-host = { path = "../../libs/raft-host" }
schemars = "0.8"
sha2 = "0.10"
tokio.workspace = true
tower.workspace = true
tracing.workspace = true
utoipa = { workspace = true, features = ["axum_extras"] }

[dev-dependencies]
tempfile = "3"
vat = { path = "../../apps/vat", default-features = false, features = ["emulator"] }

[build-dependencies]
build-stamp = { path = "../../libs/build-stamp" }
