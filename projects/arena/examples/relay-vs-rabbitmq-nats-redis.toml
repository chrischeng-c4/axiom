# arena comparison spec: relay vs RabbitMQ / NATS JetStream / Redis Streams.
#
# A permanent regression gate (mirrors lumen's perf_gate_vs_db): every iteration
# relay must hold its ratio vs competitors (ratchet) and must beat the primary
# bar (RabbitMQ quorum queue) where claimed, or the gate fails.
#
# Scope: relay is a single-cast pull work-queue broker. Redpanda/Kafka-class
# topic replay journals are tape competitors, not relay competitors.
#
# The executable harness is:
#   cargo run -p relay --release --example bench_compare -- --backend <target>
# All targets are durable-only; Redis-compatible targets must have append-only
# persistence enabled or the harness fails. This arena file stays as the
# normalized ratchet wrapper around those runs.

spec_version = 1
name = "relay-vs-rabbitmq-nats-redis"
base = "relay"            # ratios divide BY relay (normalized so >1 = relay wins)
ratchet = 0.95            # relay may not drop below 95% of its recorded baseline ratio
baseline = ".arena/relay-baselines.json"

[targets.relay]
kind = "service"
[targets.relay.load]
target_qps = 50000
workers = 32
duration_secs = 20
warmup_secs = 5

# Competitor adapters (command flavor; CI-provisioned). Each emits one metric.
[targets.rabbitmq]
kind = "command"
[targets.nats-jetstream]
kind = "command"
[targets.redis-streams]
kind = "command"
[targets.dragonfly-streams]
kind = "command"

# --- work-queue: publish then lease/reserve/read + ack/delete throughput. ---
[[cells]]
name = "work_queue"
metric = "qps"           # higher is better
[cells.targets.relay]
command = "cargo run -p relay --release --example bench_compare -- --backend relay --ops 200000 --concurrency 50 --batch 100"
[cells.targets.rabbitmq]
gate = "win"
command = "cargo run -p relay --release --example bench_compare -- --backend rabbitmq --ops 200000 --concurrency 50 --batch 100"
[cells.targets.nats-jetstream]
command = "cargo run -p relay --release --example bench_compare -- --backend nats --ops 200000 --concurrency 50 --batch 100"
[cells.targets.redis-streams]
command = "cargo run -p relay --release --example bench_compare -- --backend redis --ops 200000 --concurrency 50 --batch 100"
[cells.targets.dragonfly-streams]
command = "cargo run -p relay --release --example bench_compare -- --backend dragonfly --ops 200000 --concurrency 50 --batch 100 --redis-url redis://127.0.0.1:6380"
