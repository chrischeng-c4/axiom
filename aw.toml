# EC tool bindings (contract before implementation). `aw health --verify-ec`
# dispatches each bound dimension to its external tool; unbound categories
# (e.g. behavior, security) fall back to the manifest command.
#   efficiency (效能) -> vat provisions PG/OpenSearch, then meter wraps the
#                         ratcheted lumen-vs-pg/OpenSearch perf gate.
#   stability (穩定性) -> vat provisions lumen/toxiproxy, then rig runs the
#                        resilience scenarios and p99 budgets.
# behavior (功能) and security (安全) stay cargo gates per the EC-gatekeeper map.
ec.efficiency = { tool = "meter", meter = "projects/lumen", command = "cd projects/lumen && ../../target/debug/vat run ec-efficiency-meter" }
ec.stability = { tool = "rig", dir = "projects/lumen/tests/rig/cases/resilience", command = "cd projects/lumen && ../../target/debug/vat run rig-resilience" }

[[projects.workspaces]]
