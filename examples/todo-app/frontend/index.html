<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141a22" />
    <title>FocusFlow — Todo</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="Task navigation">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">F</span>
          <span>FocusFlow</span>
        </div>

        <nav class="task-filters" aria-label="Task filters">
          <button class="filter-button is-active" type="button" data-filter="all">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
            All tasks <span data-count="all">0</span>
          </button>
          <button class="filter-button" type="button" data-filter="open">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
            In progress <span data-count="open">0</span>
          </button>
          <button class="filter-button" type="button" data-filter="done">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>
            Completed <span data-count="done">0</span>
          </button>
        </nav>

        <div class="sidebar-note">
          <span class="note-kicker">TODAY</span>
          <strong id="daily-progress">0 tasks completed</strong>
          <div class="progress-track" aria-hidden="true"><span id="progress-fill"></span></div>
        </div>
      </aside>

      <section class="workspace" aria-labelledby="page-title">
        <header class="workspace-header">
          <div>
            <p class="eyebrow" id="date-label">TODAY</p>
            <h1 id="page-title">My tasks</h1>
          </div>
          <button id="clear-completed" class="text-button" type="button">Clear completed</button>
        </header>

        <form id="todo-form" class="create-task" novalidate>
          <label class="sr-only" for="todo-title">New task</label>
          <input id="todo-title" name="title" type="text" maxlength="160" placeholder="What needs your attention?" autocomplete="off" required />
          <label class="sr-only" for="todo-priority">Priority</label>
          <select id="todo-priority" name="priority" aria-label="Task priority">
            <option value="medium">Medium priority</option>
            <option value="high">High priority</option>
            <option value="low">Low priority</option>
          </select>
          <label class="sr-only" for="todo-date">Due date</label>
          <input id="todo-date" name="due_date" type="date" />
          <button type="submit" class="primary-button">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            Add task
          </button>
          <p id="form-error" class="form-error" role="alert" hidden></p>
        </form>

        <div id="task-summary" class="task-summary" aria-live="polite"></div>
        <ul id="todo-list" class="todo-list" aria-label="Tasks"></ul>
        <div id="empty-state" class="empty-state" hidden>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12.5 9.5 17 19 7.5"/></svg>
          <h2>Nothing here yet</h2>
          <p>Add a task above, then give it your full attention.</p>
        </div>
      </section>
    </main>
    <template id="task-template">
      <li class="task-item">
        <button class="complete-button" type="button" aria-label="Mark task complete"><span aria-hidden="true"></span></button>
        <div class="task-copy">
          <p class="task-title"></p>
          <div class="task-meta"><span class="priority-badge"></span><span class="due-date"></span></div>
        </div>
        <button class="delete-button" type="button" aria-label="Delete task">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M9 7l1-2h4l1 2M7 7l1 13h8l1-13"/></svg>
        </button>
      </li>
    </template>
    <script src="app.js" defer></script>
  </body>
</html>
