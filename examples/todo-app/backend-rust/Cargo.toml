[package]
name = "focusflow-todo"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
axum = "0.7"
chrono = { version = "0.4", features = ["clock"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
