[project]
name = "focusflow-external-contracts"
version = "0.1.0"
requires-python = ">=3.11"

[tool.aw.python-artifact]
protocol = "aw.python-artifact.v1"
entrypoint = "src/_native_test.py"
source_roots = ["src"]
dependency_files = ["pyproject.toml"]
evidence_dir = "evidence"

[tool.aw.python-ec]
protocol = "aw.python-ec.v1"
author = "focusflow-contract-author"
efficiency_policy = "required"

[[tool.aw.python-ec.cases]]
id = "todo-create-list"
artifact_id = "artifact:todo/api"
capability_id = "todo-http-api"
use_case_id = "create-list"
dimension = "behavior"
applicability = "td"
test_path = "src/behavior_create_list.py"
promise = "A valid Todo can be created and subsequently appears in the ordered list."
oracle = "native Rust Todo repository contract"
target = "rust"
command = "python3 examples/todo-app/verify_ec.py todo-create-list"
evidence_paths = ["evidence/todo-create-list.json"]

[[tool.aw.python-ec.cases]]
id = "todo-input-validation"
artifact_id = "artifact:todo/api"
capability_id = "todo-http-api"
use_case_id = "validation"
dimension = "security"
applicability = "td"
test_path = "src/security_validation.py"
promise = "Malformed title, priority, and due date inputs are rejected before persistence."
oracle = "domain validation tests"
target = "rust"
command = "python3 examples/todo-app/verify_ec.py todo-input-validation"
evidence_paths = ["evidence/todo-input-validation.json"]

[[tool.aw.python-ec.cases]]
id = "todo-repeatable-storage"
artifact_id = "artifact:todo/api"
capability_id = "todo-http-api"
use_case_id = "storage-roundtrip"
dimension = "stability"
applicability = "post-gen"
test_path = "src/stability_storage.py"
promise = "SQLite CRUD survives independent repository connections."
oracle = "native SQLite round-trip test"
threshold = "0 failures"
target = "rust"
command = "python3 examples/todo-app/verify_ec.py todo-repeatable-storage"
evidence_paths = ["evidence/todo-repeatable-storage.json"]

[[tool.aw.python-ec.cases]]
id = "todo-native-test-budget"
artifact_id = "artifact:todo/api"
capability_id = "todo-http-api"
use_case_id = "native-test-budget"
dimension = "efficiency"
applicability = "post-gen"
test_path = "src/efficiency_native_test.py"
promise = "The bounded native Todo suite completes within its declared local budget."
oracle = "cargo test exit status and elapsed wall time"
threshold = "30 seconds"
target = "rust"
command = "python3 examples/todo-app/verify_ec.py todo-native-test-budget"
evidence_paths = ["evidence/todo-native-test-budget.json"]
